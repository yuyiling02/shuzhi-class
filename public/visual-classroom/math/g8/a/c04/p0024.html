<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>16.3 乘法公式 · 几何证明</title>
<style>
  :root{--blue:#3b7dd8;--blueL:#bfd9f8;--green:#1e9e74;--greenL:#c3ecdb;--orange:#e08a2e;--orangeL:#fcd9a4;--red:#d9453c;--redL:#f7b8b2;--purple:#6b46a8;--yellow:#ffe38c;--ink:#1f2c38;--sub:#66798c;--line:#dbe3ec;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#f2f5f9;color:var(--ink);padding:14px 12px 30px;}
  .wrap{max-width:960px;margin:0 auto;}
  header{text-align:center;margin-bottom:10px;}
  header h1{font-size:21px;}
  header p{color:var(--sub);font-size:13px;margin-top:2px;}
  .modes{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:10px;}
  .mode{padding:9px 18px;border-radius:999px;border:2px solid var(--line);background:#fff;font-size:15px;font-weight:700;color:var(--sub);cursor:pointer;}
  .mode.on{background:var(--purple);border-color:var(--purple);color:#fff;}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 2px 8px rgba(15,23,42,.05);margin-bottom:12px;}
  .sliders{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-bottom:8px;font-size:14px;font-weight:700;}
  .sliders label{display:flex;align-items:center;gap:8px;}
  .sliders b{color:var(--purple);min-width:16px;text-align:center;}
  .sliders input{width:130px;accent-color:var(--purple);}
  svg{display:block;width:100%;height:auto;}
  .caption{text-align:center;font-size:17px;font-weight:700;color:var(--ink);min-height:28px;margin:6px 0;}
  .caption .em{color:var(--purple);}
  .ctrl{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:6px;}
  .ctrl button{padding:8px 16px;border-radius:10px;border:2px solid var(--line);background:#fff;font-size:14px;font-weight:700;cursor:pointer;color:var(--ink);}
  .ctrl button.primary{background:var(--blue);border-color:var(--blue);color:#fff;}
  .ctrl button.play{background:var(--green);border-color:var(--green);color:#fff;}
  .ctrl button.play.on{background:var(--orange);border-color:var(--orange);}
  .ctrl button:disabled{opacity:.4;cursor:default;}
  .dots{display:flex;gap:7px;justify-content:center;margin:8px 0 2px;}
  .dots i{width:11px;height:11px;border-radius:50%;background:#cbd5e1;transition:.3s;}
  .dots i.on{background:var(--purple);transform:scale(1.2);}
  .formula{text-align:center;font-family:"Cambria Math",Georgia,serif;font-size:26px;font-weight:bold;line-height:1.8;padding:8px 4px;}
  .formula .tm{transition:opacity .4s;padding:0 2px;}
  .formula .tm.dim{opacity:.22;}
  .formula sup{font-size:.6em;}
  .fnum{text-align:center;font-family:"Cambria Math",Georgia,serif;font-size:16px;color:var(--sub);min-height:22px;}
  .fnum b{color:var(--green);}
  .ext-head{display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
  .ext-head h3{font-size:15px;color:var(--purple);}
  .ext-head span{font-size:13px;color:var(--sub);}
  #yh{display:flex;flex-direction:column;align-items:center;gap:3px;margin:8px 0;}
  .yh-row{display:flex;gap:5px;align-items:center;}
  .yh-cell{width:30px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:#f2f5f9;font-size:13px;font-weight:bold;color:#5b6b7d;}
  .yh-cell.hl{outline:2px solid var(--purple);}
  .yh-cell.k1{background:var(--blueL);color:#17457c;} .yh-cell.k2{background:var(--orangeL);color:#7d4a0a;} .yh-cell.k4{background:var(--greenL);color:#10603f;}
  .yh-note{font-size:13px;line-height:1.7;background:#f7f3fd;border-radius:8px;padding:8px 10px;color:#3c3350;}
  .hide{display:none;}
  footer{text-align:center;color:#94a3b8;font-size:12px;margin-top:14px;}
  @media(max-width:640px){.formula{font-size:20px;}.caption{font-size:15px;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>16.3 乘法公式 · 看得见的证明</h1>
    <p>每一块颜色对应公式里的一项 · 面积加起来，就是公式</p>
  </header>

  <div class="modes">
    <button class="mode on" data-m="pf">平方差</button>
    <button class="mode" data-m="he">完全平方和</button>
    <button class="mode" data-m="cha">完全平方差</button>
  </div>

  <div class="card">
    <div class="sliders">
      <label>边长 a <input type="range" id="sa" min="2" max="5" value="3"><b id="va">3</b></label>
      <label>边长 b <input type="range" id="sb" min="1" max="4" value="1"><b id="vb">1</b></label>
    </div>
    <svg id="svg" viewBox="0 0 800 540"></svg>
    <div class="caption" id="cap"></div>
    <div class="dots" id="dots"></div>
    <div class="ctrl">
      <button id="prev">◀ 上一步</button>
      <button id="next" class="primary">下一步 ▶</button>
      <button id="play" class="play">▶ 自动播放</button>
      <button id="reset">↺ 重置</button>
    </div>
  </div>

  <div class="card">
    <div class="formula" id="formula"></div>
    <div class="fnum" id="fnum"></div>
  </div>

  <div class="card">
    <div class="ext-head" id="extHead">
      <h3>拓展 · 杨辉三角：系数为什么是 1, 2, 1？</h3>
      <span id="extArrow">展开 ▼</span>
    </div>
    <div id="extBody" class="hide">
      <div id="yh"></div>
      <div class="yh-note" id="yhNote"></div>
    </div>
  </div>

  <footer>人教版八年级上册 · 16.3 乘法公式 · 数形对照</footer>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
const svg=$('svg');
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const lerp=(A,B,t)=>A+(B-A)*t;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function el(n,a,p){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e;}
function T(x,y,s,fill,size,op,w){const t=el('text',{x,y,'text-anchor':'middle','font-size':size||15,fill:fill||'#334155','font-weight':w||'bold','paint-order':'stroke',stroke:'#fff','stroke-width':5,opacity:op===undefined?1:op});t.textContent=s;return t;}
function box(x,y,w,h,fill,o){o=o||{};return el('rect',{x,y,width:Math.max(0,w),height:Math.max(0,h),fill,stroke:o.stroke||'#fff','stroke-width':o.sw||2,opacity:o.op===undefined?1:o.op,'stroke-dasharray':o.dash||'none'});}

const defs=el('defs',{});
(function(){const p=el('pattern',{id:'hatch',width:9,height:9,patternUnits:'userSpaceOnUse',patternTransform:'rotate(45)'},defs);
el('rect',{width:9,height:9,fill:'#e9eef4'},p);el('line',{x1:0,y1:0,x2:0,y2:9,stroke:'#c6d0dc','stroke-width':2.6},p);})();

let S={m:'pf',a:3,b:1};
let target=0,cur=0,raf=null,playTimer=null;
const STEPS={
  pf:[
    '边长为 <span class="em">a</span> 的大正方形，面积 = a²',
    '切掉角上一个边长 <span class="em">b</span> 的小正方形（b²）',
    '剩下的 L 形，面积 = <span class="em">a² − b²</span>',
    '把上面那块剪下来，旋转 90° 搬到右边',
    '拼成一个长方形：长 (a+b)，宽 (a−b)'
  ],
  he:[
    '边长为 <span class="em">a+b</span> 的大正方形',
    '左下角：边长 a 的正方形，面积 <span class="em">a²</span>',
    '两条长方形，面积都是 <span class="em">ab</span>',
    '右上角：边长 b 的正方形，面积 <span class="em">b²</span>',
    '四块加起来 = 大正方形面积'
  ],
  cha:[
    '边长为 <span class="em">a</span> 的大正方形，面积 a²',
    '减掉下面一条 ab，再减掉右面一条 ab',
    '角上 b² 被减了两次，要<span class="em">补回一个 b²</span>',
    '剩下的蓝色正方形，边长 (a−b)',
    '所以 (a−b)² = a² − 2ab + b²'
  ]
};
const N=()=>STEPS[S.m].length-1;

function ensureAnim(){if(raf==null)raf=requestAnimationFrame(tick);}
function tick(){cur+=(target-cur)*0.16;if(Math.abs(target-cur)<0.002)cur=target;render(cur);if(cur!==target){raf=requestAnimationFrame(tick);}else{raf=null;}}
function setTarget(n){target=clamp(n,0,N());ensureAnim();updateUI();}
function stopPlay(){if(playTimer){clearInterval(playTimer);playTimer=null;}$('play').textContent='▶ 自动播放';$('play').classList.remove('on');}
function startPlay(){if(target>=N())setTarget(0);$('play').textContent='⏸ 暂停';$('play').classList.add('on');playTimer=setInterval(()=>{if(target<N())setTarget(target+1);else stopPlay();},1600);}

function render(t){
  svg.innerHTML='';svg.appendChild(defs);
  if(S.m==='pf')drawPF(t);else if(S.m==='he')drawHE(t);else drawCHA(t);
}

function drawPF(t){
  const a=S.a,b=S.b,U=Math.min(78,620/(a+b));
  const W=a*U,H=(a-b)*U,HB=b*U,TW=(a+b)*U;
  const x0=(800-TW)/2,y0=120;
  const cut=clamp(t,0,1),split=clamp(t-1,0,1),mv=ease(clamp(t-2,0,1)),res=clamp(t-3,0,1);
  box(x0,y0,W,W,'#bfd9f8',{stroke:'#8fb3d9',sw:1.5});
  if(cut<1)T(x0+W/2,y0+W/2+8,'a² = '+(a*a),'#17457c',20,1-cut);
  box(x0+H,y0,HB,HB,'url(#hatch)',{stroke:'#9aa7b4',sw:1.6,dash:'5 4',op:cut});
  if(cut>0)T(x0+H+HB/2,y0+HB/2+5,'切掉 b²='+(b*b),'#5b6b7d',13,cut);
  if(split>0)el('line',{x1:x0,y1:y0+HB,x2:x0+H,y2:y0+HB,stroke:'#6b46a8','stroke-width':2.2,'stroke-dasharray':'7 5',opacity:split});
  box(x0,y0+H,W,H,'#bfd9f8',{stroke:'#8fb3d9',sw:2});
  if(split>0.3&&res<1)T(x0+W/2,y0+H+H/2+6,'a×(a−b)='+(a*(a-b)),'#17457c',14,split*(1-res));
  const tx=lerp(x0,x0+W+HB,mv),ty=lerp(y0,y0+H,mv),th=90*mv;
  const g=el('g',{transform:'translate('+tx+','+ty+') rotate('+th+')'});
  el('rect',{x:0,y:0,width:H,height:HB,fill:'#9dc4ee',stroke:'#7fa6d2','stroke-width':2},g);
  if(mv>0.03&&mv<0.97){
    const c1=[x0+H/2,y0+HB/2],c2=[x0+W+HB/2,y0+H+H/2];
    const mx=(c1[0]+c2[0])/2,my=Math.min(c1[1],c2[1])-60;
    el('path',{d:'M'+c1[0]+' '+c1[1]+' Q'+mx+' '+my+' '+c2[0]+' '+c2[1],fill:'none',stroke:'#6b46a8','stroke-width':2.6,'stroke-dasharray':'9 6',opacity:Math.sin(mv*Math.PI)});
    T(mx,my-10,'旋转 90° 搬过来','#6b46a8',14,Math.sin(mv*Math.PI));
  }
  if(res>0){
    el('rect',{x:x0,y:y0+H,width:TW,height:H,fill:'none',stroke:'#6b46a8','stroke-width':3.2,opacity:res});
    T(x0+TW/2,y0+W+36,'长 a+b='+(a+b)+'，宽 a−b='+(a-b)+'，面积='+(a+b)*(a-b),'#6b46a8',16,res);
  }
  T(x0+W/2,y0-14,'a = '+a,'#3b7dd8',15,1-res*0.9);
  T(x0-30,y0+W/2,'a='+a,'#3b7dd8',14,1-res*0.9);
  if(cut>0)T(x0+H+HB/2,y0-14,'b='+b,'#1e9e74',14,cut);
}

function drawHE(t){
  const a=S.a,b=S.b,U=Math.min(74,470/(a+b));
  const W=(a+b)*U,x0=(800-W)/2,y0=90,AW=a*U,BH=b*U;
  box(x0,y0,W,W,'#f7fafd',{stroke:'#c3d4e6',sw:1.5});
  const o1=clamp(t-1,0,1),o2=clamp(t-2,0,1),o3=clamp(t-3,0,1),o4=clamp(t-4,0,1);
  const P=[
    {x:x0,y:y0+BH,w:AW,h:AW,fill:'#bfd9f8',tc:'#17457c',name:'a²='+(a*a),o:o1},
    {x:x0,y:y0,w:AW,h:BH,fill:'#fcd9a4',tc:'#7d4a0a',name:'ab='+(a*b),o:o2},
    {x:x0+AW,y:y0+BH,w:BH,h:AW,fill:'#f7c985',tc:'#7d4a0a',name:'ab='+(a*b),o:o2},
    {x:x0+AW,y:y0,w:BH,h:BH,fill:'#c3ecdb',tc:'#10603f',name:'b²='+(b*b),o:o3}
  ];
  P.forEach(d=>{
    box(d.x,d.y,d.w,d.h,d.fill,{stroke:'#fff',sw:3,op:d.o});
    if(d.o>0.3)T(d.x+d.w/2,d.y+d.h/2+6,d.name,d.tc,15,d.o);
  });
  el('rect',{x:x0,y:y0,width:W,height:W,fill:'none',stroke:'#6b46a8','stroke-width':3});
  T(x0+AW/2,y0-14,'a='+a,'#3b7dd8',15);
  T(x0+AW+BH/2,y0-14,'b='+b,'#1e9e74',15);
  T(x0-26,y0+BH/2,'b='+b,'#1e9e74',13);
  T(x0-26,y0+BH+AW/2,'a='+a,'#3b7dd8',13);
  if(o4>0)T(x0+W/2,y0+W+30,'(a+b)² = '+(a+b)*(a+b),'#6b46a8',17,o4);
}

function drawCHA(t){
  const a=S.a,b=S.b,U=Math.min(84,600/a);
  const W=a*U,x0=(800-W)/2,y0=110,H=(a-b)*U,HB=b*U;
  const red=clamp(t-1,0,1),back=clamp(t-2,0,1),rem=clamp(t-3,0,1),fin=clamp(t-4,0,1);
  box(x0,y0,W,W,'#bfd9f8',{stroke:'#8fb3d9',sw:1.5});
  box(x0,y0,H,H,'#8dbdf0',{stroke:'#5b93cc',sw:2.5,op:0.35+0.65*rem});
  if(rem>0.3){T(x0+H/2,y0+H/2-2,'(a−b)²','#0f355f',16,rem);T(x0+H/2,y0+H/2+18,'='+(a-b)*(a-b),'#0f355f',14,rem);}
  box(x0,y0+H,W,HB,'#f7b8b2',{stroke:'#d9453c',sw:2,op:red});
  if(red>0.3)T(x0+W/2,y0+H+HB/2+5,'−ab='+(a*b),'#8c1d13',14,red);
  box(x0+H,y0,HB,W,'#f7b8b2',{stroke:'#d9453c',sw:2,op:red});
  if(red>0.3){const tt=el('text',{x:x0+H+HB/2,y:y0+H/2+4,'text-anchor':'middle','font-size':14,'font-weight':'bold',fill:'#8c1d13','paint-order':'stroke',stroke:'#fff','stroke-width':5,opacity:red,transform:'rotate(-90 '+(x0+H+HB/2)+' '+(y0+H/2+4)+')'});tt.textContent='−ab';}
  box(x0+H,y0+H,HB,HB,'#ffe38c',{stroke:'#e0a02e',sw:2.5,op:back});
  if(back>0.3)T(x0+H+HB/2,y0+H+HB/2+5,'+b²='+(b*b),'#7d5100',13,back);
  el('rect',{x:x0,y:y0,width:W,height:W,fill:'none',stroke:'#6b46a8','stroke-width':2.4});
  T(x0+H/2,y0-14,'a−b='+(a-b),'#5b93cc',14);
  T(x0+H+HB/2,y0-14,'b='+b,'#1e9e74',14);
  if(fin>0)T(x0+W/2,y0+W+30,'蓝色剩余 = a² − 2ab + b² = '+(a-b)*(a-b),'#6b46a8',16,fin);
}

function formulaHTML(){
  const a=S.a,b=S.b,A=a*a,AB=a*b,B=b*b;
  const tm=(s,step,color)=>'<span class="tm'+(target>=step?'':' dim')+'" style="color:'+(color||'inherit')+'">'+s+'</span>';
  if(S.m==='pf'){
    return tm('a²',1,'#3b7dd8')+' '+tm('−',1)+' '+tm('b²',1,'#8a97a5')+' '+tm('=',4)+' '+tm('(a+b)(a−b)',4,'#6b46a8');
  }
  if(S.m==='he'){
    return tm('(a+b)²',0,'#6b46a8')+' '+tm('=',4)+' '+tm('a²',1,'#3b7dd8')+' '+tm('+',2)+' '+tm('2ab',2,'#e08a2e')+' '+tm('+',3)+' '+tm('b²',3,'#1e9e74');
  }
  return tm('(a−b)²',3,'#6b46a8')+' '+tm('=',4)+' '+tm('a²',0,'#3b7dd8')+' '+tm('−',1)+' '+tm('2ab',1,'#d9453c')+' '+tm('+',2)+' '+tm('b²',2,'#b9770e');
}
function fnumHTML(){
  const a=S.a,b=S.b,A=a*a,AB=a*b,B=b*b;
  if(target<N())return '';
  if(S.m==='pf')return A+' − '+B+' = '+(a+b)+' × '+(a-b)+' = <b>'+(a+b)*(a-b)+'</b>';
  if(S.m==='he')return (a+b)*(a+b)+' = '+A+' + '+AB+' + '+AB+' + '+B+' = <b>'+(A+2*AB+B)+'</b>';
  return (a-b)*(a-b)+' = '+A+' − '+AB+' − '+AB+' + '+B+' = <b>'+(A-2*AB+B)+'</b>';
}
function updateUI(){
  $('cap').innerHTML=STEPS[S.m][target];
  $('dots').innerHTML=STEPS[S.m].map((_,i)=>'<i class="'+(i<=target?'on':'')+'"></i>').join('');
  $('formula').innerHTML=formulaHTML();
  $('fnum').innerHTML=fnumHTML();
  $('prev').disabled=target===0;
  $('next').disabled=target===N();
}

function setMode(m){
  stopPlay();S.m=m;
  if(m!=='he'&&S.b>=S.a)S.b=S.a-1;
  document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  $('sb').max=m==='he'?4:S.a-1;
  target=0;cur=0;render(0);updateUI();
}
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
$('sa').oninput=e=>{S.a=+e.target.value;$('va').textContent=S.a;if(S.m!=='he'&&S.b>=S.a){S.b=S.a-1;$('sb').value=S.b;$('vb').textContent=S.b;}$('sb').max=S.m==='he'?4:S.a-1;target=0;cur=0;render(0);updateUI();};
$('sb').oninput=e=>{S.b=+e.target.value;$('vb').textContent=S.b;target=0;cur=0;render(0);updateUI();};
$('next').onclick=()=>{stopPlay();setTarget(target+1);};
$('prev').onclick=()=>{stopPlay();setTarget(target-1);};
$('reset').onclick=()=>{stopPlay();setTarget(0);};
$('play').onclick=()=>playTimer?stopPlay():startPlay();
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){stopPlay();setTarget(target+1);}
  if(e.key==='ArrowLeft'){stopPlay();setTarget(target-1);}
  if(e.key===' '){e.preventDefault();playTimer?stopPlay():startPlay();}
});

/* 杨辉三角 */
const YH=[[1]];for(let r=1;r<5;r++){const p=YH[r-1],row=[1];for(let i=1;i<r;i++)row.push(p[i-1]+p[i]);row.push(1);YH.push(row);}
function renderYH(){
  const box2=$('yh');box2.innerHTML='';
  YH.forEach((row,r)=>{
    const div=document.createElement('div');div.className='yh-row';
    row.forEach((v,c)=>{const cell=document.createElement('span');cell.className='yh-cell';cell.textContent=v;
      if(r===2){cell.classList.add('hl');cell.classList.add(['k1','k2','k4'][c]);}
      div.appendChild(cell);});
    box2.appendChild(div);
  });
  $('yhNote').innerHTML='第 3 行 <b>1, 2, 1</b> 正是 (a+b)² 的系数：1 个 a²（蓝）+ 2 个 ab（橙）+ 1 个 b²（绿），和上面四块面积一一对应。每个数 = 肩上两数之和。杨辉三角比欧洲帕斯卡早约 400 年。';
}
$('extHead').onclick=()=>{const b=$('extBody');const hid=b.classList.toggle('hide');$('extArrow').textContent=hid?'展开 ▼':'收起 ▲';if(!hid)renderYH();};

setMode('pf');
</script>
</body>
</html>
