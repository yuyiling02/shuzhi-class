<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>18.1 分式 · 条件判断器</title>
<style>
  :root{--blue:#4a7dde;--green:#31b57d;--red:#d9453c;--purple:#7048a8;--orange:#e07a1f;--ink:#2b3a4d;--sub:#7a8ba0;--line:#dde6f2;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-family:"Microsoft YaHei","PingFang SC",sans-serif;}
  body{background:#eef2f7;color:var(--ink);padding:14px 12px 30px;min-height:100vh;}
  .wrap{max-width:920px;margin:0 auto;}
  header{text-align:center;margin-bottom:8px;}
  header h1{font-size:21px;color:#1e3a5f;}
  .motto{display:inline-block;background:#fff8e6;border:1px solid #f0d98c;color:#8a6d1a;border-radius:999px;padding:6px 16px;font-size:14px;font-weight:bold;margin-top:6px;}
  .tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0;}
  .tab{padding:9px 18px;border-radius:999px;border:2px solid var(--line);background:#fff;font-size:15px;font-weight:700;color:var(--sub);cursor:pointer;}
  .tab.on{background:var(--blue);border-color:var(--blue);color:#fff;}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 2px 8px rgba(30,58,95,.06);margin-bottom:12px;}
  .presets{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px;}
  .preset{border:1.5px solid #c9d6e8;background:#f6f9fd;border-radius:9px;padding:7px 13px;font-size:15px;cursor:pointer;font-family:"Cambria Math",Georgia,serif;}
  .preset.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:bold;}
  .stage{display:flex;gap:20px;align-items:center;justify-content:center;flex-wrap:wrap;}
  .fracBox{text-align:center;}
  .frac{display:inline-flex;flex-direction:column;align-items:center;padding:4px 10px;}
  .frac .part{font-size:30px;font-family:"Cambria Math",Georgia,serif;padding:3px 14px;white-space:nowrap;}
  .frac .bar{height:3px;background:var(--ink);align-self:stretch;border-radius:2px;margin:2px 0;}
  .subs{margin-top:10px;font-size:17px;font-family:"Cambria Math",Georgia,serif;min-height:26px;}
  .subs b{color:var(--green);} .subs .bad{color:var(--red);font-weight:bold;}
  .verdict{border-radius:14px;padding:18px 26px;font-size:26px;font-weight:800;text-align:center;min-width:220px;transition:.25s;}
  .verdict .reason{font-size:14px;font-weight:normal;margin-top:6px;}
  .v-ok{background:#e6f7ef;color:#177a52;border:2px solid #7fd6ae;}
  .v-zero{background:#eef0fd;color:#4a3fbf;border:2px solid #a9a3ec;}
  .v-bad{background:#fdeaea;color:#b52f27;border:2px solid #eda39e;animation:shake .35s;}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .sliderRow{display:flex;align-items:center;gap:10px;margin:14px 0 4px;}
  .sliderRow label{font-size:14px;font-weight:bold;white-space:nowrap;}
  input[type=range]{flex:1;accent-color:var(--blue);height:26px;}
  .xval{font-family:"Cambria Math",serif;font-size:18px;font-weight:bold;color:var(--orange);min-width:70px;text-align:center;}
  .bigbtn{background:var(--blue);color:#fff;border:none;border-radius:10px;padding:9px 18px;font-size:15px;font-weight:bold;cursor:pointer;}
  svg{display:block;width:100%;height:auto;touch-action:none;}
  .nl-note{font-size:12.5px;color:var(--sub);margin-top:4px;display:flex;gap:16px;justify-content:center;flex-wrap:wrap;}
  .nl-note b.r{color:var(--red);} .nl-note b.g{color:var(--green);} .nl-note b.o{color:var(--orange);}
  .propRow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;margin:8px 0;}
  .fbtn{border:1.5px solid #c9d6e8;background:#f6f9fd;border-radius:8px;padding:7px 14px;font-size:15px;cursor:pointer;font-family:"Cambria Math",serif;}
  .fbtn.on{background:var(--purple);border-color:var(--purple);color:#fff;font-weight:bold;}
  .propEq{font-family:"Cambria Math",Georgia,serif;font-size:21px;text-align:center;padding:14px 8px;background:#f8f5fd;border-radius:12px;border:1px dashed #c9b6ea;color:#3d2a63;line-height:1.9;}
  .propEq .hl{color:var(--purple);font-weight:bold;}
  .propWarn{font-size:14px;color:#b52f27;margin-top:8px;font-weight:bold;text-align:center;}
  .quizQ{font-size:18px;text-align:center;margin-bottom:14px;line-height:1.7;}
  .quizQ .f{font-family:"Cambria Math",Georgia,serif;font-size:22px;color:#1e3a5f;font-weight:bold;}
  .quizOpts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .opt{border:2px solid #c9d6e8;background:#f6f9fd;border-radius:12px;padding:14px 20px;font-size:16px;font-weight:700;cursor:pointer;min-width:150px;}
  .opt.right{background:#e6f7ef;border-color:var(--green);color:#177a52;}
  .opt.wrong{background:#fdeaea;border-color:var(--red);color:#b52f27;}
  .opt:disabled{cursor:default;}
  .quizFb{margin-top:12px;font-size:14px;line-height:1.7;padding:10px 14px;border-radius:10px;display:none;text-align:center;}
  .quizFb.good{background:#e6f7ef;color:#177a52;display:block;}
  .quizFb.badfb{background:#fdf3e0;color:#8a6d1a;display:block;}
  .hide{display:none;}
  footer{text-align:center;color:#94a3b8;font-size:12px;margin-top:14px;}
  @media(max-width:640px){.verdict{font-size:20px;min-width:160px;}.frac .part{font-size:24px;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>18.1 分式 · 它有意义吗？值是 0 吗？</h1>
    <div class="motto">先看分母，再看分子</div>
  </header>

  <div class="tabs">
    <button class="tab on" data-t="judge">① 判断器</button>
    <button class="tab" data-t="prop">② 基本性质</button>
    <button class="tab" data-t="quiz">③ 挑战</button>
  </div>

  <!-- 判断器 -->
  <div id="secJudge">
    <div class="card">
      <div class="presets" id="presets"></div>
      <div class="stage">
        <div class="fracBox">
          <div class="frac" id="fracShow"></div>
          <div class="subs" id="subsShow"></div>
        </div>
        <div class="verdict v-ok" id="verdict"></div>
      </div>
      <div class="sliderRow">
        <label>x 的值</label>
        <input type="range" id="xslider" min="-6" max="6" step="0.5" value="1">
        <span class="xval" id="xval">x = 1</span>
        <button class="bigbtn" id="btnRand" style="font-size:13px;padding:7px 12px;">🎲 随机</button>
      </div>
      <svg id="numline" viewBox="0 0 900 90"></svg>
      <div class="nl-note">
        <span><b class="r">○ 红圈</b> = 分母为 0 的禁区</span>
        <span><b class="g">● 绿点</b> = 值为 0 的 x</span>
        <span><b class="o">▼ 橙指针</b> = 当前 x（可拖动）</span>
      </div>
    </div>
  </div>

  <!-- 基本性质 -->
  <div id="secProp" class="hide">
    <div class="card">
      <div class="presets" id="presets2"></div>
      <div class="propRow">
        <span style="font-size:14px;color:var(--sub);">分子分母同乘：</span>
        <button class="fbtn" data-f="c2">×2</button>
        <button class="fbtn" data-f="x1">×(x+1)</button>
        <button class="fbtn" data-f="x2">×(x−2)</button>
        <button class="fbtn" data-f="cancel" id="btnCancel" style="display:none;background:#fff8e6;border-color:#f0d98c;color:#8a6d1a;font-weight:bold;">⇣ 约分</button>
      </div>
      <div class="propEq" id="propEq"></div>
      <div class="propWarn" id="propWarn"></div>
      <div class="caption" style="text-align:center;font-size:14px;color:var(--sub);margin-top:10px;">同乘（除）同一个<b>不为 0</b> 的整式，分式的值不变 —— 约分、通分的依据</div>
    </div>
  </div>

  <!-- 挑战 -->
  <div id="secQuiz" class="hide">
    <div class="card">
      <div class="quizQ" id="quizQ"></div>
      <div class="quizOpts">
        <button class="opt" data-a="zero">值为 0</button>
        <button class="opt" data-a="ok">有意义，值不为 0</button>
        <button class="opt" data-a="bad">无意义</button>
      </div>
      <div class="quizFb" id="quizFb"></div>
      <div style="text-align:center;margin-top:14px;"><button class="bigbtn" id="btnQuiz">🔄 下一题</button></div>
    </div>
  </div>

  <footer>人教版八年级上册 · 18.1 分式及其基本性质</footer>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const PRESETS=[
  {label:'1/x',cf:1,nz:[],cd:1,dz:[0]},
  {label:'(x−2)/(x+3)',cf:1,nz:[2],cd:1,dz:[-3]},
  {label:'x/(x²−4)',cf:1,nz:[0],cd:1,dz:[2,-2]},
  {label:'(x²−1)/(x−1)',cf:1,nz:[1,-1],cd:1,dz:[1]},
  {label:'(x+1)/[(x+3)(x−3)]',cf:1,nz:[-1],cd:1,dz:[-3,3]},
  {label:'3/(x−2)',cf:3,nz:[],cd:1,dz:[2]}
];
let S={pi:0,x:1,mul:'none'};
function fmtR(r){r=+r.toFixed(1);return r===0?'':(r>0?'−'+r:'+'+(-r));}
const numStr=p=>{const fs=p.nz.map(r=>'x'+fmtR(r));let base=fs.length===1?fs[0]:fs.map(r=>'('+r+')').join('');if(p.cf!==1)base=(p.cf<0?'−'+Math.abs(p.cf):p.cf)+(base?'·'+base:'');return base||'1';};
const denStr=p=>{const fs=p.dz.map(r=>'x'+fmtR(r));const base=fs.length===1?fs[0]:fs.map(r=>'('+r+')').join('');return (p.cd!==1?p.cd+'·':'')+base;};
const numVal=(p,x)=>p.cf*p.nz.reduce((a,r)=>a*(x-r),1);
const denVal=(p,x)=>p.cd*p.dz.reduce((a,r)=>a*(x-r),1);
const fmtNum=v=>{v=+v.toFixed(2);return (Object.is(v,-0)?0:v).toString().replace('-','−');};

function renderFrac(){
  const p=PRESETS[S.pi],x=S.x,nv=numVal(p,x),dv=denVal(p,x);
  $('fracShow').innerHTML='<div class="part">'+numStr(p)+'</div><div class="bar"></div><div class="part">'+denStr(p)+'</div>';
  if(dv===0)$('subsShow').innerHTML='x = '+fmtNum(x)+'：分母 = <span class="bad">0</span> → 无意义';
  else $('subsShow').innerHTML='x = '+fmtNum(x)+'：= '+fmtNum(nv)+' ÷ '+fmtNum(dv)+' = <b>'+fmtNum(nv/dv)+'</b>';
  const v=$('verdict');
  if(dv===0){v.className='verdict v-bad';v.innerHTML='✕ 无意义<div class="reason">分母 = 0，触碰禁区</div>';}
  else if(nv===0){v.className='verdict v-zero';v.innerHTML='值为 0<div class="reason">分子 = 0 且 分母 = '+fmtNum(dv)+' ≠ 0</div>';}
  else{v.className='verdict v-ok';v.innerHTML='✓ 有意义<div class="reason">分母 = '+fmtNum(dv)+' ≠ 0，值 = '+fmtNum(nv/dv)+'</div>';}
  $('xval').textContent='x = '+fmtNum(x);
  $('xslider').value=x;
  renderNumline();
}
function renderNumline(){
  const svg=$('numline'),p=PRESETS[S.pi],x=S.x;
  const X0=40,X1=860,Y=40,scale=(X1-X0)/12,px=v=>X0+(v+6)*scale;
  let s='<line x1="'+X0+'" y1="'+Y+'" x2="'+X1+'" y2="'+Y+'" stroke="#8fa3ba" stroke-width="2"/>';
  s+='<path d="M '+(X1+4)+' '+Y+' l -10 -5 v 10 z" fill="#8fa3ba"/>';
  for(let t=-6;t<=6;t++){s+='<line x1="'+px(t)+'" y1="'+(Y-6)+'" x2="'+px(t)+'" y2="'+(Y+6)+'" stroke="#8fa3ba" stroke-width="'+(t===0?2.4:1.4)+'"/><text x="'+px(t)+'" y="'+(Y+22)+'" font-size="12" fill="#7a8ba0" text-anchor="middle">'+t+'</text>';}
  p.dz.forEach(r=>{s+='<circle cx="'+px(r)+'" cy="'+Y+'" r="9" fill="#fff" stroke="#d9453c" stroke-width="3"/><text x="'+px(r)+'" y="'+(Y-16)+'" font-size="12" fill="#d9453c" text-anchor="middle" font-weight="bold">分母=0</text>';});
  p.nz.filter(r=>!p.dz.some(d=>Math.abs(d-r)<1e-9)).forEach(r=>{s+='<circle cx="'+px(r)+'" cy="'+Y+'" r="7" fill="#1e9e74"/><text x="'+px(r)+'" y="'+(Y-16)+'" font-size="12" fill="#177a52" text-anchor="middle" font-weight="bold">值为0</text>';});
  s+='<path d="M '+px(x)+' '+(Y+34)+' l -7 -11 h 14 z" fill="#e07a1f"/>';
  s+='<line x1="'+px(x)+'" y1="'+(Y-11)+'" x2="'+px(x)+'" y2="'+(Y+26)+'" stroke="#e07a1f" stroke-width="2.5" stroke-dasharray="4 3"/>';
  s+='<text x="'+px(x)+'" y="'+(Y+52)+'" font-size="13" fill="#e07a1f" text-anchor="middle" font-weight="bold">x='+fmtNum(x)+'</text>';
  svg.innerHTML=s;
}
(function(){
  const svg=$('numline');
  const drag=e=>{const rect=svg.getBoundingClientRect();let v=(e.clientX-rect.left)*(900/rect.width)-40;v=Math.round(v/((860-40)/12)*2)/2;S.x=Math.max(-6,Math.min(6,v));renderFrac();};
  svg.addEventListener('pointerdown',e=>{drag(e);svg.setPointerCapture(e.pointerId);});
  svg.addEventListener('pointermove',e=>{if(e.buttons)drag(e);});
})();

/* 基本性质 */
const MULS={c2:{s:'2',extra:null},x1:{s:'(x+1)',extra:-1},x2:{s:'(x−2)',extra:2}};
function renderProp(){
  const p=PRESETS[S.pi],m=S.mul;
  const common=p.nz.some(z=>p.dz.some(d=>Math.abs(z-d)<1e-9));
  $('btnCancel').style.display=common?'':'none';
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.toggle('on',b.dataset.f===m));
  const eq=$('propEq'),warn=$('propWarn');
  if(m==='cancel'&&common){
    const z=p.nz.find(z0=>p.dz.some(d=>Math.abs(z0-d)<1e-9));
    const rest=p.nz.filter(v=>Math.abs(v-z)>1e-9),rd=p.dz.filter(v=>Math.abs(v-z)>1e-9);
    const restN=rest.map(r=>'(x'+fmtR(r)+')').join('')||'1';
    const restD=rd.map(r=>'(x'+fmtR(r)+')').join('')||'1';
    const simp=restD==='1'?restN:restN+' / '+restD;
    eq.innerHTML='<span class="hl">约分</span>：'+numStr(p)+' / '+denStr(p)+' = <b style="color:#177a52">'+simp+'</b>';
    warn.textContent='⚠ 约分后必须注明 x ≠ '+fmtNum(z)+'（原分母为 0 的值要排除）';
    return;
  }
  if(m==='none'||!MULS[m]){
    eq.innerHTML=numStr(p)+' / '+denStr(p)+'　<span style="color:#8a97a5;font-size:14px">← 点上方按钮，试试同乘一个整式</span>';
    warn.textContent='';return;
  }
  const M=MULS[m];
  const newN=numStr(p)==='1'?M.s:numStr(p)+'·'+M.s;
  const newD=denStr(p)+'·'+M.s;
  eq.innerHTML=numStr(p)+' / '+denStr(p)+' = <span class="hl">('+numStr(p)+'·'+M.s+') / ('+denStr(p)+'·'+M.s+')</span> = '+newN+' / '+newD;
  if(M.extra!==null)warn.textContent='⚠ 同乘 '+M.s+' 后，新增限制 '+M.s+' ≠ 0，即 x ≠ '+fmtNum(M.extra)+'（原分式本无此限制）';
  else warn.textContent='×2 恒不为 0，禁区不变，任意 x（原禁区除外）两式值都相等';
}
document.querySelectorAll('.fbtn').forEach(b=>b.onclick=()=>{S.mul=(S.mul===b.dataset.f)?'none':b.dataset.f;renderProp();});

/* 挑战 */
let Q=null;
function newQuiz(){
  const pi=Math.floor(Math.random()*PRESETS.length),p=PRESETS[pi];
  let x;
  if(Math.random()<0.5){const hot=[...p.dz,...p.nz.filter(z=>!p.dz.some(d=>Math.abs(d-z)<1e-9))];x=hot[Math.floor(Math.random()*hot.length)];if(Math.random()<0.4)x+=Math.random()<.5?-0.5:0.5;}
  else x=Math.round((Math.random()*12-6)*2)/2;
  x=Math.max(-6,Math.min(6,x));
  Q={pi,x,done:false};
  $('quizQ').innerHTML='当 <b style="color:#e07a1f">x = '+fmtNum(x)+'</b> 时，分式 <span class="f">'+numStr(p)+' / '+denStr(p)+'</span> 处于哪种状态？';
  $('quizFb').className='quizFb';
  document.querySelectorAll('.opt').forEach(o=>{o.disabled=false;o.classList.remove('right','wrong');});
}
document.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{
  if(!Q||Q.done)return;Q.done=true;
  const p=PRESETS[Q.pi],x=Q.x,nv=numVal(p,x),dv=denVal(p,x);
  const truth=dv===0?'bad':(nv===0?'zero':'ok');
  o.classList.add(truth===o.dataset.a?'right':'wrong');
  document.querySelector('.opt[data-a="'+truth+'"]').classList.add('right');
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  const why=dv===0?'分母 = 0 → 触碰禁区，无意义。':nv===0?'分子 = 0 且分母 = '+fmtNum(dv)+' ≠ 0 → 值为 0。':'分母 = '+fmtNum(dv)+' ≠ 0 有意义，值 = '+fmtNum(nv/dv)+'。';
  const fb=$('quizFb');
  fb.className='quizFb '+(truth===o.dataset.a?'good':'badfb');
  fb.innerHTML=(truth===o.dataset.a?'🎉 答对了！':'再想想～')+why+' 顺序：先看分母，再看分子。';
});
$('btnQuiz').onclick=newQuiz;

/* 页签 & 预设 */
function syncPresetUI(){
  ['presets','presets2'].forEach(id=>{
    Array.from($(id).children).forEach((b,j)=>b.classList.toggle('on',j===S.pi));
  });
}
function buildPresets(container,onPick){
  const pr=$(container);pr.innerHTML='';
  PRESETS.forEach((p,i)=>{const b=document.createElement('button');b.className='preset'+(i===S.pi?' on':'');b.textContent=p.label;
    b.onclick=()=>{S.pi=i;S.mul='none';syncPresetUI();onPick();};
    pr.appendChild(b);});
}
function setTab(t){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  $('secJudge').classList.toggle('hide',t!=='judge');
  $('secProp').classList.toggle('hide',t!=='prop');
  $('secQuiz').classList.toggle('hide',t!=='quiz');
  if(t==='prop')renderProp();
  if(t==='quiz'&&!Q)newQuiz();
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
$('xslider').oninput=e=>{S.x=+e.target.value;renderFrac();};
$('btnRand').onclick=()=>{S.x=Math.round((Math.random()*12-6)*2)/2;renderFrac();};

buildPresets('presets',renderFrac);
buildPresets('presets2',renderProp);
newQuiz();
renderFrac();
renderProp();
</script>
</body>
</html>
