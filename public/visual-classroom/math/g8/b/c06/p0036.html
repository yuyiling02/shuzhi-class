<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>24.3 数据的四分位数</title>
<style>
  :root{--blue:#2563eb;--blueL:#dbeafe;--green:#16a34a;--greenL:#dcfce7;--orange:#f59e0b;--orangeL:#fef3c7;--purple:#7c3aed;--purpleL:#ede9fe;--red:#ef4444;--ink:#1e293b;--sub:#64748b;--line:#e2e8f0;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#f4f7fb;color:var(--ink);padding:14px 12px 30px;}
  .wrap{max-width:940px;margin:0 auto;}
  header{text-align:center;margin-bottom:10px;}
  header h1{font-size:21px;}
  header p{color:var(--sub);font-size:13px;margin-top:2px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 2px 8px rgba(15,23,42,.05);margin-bottom:12px;}
  svg{display:block;width:100%;height:auto;}
  .caption{text-align:center;font-size:16px;font-weight:700;min-height:26px;margin:6px 0;}
  .caption .em{color:var(--purple);}
  .presets{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:8px;}
  .presets button{padding:7px 14px;border-radius:9px;border:2px solid var(--line);background:#fff;font-size:13px;font-weight:700;cursor:pointer;color:var(--sub);}
  .presets button.on{background:var(--purple);border-color:var(--purple);color:#fff;}
  .dataRow{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin:8px 0;}
  .dataRow input{width:48px;padding:6px 2px;border:1.5px solid var(--line);border-radius:7px;font-size:14px;text-align:center;font-weight:700;}
  .dots{display:flex;gap:7px;justify-content:center;margin:8px 0 2px;}
  .dots i{width:11px;height:11px;border-radius:50%;background:#cbd5e1;transition:.3s;cursor:pointer;}
  .dots i.on{background:var(--purple);transform:scale(1.2);}
  .ctrl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px;}
  .ctrl button{padding:8px 16px;border-radius:10px;border:2px solid var(--line);background:#fff;font-size:14px;font-weight:700;cursor:pointer;}
  .ctrl button.primary{background:var(--blue);border-color:var(--blue);color:#fff;}
  .ctrl button.play{background:var(--green);border-color:var(--green);color:#fff;}
  .ctrl button.play.on{background:var(--orange);border-color:var(--orange);}
  .ctrl button:disabled{opacity:.4;cursor:default;}
  .fivenum{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px;}
  .fivenum .f{padding:8px 14px;border-radius:10px;text-align:center;min-width:80px;}
  .fivenum .f .t{font-size:12px;color:var(--sub);}
  .fivenum .f .v{font-size:20px;font-weight:800;}
  .hide{display:none;}
  footer{text-align:center;color:#94a3b8;font-size:12px;margin-top:14px;}
  @media(max-width:640px){.caption{font-size:14px;}.dataRow input{width:42px;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>24.3 数据的四分位数</h1>
    <p>把排序数据一分为四 · 五数概括 / IQR / 异常值 / 箱线图</p>
  </header>

  <div class="card">
    <div class="presets">
      <button data-p="0" class="on">预设·无异常值</button>
      <button data-p="1">预设·含异常值</button>
      <button id="rand">🎲 随机 16 个</button>
    </div>
    <div class="dataRow" id="dataRow"></div>
    <svg id="svg" viewBox="0 0 900 400"></svg>
    <div class="caption" id="cap"></div>
    <div class="dots" id="dots"></div>
    <div class="ctrl">
      <button id="prev">◀ 上一步</button>
      <button id="next" class="primary">下一步 ▶</button>
      <button id="play" class="play">▶ 自动播放</button>
      <button id="reset">↺ 重置</button>
    </div>
    <div class="fivenum" id="fivenum"></div>
  </div>

  <footer>人教版八年级下册 · 24.3 数据的四分位数 · 奇数个数据剔除中位数再找 Q1/Q3</footer>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
const svg=$('svg');
const PRESETS=[
  [64,66,68,70,70,72,73,74,75,76,78,79,81,83,85,88],
  [25,64,66,68,70,71,72,73,74,75,76,78,80,82,85,102]
];
let DATA=PRESETS[1].slice();
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
function el(n,a){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e;}
function T(x,y,s,fill,size,op,w){const t=el('text',{x,y,'text-anchor':'middle','font-size':size||13,fill:fill||'#334155','font-weight':w||'bold','paint-order':'stroke',stroke:'#fff','stroke-width':4,opacity:op===undefined?1:op});t.textContent=s;return t;}
function med(a){const n=a.length,m=n>>1;return n%2?a[m]:(a[m-1]+a[m])/2;}
function stats(){
  const s=[...DATA].sort((a,b)=>a-b),n=s.length,k=Math.floor(n/2);
  const lower=s.slice(0,k),upper=s.slice(n-k);
  const Q1=med(lower),Q2=med(s),Q3=med(upper);
  const IQR=Q3-Q1,lo=Q1-1.5*IQR,hi=Q3+1.5*IQR;
  const outliers=s.filter(v=>v<lo||v>hi);
  const inliers=s.filter(v=>v>=lo&&v<=hi);
  return {s,n,Q1,Q2,Q3,IQR,lo,hi,outliers,wLo:Math.min(...inliers),wHi:Math.max(...inliers),min:s[0],max:s[n-1]};
}
const CAP=[
  '原始数据（乱序）：先观察这 16 个数',
  '第一步：<span class="em">升序排序</span>',
  '找 Q1、Q2、Q3：奇数个时<span class="em">剔除中位数</span>，上下两半各取中位数',
  '<span class="em">五数概括</span>：Min、Q1、Q2、Q3、Max',
  'IQR = Q3 − Q1 = 中间 50% 数据的跨度',
  '异常值：超出 [Q1−1.5IQR, Q3+1.5IQR] 的数',
  '画出<span class="em">箱线图</span>：箱体 Q1~Q3，中位线 Q2，须到界内最值'
];
let target=0,cur=0,raf=null,playTimer=null;
function ensureAnim(){if(raf==null)raf=requestAnimationFrame(tick);}
function tick(){cur+=(target-cur)*0.16;if(Math.abs(target-cur)<0.002)cur=target;render(cur);if(cur!==target)raf=requestAnimationFrame(tick);else raf=null;}
function setTarget(n){target=clamp(n,0,6);ensureAnim();updateUI();}
function stopPlay(){if(playTimer){clearInterval(playTimer);playTimer=null;}$('play').textContent='▶ 自动播放';$('play').classList.remove('on');}
function startPlay(){if(target>=6)setTarget(0);$('play').textContent='⏸ 暂停';$('play').classList.add('on');playTimer=setInterval(()=>{if(target<6)setTarget(target+1);else stopPlay();},2000);}

function buildInputs(){
  const d=$('dataRow');d.innerHTML='';
  DATA.forEach((v,i)=>{const inp=document.createElement('input');inp.type='number';inp.value=v;
    inp.oninput=()=>{const n=+inp.value;if(!isNaN(n)){DATA[i]=n;setTarget(0);cur=0;render(0);updateUI();}};d.appendChild(inp);});
}
function render(t){
  svg.innerHTML='';
  const st=stats();
  const sortOp=clamp(t-1,0,1),qOp=clamp(t-2,0,1),fiveOp=clamp(t-3,0,1),iqrOp=clamp(t-4,0,1),outOp=clamp(t-5,0,1),boxOp=clamp(t-6,0,1);
  const x0=70,x1=850;
  const vmin=Math.min(20,st.min),vmax=Math.max(105,st.max);
  const px=v=>x0+(v-vmin)/(vmax-vmin)*(x1-x0);
  // 数据点行
  const shown=sortOp>0.5?st.s:DATA;
  const n=shown.length,bw=(x1-x0)/n;
  shown.forEach((v,i)=>{
    const cx=x0+i*bw+bw/2;
    let fill='#dbeafe',stroke='#93c5fd',tc='#1d4ed8';
    if(qOp>0.5){
      if(v===st.Q2){fill='#ede9fe';stroke='#7c3aed';tc='#6d28d9';}
    }
    if(outOp>0.5&&st.outliers.includes(v)){fill='#fee2e2';stroke='#ef4444';tc='#b91c1c';}
    el('rect',{x:cx-15,y:40,width:30,height:30,rx:6,fill,stroke,'stroke-width':2});
    T(cx,60,String(v),tc,12);
  });
  if(qOp>0.5){
    T(px(st.Q1),95,'Q1='+st.Q1,'#2563eb',14,qOp);
    T(px(st.Q2),112,'Q2='+st.Q2,'#7c3aed',14,qOp);
    T(px(st.Q3),95,'Q3='+st.Q3,'#16a34a',14,qOp);
  }
  // 数轴
  const ay=200;
  el('line',{x1:x0,y1:ay,x2:x1,y2:ay,stroke:'#cbd5e1','stroke-width':2});
  for(let v=Math.ceil(vmin/10)*10;v<=vmax;v+=10){el('line',{x1:px(v),y1:ay-4,x2:px(v),y2:ay+4,stroke:'#cbd5e1','stroke-width':1.4});T(px(v),ay+20,String(v),'#94a3b8',11);}
  // IQR 区间
  if(iqrOp>0){
    el('rect',{x:px(st.Q1),y:ay-30,width:px(st.Q3)-px(st.Q1),height:60,fill:'#ede9fe',opacity:0.4*iqrOp});
    T((px(st.Q1)+px(st.Q3))/2,ay-38,'IQR='+st.IQR,'#7c3aed',14,iqrOp);
  }
  // 异常值界
  if(outOp>0){
    el('line',{x1:px(st.lo),y1:ay-50,x2:px(st.lo),y2:ay+50,stroke:'#ef4444','stroke-width':2,'stroke-dasharray':'6 4',opacity:outOp});
    el('line',{x1:px(st.hi),y1:ay-50,x2:px(st.hi),y2:ay+50,stroke:'#ef4444','stroke-width':2,'stroke-dasharray':'6 4',opacity:outOp});
    T(px(st.lo),ay+66,'下界'+Math.round(st.lo*10)/10,'#ef4444',11,outOp);
    T(px(st.hi),ay+66,'上界'+Math.round(st.hi*10)/10,'#ef4444',11,outOp);
  }
  // 箱线图
  if(boxOp>0){
    const by=320,bh=44;
    el('line',{x1:px(st.wLo),y1:by+bh/2,x2:px(st.Q1),y2:by+bh/2,stroke:'#334155','stroke-width':2,opacity:boxOp});
    el('line',{x1:px(st.Q3),y1:by+bh/2,x2:px(st.wHi),y2:by+bh/2,stroke:'#334155','stroke-width':2,opacity:boxOp});
    el('line',{x1:px(st.wLo),y1:by+8,x2:px(st.wLo),y2:by+bh-8,stroke:'#334155','stroke-width':2,opacity:boxOp});
    el('line',{x1:px(st.wHi),y1:by+8,x2:px(st.wHi),y2:by+bh-8,stroke:'#334155','stroke-width':2,opacity:boxOp});
    el('rect',{x:px(st.Q1),y:by,width:px(st.Q3)-px(st.Q1),height:bh,rx:4,fill:'#dbeafe',stroke:'#2563eb','stroke-width':2.5,opacity:boxOp});
    el('line',{x1:px(st.Q2),y1:by,x2:px(st.Q2),y2:by+bh,stroke:'#7c3aed','stroke-width':3,opacity:boxOp});
    T(px(st.Q1),by-8,'Q1','#2563eb',12,boxOp);
    T(px(st.Q2),by-8,'Q2','#7c3aed',12,boxOp);
    T(px(st.Q3),by-8,'Q3','#16a34a',12,boxOp);
    st.outliers.forEach(v=>{el('circle',{cx:px(v),cy:by+bh/2,r:7,fill:'#fff',stroke:'#ef4444','stroke-width':2.5,opacity:boxOp});T(px(v),by+bh+18,String(v),'#ef4444',12,boxOp);});
    T(450,by+bh+38,'箱线图：须只到界内最值，异常值单独画空心点','#64748b',13,boxOp);
  }
}
function updateUI(){
  const st=stats();
  $('cap').innerHTML=CAP[target];
  $('dots').innerHTML=CAP.map((_,i)=>'<i class="'+(i<=target?'on':'')+'" data-i="'+i+'"></i>').join('');
  document.querySelectorAll('.dots i').forEach(d=>d.onclick=()=>{stopPlay();setTarget(+d.dataset.i);});
  $('prev').disabled=target===0;$('next').disabled=target===6;
  if(target>=3){
    $('fivenum').innerHTML=
      '<div class="f" style="background:#f1f5f9;"><div class="t">Min</div><div class="v">'+st.min+'</div></div>'+
      '<div class="f" style="background:var(--blueL);color:var(--blue);"><div class="t">Q1</div><div class="v">'+st.Q1+'</div></div>'+
      '<div class="f" style="background:var(--purpleL);color:var(--purple);"><div class="t">Q2</div><div class="v">'+st.Q2+'</div></div>'+
      '<div class="f" style="background:var(--greenL);color:var(--green);"><div class="t">Q3</div><div class="v">'+st.Q3+'</div></div>'+
      '<div class="f" style="background:#f1f5f9;"><div class="t">Max</div><div class="v">'+st.max+'</div></div>'+
      (target>=5?'<div class="f" style="background:#fee2e2;color:var(--red);"><div class="t">异常值</div><div class="v">'+(st.outliers.length?st.outliers.join(','):'无')+'</div></div>':'');
  }else $('fivenum').innerHTML='';
}
document.querySelectorAll('.presets button[data-p]').forEach(b=>b.onclick=()=>{
  DATA=PRESETS[+b.dataset.p].slice();
  document.querySelectorAll('.presets button[data-p]').forEach(x=>x.classList.toggle('on',x===b));
  buildInputs();setTarget(0);cur=0;render(0);updateUI();
});
$('rand').onclick=()=>{DATA=[];for(let i=0;i<16;i++)DATA.push(60+Math.floor(Math.random()*41));document.querySelectorAll('.presets button[data-p]').forEach(x=>x.classList.remove('on'));buildInputs();setTarget(0);cur=0;render(0);updateUI();};
$('next').onclick=()=>{stopPlay();setTarget(target+1);};
$('prev').onclick=()=>{stopPlay();setTarget(target-1);};
$('reset').onclick=()=>{stopPlay();setTarget(0);};
$('play').onclick=()=>playTimer?stopPlay():startPlay();
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){stopPlay();setTarget(target+1);}
  if(e.key==='ArrowLeft'){stopPlay();setTarget(target-1);}
  if(e.key===' '){e.preventDefault();playTimer?stopPlay():startPlay();}
});
buildInputs();render(0);updateUI();
</script>
</body>
</html>
