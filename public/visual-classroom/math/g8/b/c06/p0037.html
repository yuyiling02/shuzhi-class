<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>24.4 数据的分组</title>
<style>
  :root{--blue:#2563eb;--blueL:#dbeafe;--green:#16a34a;--greenL:#dcfce7;--orange:#f59e0b;--purple:#7c3aed;--purpleL:#ede9fe;--red:#ef4444;--ink:#1e293b;--sub:#64748b;--line:#e2e8f0;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#f4f7fb;color:var(--ink);padding:14px 12px 30px;}
  .wrap{max-width:940px;margin:0 auto;}
  header{text-align:center;margin-bottom:10px;}
  header h1{font-size:21px;}
  header p{color:var(--sub);font-size:13px;margin-top:2px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 2px 8px rgba(15,23,42,.05);margin-bottom:12px;}
  svg{display:block;width:100%;height:auto;}
  .caption{text-align:center;font-size:16px;font-weight:700;min-height:26px;margin:6px 0;}
  .caption .em{color:var(--purple);}
  .sliderRow{display:flex;align-items:center;gap:10px;justify-content:center;margin:8px 0;font-size:15px;font-weight:700;}
  .sliderRow input{width:220px;accent-color:var(--purple);}
  .sliderRow b{color:var(--purple);min-width:30px;text-align:center;font-size:17px;}
  .dots{display:flex;gap:7px;justify-content:center;margin:8px 0 2px;}
  .dots i{width:11px;height:11px;border-radius:50%;background:#cbd5e1;transition:.3s;cursor:pointer;}
  .dots i.on{background:var(--purple);transform:scale(1.2);}
  .ctrl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px;}
  .ctrl button{padding:8px 16px;border-radius:10px;border:2px solid var(--line);background:#fff;font-size:14px;font-weight:700;cursor:pointer;}
  .ctrl button.primary{background:var(--blue);border-color:var(--blue);color:#fff;}
  .ctrl button.play{background:var(--green);border-color:var(--green);color:#fff;}
  .ctrl button.play.on{background:var(--orange);border-color:var(--orange);}
  .ctrl button:disabled{opacity:.4;cursor:default;}
  table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px;}
  th,td{padding:6px 8px;border-bottom:1px solid #eef2f7;text-align:center;}
  th{color:var(--sub);font-size:13px;}
  td.hl{background:var(--purpleL);font-weight:800;color:var(--purple);}
  .concl{text-align:center;font-size:15px;font-weight:700;background:var(--purpleL);color:var(--purple);border-radius:12px;padding:12px;margin-top:10px;}
  .hide{display:none;}
  footer{text-align:center;color:#94a3b8;font-size:12px;margin-top:14px;}
  @media(max-width:640px){.caption{font-size:14px;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>24.4 数据的分组</h1>
    <p>50 名学生身高（cm）· 口诀：算极差 → 定组距组数 → 数频数 → 画直方图</p>
  </header>

  <div class="card">
    <div class="sliderRow"><span>组距 d</span><input type="range" id="dSlider" min="0.5" max="6" step="0.5" value="3"><b id="dVal">3</b><span id="grpInfo" style="color:var(--sub);font-size:13px;"></span></div>
    <svg id="svg" viewBox="0 0 900 340"></svg>
    <div class="caption" id="cap"></div>
    <div class="dots" id="dots"></div>
    <div class="ctrl">
      <button id="prev">◀ 上一步</button>
      <button id="next" class="primary">下一步 ▶</button>
      <button id="play" class="play">▶ 自动播放</button>
      <button id="reset">↺ 重置</button>
    </div>
  </div>

  <div class="card" id="tableCard">
    <table id="freqTable"></table>
    <div class="concl hide" id="concl"></div>
  </div>

  <footer>人教版八年级下册 · 24.4 数据的分组 · 直方图矩形连续无空隙，纵轴为频数</footer>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
const svg=$('svg');
const DATA=[155.5,157.0,158.5,159.0,160.0,160.5,161.0,161.5,162.0,162.5,163.0,163.0,163.5,164.0,164.5,165.0,165.0,165.5,166.0,166.0,166.5,167.0,167.0,167.5,168.0,168.0,168.5,169.0,169.0,169.5,170.0,170.0,170.5,171.0,171.5,172.0,172.0,172.5,173.0,173.5,174.0,174.5,175.0,175.5,176.0,176.5,177.0,177.5,178.0,178.5];
const MIN=Math.min(...DATA),MAX=Math.max(...DATA),START=Math.floor(MIN),RANGE=MAX-MIN;
let d=3;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
function el(n,a){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e;}
function T(x,y,s,fill,size,op,w){const t=el('text',{x,y,'text-anchor':'middle','font-size':size||13,fill:fill||'#334155','font-weight':w||'bold','paint-order':'stroke',stroke:'#fff','stroke-width':4,opacity:op===undefined?1:op});t.textContent=s;return t;}
function groups(){
  const k=Math.ceil((MAX-START)/d),gs=[];
  for(let i=0;i<k;i++){const lo=START+i*d,hi=lo+d;gs.push({lo,hi,count:0});}
  DATA.forEach(v=>{let idx=Math.floor((v-START)/d);if(idx>=k)idx=k-1;gs[idx].count++;});
  return gs;
}
const CAP=[
  '① 算极差：最大 '+MAX+' − 最小 '+MIN+' = <span class="em">'+RANGE+'</span>',
  '② 定组距组数：从 '+START+' 起，组距 d='+d+'，组数 = ⌈(最大−起点)÷d⌉ 进一法',
  '③ 数频数：每个数据落进哪一组，划记计数（频率 = 频数÷50）',
  '④ 画直方图：矩形连续无空隙，高 = 频数',
  '⑤ 用样本估计总体：频数最高组的占比，估计全年级'
];
let target=0,cur=0,raf=null,playTimer=null;
function ensureAnim(){if(raf==null)raf=requestAnimationFrame(tick);}
function tick(){cur+=(target-cur)*0.16;if(Math.abs(target-cur)<0.002)cur=target;render(cur);if(cur!==target)raf=requestAnimationFrame(tick);else raf=null;}
function setTarget(n){target=clamp(n,0,4);ensureAnim();updateUI();}
function stopPlay(){if(playTimer){clearInterval(playTimer);playTimer=null;}$('play').textContent='▶ 自动播放';$('play').classList.remove('on');}
function startPlay(){if(target>=4)setTarget(0);$('play').textContent='⏸ 暂停';$('play').classList.add('on');playTimer=setInterval(()=>{if(target<4)setTarget(target+1);else stopPlay();},2000);}

function render(t){
  svg.innerHTML='';
  const gs=groups(),k=gs.length;
  const rangeOp=clamp(t,0,1),boundOp=clamp(t-1,0,1),freqOp=clamp(t-2,0,1),histOp=clamp(t-3,0,1),estOp=clamp(t-4,0,1);
  const x0=70,x1=850,y0=280;
  const vmin=START,vmax=START+k*d;
  const px=v=>x0+(v-vmin)/(vmax-vmin)*(x1-x0);
  const maxC=Math.max(...gs.map(g=>g.count));
  const py=c=>y0-c/maxC*200;
  el('line',{x1:x0,y1:y0,x2:x1,y2:y0,stroke:'#cbd5e1','stroke-width':2});
  // 数据点（底部抖动）
  DATA.forEach((v,i)=>{el('circle',{cx:px(v),cy:y0+18+(i%3)*5,r:3,fill:'#93c5fd',opacity:0.7});});
  // 极差标注
  if(rangeOp>0){
    el('line',{x1:px(MIN),y1:40,x2:px(MIN),y2:y0,stroke:'#ef4444','stroke-width':1.5,'stroke-dasharray':'5 4',opacity:rangeOp});
    el('line',{x1:px(MAX),y1:40,x2:px(MAX),y2:y0,stroke:'#ef4444','stroke-width':1.5,'stroke-dasharray':'5 4',opacity:rangeOp});
    T(px(MIN),32,'最小'+MIN,'#ef4444',12,rangeOp);
    T(px(MAX),32,'最大'+MAX,'#ef4444',12,rangeOp);
    el('line',{x1:px(MIN),y1:52,x2:px(MAX),y2:52,stroke:'#ef4444','stroke-width':2,opacity:rangeOp});
    T((px(MIN)+px(MAX))/2,70,'极差 = '+RANGE,'#ef4444',14,rangeOp);
  }
  // 组界 + 直方图
  gs.forEach((g,i)=>{
    if(boundOp>0)el('line',{x1:px(g.lo),y1:90,x2:px(g.lo),y2:y0,stroke:'#c4b5fd','stroke-width':1.5,'stroke-dasharray':'4 3',opacity:boundOp});
    if(histOp>0){
      const h=(y0-py(g.count))*histOp;
      const isMax=g.count===maxC;
      el('rect',{x:px(g.lo)+1,y:y0-h,width:px(g.hi)-px(g.lo)-2,height:h,fill:estOp>0&&isMax?'#c4b5fd':'#93c5fd',stroke:'#2563eb','stroke-width':1.5,opacity:histOp});
      if(freqOp>0.3)T((px(g.lo)+px(g.hi))/2,y0-h-8,String(g.count),'#1d4ed8',13,freqOp);
    }
    if(boundOp>0.3)T((px(g.lo)+px(g.hi))/2,y0+44,g.lo+'~'+g.hi,'#64748b',10,boundOp);
  });
  if(boundOp>0)el('line',{x1:px(vmax),y1:90,x2:px(vmax),y2:y0,stroke:'#c4b5fd','stroke-width':1.5,'stroke-dasharray':'4 3',opacity:boundOp});
  if(estOp>0){
    const mg=gs.find(g=>g.count===maxC);
    T((px(mg.lo)+px(mg.hi))/2,py(maxC)-30,'最高组 '+mg.lo+'~'+mg.hi,'#7c3aed',13,estOp);
  }
}
function updateUI(){
  const gs=groups(),k=gs.length;
  $('cap').innerHTML=CAP[target].replace('d='+d,'d='+d);
  $('grpInfo').textContent='共 '+k+' 组'+(k>15?'（偏多）':k<4?'（偏少）':'');
  $('dots').innerHTML=CAP.map((_,i)=>'<i class="'+(i<=target?'on':'')+'" data-i="'+i+'"></i>').join('');
  document.querySelectorAll('.dots i').forEach(dd=>dd.onclick=()=>{stopPlay();setTarget(+dd.dataset.i);});
  $('prev').disabled=target===0;$('next').disabled=target===4;
  // 频数表
  if(target>=2){
    let html='<tr><th>分组</th><th>划记</th><th>频数</th><th>频率</th></tr>';
    gs.forEach((g,i)=>{
      const tally='正'.repeat(Math.floor(g.count/5))+(g.count%5?'·'.repeat(g.count%5):'');
      html+='<tr><td>'+g.lo+'~'+g.hi+'</td><td>'+(tally||'—')+'</td><td class="'+(target>=2?'hl':'')+'">'+g.count+'</td><td>'+(g.count/50).toFixed(2)+'</td></tr>';
    });
    html+='<tr><td><b>合计</b></td><td></td><td><b>50</b></td><td><b>1.00</b></td></tr>';
    $('freqTable').innerHTML=html;
  }else $('freqTable').innerHTML='';
  if(target>=4){
    const mg=gs.find(g=>g.count===Math.max(...gs.map(g=>g.count)));
    const r=mg.count/50,est=Math.round(r*1000);
    $('concl').classList.remove('hide');
    $('concl').innerHTML='样本中 '+mg.lo+'~'+mg.hi+' cm 占 '+mg.count+'/50 = '+(r*100).toFixed(0)+'%，估计全年级 1000 人中约有 <b>'+est+'</b> 人身高在此范围。';
  }else $('concl').classList.add('hide');
}
$('dSlider').oninput=e=>{d=+e.target.value;$('dVal').textContent=d;setTarget(1);cur=1;render(1);updateUI();};
$('next').onclick=()=>{stopPlay();setTarget(target+1);};
$('prev').onclick=()=>{stopPlay();setTarget(target-1);};
$('reset').onclick=()=>{stopPlay();d=3;$('dSlider').value=3;$('dVal').textContent=3;setTarget(0);};
$('play').onclick=()=>playTimer?stopPlay():startPlay();
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){stopPlay();setTarget(target+1);}
  if(e.key==='ArrowLeft'){stopPlay();setTarget(target-1);}
  if(e.key===' '){e.preventDefault();playTimer?stopPlay():startPlay();}
});
render(0);updateUI();
</script>
</body>
</html>
