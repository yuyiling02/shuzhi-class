<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>24.2 数据的离散程度</title>
<style>
  :root{--blue:#2563eb;--blueL:#dbeafe;--green:#16a34a;--greenL:#dcfce7;--orange:#f59e0b;--red:#ef4444;--purple:#7c3aed;--ink:#1e293b;--sub:#64748b;--line:#e2e8f0;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#f4f7fb;color:var(--ink);padding:14px 12px 30px;}
  .wrap{max-width:940px;margin:0 auto;}
  header{text-align:center;margin-bottom:10px;}
  header h1{font-size:21px;}
  header p{color:var(--sub);font-size:13px;margin-top:2px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 2px 8px rgba(15,23,42,.05);margin-bottom:12px;}
  svg{display:block;width:100%;height:auto;}
  .caption{text-align:center;font-size:17px;font-weight:700;min-height:28px;margin:6px 0;}
  .caption .em{color:var(--purple);}
  .formula{text-align:center;font-family:"Cambria Math",Georgia,serif;font-size:24px;font-weight:bold;padding:8px;line-height:1.8;}
  .formula .tm{transition:opacity .4s;padding:0 3px;}
  .formula .tm.dim{opacity:.2;}
  .formula sup{font-size:.6em;} .formula sub{font-size:.6em;}
  .dots{display:flex;gap:7px;justify-content:center;margin:8px 0 2px;}
  .dots i{width:11px;height:11px;border-radius:50%;background:#cbd5e1;transition:.3s;cursor:pointer;}
  .dots i.on{background:var(--purple);transform:scale(1.2);}
  .ctrl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px;}
  .ctrl button{padding:8px 16px;border-radius:10px;border:2px solid var(--line);background:#fff;font-size:14px;font-weight:700;cursor:pointer;}
  .ctrl button.primary{background:var(--blue);border-color:var(--blue);color:#fff;}
  .ctrl button.play{background:var(--green);border-color:var(--green);color:#fff;}
  .ctrl button.play.on{background:var(--orange);border-color:var(--orange);}
  .ctrl button:disabled{opacity:.4;cursor:default;}
  .vbars{display:flex;flex-direction:column;gap:10px;margin-top:10px;}
  .vbar{display:flex;align-items:center;gap:10px;}
  .vbar .lab{width:60px;font-weight:800;font-size:15px;}
  .vbar .track{flex:1;height:26px;background:#f1f5f9;border-radius:8px;overflow:hidden;}
  .vbar .fill{height:100%;border-radius:8px;transition:width .8s;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:#fff;font-weight:800;font-size:13px;min-width:36px;}
  .concl{text-align:center;font-size:16px;font-weight:800;background:var(--greenL);color:var(--green);border-radius:12px;padding:12px;margin-top:10px;opacity:0;transition:.5s;}
  .concl.show{opacity:1;}
  .hide{display:none;}
  footer{text-align:center;color:#94a3b8;font-size:12px;margin-top:14px;}
  @media(max-width:640px){.formula{font-size:18px;}.caption{font-size:15px;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>24.2 数据的离散程度</h1>
    <p>甲、乙两组数据平均数都是 6，谁更稳定？用方差说话</p>
  </header>

  <div class="card">
    <svg id="svg" viewBox="0 0 900 300"></svg>
    <div class="caption" id="cap"></div>
    <div class="dots" id="dots"></div>
    <div class="ctrl">
      <button id="prev">◀ 上一步</button>
      <button id="next" class="primary">下一步 ▶</button>
      <button id="play" class="play">▶ 自动播放</button>
      <button id="reset">↺ 重置</button>
    </div>
  </div>

  <div class="card">
    <div class="formula" id="formula"></div>
    <div class="vbars">
      <div class="vbar"><span class="lab" style="color:var(--blue);">甲</span><div class="track"><div class="fill" id="barA" style="background:var(--blue);width:5%;">0.4</div></div></div>
      <div class="vbar"><span class="lab" style="color:var(--orange);">乙</span><div class="track"><div class="fill" id="barB" style="background:var(--orange);width:5%;">8</div></div></div>
    </div>
    <div class="concl" id="concl">方差越小越稳定：甲 s²=0.4 ＜ 乙 s²=8 → 甲组数据更稳定</div>
  </div>

  <footer>人教版八年级下册 · 24.2 数据的离散程度 · 极差 / 方差 / 标准差</footer>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
const svg=$('svg');
const A=[5,6,6,6,7],B=[2,4,6,8,10],MEAN=6,N=5;
function el(n,a){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e;}
function T(x,y,s,fill,size,op,w){const t=el('text',{x,y,'text-anchor':'middle','font-size':size||14,fill:fill||'#334155','font-weight':w||'bold','paint-order':'stroke',stroke:'#fff','stroke-width':4,opacity:op===undefined?1:op});t.textContent=s;return t;}
const CAP=[
  '两组数据：甲 <span class="em">5,6,6,6,7</span>，乙 <span class="em">2,4,6,8,10</span>',
  '先求平均数：两组都是 <span class="em">x̄ = 6</span>',
  '看每个数到平均数的<span class="em">偏差</span>（虚线）—— 直接相加会抵消成 0',
  '把偏差<span class="em">平方</span>：负号消失，大偏差被放大',
  '平方后<span class="em">求和</span>：甲 = 2，乙 = 40',
  '再<span class="em">除以 n=5</span> 取平均：甲 s²=0.4，乙 s²=8'
];
let target=0,cur=0,raf=null,playTimer=null;
function ensureAnim(){if(raf==null)raf=requestAnimationFrame(tick);}
function tick(){cur+=(target-cur)*0.16;if(Math.abs(target-cur)<0.002)cur=target;render(cur);if(cur!==target)raf=requestAnimationFrame(tick);else raf=null;}
function setTarget(n){target=Math.max(0,Math.min(5,n));ensureAnim();updateUI();}
function stopPlay(){if(playTimer){clearInterval(playTimer);playTimer=null;}$('play').textContent='▶ 自动播放';$('play').classList.remove('on');}
function startPlay(){if(target>=5)setTarget(0);$('play').textContent='⏸ 暂停';$('play').classList.add('on');playTimer=setInterval(()=>{if(target<5)setTarget(target+1);else stopPlay();},1900);}

function drawRow(data,y,color,devOp,sqOp,label){
  const x0=80,x1=840,px=v=>x0+(v/12)*(x1-x0);
  el('line',{x1:px(0),y1:y,x2:px(12),y2:y,stroke:'#cbd5e1','stroke-width':2});
  for(let t=0;t<=12;t+=2){el('line',{x1:px(t),y1:y-4,x2:px(t),y2:y+4,stroke:'#cbd5e1','stroke-width':1.4});T(px(t),y+20,String(t),'#94a3b8',11);}
  el('line',{x1:px(MEAN),y1:y-46,x2:px(MEAN),y2:y+8,stroke:'#16a34a','stroke-width':2,'stroke-dasharray':'5 4'});
  T(px(MEAN),y-52,'x̄=6','#16a34a',13);
  T(x0-30,y+5,label,color,18);
  data.forEach(v=>{
    el('circle',{cx:px(v),cy:y,r:9,fill:color,stroke:'#fff','stroke-width':2});
    T(px(v),y-16,String(v),color,14);
    if(devOp>0){
      el('line',{x1:px(v),y1:y,x2:px(MEAN),y2:y,stroke:color,'stroke-width':2.5,'stroke-dasharray':'4 3',opacity:devOp});
      const d=v-MEAN;
      if(sqOp>0)T((px(v)+px(MEAN))/2,y+38,(d<0?'−':'')+Math.abs(d)+'²='+d*d,'#7c3aed',12,sqOp);
      else if(devOp>0.5)T((px(v)+px(MEAN))/2,y+38,(d>0?'+':'')+d,color,12,devOp);
    }
  });
}
function render(t){
  svg.innerHTML='';
  const dev=clamp(t-2,0,1),sq=clamp(t-3,0,1),sum=clamp(t-4,0,1),div=clamp(t-5,0,1);
  drawRow(A,90,'#2563eb',dev,sq,'甲');
  drawRow(B,210,'#f59e0b',dev,sq,'乙');
  if(sum>0){T(450,270,'平方和：甲 = 1+0+0+0+1 = 2　　乙 = 16+4+0+4+16 = 40','#7c3aed',15,sum);}
  if(div>0){T(450,292,'÷5：甲 s² = 2÷5 = 0.4　　乙 s² = 40÷5 = 8','#16a34a',15,div);}
}
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
function formulaHTML(){
  const tm=(s,step,color)=>'<span class="tm'+(target>=step?'':' dim')+'" style="color:'+(color||'inherit')+'">'+s+'</span>';
  return tm('s²',5,'#16a34a')+' '+tm('=',5)+' '+tm('Σ',4,'#7c3aed')+'('+tm('x<sub>i</sub>',0,'#2563eb')+' '+tm('−',2)+' '+tm('x̄',1,'#16a34a')+')'+tm('²',3,'#7c3aed')+' '+tm('/ n',5,'#16a34a');
}
function updateUI(){
  $('cap').innerHTML=CAP[target];
  $('dots').innerHTML=CAP.map((_,i)=>'<i class="'+(i<=target?'on':'')+'" data-i="'+i+'"></i>').join('');
  document.querySelectorAll('.dots i').forEach(d=>d.onclick=()=>{stopPlay();setTarget(+d.dataset.i);});
  $('formula').innerHTML=formulaHTML();
  $('barA').style.width=target>=5?'5%':'5%';
  $('barB').style.width=target>=5?'100%':'5%';
  $('concl').classList.toggle('show',target>=5);
  $('prev').disabled=target===0;$('next').disabled=target===5;
}
$('next').onclick=()=>{stopPlay();setTarget(target+1);};
$('prev').onclick=()=>{stopPlay();setTarget(target-1);};
$('reset').onclick=()=>{stopPlay();setTarget(0);};
$('play').onclick=()=>playTimer?stopPlay():startPlay();
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){stopPlay();setTarget(target+1);}
  if(e.key==='ArrowLeft'){stopPlay();setTarget(target-1);}
  if(e.key===' '){e.preventDefault();playTimer?stopPlay():startPlay();}
});
render(0);updateUI();
</script>
</body>
</html>
