<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>24.1 数据的集中趋势</title>
<style>
  :root{--blue:#2563eb;--blueL:#dbeafe;--green:#16a34a;--greenL:#dcfce7;--orange:#f59e0b;--orangeL:#fef3c7;--purple:#7c3aed;--red:#ef4444;--ink:#1e293b;--sub:#64748b;--line:#e2e8f0;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#f4f7fb;color:var(--ink);padding:14px 12px 30px;}
  .wrap{max-width:940px;margin:0 auto;}
  header{text-align:center;margin-bottom:10px;}
  header h1{font-size:21px;}
  header p{color:var(--sub);font-size:13px;margin-top:2px;}
  .tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:10px;}
  .tab{padding:9px 18px;border-radius:999px;border:2px solid var(--line);background:#fff;font-size:15px;font-weight:700;color:var(--sub);cursor:pointer;}
  .tab.on{background:var(--blue);border-color:var(--blue);color:#fff;}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 2px 8px rgba(15,23,42,.05);margin-bottom:12px;}
  svg{display:block;width:100%;height:auto;}
  .caption{text-align:center;font-size:16px;font-weight:700;min-height:26px;margin:6px 0;}
  .caption .em{color:var(--blue);}
  .formula{text-align:center;font-family:"Cambria Math",Georgia,serif;font-size:22px;font-weight:bold;line-height:1.8;padding:6px;}
  .formula b{color:var(--green);}
  .dataRow{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0;}
  .dataRow input{width:58px;padding:7px 4px;border:1.5px solid var(--line);border-radius:8px;font-size:15px;text-align:center;font-weight:700;}
  .dataRow input.w{width:42px;border-color:#fcd34d;background:#fffbeb;}
  .ctrl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px;}
  .ctrl button{padding:8px 16px;border-radius:10px;border:2px solid var(--line);background:#fff;font-size:14px;font-weight:700;cursor:pointer;}
  .ctrl button.primary{background:var(--blue);border-color:var(--blue);color:#fff;}
  .ctrl button.green{background:var(--green);border-color:var(--green);color:#fff;}
  .ctrl button:disabled{opacity:.4;cursor:default;}
  .toggle{display:flex;gap:8px;align-items:center;justify-content:center;font-size:14px;font-weight:700;margin:6px 0;}
  .toggle input{width:18px;height:18px;accent-color:var(--orange);}
  .stat{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px;}
  .stat .s{padding:10px 18px;border-radius:12px;text-align:center;min-width:120px;}
  .stat .s .t{font-size:13px;color:var(--sub);}
  .stat .s .v{font-size:24px;font-weight:800;margin-top:2px;}
  .s.blue{background:var(--blueL);color:var(--blue);} .s.green{background:var(--greenL);color:var(--green);} .s.orange{background:var(--orangeL);color:#b45309;}
  .ext-head{display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
  .ext-head h3{font-size:15px;color:var(--purple);}
  .ext-head span{font-size:13px;color:var(--sub);}
  .hide{display:none;}
  footer{text-align:center;color:#94a3b8;font-size:12px;margin-top:14px;}
  @media(max-width:640px){.formula{font-size:18px;}.caption{font-size:14px;}.dataRow input{width:48px;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>24.1 数据的集中趋势</h1>
    <p>10 名学生立定跳远成绩（cm）· 平均数 / 中位数 / 众数</p>
  </header>

  <div class="tabs">
    <button class="tab on" data-t="mean">平均数</button>
    <button class="tab" data-t="median">中位数</button>
    <button class="tab" data-t="mode">众数</button>
    <button class="tab" data-t="which">该用谁</button>
  </div>

  <!-- 平均数 -->
  <div id="secMean">
    <div class="card">
      <div class="caption">改一改下面的成绩，平均数立刻跟着变</div>
      <div class="dataRow" id="meanData"></div>
      <div class="toggle"><input type="checkbox" id="wToggle"><label for="wToggle">加入"权"（加权平均数）</label></div>
      <div class="dataRow hide" id="weightRow"></div>
      <svg id="svgMean" viewBox="0 0 900 300"></svg>
      <div class="formula" id="meanFormula"></div>
    </div>
  </div>

  <!-- 中位数 -->
  <div id="secMedian" class="hide">
    <div class="card">
      <div class="caption" id="medCap">中位数必须先<b>排序</b>！点「开始排序」看冒泡排序</div>
      <svg id="svgMed" viewBox="0 0 900 220"></svg>
      <div class="ctrl">
        <button id="medSort" class="primary">▶ 开始排序</button>
        <button id="medReset">↺ 还原无序</button>
      </div>
      <div class="formula" id="medFormula"></div>
    </div>
  </div>

  <!-- 众数 -->
  <div id="secMode" class="hide">
    <div class="card">
      <div class="caption">哪个成绩出现次数最多？最高的柱子就是<span class="em">众数</span></div>
      <svg id="svgMode" viewBox="0 0 900 300"></svg>
      <div class="formula" id="modeFormula"></div>
    </div>
  </div>

  <!-- 该用谁 -->
  <div id="secWhich" class="hide">
    <div class="card">
      <div class="caption">把最好成绩 220 拖成一个"极端值"，看三个统计量谁被带跑</div>
      <div class="toggle"><span>极端值</span><input type="range" id="extSlider" min="220" max="600" step="10" value="220" style="width:200px;accent-color:var(--red);"><b id="extVal" style="color:var(--red);">220</b></div>
      <div class="stat">
        <div class="s blue"><div class="t">平均数</div><div class="v" id="wMean"></div></div>
        <div class="s green"><div class="t">中位数</div><div class="v" id="wMed"></div></div>
        <div class="s orange"><div class="t">众数</div><div class="v" id="wMode"></div></div>
      </div>
      <div class="caption" id="wCap" style="margin-top:12px;"></div>
    </div>
  </div>

  <!-- 拓展 -->
  <div class="card">
    <div class="ext-head" id="extHead">
      <h3>综合实践 · 某班 20 名学生体质健康调查</h3>
      <span id="extArrow">展开 ▼</span>
    </div>
    <div id="extBody" class="hide">
      <div class="ctrl"><button id="resample" class="green">🎲 重新抽样 20 人身高</button></div>
      <div class="stat" id="surveyStat"></div>
      <div class="caption" id="surveyNote" style="font-weight:normal;color:var(--sub);"></div>
    </div>
  </div>

  <footer>人教版八年级下册 · 24.1 数据的集中趋势</footer>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
let DATA=[185,198,200,185,210,198,175,205,198,220];
let W=[1,2,1,1,3,2,1,1,2,1];
const ORIG=DATA.slice();
function el(n,a,p){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||svgMean).appendChild(e);return e;}
function T(p,x,y,s,fill,size,op,w){const t=el('text',{x,y,'text-anchor':'middle','font-size':size||14,fill:fill||'#334155','font-weight':w||'bold','paint-order':'stroke',stroke:'#fff','stroke-width':4,opacity:op===undefined?1:op},p);t.textContent=s;return t;}
const mean=a=>a.reduce((s,v)=>s+v,0)/a.length;
const median=a=>{const s=[...a].sort((x,y)=>x-y),n=s.length,m=n>>1;return n%2?s[m]:(s[m-1]+s[m])/2;};
function mode(a){const c={};a.forEach(v=>c[v]=(c[v]||0)+1);const mx=Math.max(...Object.values(c));if(mx===1)return[];return Object.keys(c).filter(k=>c[k]===mx).map(Number);}
const r1=v=>Math.round(v*10)/10;

/* ---- 平均数 ---- */
function buildMeanInputs(){
  const d=$('meanData');d.innerHTML='';
  DATA.forEach((v,i)=>{const inp=document.createElement('input');inp.type='number';inp.value=v;
    inp.oninput=()=>{const n=+inp.value;if(!isNaN(n)&&n>0){DATA[i]=n;renderMean();renderMode();renderWhich();}};d.appendChild(inp);});
  const w=$('weightRow');w.innerHTML='';
  W.forEach((v,i)=>{const inp=document.createElement('input');inp.type='number';inp.className='w';inp.value=v;inp.min=1;
    inp.oninput=()=>{const n=+inp.value;if(!isNaN(n)&&n>0){W[i]=n;renderMean();}};w.appendChild(inp);});
}
function renderMean(){
  const svg=$('svgMean');svg.innerHTML='';
  const weighted=$('wToggle').checked;
  $('weightRow').classList.toggle('hide',!weighted);
  const n=DATA.length,x0=60,x1=860,y0=250,bw=(x1-x0)/n;
  const min=150,max=Math.max(240,...DATA);
  const py=v=>y0-(v-min)/(max-min)*200;
  el('line',{x1:x0,y1:y0,x2:x1,y2:y0,stroke:'#cbd5e1','stroke-width':2},svg);
  DATA.forEach((v,i)=>{
    const cx=x0+i*bw+bw/2;
    el('rect',{x:cx-18,y:py(v),width:36,height:y0-py(v),rx:5,fill:'#93c5fd',stroke:'#2563eb','stroke-width':1.5},svg);
    T(svg,cx,py(v)-8,String(v),'#1d4ed8',13);
    T(svg,cx,y0+18,'#'+(i+1),'#94a3b8',11);
    if(weighted)T(svg,cx,y0+34,'权'+W[i],'#b45309',11);
  });
  let mv,label;
  if(weighted){const sw=W.reduce((a,b)=>a+b,0);mv=DATA.reduce((s,v,i)=>s+v*W[i],0)/sw;label='加权平均数';}
  else{mv=mean(DATA);label='平均数';}
  el('line',{x1:x0,y1:py(mv),x2:x1,y2:py(mv),stroke:'#16a34a','stroke-width':2.5,'stroke-dasharray':'8 5'},svg);
  T(svg,x1-40,py(mv)-10,label+' '+r1(mv),'#16a34a',15);
  if(weighted){
    const sw=W.reduce((a,b)=>a+b,0);
    $('meanFormula').innerHTML='加权平均数 = Σ(成绩×权) ÷ Σ权 = '+DATA.reduce((s,v,i)=>s+v*W[i],0)+' ÷ '+sw+' = <b>'+r1(mv)+'</b>';
  }else{
    $('meanFormula').innerHTML='平均数 = ('+DATA.join('+')+') ÷ '+n+' = '+DATA.reduce((a,b)=>a+b,0)+' ÷ '+n+' = <b>'+r1(mv)+'</b>';
  }
}
$('wToggle').onchange=renderMean;

/* ---- 中位数（冒泡排序动画）---- */
let medArr=DATA.slice(),medFrames=[],medIdx=0,medTimer=null,medDone=false;
function buildFrames(){
  const a=DATA.slice(),frames=[{a:a.slice(),cmp:-1,swap:false}];
  for(let i=0;i<a.length-1;i++)for(let j=0;j<a.length-1-i;j++){
    frames.push({a:a.slice(),cmp:j,swap:false});
    if(a[j]>a[j+1]){[a[j],a[j+1]]=[a[j+1],a[j]];frames.push({a:a.slice(),cmp:j,swap:true});}
  }
  frames.push({a:a.slice(),cmp:-1,swap:false,done:true});
  return frames;
}
function renderMed(){
  const svg=$('svgMed');svg.innerHTML='';
  const f=medFrames[medIdx]||{a:medArr,cmp:-1};
  const a=f.a,n=a.length,x0=60,x1=860,bw=(x1-x0)/n;
  a.forEach((v,i)=>{
    const cx=x0+i*bw+bw/2;
    let fill='#dbeafe',stroke='#93c5fd',tc='#1d4ed8';
    if(f.done){const m=n>>1;if(n%2){if(i===m){fill='#fef3c7';stroke='#f59e0b';tc='#b45309';}}else if(i===m-1||i===m){fill='#fef3c7';stroke='#f59e0b';tc='#b45309';}}
    else if(f.cmp===i||f.cmp+1===i){fill=f.swap?'#fee2e2':'#fef9c3';stroke=f.swap?'#ef4444':'#f59e0b';tc=f.swap?'#b91c1c':'#b45309';}
    el('rect',{x:cx-26,y:70,width:52,height:52,rx:10,fill,stroke,'stroke-width':2.5},svg);
    T(svg,cx,102,String(v),tc,18);
    T(svg,cx,145,'第'+(i+1)+'个','#94a3b8',11);
  });
  if(f.done){
    const s=[...a].sort((x,y)=>x-y),m=n>>1;
    const mv=n%2?s[m]:(s[m-1]+s[m])/2;
    $('medCap').innerHTML='排序完成！'+(n%2?'正中间第 '+(m+1)+' 个':'中间第 '+m+'、'+(m+1)+' 个的平均')+' = <span class="em">'+r1(mv)+'</span>';
    $('medFormula').innerHTML='中位数 = <b>'+r1(mv)+'</b>　（排序后取中间位置，不受极端值影响）';
  }else if(f.cmp>=0){
    $('medCap').innerHTML=f.swap?'逆序！交换这两个数':'比较相邻两个数，大的往后挪';
    $('medFormula').innerHTML='';
  }
}
function stopMed(){if(medTimer){clearInterval(medTimer);medTimer=null;}$('medSort').textContent='▶ 开始排序';}
$('medSort').onclick=()=>{
  if(medTimer){stopMed();return;}
  if(medDone||medIdx>=medFrames.length-1){medFrames=buildFrames();medIdx=0;medDone=false;}
  $('medSort').textContent='⏸ 暂停';
  medTimer=setInterval(()=>{
    if(medIdx<medFrames.length-1){medIdx++;renderMed();}
    if(medIdx>=medFrames.length-1){medDone=true;stopMed();}
  },160);
};
$('medReset').onclick=()=>{stopMed();medFrames=buildFrames();medIdx=0;medDone=false;renderMed();$('medCap').innerHTML='中位数必须先<b>排序</b>！点「开始排序」看冒泡排序';$('medFormula').innerHTML='';};

/* ---- 众数 ---- */
function renderMode(){
  const svg=$('svgMode');svg.innerHTML='';
  const c={};DATA.forEach(v=>c[v]=(c[v]||0)+1);
  const keys=Object.keys(c).map(Number).sort((a,b)=>a-b);
  const mx=Math.max(...Object.values(c));
  const modes=mode(DATA);
  const x0=70,x1=850,y0=250,bw=(x1-x0)/keys.length;
  el('line',{x1:x0,y1:y0,x2:x1,y2:y0,stroke:'#cbd5e1','stroke-width':2},svg);
  keys.forEach((k,i)=>{
    const cx=x0+i*bw+bw/2,h=c[k]/mx*180;
    const isM=modes.includes(k);
    el('rect',{x:cx-24,y:y0-h,width:48,height:h,rx:5,fill:isM?'#f59e0b':'#bfdbfe',stroke:isM?'#d97706':'#93c5fd','stroke-width':2},svg);
    T(svg,cx,y0-h-10,c[k]+'次',isM?'#b45309':'#64748b',14);
    T(svg,cx,y0+20,String(k),'#334155',14);
    if(isM)T(svg,cx,y0-h-30,'众数','#b45309',13);
  });
  $('modeFormula').innerHTML=modes.length?('众数 = <b>'+modes.join(' 和 ')+'</b>（出现 '+mx+' 次，最多）'):'每个数都只出现 1 次 → <b>没有众数</b>';
}

/* ---- 该用谁 ---- */
function renderWhich(){
  const v=+$('extSlider').value;$('extVal').textContent=v;
  const a=DATA.slice();a[9]=v;
  const mv=r1(mean(a)),md=r1(median(a)),mo=mode(a);
  $('wMean').textContent=mv;$('wMed').textContent=md;$('wMode').textContent=mo.length?mo.join(','):'无';
  $('wCap').innerHTML=v<=230?'现在没有极端值，三者都正常。':(v>=400?'极端值 '+v+' 把<b style="color:#2563eb">平均数</b>拉到 '+mv+'，而<b style="color:#16a34a">中位数</b>仍是 '+md+'、<b style="color:#b45309">众数</b>仍是 '+(mo.join(',')||'无')+' —— 中位数和众数更"抗干扰"。':'平均数开始被带动（'+mv+'），中位数 '+md+' 几乎不动。');
}
$('extSlider').oninput=renderWhich;

/* ---- 拓展调查 ---- */
function survey(){
  const a=[];for(let i=0;i<20;i++)a.push(150+Math.floor(Math.random()*29));
  const mv=r1(mean(a)),md=r1(median(a)),mo=mode(a),rg=Math.max(...a)-Math.min(...a);
  $('surveyStat').innerHTML=
    '<div class="s blue"><div class="t">平均身高</div><div class="v">'+mv+'</div></div>'+
    '<div class="s green"><div class="t">中位数</div><div class="v">'+md+'</div></div>'+
    '<div class="s orange"><div class="t">众数</div><div class="v">'+(mo.length?mo.join(','):'无')+'</div></div>'+
    '<div class="s blue"><div class="t">极差</div><div class="v">'+rg+'</div></div>';
  const ratio=rg/mv;
  $('surveyNote').textContent='样本极差÷平均数 = '+r1(ratio)+'，'+(ratio>0.25?'个体差异较大':ratio>0.12?'个体差异中等':'个体差异较小')+'。可用样本平均身高估计全班平均水平；评分比赛常"去掉一个最高分、一个最低分再取平均"，就是为了减少极端值影响。';
}
$('resample').onclick=survey;
$('extHead').onclick=()=>{const b=$('extBody');const hid=b.classList.toggle('hide');$('extArrow').textContent=hid?'展开 ▼':'收起 ▲';if(!hid&&!$('surveyStat').innerHTML)survey();};

/* ---- 页签 ---- */
function setTab(t){
  stopMed();
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  ['mean','median','mode','which'].forEach(k=>$('sec'+k.charAt(0).toUpperCase()+k.slice(1)).classList.toggle('hide',k!==t));
  if(t==='median'){medFrames=buildFrames();medIdx=0;medDone=false;renderMed();}
  if(t==='mode')renderMode();
  if(t==='which')renderWhich();
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setTab(b.dataset.t));

buildMeanInputs();renderMean();renderMode();renderWhich();
medFrames=buildFrames();renderMed();
</script>
</body>
</html>
