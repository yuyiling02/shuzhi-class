  <title>高一 · 单位圆如何“转”出六组诱导公式</title>
  <style>
:root {
  --bg: #070b14;
  --bg-radial: radial-gradient(1200px 600px at 20% 0%, rgba(56, 189, 248, 0.12), transparent 60%),
               radial-gradient(900px 500px at 85% 100%, rgba(167, 139, 250, 0.10), transparent 60%);
  --surface: rgba(15, 23, 42, 0.78);
  --surface-solid: #0f172a;
  --surface-2: rgba(30, 41, 59, 0.65);
  --border: rgba(148, 163, 184, 0.16);
  --border-strong: rgba(56, 189, 248, 0.42);
  --ink: #f1f5f9;
  --ink-2: #94a3b8;
  --ink-3: #64748b;
  --cyan: #38bdf8;
  --cyan-glow: rgba(56, 189, 248, 0.35);
  --purple: #a78bfa;
  --amber: #fbbf24;
  --green: #34d399;
  --red: #fb7185;
  --grid-line: rgba(148, 163, 184, 0.16);
  --grid-axis: rgba(226, 232, 240, 0.68);
  --canvas-bg: #050912;
  --shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
}

[data-theme="light"] {
  --bg: #f1f5f9;
  --bg-radial: radial-gradient(1100px 520px at 15% 0%, rgba(37, 99, 235, 0.08), transparent 60%),
               radial-gradient(900px 500px at 90% 100%, rgba(124, 58, 237, 0.06), transparent 60%);
  --surface: rgba(255, 255, 255, 0.9);
  --surface-solid: #ffffff;
  --surface-2: rgba(241, 245, 249, 0.9);
  --border: rgba(15, 23, 42, 0.1);
  --border-strong: rgba(37, 99, 235, 0.4);
  --ink: #0f172a;
  --ink-2: #475569;
  --ink-3: #94a3b8;
  --cyan: #0284c7;
  --cyan-glow: rgba(2, 132, 199, 0.22);
  --purple: #7c3aed;
  --amber: #d97706;
  --green: #059669;
  --red: #e11d48;
  --grid-line: rgba(15, 23, 42, 0.06);
  --grid-axis: rgba(15, 23, 42, 0.28);
  --canvas-bg: #ffffff;
  --shadow: 0 14px 36px rgba(15, 23, 42, 0.08);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
  background-color: var(--bg);
  background-image: var(--bg-radial);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

.app {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
}

/* Header */
.topbar {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 18px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  backdrop-filter: blur(14px);
  z-index: 20;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.back-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--ink-2);
  text-decoration: none;
  font-size: 15px;
  transition: 0.16s;
}
.back-link:hover {
  border-color: var(--border-strong);
  color: var(--cyan);
}

.grade-pill {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  padding: 3px 9px;
  border-radius: 999px;
  background: rgba(56, 189, 248, 0.14);
  border: 1px solid rgba(56, 189, 248, 0.3);
  color: var(--cyan);
  white-space: nowrap;
}

.title-group h1 {
  font-size: 16px;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.seg-tabs {
  display: inline-flex;
  padding: 3px;
  border-radius: 11px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  gap: 2px;
}

.seg-btn {
  border: none;
  background: transparent;
  color: var(--ink-2);
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 600;
  padding: 5px 12px;
  border-radius: 8px;
  cursor: pointer;
  transition: 0.16s;
  white-space: nowrap;
}
.seg-btn:hover { color: var(--ink); }
.seg-btn.active {
  background: var(--cyan);
  color: #061220;
  font-weight: 700;
  box-shadow: 0 2px 10px var(--cyan-glow);
}
[data-theme="light"] .seg-btn.active { color: #fff; }
.seg-btn:disabled { cursor: not-allowed; }

.icon-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 32px;
  padding: 0 11px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--ink-2);
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.16s;
  white-space: nowrap;
}
.icon-btn:hover {
  border-color: var(--border-strong);
  color: var(--ink);
}
.icon-btn.on {
  border-color: var(--cyan);
  background: rgba(56, 189, 248, 0.15);
  color: var(--cyan);
}

/* Main workspace */
.workspace {
  flex: 1;
  min-height: 0;
  display: flex;
  position: relative;
  padding: 12px;
  gap: 12px;
}

.stage-shell {
  flex: 1;
  min-width: 0;
  min-height: 0;
  position: relative;
  border-radius: 18px;
  border: 1px solid var(--border);
  background: var(--canvas-bg);
  box-shadow: var(--shadow);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

canvas.lab-canvas {
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: crosshair;
}

/* Floating HUD inside stage */
.hud-top-left {
  position: absolute;
  top: 14px;
  left: 14px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
  pointer-events: none;
  z-index: 5;
  max-width: min(600px, calc(100% - 28px));
}
.hud-top-left > * { pointer-events: auto; }

.formula-pill {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 8px 16px;
  border-radius: 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  backdrop-filter: blur(12px);
  font-family: "Cambria Math", "Times New Roman", "PingFang SC", serif;
  font-size: clamp(15px, 1.8vw, 23px);
  font-weight: 700;
  letter-spacing: 0.02em;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
  white-space: nowrap;
}

.formula-pill .hl-a { color: var(--cyan); }
.formula-pill .hl-w { color: var(--purple); }
.formula-pill .hl-p { color: var(--amber); }
.formula-pill .pm { color: var(--ink-3); }
.formula-pill .pm.eq { margin: 0 9px; }

.fn-tabs { backdrop-filter: blur(12px); }

.hud-bottom-left {
  position: absolute;
  bottom: 14px;
  left: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  z-index: 5;
  flex-wrap: wrap;
}

.hud-bottom-right {
  position: absolute;
  bottom: 14px;
  right: 14px;
  z-index: 5;
  font-size: 12px;
  color: var(--ink-3);
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 5px 10px;
  border-radius: 999px;
  backdrop-filter: blur(8px);
}

/* Alert banner */
.alert-banner {
  position: absolute;
  top: 14px;
  right: 14px;
  z-index: 10;
  max-width: 330px;
  padding: 10px 14px;
  border-radius: 12px;
  background: rgba(225, 29, 72, 0.16);
  border: 1px solid rgba(251, 113, 133, 0.55);
  color: #fecdd3;
  font-size: 12.5px;
  font-weight: 600;
  line-height: 1.6;
  backdrop-filter: blur(10px);
  box-shadow: 0 10px 30px rgba(225, 29, 72, 0.22);
  display: none;
  animation: shakeIn 0.32s ease;
}
[data-theme="light"] .alert-banner {
  background: rgba(255, 241, 242, 0.95);
  color: #be123c;
}
.alert-banner.show { display: block; }
.alert-banner.info {
  background: rgba(56, 189, 248, 0.13);
  border-color: rgba(56, 189, 248, 0.45);
  color: #bae6fd;
  box-shadow: 0 10px 30px rgba(56, 189, 248, 0.18);
}
[data-theme="light"] .alert-banner.info {
  background: rgba(240, 249, 255, 0.96);
  color: #0c4a6e;
}

@keyframes shakeIn {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-6px); }
  40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(4px); }
}

/* Side drawer */
.side-drawer {
  width: 360px;
  flex: none;
  display: flex;
  flex-direction: column;
  gap: 10px;
  overflow-y: auto;
  padding-right: 2px;
  transition: width 0.22s ease, opacity 0.2s ease;
}
.side-drawer::-webkit-scrollbar { width: 6px; }
.side-drawer::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }

.app.presentation .side-drawer { display: none; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 14px 15px;
  backdrop-filter: blur(12px);
  flex: none;
}

.card-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: 13px;
  font-weight: 700;
  color: var(--ink-2);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 10px;
}

.badge {
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--cyan);
  border: 1px solid var(--border);
  text-transform: none;
  letter-spacing: 0;
}

/* Sliders */
.slider-row {
  display: flex;
  flex-direction: column;
  gap: 5px;
  margin-bottom: 11px;
}
.slider-row:last-child { margin-bottom: 0; }
.slider-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: 13px;
}
.slider-head .name { color: var(--ink-2); font-weight: 600; }
.slider-head .val {
  font-variant-numeric: tabular-nums;
  font-weight: 800;
  font-size: 15px;
  color: var(--cyan);
}

input[type="range"].lab-range {
  width: 100%;
  appearance: none;
  height: 6px;
  border-radius: 999px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  outline: none;
  cursor: pointer;
}
input[type="range"].lab-range::-webkit-slider-thumb {
  appearance: none;
  width: 17px;
  height: 17px;
  border-radius: 50%;
  background: var(--cyan);
  border: 2px solid #fff;
  box-shadow: 0 0 12px var(--cyan-glow);
  cursor: grab;
  transition: transform 0.12s;
}
input[type="range"].lab-range::-webkit-slider-thumb:hover { transform: scale(1.15); }

/* Buttons */
.btn-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.btn {
  flex: 1 1 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--ink);
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  padding: 8px 12px;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.15s;
  white-space: nowrap;
}
.btn:hover {
  border-color: var(--border-strong);
  transform: translateY(-1px);
}
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
.btn.primary {
  background: var(--cyan);
  border-color: var(--cyan);
  color: #061220;
  font-weight: 700;
  box-shadow: 0 4px 16px var(--cyan-glow);
}
[data-theme="light"] .btn.primary { color: #fff; }
.btn.amber {
  background: rgba(251, 191, 36, 0.16);
  border-color: rgba(251, 191, 36, 0.45);
  color: var(--amber);
}
.btn.active {
  border-color: var(--cyan);
  background: rgba(56, 189, 248, 0.18);
  color: var(--cyan);
}
.btn.sm {
  flex: 1 1 45%;
  font-size: 12px;
  padding: 7px 8px;
  font-weight: 600;
}

/* Predict-Observe-Explain */
.predict-q {
  font-size: 14px;
  font-weight: 700;
  line-height: 1.55;
  margin-bottom: 10px;
}
.predict-opts {
  display: flex;
  flex-direction: column;
  gap: 7px;
  margin-bottom: 11px;
}
.predict-opt {
  text-align: left;
  padding: 9px 12px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--ink);
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
  transition: 0.15s;
}
.predict-opt:hover { border-color: var(--border-strong); }
.predict-opt.picked {
  border-color: var(--cyan);
  background: rgba(56, 189, 248, 0.16);
  font-weight: 700;
}
.predict-opt.correct {
  border-color: var(--green);
  background: rgba(52, 211, 153, 0.18);
  color: var(--green);
}
.predict-opt.wrong {
  border-color: var(--red);
  background: rgba(251, 113, 133, 0.15);
  color: var(--red);
}
.predict-feedback {
  font-size: 13px;
  line-height: 1.65;
  color: var(--ink-2);
  padding: 10px 12px;
  border-radius: 10px;
  background: var(--surface-2);
  border-left: 3px solid var(--cyan);
  margin-top: 10px;
  display: none;
}
.predict-feedback.show { display: block; }

.stat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.stat-box {
  padding: 9px 11px;
  border-radius: 11px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  min-width: 0;
}
.stat-box .k { font-size: 11.5px; color: var(--ink-3); }
.stat-box .v {
  font-size: 17px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  margin-top: 2px;
  white-space: nowrap;
}
.stat-box .v.sm { font-size: 13px; }

/* 公式选择按钮 */
.fbtn-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
}
.fbtn {
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--ink);
  border-radius: 10px;
  padding: 7px 10px;
  cursor: pointer;
  font-family: inherit;
  text-align: left;
  transition: 0.15s;
}
.fbtn b { display: block; font-size: 12.5px; font-weight: 700; }
.fbtn em {
  font-style: normal;
  font-size: 11.5px;
  color: var(--ink-3);
  font-family: "Cambria Math", "Times New Roman", serif;
}
.fbtn:hover { border-color: var(--border-strong); }
.fbtn.on {
  background: rgba(56, 189, 248, 0.16);
  border-color: var(--cyan);
  box-shadow: 0 0 0 1px var(--cyan-glow);
}
.fbtn.on em { color: var(--cyan); }

/* 数值验证表 */
.vt {
  width: 100%;
  border-collapse: collapse;
  font-variant-numeric: tabular-nums;
}
.vt th {
  font-size: 10.5px;
  color: var(--ink-3);
  font-weight: 700;
  text-align: left;
  padding: 0 4px 5px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.vt td {
  font-size: 12.5px;
  padding: 6px 4px;
  border-bottom: 1px solid var(--border);
  color: var(--ink-2);
  white-space: nowrap;
}
.vt tr:last-child td { border-bottom: none; }
.vt td b { color: var(--ink); font-weight: 700; }
.vt td .sub { display: block; font-size: 10.5px; color: var(--ink-3); font-weight: 500; }
.vt td.ok { color: var(--green); font-weight: 700; font-size: 11.5px; }
.vt tr.hi td { background: rgba(56, 189, 248, 0.07); }
.vt tr.hi td b { color: var(--cyan); }

.legend {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  font-size: 11.5px;
  color: var(--ink-3);
  margin-top: 11px;
  line-height: 1.7;
}
.legend i {
  display: inline-block;
  width: 14px;
  height: 3px;
  border-radius: 2px;
  margin-right: 5px;
  vertical-align: middle;
}

.toast {
  position: absolute;
  top: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(-16px);
  z-index: 30;
  padding: 10px 20px;
  border-radius: 999px;
  background: linear-gradient(135deg, #10b981, #06b6d4);
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  box-shadow: 0 12px 32px rgba(16, 185, 129, 0.35);
  opacity: 0;
  pointer-events: none;
  transition: 0.28s cubic-bezier(0.22, 1, 0.36, 1);
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

@media (max-width: 1000px) {
  .workspace { flex-direction: column; }
  .side-drawer { width: 100%; max-height: 46%; }
  .hud-bottom-right { display: none; }
}

      background: var(--surface-2);
      border-left: 3px solid var(--cyan);
      font-size: 13.5px;
      line-height: 1.65;
      color: var(--ink-2);
      margin-bottom: 14px;
    }
    .quiz-explain.show { display: block; }
    .quiz-foot {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    /* ===== 答对反馈：飘起来的"✓ 答对了"印章 ===== */
    .quiz-stamp {
      position: absolute;
      left: 50%;
      top: 0;
      z-index: 4;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 12px 22px;
      border-radius: 18px;
      background: linear-gradient(135deg, #34d399, #10b981);
      color: #fff;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 0.02em;
      white-space: nowrap;
      box-shadow: 0 18px 46px rgba(16, 185, 129, 0.42), 0 0 0 6px rgba(52, 211, 153, 0.16);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -55%) scale(0.6);
    }
    .quiz-stamp .s-ico {
      font-size: 24px;
      line-height: 1;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.18));
    }
    .quiz-stamp .s-sub {
      display: block;
      font-size: 13px;
      font-weight: 700;
      opacity: 0.9;
      letter-spacing: 0;
      margin-top: 1px;
    }
    .quiz-stamp.gold {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      box-shadow: 0 18px 46px rgba(245, 158, 11, 0.45), 0 0 0 6px rgba(251, 191, 36, 0.18);
    }
    .quiz-stamp.show { animation: stampPop 1.35s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    @keyframes stampPop {
      0%   { opacity: 0; transform: translate(-50%, -42%) scale(0.5) rotate(-7deg); }
      16%  { opacity: 1; transform: translate(-50%, -58%) scale(1.12) rotate(2deg); }
      26%  { transform: translate(-50%, -55%) scale(0.98) rotate(0deg); }
      34%  { transform: translate(-50%, -55%) scale(1); }
      74%  { opacity: 1; transform: translate(-50%, -62%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -95%) scale(1.04); }
    }

    .quiz-opt.correct {
      position: relative;
      animation: optWin 0.52s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes optWin {
      0%   { transform: scale(1); box-shadow: 0 0 0 rgba(52, 211, 153, 0); }
      32%  { transform: scale(1.045); box-shadow: 0 0 26px rgba(52, 211, 153, 0.55); }
      62%  { transform: scale(0.994); }
      100% { transform: scale(1); box-shadow: 0 0 18px rgba(52, 211, 153, 0.25); }
    }
    .opt-tick {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      margin-left: 7px;
      border-radius: 50%;
      background: var(--green);
      color: #04120c;
      font-size: 12px;
      font-weight: 900;
      line-height: 1;
      vertical-align: -2px;
      animation: tickIn 0.42s 0.1s backwards cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes tickIn {
      0% { opacity: 0; transform: scale(0.2) rotate(-40deg); }
      70% { opacity: 1; transform: scale(1.18) rotate(4deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }
    .quiz-opt.correct::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 12px;
      border: 2px solid rgba(52, 211, 153, 0.85);
      pointer-events: none;
      animation: ringPulse 0.95s ease-out forwards;
    }
    @keyframes ringPulse {
      0% { opacity: 0.9; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.16); }
    }

    .badge.bump { animation: scoreBump 0.62s cubic-bezier(0.22, 1, 0.36, 1); }
    @keyframes scoreBump {
      0% { transform: scale(1); }
      30% { transform: scale(1.22); }
      60% { transform: scale(0.97); }
      100% { transform: scale(1); }
    }
    .badge.gain {
      color: #34d399;
      border-color: rgba(52, 211, 153, 0.55);
      background: rgba(52, 211, 153, 0.16);
    }

    .quiz-modal.okFlash { animation: popIn 0.22s cubic-bezier(0.22, 1, 0.36, 1), modalOk 0.9s ease-out; }
    @keyframes modalOk {
      0%   { box-shadow: 0 28px 70px rgba(0, 0, 0, 0.55), 0 0 0 0 rgba(52, 211, 153, 0.5); }
      40%  { box-shadow: 0 28px 70px rgba(0, 0, 0, 0.55), 0 0 0 10px rgba(52, 211, 153, 0.12); }
      100% { box-shadow: 0 28px 70px rgba(0, 0, 0, 0.55), 0 0 0 0 rgba(52, 211, 153, 0); }
    }

    .fx-canvas {
      position: fixed;
      inset: 0;
      z-index: 70;
      display: none;
      pointer-events: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .quiz-stamp.show { animation: stampFade 1s ease forwards; }
      @keyframes stampFade {
        0% { opacity: 0; } 15% { opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; }
      }
      .quiz-opt.correct, .quiz-opt.correct::before, .opt-tick,
      .badge.bump, .quiz-modal.okFlash { animation: none; }
    }
  </style>
  <style>
    /* ===== 对称变换连续演示（在画布内进行，不另开窗口） ===== */
    .morph-hud {

  </style>
</head>

<script>
(() => {
  'use strict';

  function getCssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  class LabCanvas {
    constructor(canvas, onDraw) {
      this.canvas = canvas;
      this.ctx = canvas.getContext('2d');
      this.onDraw = onDraw;
      this.width = 800;
      this.height = 500;
      this.dpr = window.devicePixelRatio || 1;
      this.particles = [];
      this.ripples = [];
      this._raf = null;
      this._last = performance.now();

      this._resize = () => {
        const rect = this.canvas.parentElement.getBoundingClientRect();
        this.dpr = Math.min(window.devicePixelRatio || 1, 2);
        this.width = Math.max(300, Math.floor(rect.width));
        this.height = Math.max(240, Math.floor(rect.height));
        this.canvas.width = Math.floor(this.width * this.dpr);
        this.canvas.height = Math.floor(this.height * this.dpr);
      };

      const ro = new ResizeObserver(this._resize);
      ro.observe(this.canvas.parentElement);
      this._resize();
    }

    start(tickFn) {
      const ctx0 = this.ctx;
      ctx0.save();
      ctx0.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      ctx0.clearRect(0, 0, this.width, this.height);
      this.onDraw(ctx0, this.width, this.height, 0, performance.now());
      ctx0.restore();

      const loop = (now) => {
        const dt = Math.min(0.05, (now - this._last) / 1000);
        this._last = now;
        if (tickFn) tickFn(dt, now);
        this._updateEffects(dt);

        const ctx = this.ctx;
        ctx.save();
        ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
        ctx.clearRect(0, 0, this.width, this.height);
        this.onDraw(ctx, this.width, this.height, dt, now);
        this._drawEffects(ctx);
        ctx.restore();

        this._raf = requestAnimationFrame(loop);
      };
      this._raf = requestAnimationFrame(loop);
    }

    burst(x, y, color = '#38bdf8', count = 26) {
      const palette = [color, '#34d399', '#fbbf24', '#a78bfa', '#ffffff'];
      for (let i = 0; i < count; i++) {
        const ang = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
        const spd = 80 + Math.random() * 210;
        this.particles.push({
          x, y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd - 40,
          life: 1,
          decay: 0.9 + Math.random() * 0.7,
          size: 2.5 + Math.random() * 3.5,
          color: palette[i % palette.length],
        });
      }
      this.ripple(x, y, color);
    }

    ripple(x, y, color = '#38bdf8') {
      this.ripples.push({ x, y, r: 6, maxR: 58, life: 1, color });
    }

    _updateEffects(dt) {
      for (let i = this.particles.length - 1; i >= 0; i--) {
        const p = this.particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 260 * dt;
        p.life -= p.decay * dt;
        if (p.life <= 0) this.particles.splice(i, 1);
      }
      for (let i = this.ripples.length - 1; i >= 0; i--) {
        const r = this.ripples[i];
        r.r += (r.maxR - r.r) * Math.min(1, dt * 6);
        r.life -= dt * 1.6;
        if (r.life <= 0) this.ripples.splice(i, 1);
      }
    }

    _drawEffects(ctx) {
      for (const r of this.ripples) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, r.life * 0.75);
        ctx.strokeStyle = r.color;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
      for (const p of this.particles) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }
  }

  function glowLine(ctx, x1, y1, x2, y2, color, width = 3, glow = 14) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.shadowColor = color;
    ctx.shadowBlur = glow;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.restore();
  }

  function glowDot(ctx, x, y, radius, color, ringColor = '#ffffff') {
    ctx.save();
    ctx.shadowColor = color;
    ctx.shadowBlur = 18;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.lineWidth = 2.2;
    ctx.strokeStyle = ringColor;
    ctx.stroke();
    ctx.restore();
  }

  function drawLabel(ctx, text, x, y, color = '#f1f5f9', size = 13, align = 'center') {
    ctx.save();
    ctx.font = `700 ${size}px "PingFang SC", "Microsoft YaHei", sans-serif`;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 4;
    ctx.strokeStyle = getCssVar('--canvas-bg') || '#050912';
    ctx.lineJoin = 'round';
    ctx.strokeText(text, x, y);
    ctx.fillStyle = color;
    ctx.fillText(text, x, y);
    ctx.restore();
  }

  function initShell({ onCommand } = {}) {
    const app = document.querySelector('.app');
    const themeBtn = document.getElementById('btnTheme');
    const presBtn = document.getElementById('btnPresentation');

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      if (themeBtn) themeBtn.textContent = theme === 'light' ? '🌙 深色实验室' : '☀ 投影浅色';
      localStorage.setItem('math_lab_theme', theme);
    }

    const saved = localStorage.getItem('math_lab_theme') || 'dark';
    setTheme(saved);

    if (themeBtn) {
      themeBtn.addEventListener('click', () => {
        const cur = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        setTheme(cur);
      });
    }

    function togglePresentation(force) {
      const next = typeof force === 'boolean' ? force : !app.classList.contains('presentation');
      app.classList.toggle('presentation', next);
      if (presBtn) presBtn.classList.toggle('on', next);
    }

    if (presBtn) {
      presBtn.addEventListener('click', () => togglePresentation());
    }

    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === 'f' || e.key === 'F') togglePresentation();
      if (e.key === 't' || e.key === 'T') {
        const cur = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        setTheme(cur);
      }
    });

    window.addEventListener('message', (event) => {
      const data = event.data;
      if (!data || data.type !== 'math-lab:command') return;
      if (data.action === 'theme' && data.payload) setTheme(data.payload);
      if (data.action === 'presentation') togglePresentation(Boolean(data.payload));
      if (onCommand) onCommand(data.action, data.payload);
    });

    return { setTheme, togglePresentation };
  }

  function showToast(msg) {
    const el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._timer);
    el._timer = setTimeout(() => el.classList.remove('show'), 2400);
  }

  let alertHoldUntil = 0;
  let alertTimer = null;
  function alertNow() {
    return (window.performance && performance.now) ? performance.now() : Date.now();
  }
  function hideAlertSoon(delay) {
    if (alertTimer) clearTimeout(alertTimer);
    alertTimer = setTimeout(() => {
      alertTimer = null;
      const el = document.getElementById('alertBanner');
      if (!el) return;
      const now = alertNow();
      if (now >= alertHoldUntil) { alertHoldUntil = 0; el.classList.remove('show'); }
      else hideAlertSoon(alertHoldUntil - now);
    }, Math.max(0, delay));
  }
  function setAlert(msg, holdMs) {
    const el = document.getElementById('alertBanner');
    if (!el) return;
    const now = alertNow();
    if (!msg) {
      if (now < alertHoldUntil) { hideAlertSoon(alertHoldUntil - now); return; }
      el.classList.remove('show');
      return;
    }
    alertHoldUntil = now + (holdMs || 0);
    el.classList.toggle('info', msg.indexOf('💡') === 0);
    if (el.textContent !== msg) {
      el.textContent = msg;
      el.classList.remove('show');
      void el.offsetWidth;
      el.classList.add('show');
    } else if (!el.classList.contains('show')) {
      el.classList.add('show');
    }
    if (holdMs && !alertTimer) hideAlertSoon(holdMs);
  }

  // 纯 Web Audio 合成音效，零外部文件
  const sound = (() => {
    let ctx = null;
    let bgmTimer = null;
    let bgmStep = 0;
    let muted = false;

    function ensureCtx() {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC();
      }
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    }

    function tone(freq, duration, type = 'sine', vol = 0.14, delay = 0) {
      if (muted) return;
      const ac = ensureCtx();
      if (!ac) return;
      const t0 = ac.currentTime + delay;
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
      osc.connect(gain);
      gain.connect(ac.destination);
      osc.start(t0);
      osc.stop(t0 + duration + 0.02);
    }

    function playClick() { tone(660, 0.06, 'triangle', 0.08, 0); }

    function playCorrect() {
      tone(523.25, 0.14, 'triangle', 0.16, 0);
      tone(659.25, 0.14, 'triangle', 0.16, 0.08);
      tone(783.99, 0.16, 'triangle', 0.16, 0.16);
      tone(1046.5, 0.32, 'sine', 0.18, 0.24);
    }

    function playWrong() {
      tone(220, 0.16, 'sawtooth', 0.09, 0);
      tone(164.81, 0.28, 'sawtooth', 0.10, 0.13);
    }

    function playVictory() {
      const notes = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5];
      const times = [0, 0.1, 0.2, 0.3, 0.44, 0.56];
      notes.forEach((f, i) => tone(f, i === notes.length - 1 ? 0.45 : 0.14, 'triangle', 0.16, times[i]));
    }

    const MELODY = [
      523.25, 659.25, 783.99, 659.25, 880.00, 783.99, 659.25, 587.33,
      523.25, 659.25, 783.99, 1046.5, 880.00, 783.99, 659.25, 587.33,
    ];
    const BASS = [
      130.81, 0, 196.00, 0, 174.61, 0, 196.00, 0,
      130.81, 0, 196.00, 0, 146.83, 0, 196.00, 0,
    ];

    function startBgm() {
      if (bgmTimer || muted) return;
      ensureCtx();
      bgmTimer = setInterval(() => {
        if (muted) return;
        const m = MELODY[bgmStep % MELODY.length];
        const b = BASS[bgmStep % BASS.length];
        if (m) tone(m, 0.18, 'sine', 0.045, 0);
        if (b) tone(b, 0.22, 'triangle', 0.04, 0);
        bgmStep += 1;
      }, 240);
    }

    function stopBgm() {
      if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; }
    }

    function toggleBgm() {
      if (bgmTimer) { stopBgm(); return false; }
      muted = false;
      startBgm();
      return true;
    }

    function setMuted(val) {
      muted = Boolean(val);
      if (muted) stopBgm();
    }

    return {
      playClick, playCorrect, playWrong, playVictory,
      startBgm, stopBgm, toggleBgm, setMuted,
      isPlaying: () => Boolean(bgmTimer) && !muted,
    };
  })();

  window.MathLab = {
    LabCanvas, getCssVar, glowLine, glowDot, drawLabel,
    initShell, showToast, setAlert, sound,
  };
})();
</script>

<script>
(() => {
  'use strict';
  const { LabCanvas, getCssVar, glowLine, glowDot, drawLabel, initShell, showToast, setAlert, sound } = window.MathLab;

  const D2R = Math.PI / 180;
  const TAU = Math.PI * 2;

  /* =========================================================
     六组诱导公式：β 统一写成 k·(π/2) ± α
     ========================================================= */
  const F = [
    { title: '公式一', sub: 'α + 2kπ', k: 4, s: 1,  sym: 'same',   geo: '终边重合',
      tip: '💡 终边相同的角，同名三角函数值完全相同 —— 这就是三角函数的周期性（sin、cos 的周期 2π，tan 的周期 π）。' },
    { title: '公式二', sub: 'π + α',   k: 2, s: 1,  sym: 'origin', geo: '关于原点对称',
      tip: '⚠️ π + α 的终边是 α 的反向延长线：横、纵坐标同时变号，所以 sin、cos 变号，tan 负负得正、不变。' },
    { title: '公式三', sub: '−α',      k: 0, s: -1, sym: 'xaxis',  geo: '关于 x 轴对称',
      tip: '💡 关于 x 轴对称：横坐标不变、纵坐标相反 —— cos 是偶函数，sin、tan 是奇函数。' },
    { title: '公式四', sub: 'π − α',   k: 2, s: -1, sym: 'yaxis',  geo: '关于 y 轴对称',
      tip: '💡 关于 y 轴对称：纵坐标不变、横坐标相反 —— 这是把钝角化成锐角最常用的一组。' },
    { title: '公式五', sub: 'π/2 − α', k: 1, s: -1, sym: 'yx',     geo: '关于 y = x 对称',
      tip: '⚠️ 奇变！π/2 的 1 倍是奇数倍 —— 函数名要换（sin ↔ cos），符号看 π/2 − α 落在第几象限。' },
    { title: '公式六', sub: 'π/2 + α', k: 1, s: 1,  sym: 'rot90',  geo: '逆时针旋转 90°',
      tip: '⚠️ 奇变！同为 k = 1：sin(π/2 + α) = cos α，而 cos(π/2 + α) = −sin α，符号一律由象限决定。' },
  ];

  const K_TXT = { 0: '0', 1: 'π/2', 2: 'π', 3: '3π/2', 4: '2π' };
  const QNAME = ['', '第一象限', '第二象限', '第三象限', '第四象限'];

  function reduce(k, s, fn) {
    const odd = Math.abs(k) % 2 === 1;
    const kk = ((k % 4) + 4) % 4;
    const q = (s === 1) ? (kk + 1) : (((kk - 1 + 4) % 4) + 1);
    const newFn = odd ? (fn === 'sin' ? 'cos' : fn === 'cos' ? 'sin' : 'cot') : fn;
    const pos = fn === 'sin' ? (q === 1 || q === 2)
              : fn === 'cos' ? (q === 1 || q === 4)
              : (q === 1 || q === 3);
    return { sign: pos ? 1 : -1, fn: newFn, q, odd };
  }

  function betaDeg(f, a) {
    switch (f.sym) {
      case 'same':   return a + 360;
      case 'origin': return a + 180;
      case 'xaxis':  return -a;
      case 'yaxis':  return 180 - a;
      case 'yx':     return 90 - a;
      case 'rot90':  return 90 + a;
    }
    return a;
  }

  function degNorm(d) {
    const r = ((d % 360) + 360) % 360;
    return Math.round(r) % 360;
  }

  function quadOf(deg) {
    const d = degNorm(deg);
    if (d % 90 === 0) return '终边在轴上';
    return QNAME[Math.floor(d / 90) + 1];
  }

  function numStr(v, d) {
    if (!isFinite(v)) return '不存在';
    const s = (Math.abs(v) < 5e-4 ? 0 : v).toFixed(d === undefined ? 3 : d);
    return s.replace('-', '−');
  }

  function trigVals(deg) {
    const c = Math.cos(deg * D2R), s = Math.sin(deg * D2R);
    return {
      sin: Math.abs(s) < 1e-12 ? 0 : s,
      cos: Math.abs(c) < 1e-12 ? 0 : c,
      tan: Math.abs(c) < 1e-9 ? NaN : s / c,
      cot: Math.abs(s) < 1e-9 ? NaN : c / s,
    };
  }

  /* =========================================================
     状态
     ========================================================= */
  const state = {
    f: 0,
    a: 30,
    fn: 'sin',
    speed: 42,
    playing: true,
    show: { line: true, sym: true, grid: true, lab: true },
    mode: 'explore',
    pickedOpt: null,
    revealed: false,
  };

  /* =========================================================
     画布
     ========================================================= */
  const canvasEl = document.getElementById('canvas');
  let meta = null;

  const lab = new LabCanvas(canvasEl, (ctx, W, H) => {
    const isLight = document.documentElement.getAttribute('data-theme') === 'light';
    const cyan = getCssVar('--cyan');
    const purple = getCssVar('--purple');
    const amber = getCssVar('--amber');
    const green = getCssVar('--green');
    const rose = getCssVar('--red');
    const ink2 = getCssVar('--ink-2');
    const ink3 = getCssVar('--ink-3');
    const gridC = getCssVar('--grid-line');
    const axisC = getCssVar('--grid-axis');

    const f = F[state.f];
    const a = state.a;
    const b = betaDeg(f, a);
    const ca = Math.cos(a * D2R), sa = Math.sin(a * D2R);
    const cb = Math.cos(b * D2R), sb = Math.sin(b * D2R);

    const cx = Math.round(W * 0.5);
    const cy = Math.round(H * 0.52);
    const R = Math.max(70, Math.min(W * 0.33, H * 0.385));
    meta = { cx, cy, R };

    const X = (v) => cx + v * R;
    const Y = (v) => cy - v * R;

    function arcTo(r, d0, d1, color, lw, dash) {
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = lw || 1.8;
      if (dash) ctx.setLineDash(dash);
      ctx.beginPath();
      ctx.arc(cx, cy, r, -d0 * D2R, -d1 * D2R, d1 > d0);
      ctx.stroke();
      ctx.restore();
    }

    function ray(deg, color, lw, dash, rr, glow) {
      const px = cx + Math.cos(deg * D2R) * rr;
      const py = cy - Math.sin(deg * D2R) * rr;
      if (glow) {
        if (dash) {
          ctx.save();
          ctx.strokeStyle = color;
          ctx.lineWidth = lw;
          ctx.lineCap = 'round';
          ctx.setLineDash(dash);
          ctx.shadowColor = color;
          ctx.shadowBlur = glow;
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.lineTo(px, py);
          ctx.stroke();
          ctx.restore();
        } else {
          glowLine(ctx, cx, cy, px, py, color, lw, glow);
        }
        return;
      }
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = lw;
      ctx.lineCap = 'round';
      if (dash) ctx.setLineDash(dash);
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(px, py);
      ctx.stroke();
      ctx.restore();
    }

    // ---------- 网格 ----------
    if (state.show.grid) {
      ctx.save();
      ctx.strokeStyle = gridC;
      ctx.lineWidth = 1;
      const step = R / 4;
      for (let i = -14; i <= 14; i++) {
        const x = cx + i * step;
        if (x < 0 || x > W) continue;
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
      }
      for (let j = -14; j <= 14; j++) {
        const y = cy + j * step;
        if (y < 0 || y > H) continue;
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      }
      ctx.restore();
    }

    // ---------- 坐标轴 ----------
    ctx.save();
    ctx.strokeStyle = axisC;
    ctx.fillStyle = axisC;
    ctx.lineWidth = 2;
    const axr = R * 1.28;
    ctx.beginPath();
    ctx.moveTo(cx - axr, cy); ctx.lineTo(cx + axr, cy);
    ctx.moveTo(cx, cy + axr); ctx.lineTo(cx, cy - axr);
    ctx.stroke();
    [[cx + axr, cy, 0], [cx, cy - axr, -Math.PI / 2], [cx - axr, cy, Math.PI], [cx, cy + axr, Math.PI / 2]].forEach(([px, py, ang]) => {
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(px - 9 * Math.cos(ang - 0.42), py - 9 * Math.sin(ang - 0.42));
      ctx.lineTo(px - 9 * Math.cos(ang + 0.42), py - 9 * Math.sin(ang + 0.42));
      ctx.closePath();
      ctx.fill();
    });
    ctx.restore();

    drawLabel(ctx, 'x', cx + axr - 4, cy + 18, ink2, 12);
    drawLabel(ctx, 'y', cx + 16, cy - axr + 12, ink2, 12);

    // ---------- 单位圆 ----------
    ctx.save();
    ctx.strokeStyle = isLight ? 'rgba(15,23,42,0.55)' : 'rgba(203,213,225,0.62)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, TAU);
    ctx.stroke();
    ctx.restore();

    drawLabel(ctx, 'O', cx - 12, cy + 14, ink2, 12);

    // 单位刻度
    [[1, '1'], [-1, '−1']].forEach(([v, t]) => {
      drawLabel(ctx, t, X(v), cy + 16, ink3, 11);
    });
    [[1, '1'], [-1, '−1']].forEach(([v, t]) => {
      drawLabel(ctx, t, cx - 16, Y(v), ink3, 11, 'right');
    });

    // ---------- 对称辅助 ----------
    if (state.show.sym) {
      ctx.save();
      ctx.strokeStyle = rose;
      ctx.globalAlpha = 0.45;
      ctx.lineWidth = 1.8;
      ctx.setLineDash([8, 6]);
      ctx.shadowColor = rose;
      ctx.shadowBlur = 6;
      if (f.sym === 'xaxis') {
        ctx.beginPath(); ctx.moveTo(X(-1.24), Y(0)); ctx.lineTo(X(1.24), Y(0)); ctx.stroke();
      } else if (f.sym === 'yaxis') {
        ctx.beginPath(); ctx.moveTo(X(0), Y(-1.24)); ctx.lineTo(X(0), Y(1.24)); ctx.stroke();
      } else if (f.sym === 'yx') {
        ctx.beginPath(); ctx.moveTo(X(-1.2), Y(-1.2)); ctx.lineTo(X(1.2), Y(1.2)); ctx.stroke();
      } else if (f.sym === 'origin') {
        ctx.beginPath();
        ctx.moveTo(X(-1.2 * ca), Y(-1.2 * sa));
        ctx.lineTo(X(1.2 * ca), Y(1.2 * sa));
        ctx.stroke();
      }
      ctx.restore();

      if (f.sym === 'origin') {
        ctx.save();
        ctx.strokeStyle = rose;
        ctx.globalAlpha = 0.75;
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.arc(cx, cy, 6, 0, TAU);
        ctx.stroke();
        ctx.restore();
      }

      if (f.sym === 'rot90') {
        const r0 = 26;
        const ux = ca, uy = -sa, vx = cb, vy = -sb;
        ctx.save();
        ctx.strokeStyle = rose;
        ctx.globalAlpha = 0.8;
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(cx + ux * r0, cy + uy * r0);
        ctx.lineTo(cx + (ux + vx) * r0, cy + (uy + vy) * r0);
        ctx.lineTo(cx + vx * r0, cy + vy * r0);
        ctx.stroke();
        ctx.restore();
      }

      if (f.sym !== 'same') {
        ctx.save();
        ctx.strokeStyle = isLight ? 'rgba(100,116,139,0.65)' : 'rgba(148,163,184,0.6)';
        ctx.lineWidth = 1.3;
        ctx.setLineDash([4, 5]);
        ctx.beginPath();
        ctx.moveTo(X(ca), Y(sa));
        ctx.lineTo(X(cb), Y(sb));
        ctx.stroke();
        ctx.restore();
      }
    }

    // ---------- 角弧 ----------
    if (a > 0.3) arcTo(R * 0.26, 0, a, cyan, 2);
    if (f.sym !== 'same') arcTo(R * 0.40, 0, b, purple, 2, [7, 5]);

    // ---------- 终边 ----------
    ray(a, cyan, 2.8, null, R * 1.19, 12);
    if (f.sym !== 'same') ray(b, purple, 2.8, null, R * 1.19, 12);

    // ---------- 三角函数线 ----------
    if (state.show.line) {
      ctx.save();
      ctx.strokeStyle = amber;
      ctx.lineWidth = 3.2;
      ctx.lineCap = 'round';
      ctx.shadowColor = amber;
      ctx.shadowBlur = 9;
      ctx.beginPath();
      ctx.moveTo(X(ca), Y(0));
      ctx.lineTo(X(ca), Y(sa));
      ctx.stroke();
      ctx.restore();

      ctx.save();
      ctx.strokeStyle = green;
      ctx.lineWidth = 3.6;
      ctx.lineCap = 'round';
      ctx.shadowColor = green;
      ctx.shadowBlur = 9;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(X(ca), cy);
      ctx.stroke();
      ctx.restore();

      const sy = (Y(sa) + Y(0)) / 2;
      drawLabel(ctx, 'sin α', X(ca) + (ca >= 0 ? 26 : -26), sy, amber, 12);
      drawLabel(ctx, 'cos α', (cx + X(ca)) / 2, cy + (sa >= 0 ? 20 : -20), green, 12);

      // β 的正弦线 / 余弦线：虚线，与 α 的实线区分
      if (f.sym !== 'same') {
        const hasSin = Math.abs(sb) > 0.055;
        const hasCos = Math.abs(cb) > 0.055;

        if (hasSin) {
          ctx.save();
          ctx.strokeStyle = amber;
          ctx.globalAlpha = 0.85;
          ctx.lineWidth = 2.2;
          ctx.lineCap = 'round';
          ctx.setLineDash([6, 5]);
          ctx.beginPath();
          ctx.moveTo(X(cb), Y(0));
          ctx.lineTo(X(cb), Y(sb));
          ctx.stroke();
          ctx.restore();
        }

        if (hasCos) {
          ctx.save();
          ctx.strokeStyle = green;
          ctx.globalAlpha = 0.85;
          ctx.lineWidth = 2.4;
          ctx.lineCap = 'round';
          ctx.setLineDash([6, 5]);
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.lineTo(X(cb), cy);
          ctx.stroke();
          ctx.restore();
        }

        const syB = (Y(sb) + Y(0)) / 2;
        if (hasSin) drawLabel(ctx, 'sin β', X(cb) + (cb >= 0 ? -26 : 26), syB, amber, 12);
        if (hasCos) drawLabel(ctx, 'cos β', (cx + X(cb)) / 2, cy + (sb >= 0 ? -20 : 20), green, 12);
      }
    }

    // ---------- 演示中的移动点 ----------
    if (morph.active) {
      const steps = mSteps();
      const st = mStage(steps);
      if (!st.done) {
        const step = steps[st.idx];
        const p = stepPoint(step, st.f);
        // 路径预览
        ctx.save();
        ctx.strokeStyle = amber;
        ctx.globalAlpha = 0.5;
        ctx.lineWidth = 1.8;
        ctx.setLineDash([5, 6]);
        ctx.beginPath();
        if (step.kind === 'rot') {
          const rp = R * 0.87;
          const d0 = -step.from * D2R, d1 = -(step.from + (step.to - step.from) * st.f) * D2R;
          ctx.arc(cx, cy, rp, d0, d1, (step.to - step.from) > 0);
        } else {
          ctx.moveTo(cx + Math.cos(step.from * D2R) * R, cy - Math.sin(step.from * D2R) * R);
          ctx.lineTo(cx + p.x * R, cy - p.y * R);
        }
        ctx.stroke();
        ctx.restore();

        glowDot(ctx, cx + p.x * R, cy - p.y * R, 8, amber);
      }
    }

    // ---------- 点与标签 ----------
    glowDot(ctx, X(ca), Y(sa), 7, cyan);
    if (f.sym !== 'same') glowDot(ctx, X(cb), Y(sb), 7, purple);

    if (a > 3) {
      const am = a / 2;
      drawLabel(ctx, 'α', cx + Math.cos(am * D2R) * (R * 0.26 + 15), cy - Math.sin(am * D2R) * (R * 0.26 + 15), cyan, 13);
    }
    if (f.sym !== 'same' && Math.abs(b) > 3) {
      const bm = b / 2;
      drawLabel(ctx, 'β', cx + Math.cos(bm * D2R) * (R * 0.40 + 21), cy - Math.sin(bm * D2R) * (R * 0.40 + 21), purple, 13);
    }

    if (state.show.lab) {
      const ptxt = `P(${numStr(ca, 2)}, ${numStr(sa, 2)})`;
      const pAlign = ca >= 0 ? 'left' : 'right';
      drawLabel(ctx, ptxt, X(ca) + (ca >= 0 ? 13 : -13), Y(sa) - 17, cyan, 12, pAlign);

      if (f.sym === 'same') {
        drawLabel(ctx, 'P′ 与 P 重合', X(ca) + (ca >= 0 ? 13 : -13), Y(sa) + 26, ink2, 11.5, pAlign);
      } else {
        const qtxt = `P′(${numStr(cb, 2)}, ${numStr(sb, 2)})`;
        const qAlign = cb >= 0 ? 'left' : 'right';
        drawLabel(ctx, qtxt, X(cb) + (cb >= 0 ? 13 : -13), Y(sb) - 17, purple, 12, qAlign);
      }
    }
  });

  /* =========================================================
     对称变换连续演示
     ========================================================= */
  const morph = { active: false, path: 1, t: 0, playing: false, sig: '', resume: false };
  const M_HOLD = 0.55;

  function twoPath() { return state.f === 1 || state.f === 5; }

  function mSteps() {
    const a = state.a;
    const two = morph.path === 2 && twoPath();
    if (state.f === 0) {
      return [{ kind: 'rot', from: a, to: a + 360, short: '再转 2π', name: '绕原点再转 2π',
        note: '终边回到原处，同名函数值完全不变', color: '--purple' }];
    }
    if (state.f === 1) {
      if (!two) {
        return [{ kind: 'rot', from: a, to: a + 180, short: '旋转 180°', name: '绕原点旋转 180°',
          note: '终边成为 α 的反向延长线，横纵坐标同时变号', color: '--purple' }];
      }
      return [
        { kind: 'mirror', from: a, to: -a, short: '① x 轴对称', name: '① 关于 x 轴对称 → −α',
          note: '横坐标不变、纵坐标相反，先造出 −α', color: '--amber' },
        { kind: 'mirror', from: -a, to: 180 + a, short: '② y 轴对称', name: '② 关于 y 轴对称 → π + α',
          note: '纵坐标不变、横坐标相反，两步合起来就是转半圈', color: '--purple' },
      ];
    }
    if (state.f === 2) {
      return [{ kind: 'mirror', from: a, to: -a, short: '关于 x 轴对称', name: '关于 x 轴对称 → −α',
        note: '横坐标不变、纵坐标相反', color: '--amber' }];
    }
    if (state.f === 3) {
      return [{ kind: 'mirror', from: a, to: 180 - a, short: '关于 y 轴对称', name: '关于 y 轴对称 → π − α',
        note: '纵坐标不变、横坐标相反', color: '--amber' }];
    }
    if (state.f === 4) {
      return [{ kind: 'mirror', from: a, to: 90 - a, short: '关于 y = x 对称', name: '关于直线 y = x 对称 → π/2 − α',
        note: '横、纵坐标互换，函数名随之改变', color: '--amber' }];
    }
    if (!two) {
      return [{ kind: 'rot', from: a, to: a + 90, short: '旋转 90°', name: '逆时针旋转 90°',
        note: '终边转过四分之一圈，横纵坐标互换且各带符号', color: '--purple' }];
    }
    return [
      { kind: 'mirror', from: a, to: -a, short: '① x 轴对称', name: '① 关于 x 轴对称 → −α',
        note: '先用公式三造出 −α', color: '--amber' },
      { kind: 'mirror', from: -a, to: 90 + a, short: '② y = x 对称', name: '② 关于 y = x 对称 → π/2 + α',
        note: '套用公式五，横纵坐标互换', color: '--purple' },
    ];
  }

  function stepPoint(s, u) {
    if (s.kind === 'rot') {
      const d = s.from + (s.to - s.from) * u;
      return { x: Math.cos(d * D2R), y: Math.sin(d * D2R), deg: d };
    }
    const x0 = Math.cos(s.from * D2R), y0 = Math.sin(s.from * D2R);
    const x1 = Math.cos(s.to * D2R), y1 = Math.sin(s.to * D2R);
    return { x: x0 + (x1 - x0) * u, y: y0 + (y1 - y0) * u };
  }

  function mTimeline(steps) {
    const segs = [];
    let t = 0;
    steps.forEach((s, i) => {
      const dur = Math.abs(s.to - s.from) < 1e-6 ? 0.35 : 1.5;
      segs.push({ start: t, anim: dur });
      t += dur + (i < steps.length - 1 ? M_HOLD : 0);
    });
    segs.total = t;
    return segs;
  }

  function mStage(steps) {
    const segs = mTimeline(steps);
    const n = steps.length;
    for (let i = 0; i < n; i++) {
      const s = segs[i];
      if (morph.t < s.start + s.anim) {
        return { idx: i, f: Math.max(0, (morph.t - s.start) / s.anim), holding: false, done: false };
      }
      if (i < n - 1 && morph.t < s.start + s.anim + M_HOLD) {
        return { idx: i, f: 1, holding: true, done: false };
      }
    }
    return { idx: n, f: 1, done: true };
  }

  const morphHud = document.getElementById('morphHud');
  const morphSteps = document.getElementById('morphSteps');
  const morphHint = document.getElementById('morphHint');
  const hudBottomLeft = document.getElementById('hudBottomLeft');
  const morphControls = document.getElementById('morphControls');
  const btnMorphPlay = document.getElementById('btnMorphPlay');
  const hintBar = document.querySelector('.hud-bottom-right');

  function resLine(fn) {
    const r = reduce(F[state.f].k, F[state.f].s, fn);
    return `${(r.sign < 0 ? '−' : '')}${r.fn} α`;
  }

  function morphHintHTML(steps, st) {
    const f = F[state.f];
    const target = `${state.fn}(${f.sub}) = ${resLine(state.fn)}`;
    if (morph.t <= 1e-6 && !morph.playing) {
      return `点击 <b>连续变换</b>：把终边从 α 出发，经「${steps.map((s) => s.short).join(' + ')}」得到 <b>${target}</b><span class="now"></span>`;
    }
    if (st.done) {
      return `<b>变换完成</b>：β = ${degNorm(betaDeg(f, state.a))}°　—　${target}　·　点「✕ 退出演示」交还自由探究<span class="now"></span>`;
    }
    const s = steps[st.idx];
    return `<b>${s.name}</b>：${s.note}<span class="now"></span>`;
  }

  function nowLabel(steps, st) {
    if (st.done) return '';
    const s = steps[st.idx];
    const p = stepPoint(s, st.f);
    const d = p.deg !== undefined ? p.deg : Math.atan2(p.y, p.x) / D2R;
    return `　·　当前 ${degNorm(d)}°`;
  }

  function paintNow() {
    const el = morphHint.querySelector('.now');
    if (!el) return;
    const steps = mSteps();
    const txt = nowLabel(steps, mStage(steps));
    if (el.textContent !== txt) el.textContent = txt;
  }

  function syncMorphUI() {
    const steps = mSteps();
    const st = mStage(steps);
    const sig = state.f + '|' + Math.round(state.a) + '|' + morph.path + '|' +
      (st.done ? 'd' : st.idx) + '|' + (st.holding ? 'h' : 'a') + '|' +
      (morph.playing ? 'p' : 's') + '|' + (morph.t <= 1e-6 ? '0' : '1');
    btnMorphPlay.textContent = morph.playing ? '⏸ 暂停变换' : '▶ 连续变换';
    if (sig === morph.sig) return;
    morph.sig = sig;

    let html = '';
    steps.forEach((s, i) => {
      const color = getCssVar(s.color) || '#38bdf8';
      const done = st.done || st.idx > i || (st.idx === i && st.holding);
      const active = !st.done && st.idx === i && !st.holding;
      let style = '';
      if (active) style = ` style="background:${color};box-shadow:0 6px 18px ${color}55"`;
      else if (done) style = ` style="color:${color};border-color:${color}55"`;
      html += `<div class="morph-step${active ? ' active' : ''}${done ? ' done' : ''}"${style}>` +
        s.short + (done ? ' ✓' : '') + (active ? ' …' : '') + '</div>';
    });
    morphSteps.innerHTML = html;
    morphHint.innerHTML = morphHintHTML(steps, st);
    paintNow();
  }

  function startMorph(auto) {
    morph.active = true;
    morph.t = 0;
    morph.playing = auto !== false;
    morph.sig = '';
    morph.resume = state.playing;
    togglePlay(false);
    hudBottomLeft.style.display = 'none';
    morphControls.style.display = 'flex';
    morphHud.classList.add('show');
    hintBar.style.display = 'none';
    syncMorphUI();
  }

  function exitMorph() {
    morph.active = false;
    morph.playing = false;
    morph.sig = '';
    morphHud.classList.remove('show');
    morphControls.style.display = 'none';
    hudBottomLeft.style.display = 'flex';
    hintBar.style.display = '';
    togglePlay(morph.resume);
  }

  function mTotal() { return mTimeline(mSteps()).total; }

  /* =========================================================
     UI 同步
     ========================================================= */
  let lastAlertMsg = '';

  function syncPill() {
    const f = F[state.f];
    const r = reduce(f.k, f.s, state.fn);
    document.getElementById('fFn').textContent = state.fn;
    document.getElementById('fAng').textContent = f.sub;
    document.getElementById('fRes').textContent = (r.sign < 0 ? '−' : '') + r.fn + ' α';
  }

  function syncReadout() {
    const f = F[state.f];
    const aShow = Math.round(state.a);
    const a = aShow;
    const b = betaDeg(f, a);
    document.getElementById('statA').textContent = aShow + '°';
    document.getElementById('statB').textContent = degNorm(b) + '°';
    document.getElementById('quadTag').textContent = quadOf(a);
    document.getElementById('geoTag').textContent = f.geo;
  }

  function syncTable() {
    const f = F[state.f];
    const a = state.a;
    const b = betaDeg(f, a);
    const A = trigVals(a);
    const B = trigVals(b);
    const rows = ['sin', 'cos', 'tan'].map((fn) => {
      const r = reduce(f.k, f.s, fn);
      const bv = B[fn], av = A[r.fn];
      let chk;
      if (!isFinite(bv) || !isFinite(av)) chk = '<span style="color:var(--ink-3)">—</span>';
      else if (Math.abs(bv - av) < 1e-6) chk = '<span class="ok">✓ 相等</span>';
      else if (Math.abs(bv + av) < 1e-6) chk = '<span class="ok">✓ 相反</span>';
      else chk = '<span style="color:var(--red);font-weight:700">✗</span>';
      const sub = (r.fn !== fn) ? `<span class="sub">= ${r.fn} α</span>` : '';
      return `<tr class="${fn === state.fn ? 'hi' : ''}">
        <td><b>${fn} β</b>${sub}</td>
        <td>${numStr(bv, 3)}</td>
        <td>${numStr(av, 3)}</td>
        <td class="ok">${chk}</td></tr>`;
    }).join('');
    document.getElementById('valBody').innerHTML = rows;
  }

  function syncAlert() {
    const f = F[state.f];
    const a = state.a;
    const b = betaDeg(f, a);
    let msg = f.tip;
    if (state.fn === 'tan' && (Math.abs(Math.cos(a * D2R)) < 1e-9 || Math.abs(Math.cos(b * D2R)) < 1e-9)) {
      msg = '⚠️ 终边正好落在 y 轴上，tan 的值不存在 —— 这就是 tan 的定义域要挖掉 π/2 + kπ 的原因。';
    }
    if (msg !== lastAlertMsg) {
      lastAlertMsg = msg;
      setAlert(msg);
    }
  }

  function markFBtns() {
    document.querySelectorAll('#fbtns .fbtn').forEach((b) => {
      b.classList.toggle('on', Number(b.dataset.i) === state.f);
    });
  }

  function syncUI() {
    syncPill();
    syncReadout();
    syncTable();
    syncAlert();
    markFBtns();
    syncPredict();
  }

  function syncLight() {
    syncReadout();
    syncTable();
    syncAlert();
  }

  /* ---------- 公式按钮 ---------- */
  function buildFBtns() {
    document.getElementById('fbtns').innerHTML = F.map((f, i) =>

  /* ---------- 播放 / 重置 ---------- */
  const btnPlay = document.getElementById('btnPlay');
  function togglePlay(force) {
    state.playing = typeof force === 'boolean' ? force : !state.playing;
    btnPlay.textContent = state.playing ? '⏸ 暂停旋转' : '▶ 继续旋转';

  /* ---------- 拖动画圆 ---------- */
  let dragging = false;
  function setAngleFromPointer(px, py) {
    if (!meta) return;
    const dx = px - meta.cx;
    const dy = meta.cy - py;
    if (Math.hypot(dx, dy) < meta.R * 0.22) return;
    let d = Math.atan2(dy, dx) / D2R;
    if (d < 0) d += 360;
    state.a = Math.floor(d) % 360;
    syncLight();
  }
  canvasEl.addEventListener('pointerdown', (e) => {
    if (morph.active) return;
    const rect = canvasEl.getBoundingClientRect();
    dragging = true;
    togglePlay(false);
    setAngleFromPointer(e.clientX - rect.left, e.clientY - rect.top);
    canvasEl.setPointerCapture && canvasEl.setPointerCapture(e.pointerId);
  });
  canvasEl.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const rect = canvasEl.getBoundingClientRect();
    setAngleFromPointer(e.clientX - rect.left, e.clientY - rect.top);
  });
  window.addEventListener('pointerup', () => { dragging = false; });

  /* ---------- 演示按钮 ---------- */
  btnMorphPlay.addEventListener('click', () => {
    if (morph.playing) {
      morph.playing = false;
    } else {
      if (morph.t >= mTotal() - 1e-6) morph.t = 0;
      morph.playing = true;
    }
    morph.sig = '';
    syncMorphUI();
  });

  document.getElementById('btnMorphReplay').addEventListener('click', () => {

  /* =========================================================
     答对特效
     ========================================================= */
  const fxCanvas = document.getElementById('fxCanvas');
  const quizStamp = document.getElementById('quizStamp');
  const reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  const fx = (() => {
    const ctx = fxCanvas.getContext('2d');
    const COLORS = ['#34d399', '#22d3ee', '#fbbf24', '#a78bfa', '#f472b6', '#38bdf8', '#ffffff'];
    let parts = [];
    let raf = 0;
    let last = 0;

    function fit() {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const w = window.innerWidth, h = window.innerHeight;
      fxCanvas.width = Math.round(w * dpr);
      fxCanvas.height = Math.round(h * dpr);
      fxCanvas.style.width = w + 'px';
      fxCanvas.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    fit();
    window.addEventListener('resize', () => { if (parts.length) fit(); });

    function paper(x, y, ang, spd, power) {
      parts.push({
        kind: 'paper',
        x, y,
        vx: Math.cos(ang) * spd * power,
        vy: Math.sin(ang) * spd * power,
        w: 6 + Math.random() * 7,
        h: 5 + Math.random() * 5,
        rot: Math.random() * 6.2832,
        vr: (Math.random() - 0.5) * 15,
        color: COLORS[(Math.random() * COLORS.length) | 0],
        life: 1,
        decay: 0.5 + Math.random() * 0.26,
        swing: Math.random() * 6.2832,
      });
    }

    function confetti(x, y, count, power) {
      for (let i = 0; i < count; i++) {
        const ang = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 0.95;
        paper(x + (Math.random() - 0.5) * 36, y + (Math.random() - 0.5) * 10,
          ang, 170 + Math.random() * 320, power || 1);
      }
    }

    function sparks(x, y, count) {
      for (let i = 0; i < count; i++) {
        const ang = Math.random() * 6.2832;
        const spd = 90 + Math.random() * 250;
        parts.push({
          kind: 'spark',
          x, y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          r: 1.6 + Math.random() * 2.6,
          color: COLORS[(Math.random() * COLORS.length) | 0],
          life: 1,
          decay: 1.1 + Math.random() * 0.9,
        });
      }
    }

    function cannons(count) {
      const w = window.innerWidth, h = window.innerHeight;
      for (let i = 0; i < count; i++) {
        const left = i % 2 === 0;
        parts.push({
          kind: 'paper',
          x: left ? -8 : w + 8,
          y: h - 16,
          vx: (left ? 1 : -1) * (360 + Math.random() * 240),
          vy: -(620 + Math.random() * 320),
          w: 7 + Math.random() * 7,
          h: 5 + Math.random() * 5,
          rot: Math.random() * 6.2832,
          vr: (Math.random() - 0.5) * 16,
          color: COLORS[(Math.random() * COLORS.length) | 0],
          life: 1,
          decay: 0.34 + Math.random() * 0.2,
          swing: Math.random() * 6.2832,
        });
      }
    }

    function tick(t) {
      const dt = last ? Math.min(0.05, (t - last) / 1000) : 0.016;
      last = t;
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i];
        p.life -= p.decay * dt;
        if (p.life <= 0) { parts.splice(i, 1); continue; }

        if (p.kind === 'paper') {
          p.vy += 1150 * dt;
          p.vx *= 1 - 1.1 * dt;
          p.vy *= 1 - 0.5 * dt;
          p.swing += dt * 9;
          p.x += (p.vx + Math.sin(p.swing) * 34) * dt;
          p.y += p.vy * dt;
          p.rot += p.vr * dt;
          ctx.save();
          ctx.globalAlpha = Math.min(1, p.life * 1.7);
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, Math.max(1, p.h * Math.abs(Math.cos(p.swing * 0.7))));
          ctx.restore();
        } else {
          p.vy += 420 * dt;
          p.vx *= 1 - 2.2 * dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          ctx.save();
          ctx.globalAlpha = Math.max(0, p.life);
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, Math.max(0.4, p.r * p.life), 0, 6.2832);
          ctx.fill();
          ctx.restore();
        }

        if (p.y > window.innerHeight + 80) parts.splice(i, 1);
      }

      if (!parts.length) {
        cancel();
        return;
      }
      raf = requestAnimationFrame(tick);
    }

    function start() {
      if (raf) return;
      fit();
      fxCanvas.style.display = 'block';
      last = 0;
      raf = requestAnimationFrame(tick);
    }

    function cancel() {
      if (raf) cancelAnimationFrame(raf);
      raf = 0;
      last = 0;
      parts = [];
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      fxCanvas.style.display = 'none';
    }

    return {
      clear: cancel,
      burstAt(el, big) {
        if (reduceMotion || !el) return;
        const r = el.getBoundingClientRect();
        const cx = r.left + r.width / 2;
        const cy = r.top + 8;
        confetti(cx, cy, big ? 84 : 42, big ? 1.25 : 1);
        sparks(cx, cy, big ? 22 : 12);
        start();
      },
      finale() {
        if (reduceMotion) return;
        cannons(64);
        start();
        [0, 1, 2].forEach((i) => {
          setTimeout(() => {
            confetti(window.innerWidth * (0.3 + i * 0.2), window.innerHeight * 0.66, 30, 1.12);
            start();
          }, 240 * (i + 1));
        });
      },
    };
  })();

  const QUIZ_SIZE = 4;
  let quizSet = [];
  let lastIds = [];

  (function syncQuizInfo() {
    const el = document.getElementById('quizBankInfo');
    if (el) {
      el.innerHTML = `题库共 <b>${QUIZ_BANK.length}</b> 道，每轮随机抽 <b>${QUIZ_SIZE}</b> 道（选项顺序也会打乱），每次打开都是新的一批题。<br>重点检验「奇变偶不变、符号看象限」与六组公式的对称关系。`;
    }
    const badge = document.getElementById('quizScoreBadge');
    if (badge) badge.textContent = `得分 0 / ${QUIZ_SIZE}`;
    const chal = document.getElementById('chalScore');
    if (chal) chal.textContent = `0 / ${QUIZ_SIZE}`;
  })();

  function shuffleArr(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function newQuizSet() {
    const fresh = QUIZ_BANK.filter((q) => lastIds.indexOf(q.id) === -1);
    const pool = fresh.length >= QUIZ_SIZE ? fresh : QUIZ_BANK;
    const picked = shuffleArr(pool).slice(0, QUIZ_SIZE);
    lastIds = picked.map((q) => q.id);
    quizSet = picked.map((q) => {
      const texts = shuffleArr(q.opts);
      return { ...q, opts: texts, ans: texts.indexOf(q.opts[q.ans]) };
    });
    quizIndex = 0;
    quizScore = 0;
    quizAnswered = false;
    quizStreak = 0;
  }

  let quizIndex = 0;
  let quizScore = 0;
  let quizAnswered = false;
  let quizStreak = 0;

  const btnQuizDemo = document.getElementById('btnQuizDemo');
  const btnQuizNext = document.getElementById('btnQuizNext');
  const btnBgm = document.getElementById('btnBgm');
  let bgmEnabled = true;

  function syncBgmBtn() {
    const playing = sound.isPlaying();
    btnBgm.textContent = playing ? '🔊 音乐开' : '🔇 音乐关';
    btnBgm.classList.toggle('on', playing);
  }

  btnBgm.addEventListener('click', () => {
    bgmEnabled = !bgmEnabled;
    if (bgmEnabled) { sound.setMuted(false); sound.startBgm(); }
    else { sound.stopBgm(); }
    syncBgmBtn();
  });

  function openQuizModal() {

    quizModal.classList.add('open');

  function closeQuizModal() {
    quizModal.classList.remove('open');
    fx.clear();
    sound.stopBgm();
    syncBgmBtn();
  }

  function renderQuizQuestion() {
    const q = quizSet[quizIndex];
    quizAnswered = false;
    fx.clear();
    if (quizStamp) quizStamp.classList.remove('show');
    document.getElementById('quizProgress').textContent = `第 ${quizIndex + 1} / ${quizSet.length} 题`;
    document.getElementById('quizScoreBadge').textContent = `得分 ${quizScore} / ${quizSet.length}`;
    document.getElementById('chalScore').textContent = `${quizScore} / ${quizSet.length}`;
    document.getElementById('quizStem').innerHTML = `${q.stem}<br><span class="quiz-formula">${q.formula}</span>`;

    const explainEl = document.getElementById('quizExplain');
    explainEl.classList.remove('show');
    explainEl.innerHTML = '';
    btnQuizDemo.style.display = 'none';
    btnQuizNext.style.display = 'none';

    const optsEl = document.getElementById('quizOpts');
    optsEl.innerHTML = '';
    q.opts.forEach((label, idx) => {
      const btn = document.createElement('button');
      btn.className = 'quiz-opt';
      btn.textContent = 'ABCD'[idx] + '. ' + label;
      btn.addEventListener('click', () => handleQuizPick(idx));
      optsEl.appendChild(btn);
    });
  }

  function handleQuizPick(pickedIdx) {
    if (quizAnswered) return;
    quizAnswered = true;
    const q = quizSet[quizIndex];
    const buttons = document.querySelectorAll('#quizOpts .quiz-opt');
    buttons.forEach((b, i) => {
      b.disabled = true;
      if (i === q.ans) {
        b.classList.add('correct');
        const tick = document.createElement('span');
        tick.className = 'opt-tick';
        tick.textContent = '✓';
        b.appendChild(tick);
      } else if (i === pickedIdx) {
        b.classList.add('wrong');
      }
    });

    if (pickedIdx === q.ans) {
      quizScore += 1;
      quizStreak = (quizStreak || 0) + 1;
      const isLast = quizIndex === quizSet.length - 1;
      const scoreBadge = document.getElementById('quizScoreBadge');
      scoreBadge.textContent = `得分 ${quizScore} / ${quizSet.length}`;
      document.getElementById('chalScore').textContent = `${quizScore} / ${quizSet.length}`;

      fx.burstAt(buttons[q.ans], isLast);
      flashModal();
      bumpBadge(scoreBadge);
      bumpBadge(document.getElementById('chalScore'));

      if (isLast) {
        fx.finale();
        const full = quizScore === quizSet.length;
        showQuizStamp(full ? '🏆' : '🎉',
          full ? '满分通关！' : '闯关完成',
          `总得分 ${quizScore} / ${quizSet.length}`,
          true);
        sound.playVictory();
        showToast(full ? `🏆 全对通关！${quizScore} / ${quizSet.length}` : `🏆 闯关完成！总得分 ${quizScore} / ${quizSet.length}`);
      } else {
        const streak = quizStreak || 1;
        showQuizStamp('✓', '答对了 +1', streak >= 2 ? `🔥 连对 ${streak} 题` : '保持这个节奏', false);
        sound.playCorrect();
        showToast(streak >= 2 ? `🔥 连对 ${streak} 题了！` : '🎉 回答正确！+1 分');
      }
    } else {
      quizStreak = 0;
      sound.playWrong();
      showToast('❌ 答错了，看看解析再去单位圆上验证一下');
    }

    const explainEl = document.getElementById('quizExplain');
    explainEl.innerHTML = `<b>解析：</b>${q.explain}`;
    explainEl.classList.add('show');

    btnQuizDemo.style.display = 'inline-flex';
    btnQuizNext.style.display = 'inline-flex';
    btnQuizNext.textContent = quizIndex < quizSet.length - 1 ? '下一题 →' : '🔄 换一批新题';
  }

  document.getElementById('btnOpenQuiz').addEventListener('click', openQuizModal);

  const PREDICT_DESC = [
    '再转 2kπ（整整一圈）回到原处',
    '绕原点转半圈（180°）',
    '关于 x 轴作对称，落到 −α',
    '关于 y 轴作对称，落到 π − α',
    '关于直线 y = x 作对称，落到 π/2 − α',
    '逆时针再转 90°，落到 π/2 + α',
  ];

  const predictBody = document.getElementById('predictBody');
  let predictData = null;
  let predictKey = '';

  function shuffleIdx(n, seed) {
    const arr = [];
    for (let i = 0; i < n; i++) arr.push(i);
    let sd = seed % 2147483647;
    if (sd <= 0) sd += 2147483646;
    for (let i = n - 1; i > 0; i--) {
      sd = (sd * 16807) % 2147483647;
      const j = sd % (i + 1);
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function buildPredict() {
    const f = F[state.f];
    const fn = state.fn;
    const r = reduce(f.k, f.s, fn);
    const co = (name) => (name === 'sin' ? 'cos' : name === 'cos' ? 'sin' : 'cot');
    const other = r.fn === fn ? co(fn) : fn;
    const base = [
      { text: r.fn + ' α', ok: r.sign > 0 },
      { text: '−' + r.fn + ' α', ok: r.sign < 0 },
      { text: other + ' α', ok: false },
      { text: '−' + other + ' α', ok: false },
    ];
    const fnIdx = fn === 'sin' ? 0 : fn === 'cos' ? 1 : 2;
    const opts = shuffleIdx(4, state.f * 37 + fnIdx * 11 + 5).map((i) => base[i]);
    const result = fn + '(' + f.sub + ') = ' + (r.sign < 0 ? '−' : '') + r.fn + ' α';
    const tip = f.tip.replace(/^[^\u4e00-\u9fa5]+/, '');
    return {
      q: '把角 α 的终边' + PREDICT_DESC[state.f] + '：<br><b>' + fn + '(' + f.sub + ')</b> 与 <b>' + fn + ' α</b> 是什么关系？',
      opts,
      correct: opts.findIndex((o) => o.ok),
      result,
      feedback: '<b>验证结论：</b>' + tip + '　即 <b>' + result + '</b>。',
    };
  }

  function renderPredict() {
    predictData = buildPredict();
    state.pickedOpt = null;
    state.revealed = false;
    const badge = document.getElementById('predictBadge');
    if (badge) badge.textContent = F[state.f].title + ' · ' + state.fn;
    const tag = ['A', 'B', 'C', 'D'];
    predictBody.innerHTML =
      '<div class="predict-q">' + predictData.q + '</div>' +
      '<div class="predict-opts" id="predictOpts">' +
      predictData.opts.map((o, i) =>
        '<button class="predict-opt" data-idx="' + i + '"><b>' + tag[i] + '.</b> ' + o.text + '</button>').join('') +
      '</div>' +
      '<button class="btn amber" id="btnReveal" style="width:100%;" disabled>✨ 请先选择一个猜想</button>' +
      '<div class="predict-feedback" id="predictFeedback">' + predictData.feedback + '</div>';
  }

  function syncPredict() {
    const key = state.f + '|' + state.fn;
    if (key === predictKey) return;
    predictKey = key;
    renderPredict();
  }

  function pickPredict(idx) {
    if (!predictData || state.revealed) return;
    predictBody.querySelectorAll('.predict-opt').forEach((o) => {
      o.classList.toggle('picked', Number(o.dataset.idx) === idx);
    });
    state.pickedOpt = idx;
    const btn = predictBody.querySelector('#btnReveal');
    if (btn) {
      btn.disabled = false;
      btn.textContent = '✨ 揭晓并慢放验证';
    }
    sound.playClick();
  }

  function revealPredict() {
    if (!predictData || state.revealed || state.pickedOpt === null) return;
    state.revealed = true;
    if (morph.active) exitMorph();
    predictBody.querySelectorAll('.predict-opt').forEach((o) => {
      const i = Number(o.dataset.idx);
      if (i === predictData.correct) o.classList.add('correct');
      else if (i === state.pickedOpt) o.classList.add('wrong');
    });
    const fb = predictBody.querySelector('#predictFeedback');
    if (fb) fb.classList.add('show');
    const btn = predictBody.querySelector('#btnReveal');
    if (btn) {
      btn.disabled = true;
      btn.textContent = '✓ 已揭晓，看右侧动画';
    }
    const card = document.getElementById('predictCard');
    if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    startMorph(true);
    if (state.pickedOpt === predictData.correct) {
      lab.burst(lab.width * 0.5, lab.height * 0.28, '#34d399', 26);
      showToast('👏 预测正确：' + predictData.result);
    } else {
      showToast('再想一想：正确答案是 ' + predictData.result);
    }
  }

    const rv = e.target.closest('#btnReveal');
    if (rv && !rv.disabled) revealPredict();

        syncUI();
      }
      if (action === 'play') togglePlay(Boolean(payload));
      if (action === 'reveal' && state.mode === 'predict') revealPredict();
    },
  });

  /* =========================================================
     动画主循环
     ========================================================= */
  let lastA = -1;
  lab.start((dt) => {
    if (morph.active && morph.playing) {
      morph.t += dt;
      if (morph.t >= mTotal()) {
        morph.t = mTotal();
        morph.playing = false;
        morph.sig = '';
      }
      syncMorphUI();
      paintNow();
    }
    if (state.playing && !morph.active) {
      state.a = (state.a + dt * state.speed) % 360;
      const ai = Math.floor(state.a);
      if (ai !== lastA) {
        lastA = ai;
        syncLight();
      }
    }
  });

  buildFBtns();
  markFBtns();
  syncUI();
})();
</script>
</body>
</html>
