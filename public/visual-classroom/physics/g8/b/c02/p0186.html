<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>活塞式抽水机 · 3D 演示</title>
<style>
  :root{ --ink:#1b2a33; --ink2:#5f7684; --line:rgba(27,42,51,.13); --card:rgba(255,255,255,.74); }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
    background:radial-gradient(118% 92% at 58% 4%, #ffffff 0%, #f1f5f8 38%, #dee6ec 70%, #c3d0da 100%);
    color:var(--ink);
  }
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #c:active{cursor:grabbing}
  .vig{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(70% 60% at 55% 42%, rgba(255,255,255,0) 44%, rgba(130,152,168,.16) 100%)}

  .head{position:fixed;left:28px;top:24px;pointer-events:none}
  .head h1{margin:0;font-size:17px;font-weight:600;letter-spacing:.06em}
  .head p{margin:5px 0 0;font-size:10.5px;color:var(--ink2);letter-spacing:.16em}
  .head .sub{margin-top:8px;font-size:11.5px;color:var(--ink2);letter-spacing:.02em;max-width:300px;line-height:1.5}
  .rule{width:26px;height:2px;background:linear-gradient(90deg,#2f7fa8,rgba(47,127,168,0));margin:10px 0 0}

  .state{position:fixed;left:28px;bottom:28px;pointer-events:none;
    display:flex;align-items:center;gap:10px;padding:9px 15px 9px 12px;border-radius:10px;
    background:var(--card);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    font-size:12.5px;color:var(--ink);box-shadow:0 8px 26px rgba(38,58,72,.08)}
  .dot{width:7px;height:7px;border-radius:50%;background:#3f9dc4;box-shadow:0 0 0 3px rgba(63,157,196,.16);transition:.3s;flex:none}
  .state b{font-weight:600}
  .state .k{color:#2f7fa8;font-weight:600}
  .state .sep{width:1px;height:15px;background:var(--line);flex:none}
  .stroke{width:44px;height:4px;border-radius:3px;background:rgba(27,42,51,.12);overflow:hidden;flex:none}
  .stroke-fill{height:100%;width:0%;background:linear-gradient(90deg,#2f7fa8,#43a9cf);border-radius:3px}
  .count{font-size:11px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}

  .ctrl{position:fixed;right:26px;bottom:28px;display:flex;gap:8px}
  .ctrl button{font:inherit;font-size:12px;color:var(--ink);padding:7px 13px;border-radius:9px;cursor:pointer;
    background:var(--card);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    transition:.18s;letter-spacing:.02em}
  .ctrl button:hover{background:rgba(255,255,255,.96);border-color:rgba(27,42,51,.24)}
  .ctrl button.off{color:#95a7b2}
  .ctrl button.primary{background:linear-gradient(180deg,#2fa2d4,#237fa8);color:#fff;border-color:rgba(20,90,120,.35);
    font-weight:600;padding:7px 16px;box-shadow:0 6px 18px rgba(31,111,146,.25);user-select:none;-webkit-user-select:none}
  .ctrl button.primary:hover{background:linear-gradient(180deg,#35addf,#2387b2);border-color:rgba(20,90,120,.45)}
  .ctrl button.primary.off{color:#fff}
  .ctrl button.primary.held{background:linear-gradient(180deg,#1c7ba4,#155f80);transform:translateY(1px);
    box-shadow:0 2px 8px rgba(31,111,146,.3)}

  #labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  #lead{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .leadline{stroke:rgba(24,42,54,.34);stroke-width:1;stroke-dasharray:2.5 2.5;fill:none}
  .leadline.k{stroke:rgba(47,127,168,.62);stroke-dasharray:2.5 2.2}
  .anc{fill:#ffffff;stroke:rgba(30,52,66,.72);stroke-width:1.5}
  .anc.k{stroke:rgba(31,111,146,.95)}
  .lbl{position:absolute;transform:translate(-50%,-50%);font-size:11px;color:#20323c;
    padding:2px 7px;border-radius:6px;white-space:nowrap;
    background:rgba(255,255,255,.86);border:1px solid rgba(27,42,51,.13);
    box-shadow:0 2px 10px rgba(38,58,72,.09)}
  .lbl.k{color:#1f6f92;border-color:rgba(47,127,168,.34);background:rgba(240,249,253,.94);font-weight:600}
  .lbl.grab{color:#fff;background:rgba(47,127,168,.92);border-color:rgba(31,101,137,.9);font-weight:600;
    animation:grabPulse 1.8s ease-in-out infinite;transition:opacity .3s}
  @keyframes grabPulse{0%,100%{box-shadow:0 2px 10px rgba(47,127,168,.35)}50%{box-shadow:0 2px 18px rgba(47,127,168,.85),0 0 0 4px rgba(47,127,168,.18)}}
  .lbl.grab.gone{opacity:0}
  .lbl.valve{font-weight:700}
  .lbl.valve.open{color:#fff;background:rgba(47,127,168,.95);border-color:rgba(31,101,137,.9);box-shadow:0 2px 14px rgba(47,127,168,.45)}
  .lbl.valve.open.a{background:rgba(199,126,42,.96);border-color:rgba(158,98,28,.9);box-shadow:0 2px 14px rgba(199,126,42,.45)}
  .hint{position:fixed;left:18px;bottom:56px;font-size:11px;color:#6d8492;letter-spacing:.06em;pointer-events:none;text-shadow:0 1px 6px rgba(255,255,255,.8)}
  .pressbar{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);display:flex;align-items:center;gap:9px;
    padding:7px 9px 7px 14px;border-radius:13px;background:var(--card);border:1px solid var(--line);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 8px 26px rgba(38,58,72,.09)}
  .pressbar .pt{font-size:12px;color:var(--ink);letter-spacing:.02em;white-space:nowrap}
  .pressbar .pt b{color:#1f6f92}
  .pressbar button{font:inherit;font-size:12.5px;font-weight:600;color:#fff;padding:9px 20px;border-radius:9px;cursor:pointer;
    border:1px solid rgba(20,90,120,.35);background:linear-gradient(180deg,#2fa2d4,#237fa8);
    box-shadow:0 6px 18px rgba(31,111,146,.25);user-select:none;-webkit-user-select:none;touch-action:none;transition:.1s}
  .pressbar button.held{background:linear-gradient(180deg,#1c7ba4,#155f80);transform:translateY(1px);box-shadow:0 2px 8px rgba(31,111,146,.3)}
  @media (max-width:760px){ .pressbar{bottom:14px;padding:6px 8px 6px 11px} .pressbar button{padding:8px 14px} }
  @media (max-width:760px){
    .head{left:16px;top:14px} .state{left:16px;bottom:16px;font-size:11.5px;padding:7px 11px}
    .ctrl{right:14px;bottom:16px} .hint{display:none}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="vig"></div>

<div class="head">
  <h1>活塞式抽水机</h1>
  <p>PISTON LIFT PUMP</p>
  <div class="sub">利用大气压强，把低处的水抽到高处</div>
  <div class="rule"></div>
</div>

<div class="state">
  <div class="dot" id="dot"></div>
  <div id="stateTxt"><b>静止</b> · 向下拖动泵柄</div>
  <div class="sep"></div>
  <div class="stroke"><div class="stroke-fill" id="strokeFill"></div></div>
  <div class="count" id="countTxt">0 次</div>
</div>

<div class="ctrl">
  <button id="btnLabel">标注</button>
  <button id="btnSlow">慢速</button>
</div>

<div class="pressbar">
  <span class="pt">按住 <b>泵柄</b> 向下拖 · 松手自动复位</span>
  <button id="btnPump">按住下压</button>
</div>

<div class="hint">拖动泵柄抽水 · 拖动空白处旋转 · 滚轮缩放</div>
<div id="labels"><svg id="lead" xmlns="http://www.w3.org/2000/svg"></svg></div>

<script src="/visual-classroom/vendor/three/0.128.0/build/three.min.js"></script>
<script>
(function () {
'use strict';

/* ==================================================================
   0. 渲染器 / 场景 / 相机
   ================================================================== */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
if ('outputColorSpace' in renderer) renderer.outputColorSpace = THREE.SRGBColorSpace;
else renderer.outputEncoding = THREE.sRGBEncoding;
if (THREE.ColorManagement) THREE.ColorManagement.enabled = true;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.05, 60);

/* --- 环境：亮图只给金属做反射，暗图作为整体环境光，避免洗掉阴影 --- */
const ENV = (function env() {
  const w = 1024, h = 512, cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const g = cv.getContext('2d');
  const lg = g.createLinearGradient(0, 0, 0, h);
  lg.addColorStop(0.00, '#ffffff');
  lg.addColorStop(0.34, '#e6eef4');
  lg.addColorStop(0.48, '#c4d0da');
  lg.addColorStop(0.52, '#70787e');
  lg.addColorStop(0.74, '#4c4a44');
  lg.addColorStop(1.00, '#34332f');
  g.fillStyle = lg; g.fillRect(0, 0, w, h);
  [[290, 105, 210, 'rgba(255,255,255,1)'],
   [780, 75, 150, 'rgba(255,250,240,.85)'],
   [520, 200, 240, 'rgba(236,246,255,.30)']].forEach(([x, y, r, c]) => {
    const rg = g.createRadialGradient(x, y, 4, x, y, r);
    rg.addColorStop(0, c); rg.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = rg; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  });

  const cv2 = document.createElement('canvas'); cv2.width = w; cv2.height = h;
  const g2 = cv2.getContext('2d');
  g2.fillStyle = '#000'; g2.fillRect(0, 0, w, h);
  g2.globalAlpha = 0.20; g2.drawImage(cv, 0, 0);

  const pm = new THREE.PMREMGenerator(renderer);
  pm.compileEquirectangularShader();
  function bake(c) {
    const t = new THREE.CanvasTexture(c);
    t.mapping = THREE.EquirectangularReflectionMapping;
    if ('colorSpace' in t) t.colorSpace = THREE.SRGBColorSpace; else t.encoding = THREE.sRGBEncoding;
    const r = pm.fromEquirectangular(t).texture;
    t.dispose();
    return r;
  }
  const bright = bake(cv), dim = bake(cv2);
  pm.dispose();
  scene.environment = dim;
  return { bright, dim };
})();

/* --- 灯光：主光强、环境弱，保证落影清晰 --- */
scene.add(new THREE.HemisphereLight(0xe8f2fa, 0x6a665c, 0.33));

const key = new THREE.DirectionalLight(0xfff3e2, 2.9);
key.position.set(-1.75, 3.85, 2.35);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
const sc = key.shadow.camera;
sc.left = -1.9; sc.right = 1.9; sc.top = 2.4; sc.bottom = -1.2; sc.near = 1.1; sc.far = 9.5;
sc.updateProjectionMatrix();
key.shadow.bias = -0.0006;
key.shadow.normalBias = 0.010;
key.shadow.radius = 2.2;
scene.add(key);
const kt = new THREE.Object3D(); kt.position.set(-0.05, 0.75, -0.05); scene.add(kt); key.target = kt;

const fill = new THREE.DirectionalLight(0xd3e4f6, 0.9); fill.position.set(3.2, 1.6, 1.9); scene.add(fill);
const rim  = new THREE.DirectionalLight(0xffffff, 0.55); rim.position.set(-1.6, 2.2, -3.4); scene.add(rim);

/* ==================================================================
   1. 程序纹理
   ================================================================== */
function noiseTex(size, base, amp, rep) {
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  const g = cv.getContext('2d'), img = g.createImageData(size, size);
  for (let i = 0; i < size * size; i++) {
    const v = base + (Math.random() - 0.5) * amp;
    img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v;
    img.data[i * 4 + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep, rep);
  return t;
}

function woodTex() {
  const w = 1024, h = 1024, cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const g = cv.getContext('2d');
  g.fillStyle = '#a8835a'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 3200; i++) {
    const x = Math.random() * w, y = Math.random() * h, r = 4 + Math.random() * 48;
    g.fillStyle = `rgba(${128 + Math.random() * 46},${96 + Math.random() * 34},${62 + Math.random() * 26},${0.03 + Math.random() * 0.05})`;
    g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
  for (let i = 0; i < 560; i++) {
    const y0 = Math.random() * h;
    g.beginPath(); g.moveTo(0, y0);
    for (let x = 0; x <= w; x += 22) {
      g.lineTo(x, y0 + Math.sin(x * 0.0055 + i * 1.7) * (4 + Math.random() * 10) + (Math.random() - 0.5) * 1.4);
    }
    g.strokeStyle = `rgba(${54 + Math.random() * 46},${34 + Math.random() * 26},${20 + Math.random() * 16},${0.05 + Math.random() * 0.15})`;
    g.lineWidth = 0.6 + Math.random() * 3.0;
    g.stroke();
  }
  for (let p = 1; p < 5; p++) {
    g.fillStyle = 'rgba(32,19,9,.42)'; g.fillRect(0, p * h / 5 - 1.7, w, 3.4);
    g.fillStyle = 'rgba(255,240,214,.13)'; g.fillRect(0, p * h / 5 + 1.7, w, 2.2);
  }
  const t = new THREE.CanvasTexture(cv);
  if ('colorSpace' in t) t.colorSpace = THREE.SRGBColorSpace; else t.encoding = THREE.sRGBEncoding;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

function dotTex() {
  const s = 64, cv = document.createElement('canvas'); cv.width = cv.height = s;
  const g = cv.getContext('2d');
  const rg = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  rg.addColorStop(0.00, 'rgba(255,255,255,1)');
  rg.addColorStop(0.40, 'rgba(255,255,255,.95)');
  rg.addColorStop(0.78, 'rgba(255,255,255,.20)');
  rg.addColorStop(1.00, 'rgba(255,255,255,0)');
  g.fillStyle = rg; g.fillRect(0, 0, s, s);
  const t = new THREE.CanvasTexture(cv);
  if ('colorSpace' in t) t.colorSpace = THREE.SRGBColorSpace; else t.encoding = THREE.sRGBEncoding;
  return t;
}

function aoTex() {
  const s = 256, cv = document.createElement('canvas'); cv.width = cv.height = s;
  const g = cv.getContext('2d');
  const rg = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  rg.addColorStop(0.00, 'rgba(0,0,0,.60)');
  rg.addColorStop(0.42, 'rgba(0,0,0,.32)');
  rg.addColorStop(0.72, 'rgba(0,0,0,.09)');
  rg.addColorStop(1.00, 'rgba(0,0,0,0)');
  g.fillStyle = rg; g.fillRect(0, 0, s, s);
  const t = new THREE.CanvasTexture(cv);
  if ('colorSpace' in t) t.colorSpace = THREE.SRGBColorSpace; else t.encoding = THREE.sRGBEncoding;
  return t;
}

const ROUGH = noiseTex(256, 152, 92, 6);

/* ==================================================================
   2. 材质
   ================================================================== */
/* 水流表面纹理：竖直明暗条纹 + 细碎噪点 */
const STREAM_TEX = (function () {
  const cv = document.createElement('canvas'); cv.width = 128; cv.height = 256;
  const g = cv.getContext('2d');
  const lg = g.createLinearGradient(0, 0, 0, 256);
  lg.addColorStop(0.00, '#4c9dbb');
  lg.addColorStop(0.09, '#9fdcea');
  lg.addColorStop(0.20, '#6cbcd6');
  lg.addColorStop(0.30, '#cdeff8');
  lg.addColorStop(0.36, '#79c4dd');
  lg.addColorStop(0.52, '#4493b2');
  lg.addColorStop(0.66, '#8ed5e7');
  lg.addColorStop(0.78, '#5fadc8');
  lg.addColorStop(0.88, '#d8f4fb');
  lg.addColorStop(0.93, '#74c0da');
  lg.addColorStop(1.00, '#4c9dbb');
  g.fillStyle = lg; g.fillRect(0, 0, 128, 256);
  for (let i = 0; i < 260; i++) {
    g.fillStyle = 'rgba(236,252,255,' + (Math.random() * 0.20).toFixed(3) + ')';
    g.fillRect(Math.random() * 128, Math.random() * 256, 4 + Math.random() * 22, 1);
  }
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(1, 1);
  if ('colorSpace' in t) t.colorSpace = THREE.SRGBColorSpace; else t.encoding = THREE.sRGBEncoding;
  return t;
})();

const M = {
  iron: new THREE.MeshPhysicalMaterial({
    color: 0x4d6058, metalness: 0.32, roughness: 0.42,
    roughnessMap: ROUGH, clearcoat: 0.40, clearcoatRoughness: 0.42,
    bumpMap: ROUGH, bumpScale: 0.0035,
    envMap: ENV.bright, envMapIntensity: 0.85
  }),
  iron2: new THREE.MeshPhysicalMaterial({
    color: 0x2f3a34, metalness: 0.36, roughness: 0.52,
    roughnessMap: ROUGH, clearcoat: 0.28, clearcoatRoughness: 0.58,
    bumpMap: ROUGH, bumpScale: 0.005,
    envMap: ENV.bright, envMapIntensity: 0.70
  }),
  steel: new THREE.MeshStandardMaterial({
    color: 0xb8c1c8, metalness: 0.95, roughness: 0.26,
    roughnessMap: ROUGH, envMap: ENV.bright, envMapIntensity: 1.15
  }),
  steelDim: new THREE.MeshStandardMaterial({
    color: 0x7d878e, metalness: 0.85, roughness: 0.42,
    roughnessMap: ROUGH, envMap: ENV.bright, envMapIntensity: 0.75
  }),
  brass: new THREE.MeshStandardMaterial({
    color: 0xb98a45, metalness: 0.96, roughness: 0.26,
    roughnessMap: ROUGH, envMap: ENV.bright, envMapIntensity: 1.2
  }),
  leather: new THREE.MeshStandardMaterial({ color: 0x5c4430, metalness: 0.03, roughness: 0.88, envMapIntensity: 0.5 }),
  rubber: new THREE.MeshStandardMaterial({ color: 0x23262b, metalness: 0.05, roughness: 0.94, envMapIntensity: 0.4 }),
  hole: new THREE.MeshStandardMaterial({ color: 0x080c0f, metalness: 0.2, roughness: 0.92, envMapIntensity: 0.2 }),

  glass: new THREE.MeshPhysicalMaterial({
    color: 0xeaf6fb, metalness: 0.0, roughness: 0.030,
    transparent: true, opacity: 0.09, side: THREE.DoubleSide,
    envMap: ENV.bright, envMapIntensity: 0.42, clearcoat: 1, clearcoatRoughness: 0.02,
    depthWrite: false, ior: 1.48, reflectivity: 0.6
  }),
  water: new THREE.MeshPhysicalMaterial({
    color: 0x6ab8d0, metalness: 0.0, roughness: 0.11,
    transparent: true, opacity: 0.60, side: THREE.FrontSide,
    envMap: ENV.bright, envMapIntensity: 0.55,
    clearcoat: 1.0, clearcoatRoughness: 0.06, depthWrite: false
  }),
  waterTank: new THREE.MeshPhysicalMaterial({
    color: 0x63b4cd, metalness: 0.0, roughness: 0.07,
    transparent: true, opacity: 0.62, side: THREE.FrontSide,
    envMap: ENV.bright, envMapIntensity: 0.55,
    clearcoat: 1.0, clearcoatRoughness: 0.04, depthWrite: false
  }),
  waterColumn: new THREE.MeshPhysicalMaterial({
    color: 0x4fa6c6, metalness: 0.0, roughness: 0.09,
    transparent: true, opacity: 0.74, side: THREE.FrontSide,
    envMap: ENV.bright, envMapIntensity: 0.45,
    clearcoat: 1.0, clearcoatRoughness: 0.05, depthWrite: false
  }),
  waterSurf: new THREE.MeshPhysicalMaterial({
    color: 0x2d94b6, metalness: 0.0, roughness: 0.026,
    transparent: true, opacity: 0.88, side: THREE.DoubleSide,
    envMap: ENV.bright, envMapIntensity: 1.30, clearcoat: 1.0, clearcoatRoughness: 0.02,
    depthWrite: false
  }),
  waterSurfBucket: new THREE.MeshPhysicalMaterial({
    color: 0x36a0bd, metalness: 0.0, roughness: 0.028,
    transparent: true, opacity: 0.84, side: THREE.DoubleSide,
    envMap: ENV.bright, envMapIntensity: 0.90,
    clearcoat: 1.0, clearcoatRoughness: 0.02,
    depthWrite: false
  }),
  streamCore: new THREE.MeshStandardMaterial({
    color: 0xffffff, map: STREAM_TEX, metalness: 0.0, roughness: 0.10,
    transparent: true, opacity: 0.82, side: THREE.DoubleSide,
    envMap: ENV.bright, envMapIntensity: 0.75, depthWrite: false
  }),
  streamSheath: new THREE.MeshBasicMaterial({
    color: 0xa8e0f0, transparent: true, opacity: 0.13,
    depthWrite: false, side: THREE.DoubleSide
  })
};

/* 阀瓣：皮革底 + 黄铜面，开启时染上醒目的青/琥珀色发光 */
const valveFaceB = new THREE.MeshStandardMaterial({
  color: 0xb98a45, metalness: 0.85, roughness: 0.30, roughnessMap: ROUGH,
  envMap: ENV.bright, envMapIntensity: 1.1, emissive: 0x1f9fd6, emissiveIntensity: 0
});
const valveFaceA = new THREE.MeshStandardMaterial({
  color: 0xb98a45, metalness: 0.85, roughness: 0.30, roughnessMap: ROUGH,
  envMap: ENV.bright, envMapIntensity: 1.1, emissive: 0xe08a2c, emissiveIntensity: 0
});
const valveHaloMat = c => new THREE.MeshBasicMaterial({
  color: c, transparent: true, opacity: 0, depthWrite: false, side: THREE.DoubleSide
});

const woodMat = new THREE.MeshStandardMaterial({
  map: woodTex(), metalness: 0.0, roughness: 0.64, envMapIntensity: 0.45
});

/* ==================================================================
   3. 工具
   ================================================================== */
function mesh(geo, mat, parent, x, y, z) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x || 0, y || 0, z || 0);
  m.castShadow = true; m.receiveShadow = true;
  (parent || scene).add(m);
  return m;
}

/* 沿曲线生成可变半径的管（用于水流：下落加速、截面收细） */
function tubeVR(curve, rf, seg, rad) {
  const fr = curve.computeFrenetFrames(seg, false);
  const pos = [], nor = [], uvs = [], idx = [];
  for (let i = 0; i <= seg; i++) {
    const t = i / seg, p = curve.getPointAt(t);
    const N = fr.normals[i], B = fr.binormals[i], r = rf(t);
    for (let j = 0; j <= rad; j++) {
      const a = j / rad * Math.PI * 2, cx = Math.cos(a), sy = Math.sin(a);
      const nx = N.x * cx + B.x * sy, ny = N.y * cx + B.y * sy, nz = N.z * cx + B.z * sy;
      pos.push(p.x + r * nx, p.y + r * ny, p.z + r * nz);
      nor.push(nx, ny, nz);
      uvs.push(t, j / rad);
    }
  }
  for (let i = 0; i < seg; i++) for (let j = 0; j < rad; j++) {
    const a = i * (rad + 1) + j, b = a + rad + 1;
    idx.push(a, b, a + 1, b, b + 1, a + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(idx);
  return g;
}

let aoT = null;
function aoBlob(sx, sz, x, z, op) {
  if (!aoT) aoT = aoTex();
  const m = new THREE.Mesh(new THREE.PlaneGeometry(sx, sz), new THREE.MeshBasicMaterial({
    map: aoT, transparent: true, depthWrite: false, opacity: op === undefined ? 1 : op
  }));
  m.rotation.x = -Math.PI / 2;
  m.position.set(x, 0.0028, z);
  m.renderOrder = 1;
  scene.add(m);
  return m;
}

/* 菲涅尔边缘光：掠射角高光，让玻璃/水体有真实的边缘反光 */
const FRES = new THREE.ShaderMaterial({
  uniforms: {
    uColor: { value: new THREE.Color(0xd6f2ff) },
    uStr: { value: 0.28 },
    uPow: { value: 2.4 }
  },
  vertexShader: [
    'varying vec3 vN; varying vec3 vV;',
    'void main(){',
    '  vec4 wp = modelMatrix * vec4(position,1.0);',
    '  vN = normalize(mat3(modelMatrix) * normal);',
    '  vV = normalize(cameraPosition - wp.xyz);',
    '  gl_Position = projectionMatrix * viewMatrix * wp;',
    '}'
  ].join('\n'),
  fragmentShader: [
    'uniform vec3 uColor; uniform float uStr; uniform float uPow;',
    'varying vec3 vN; varying vec3 vV;',
    'void main(){',
    '  float f = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), uPow);',
    '  gl_FragColor = vec4(uColor, f * uStr);',
    '}'
  ].join('\n'),
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  side: THREE.DoubleSide
});
function fresnelShell(geo, parent, x, y, z, s) {
  const m = new THREE.Mesh(geo, FRES);
  m.position.set(x || 0, y || 0, z || 0);
  if (s) m.scale.set(s[0], s[1], s[2]);
  m.renderOrder = 7;
  parent.add(m);
  return m;
}

const orbit = { theta: 0.640, phi: 1.286, radius: 3.92, target: new THREE.Vector3(0.010, 0.880, 0.010) };
function applyCamera() {
  const sp = Math.sin(orbit.phi), cp = Math.cos(orbit.phi);
  camera.position.set(
    orbit.target.x + orbit.radius * sp * Math.sin(orbit.theta),
    orbit.target.y + orbit.radius * cp,
    orbit.target.z + orbit.radius * sp * Math.cos(orbit.theta)
  );
  camera.lookAt(orbit.target);
  camera.updateMatrixWorld();
}
applyCamera();

let orbitDrag = false, lx = 0, ly = 0;
let handlePointer = null;
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
function overHandle(e) {
  ndc.x = (e.clientX / innerWidth) * 2 - 1;
  ndc.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(ndc, camera);
  return raycaster.intersectObject(lever, true).length > 0;
}
// 满行程时手柄末端的世界竖直跨度：末端 y = pivot.y + armHandle·sin(θ)，sin(θ)=amp·s/armPin
const HANDLE_TRAVEL = 2 * P.armHandle * P.amp / P.armPin;
// 在当前相机下，把这段世界长度投影成屏幕像素，作为"拖多少像素走完全程"
function pixelsForHandleTravel() {
  const a = pump.localToWorld(new THREE.Vector3(P.pivot.x, P.pivot.y, 0)).project(camera);
  const b = pump.localToWorld(new THREE.Vector3(P.pivot.x, P.pivot.y + HANDLE_TRAVEL, 0)).project(camera);
  return Math.max(120, Math.abs((b.y - a.y) * 0.5 * innerHeight));
}
let dragPixels = 0;
canvas.addEventListener('pointerdown', e => {
  if (!frozen && overHandle(e)) {
    handlePointer = e.pointerId;
    dragging = true;
    hasDragged = true;
    dragStartY = e.clientY;
    dragStartU = u;
    dragDir = 0; dragHeat = 0;
    dragPixels = pixelsForHandleTravel();
    canvas.style.cursor = 'grabbing';
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    return;
  }
  orbitDrag = true; lx = e.clientX; ly = e.clientY; canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (handlePointer === e.pointerId && dragging) {
    const dy = e.clientY - dragStartY;           // 向下拖为正 → 下压 u 增大
    const next = THREE.MathUtils.clamp(dragStartU + dy / dragPixels, 0, 1);
    if (Math.abs(next - u) > 0.0005) {           // 拖下→dir=-1(下压), 拖上→dir=+1(上提)
      dragDir = next > u ? -1 : 1;
      dragHeat = 1;
    }
    u = next;
    return;
  }
  if (!orbitDrag) { canvas.style.cursor = overHandle(e) ? 'pointer' : 'grab'; return; }
  orbit.theta -= (e.clientX - lx) * 0.0052;
  orbit.phi = Math.min(1.54, Math.max(0.46, orbit.phi - (e.clientY - ly) * 0.0042));
  lx = e.clientX; ly = e.clientY; applyCamera();
});
function releaseHandle() {
  if (handlePointer !== null) {
    handlePointer = null; dragging = false;
    dragDir = 0; dragHeat = 0;              // 清掉拖动余温，避免回弹瞬间两阀同开
    canvas.style.cursor = 'grab';
  }
}
canvas.addEventListener('pointerup', e => {
  releaseHandle();
  orbitDrag = false; try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
});
canvas.addEventListener('pointercancel', () => { releaseHandle(); orbitDrag = false; });
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  orbit.radius = Math.min(7.5, Math.max(1.9, orbit.radius * (1 + Math.sign(e.deltaY) * 0.055)));
  applyCamera();
}, { passive: false });

/* ==================================================================
   11. 运动 / 流体
   ================================================================== */
// 手柄行程 u：0(抬起/活塞最高) → 1(按下/活塞最低)
// 主交互：抓住手柄直接拖动，u 实时跟手；松手后弹簧复位回弹到 0。
const PUMP_LAMBDA = 4.2;
let u = 0, uVel = 0, pressing = false, slow = false;
let dragging = false, dragStartY = 0, dragStartU = 0, hasDragged = false;
let dragDir = 0, dragHeat = 0;              // 拖动方向与余温：慢拉时也能持续开阀
let strokes = 0, wasDown = false;           // 完整往复计数
let openA = 0, openB = 0, flowOut = 0, lastState = '';
let frozen = false, frozenU = 0, frozenDir = 0;
let lastFrameU = 0;                        // 上一帧的 u，跨帧算速度（拖拽时 u 在帧间由鼠标改）
const stateTxt = document.getElementById('stateTxt'), dotEl = document.getElementById('dot');
const strokeFill = document.getElementById('strokeFill'), countTxt = document.getElementById('countTxt');
const damp = (c, t, l, dt) => c + (t - c) * (1 - Math.exp(-l * dt));

function step(dt) {
  if (frozen) {
    u = frozenU;
  } else if (dragging) {
    // u 由 pointermove 直接设定，跟手；此处不再阻尼推进
  } else {
    // 松手 / 未抓取：弹簧复位回弹到抬起位；按住按钮则自动下压（备用操作）
    const targetU = pressing ? 1 : 0;
    u = damp(u, targetU, PUMP_LAMBDA * (slow ? 0.42 : 1) * (pressing ? 1 : 1.35), dt);
  }
  // 用上一帧的 u 算速度：拖拽时 u 在帧间被 pointermove 修改，也能正确捕捉
  uVel = dt > 0 ? (u - lastFrameU) / dt : 0;   // 正=下压, 负=回弹上提
  lastFrameU = u;

  // 完整一次往复计数：下压到底(u>0.92)后再复位到顶(u<0.08)记一次
  if (!frozen) {
    if (u > 0.92) wasDown = true;
    if (wasDown && u < 0.08) { wasDown = false; strokes++; countTxt.textContent = strokes + ' 次'; }
  }

  // 把行程映射回原相位驱动所需的 sin/cos 分量
  // 上提(c>0) B 开+出水；下压(c<0) A 开。运动方向定阀门开闭，速度只调强度。
  dragHeat = Math.max(0, dragHeat - dt * 3.2);           // 拖动余温缓慢衰减
  const s = 1 - 2 * u;
  let moveDir = 0;
  if (Math.abs(uVel) > 0.02) moveDir = uVel > 0 ? -1 : 1;  // 帧间速度方向
  else if (dragHeat > 0.05 && dragDir !== 0) moveDir = dragDir; // 慢拉停顿间保持方向
  const mag = moveDir !== 0 ? THREE.MathUtils.clamp(0.68 + Math.abs(uVel) * 0.2 + dragHeat * 0.2, 0.68, 1) : 0;
  const dirMag = moveDir * mag;                            // 下压<0→A开, 上提>0→B开+出水
  const c = frozen ? frozenDir : dirMag;
  const yP = P.yPistonC + P.amp * s;

  piston.position.y = yP;

  const th = Math.asin(THREE.MathUtils.clamp(P.amp * s / P.armPin, -1, 1));
  lever.rotation.z = th;

  const pinW = new THREE.Vector3(P.armPin * Math.cos(th), P.armPin * Math.sin(th), 0).add(P.pivot);
  const base = new THREE.Vector3(0, yP + 0.052, 0);
  const dir = new THREE.Vector3().subVectors(pinW, base);
  const len = dir.length();
  rod.position.copy(base);
  rod.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  rod.scale.set(1, len, 1);

  openB = damp(openB, THREE.MathUtils.clamp(c * 2.2, 0, 1), 17, dt);
  openA = damp(openA, THREE.MathUtils.clamp(-c * 2.2, 0, 1), 17, dt);
  // 加大开合角度，让阀瓣动作一眼可见
  flapB.rotation.z = -openB * 1.12;
  flapA.rotation.z = openA * 1.26;
  // 阀瓣染色发光 + 指示环，开得越大越亮
  valveFaceB.emissiveIntensity = openB * 0.95;
  valveFaceA.emissiveIntensity = openA * 0.95;
  haloB.material.opacity = openB * 0.9;
  haloA.material.opacity = openA * 0.9;
  haloB.scale.setScalar(1 + openB * 0.10);
  haloA.scale.setScalar(1 + openA * 0.10);
  // 标签高亮：开启的阀显示醒目底色
  lbB.classList.toggle('open', openB > 0.35);
  lbA.classList.toggle('open', openA > 0.35);

  const yFloor = P.yValveB + 0.006;
  const hB = Math.max(0.004, (yP - 0.034) - yFloor);
  waterBelow.position.y = yFloor + hB / 2;
  waterBelow.scale.set(1, hB, 1);

  const yLevel = P.ySpout - 0.062;
  const yTop = yP + 0.034;
  const hA = Math.max(0.004, yLevel - yTop);
  waterAbove.position.y = yTop + hA / 2;
  waterAbove.scale.set(1, hA, 1);

  flowOut = damp(flowOut, Math.max(0, c), 10, dt);
  STREAM_TEX.offset.x = (STREAM_TEX.offset.x - dt * 1.8) % 1;
  streamGrp.position.x = mouth.x + (Math.sin(tt * 7.3) * 0.0032 + Math.sin(tt * 17.1) * 0.0012) * flowOut;
  streamGrp.position.z = mouth.z + Math.cos(tt * 6.1) * 0.0026 * flowOut;
  streamGrp.visible = flowOut > 0.012;
  const ss = 0.68 + 0.32 * flowOut;
  streamGrp.scale.set(ss, 1, ss);
  M.streamCore.opacity = 0.42 + flowOut * 0.42;
  M.streamSheath.opacity = 0.06 + flowOut * 0.14;

  const ripT = (tt * 1.45) % 1;
  for (let i = 0; i < RIP.length; i++) {
    const r = RIP[i], f = (ripT + r.ph) % 1, sc = 0.030 + 0.105 * f;
    r.m.scale.set(sc, sc, 1);
    r.m.material.opacity = flowOut * 0.85 * (1 - f) * (1 - f);
    r.m.visible = flowOut > 0.02;
  }
  foam.material.opacity = flowOut * 0.78;
  foam.visible = flowOut > 0.02;

  const intake = Math.max(0, c);
  pipeFlow.material.opacity = 0.06 + intake * 0.85;
  vaFlow.material.opacity = Math.max(0, -c) * 0.85;
  drops.material.opacity = 0.04 + flowOut * 0.55;

  const pa = pipeFlow.geometry.attributes.position.array;
  const vPipe = 0.16 + intake * 0.55;
  const _pp = new THREE.Vector3(), _pt = new THREE.Vector3();
  for (let i = 0; i < N_PIPE; i++) {
    const p = pipePts[i];
    p.f += vPipe * p.sp * dt;
    if (p.f > 1) { p.f -= 1; p.a = Math.random() * 6.283; p.r = 0.004 + Math.random() * 0.017; }
    pipeCurve.getPointAt(p.f, _pp);
    pipeCurve.getTangentAt(p.f, _pt);
    // 管内截面：平面法线 + z 向
    const nx = _pt.y, ny = -_pt.x, ca = Math.cos(p.a), sa = Math.sin(p.a);
    pa[i * 3] = _pp.x + nx * ca * p.r;
    pa[i * 3 + 1] = _pp.y + ny * ca * p.r;
    pa[i * 3 + 2] = _pp.z + sa * p.r;
  }
  pipeFlow.geometry.attributes.position.needsUpdate = true;

  const aa = vaFlow.geometry.attributes.position.array;
  for (let i = 0; i < N_VA; i++) {
    const p = vaPts[i];
    p.f += dt * p.sp * (0.35 + Math.max(0, -c) * 2.4);
    if (p.f > 1) { p.f -= 1; p.a = Math.random() * 6.283; p.r = Math.random() * 0.034; }
    aa[i * 3] = Math.cos(p.a) * p.r;
    aa[i * 3 + 1] = THREE.MathUtils.lerp(yP - 0.045, yP + 0.130, p.f);
    aa[i * 3 + 2] = Math.sin(p.a) * p.r;
  }
  vaFlow.geometry.attributes.position.needsUpdate = true;

  const da = drops.geometry.attributes.position.array;
  const live = flowOut > 0.05;
  for (let i = 0; i < N_DROP; i++) {
    const p = dropPts[i];
    p.vy -= 9.8 * dt;
    p.y += p.vy * dt; p.x += p.vx * dt; p.z += p.vz * dt;
    if (p.y < BW + 0.012 || !live) {
      p.x = mouth.x + (Math.random() - 0.5) * 0.028;
      p.z = mouth.z + (Math.random() - 0.5) * 0.028;
      p.y = streamTop - Math.random() * 0.045;
      p.vy = -(0.6 + Math.random() * 0.5);
      p.vx = (Math.random() - 0.5) * 0.02;
      p.vz = (Math.random() - 0.5) * 0.02;
    }
    da[i * 3] = p.x; da[i * 3 + 1] = p.y; da[i * 3 + 2] = p.z;
  }
  drops.geometry.attributes.position.needsUpdate = true;

  const sa = splash.geometry.attributes.position.array;
  splash.material.opacity = flowOut * 1.0;
  for (let i = 0; i < N_SPL; i++) {
    const o = splPts[i];
    o.vy -= 9.8 * dt;
    o.x += o.vx * dt; o.y += o.vy * dt; o.z += o.vz * dt;
    if (o.y < IMP.y - 0.004 || flowOut < 0.05) respawnSpl(o, false);
    sa[i * 3] = o.x; sa[i * 3 + 1] = o.y; sa[i * 3 + 2] = o.z;
  }
  splash.geometry.attributes.position.needsUpdate = true;

  const atRest = !dragging && !pressing && u < 0.012;
  const isMoving = frozen ? true : (Math.abs(uVel) > 0.02 && !atRest);
  const st = !isMoving ? 'idle' : (c > 0 ? 'up' : 'down');
  if (st !== lastState) {
    lastState = st;
    if (st === 'up') {
      stateTxt.innerHTML = '<b>提起活塞</b> · <span class="k">底阀 B 开</span>　活塞阀 A 闭 · 大气压将水压入筒内，活塞上方的水由出水管流出';
      dotEl.style.background = '#3f9dc4'; dotEl.style.boxShadow = '0 0 0 3px rgba(63,157,196,.16)';
    } else if (st === 'down') {
      stateTxt.innerHTML = '<b>压下活塞</b> · <span class="k">活塞阀 A 开</span>　底阀 B 闭 · 活塞下方的水经阀 A 进入上方';
      dotEl.style.background = '#cf8b3c'; dotEl.style.boxShadow = '0 0 0 3px rgba(207,139,60,.16)';
    } else {
      stateTxt.innerHTML = '<b>静止</b> · 向下拖动泵柄，松手自动复位';
      dotEl.style.background = '#8ea2ad'; dotEl.style.boxShadow = '0 0 0 3px rgba(142,162,173,.16)';
    }
  }
  strokeFill.style.width = (u * 100).toFixed(0) + '%';

  place(lbA, pump.localToWorld(new THREE.Vector3(-0.058, yP + 0.026, 0)), -86, -20);
  place(lbB, pump.localToWorld(new THREE.Vector3(0.058, P.yValveB + 0.004, 0)), 82, 16);
  place(lbPiston, pump.localToWorld(new THREE.Vector3(-0.0935, yP - 0.004, 0)), 100, 34);
  place(lbSpout, pump.localToWorld(new THREE.Vector3(0.238, 1.312, -0.044)), 26, -54);
  place(lbPipe, pump.localToWorld(new THREE.Vector3(-0.212, 0.548, 0.000)), -66, -26);
  // 手柄拖动提示：抓过一次后淡出。放在手柄杆中段并向下偏移，避免贴到画面顶沿
  const handleTip = lever.localToWorld(new THREE.Vector3(0.30, 0, 0));
  place(lbGrab, handleTip, -8, 34);
  if (hasDragged) lbGrab.style.opacity = 0;
}

/* ---- 水面 ---- */
const sPos = surfGeo.attributes.position;
function waves(t) {
  for (let i = 0; i < sPos.count; i++) {
    const x = surfBase[i * 3], y = surfBase[i * 3 + 1];
    const h = Math.sin(x * 30 + t * 1.8) * 0.45 + Math.sin(y * 24 - t * 1.4) * 0.4 +
              Math.sin((x + y) * 42 + t * 2.6) * 0.28 + Math.sin((x - y) * 58 - t * 3.1) * 0.14;
    sPos.setZ(i, h * 0.00085);
  }
  sPos.needsUpdate = true;
  surfGeo.computeVertexNormals();
}

/* ==================================================================
   12. UI
   ================================================================== */
const bS = document.getElementById('btnSlow'), bL = document.getElementById('btnLabel');
const bPump = document.getElementById('btnPump');
bS.onclick = () => { slow = !slow; bS.textContent = slow ? '常速' : '慢速'; bS.classList.toggle('off', slow); };
bL.onclick = () => {
  const on = labelsEl.style.display === 'none';
  labelsEl.style.display = on ? '' : 'none';
  bL.classList.toggle('off', !on);
};

// 备用操作：按住按钮 / 空格 自动下压（主操作是直接拖动手柄）
function setPress(v) {
  if (frozen) return;
  pressing = v;
  if (v) hasDragged = true;
  bPump.classList.toggle('held', v);
  bPump.textContent = v ? '下压中…' : '按住下压';
}
bPump.addEventListener('pointerdown', e => { e.preventDefault(); setPress(true); try { bPump.setPointerCapture(e.pointerId); } catch (_) {} });
['pointerup', 'pointercancel', 'pointerleave'].forEach(t => bPump.addEventListener(t, () => setPress(false)));
addEventListener('keydown', e => { if (e.code === 'Space' && !e.repeat) { e.preventDefault(); setPress(true); } });
addEventListener('keyup', e => { if (e.code === 'Space') { e.preventDefault(); setPress(false); } });
addEventListener('blur', () => setPress(false));

/* ==================================================================
   13. 循环
   ================================================================== */
// 调试：?p=<0..1 行程> &dir=down|up 冻结；默认自动演示（未传参时轻微自动起伏）
const q = new URLSearchParams(location.search);
let autoDemo = false;
if (q.has('p')) {
  frozenU = THREE.MathUtils.clamp(parseFloat(q.get('p')) || 0, 0, 1);
  frozenDir = q.get('dir') === 'down' ? -1 : (q.get('dir') === 'up' ? 1 : 0);
  frozen = true;
  u = frozenU;
}
// 测试探针（仅供自动化验证读取内部状态）
if (q.has('probe')) {
  window.__pump = {
    get u() { return u; },
    get dragging() { return dragging; },
    get openA() { return openA; },
    get openB() { return openB; },
    get strokes() { return strokes; },
    get state() { return lastState; },
    handlePos() {
      const w = lever.localToWorld(new THREE.Vector3(P.armHandle, 0, 0)).project(camera);
      return { x: (w.x * 0.5 + 0.5) * innerWidth, y: (-w.y * 0.5 + 0.5) * innerHeight };
    }
  };
}

let prev = performance.now(), tt = 0, fc = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.max(0, Math.min(0.05, (now - prev) / 1000)); prev = now; tt += dt;
  step(dt);
  if ((++fc & 1) === 0) waves(tt);
  renderer.render(scene, camera);
}
requestAnimationFrame(loop);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  applyCamera();
  renderer.setSize(innerWidth, innerHeight);
});

})();
</script>
