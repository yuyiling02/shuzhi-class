<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>探究杠杆的平衡条件 · 3D 实验</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #dde3e8; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
  canvas { display: block; }

  .panel {
    position: fixed;
    z-index: 8;
    background: rgba(255,255,255,.84);
    backdrop-filter: blur(14px) saturate(1.2);
    -webkit-backdrop-filter: blur(14px) saturate(1.2);
    border: 1px solid rgba(255,255,255,.92);
    border-radius: 14px;
    box-shadow: 0 8px 28px rgba(38,52,64,.16), inset 0 1px 0 rgba(255,255,255,.8);
    color: #263441;
  }

  #info { top: 18px; left: 18px; padding: 13px 17px 11px; min-width: 300px; }
  #info h1 { margin: 0 0 7px; font-size: 14px; letter-spacing: .05em; font-weight: 650; }
  #legend { font-size: 11px; color: #637585; line-height: 1.75; margin-bottom: 9px; }
  #legend b { font-weight: 650; }
  .o { color: #bf443c; } .f1 { color: #d1793c; } .f2 { color: #3f78ab; }
  #info .row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; line-height: 1.85; font-variant-numeric: tabular-nums; }
  .tag { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 6px; font-size: 11px; color: #fff; font-weight: 650; flex: none; }
  .tag.f1 { background: #d1793c; } .tag.f2 { background: #3f78ab; }
  #eq { margin-top: 7px; padding-top: 7px; border-top: 1px solid rgba(80,100,120,.14); font-size: 12.5px; font-variant-numeric: tabular-nums; }

  /* 五要素标注覆盖层：投影到屏幕的 HTML 标签，自动避让不重叠 */
  #labelLayer { position: fixed; inset: 0; pointer-events: none; z-index: 6; }
  .elabel {
    position: absolute; left: 0; top: 0;
    padding: 3px 8px; border-radius: 7px;
    background: rgba(255,255,255,.95);
    border: 1px solid; box-shadow: 0 2px 7px rgba(30,50,65,.15);
    font-size: 12px; font-weight: 650; white-space: nowrap;
    transform: translate(-50%, -50%);
    will-change: transform;
  }
  .elabel.o  { color: #bf443c; border-color: #bf443c; }
  .elabel.f1 { color: #b5652f; border-color: #d1793c; }
  .elabel.f2 { color: #2c6a9c; border-color: #3f78ab; }
  #leadLayer { position: fixed; inset: 0; pointer-events: none; z-index: 5; }

  #bar { bottom: 18px; left: 50%; transform: translateX(-50%); padding: 8px; display: flex; gap: 6px; align-items: center; white-space: nowrap; }
  #bar .sep { width: 1px; height: 24px; background: rgba(80,100,120,.2); margin: 0 3px; }
  button {
    appearance: none; border: 1px solid rgba(70,95,115,.2); background: #fff; color: #30414f;
    font: inherit; font-size: 12px; padding: 7px 11px; border-radius: 9px; cursor: pointer;
    transition: background .15s, transform .08s, box-shadow .15s;
  }
  button:hover { background: #f1f6f9; box-shadow: 0 2px 8px rgba(40,60,80,.12); }
  button:active { transform: translateY(1px); }
  button.on { background: #2f6f9e; border-color: #2f6f9e; color: #fff; }
  button.mode.on { background: #b4683a; border-color: #b4683a; }

  #hint { position: fixed; bottom: 21px; right: 18px; font-size: 11px; color: #6d7e8c; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 13px; color: #6b7c8a; background: #dde3e8; z-index: 10; transition: opacity .4s; }
</style>
</head>
<body>
<div id="loading">正在装配实验器材…</div>

<div class="panel" id="info">
  <h1>探究杠杆的平衡条件</h1>
  <div id="legend">
    <b class="o">O</b> 支点　<b class="f1">F₁</b> 动力　<b class="f1">L₁</b> 动力臂<br />
    <b class="f2">F₂</b> 阻力　<b class="f2">L₂</b> 阻力臂
  </div>
  <div class="row"><span class="tag f1">动</span><span id="driveTxt">—</span></div>
  <div class="row"><span class="tag f2">阻</span><span id="resistTxt">—</span></div>
  <div id="eq">—</div>
</div>

<svg id="leadLayer"></svg>
<div id="labelLayer"></div>

<div class="panel" id="bar">
  <button class="mode on" data-act="modeWeight">挂钩码</button>
  <button class="mode" data-act="modePivot">移支点</button>
  <span class="sep"></span>
  <button data-act="clear">清空</button>
  <button data-act="lock">释放杠杆</button>
  <button data-act="reset">复位</button>
  <button class="on" data-act="labels">五要素标注</button>
</div>

<div id="hint">点孔加码 · 点码减码 · 拖动整串换孔 · 切「移支点」点孔设支点 · 空白处拖动转视角</div>

<script type="importmap">
{
  "imports": {
    "three": "/visual-classroom/vendor/three/0.160.0/build/three.module.js",
    "three/addons/": "/visual-classroom/vendor/three/0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ============ 渲染器 / 场景 / 相机 ============ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdde3e8);
scene.fog = new THREE.Fog(0xdde3e8, 28, 70);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 200);
camera.position.set(7.8, 5.8, 11.4);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3.05, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 6;
controls.maxDistance = 32;
controls.minPolarAngle = 0.18;
controls.maxPolarAngle = Math.PI * 0.49;

/* ============ 灯光 ============ */
scene.add(new THREE.HemisphereLight(0xffffff, 0x98a6b2, 0.85));
const key = new THREE.DirectionalLight(0xfff5e6, 2.15);
key.position.set(6, 13, 9);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -12; key.shadow.camera.right = 12;
key.shadow.camera.top = 12; key.shadow.camera.bottom = -12;
key.shadow.camera.near = 1; key.shadow.camera.far = 45;
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02; key.shadow.radius = 2.5;
scene.add(key);
const fill = new THREE.DirectionalLight(0xcfe2ff, 0.55);
fill.position.set(-9, 6, -7);
scene.add(fill);

/* ============ 材质 ============ */
const MAT = {
  base:   new THREE.MeshStandardMaterial({ color: 0x3c4a4d, metalness: 0.62, roughness: 0.42 }),
  post:   new THREE.MeshStandardMaterial({ color: 0xbcc6cd, metalness: 0.82, roughness: 0.3 }),
  beam:   new THREE.MeshStandardMaterial({ color: 0xc6d0d6, metalness: 0.86, roughness: 0.26 }),
  dark:   new THREE.MeshStandardMaterial({ color: 0x222a30, metalness: 0.45, roughness: 0.55 }),
  brass:  new THREE.MeshStandardMaterial({ color: 0xb4914c, metalness: 0.85, roughness: 0.3 }),
  weight: new THREE.MeshPhysicalMaterial({ color: 0xd9e0e5, metalness: 0.78, roughness: 0.28, clearcoat: 0.4, clearcoatRoughness: 0.22 }),
  rubber: new THREE.MeshStandardMaterial({ color: 0x1e2428, metalness: 0.05, roughness: 0.9 }),
  red:    new THREE.MeshStandardMaterial({ color: 0xd4513c, metalness: 0.15, roughness: 0.45, side: THREE.DoubleSide }),
  drive:  new THREE.MeshBasicMaterial({ color: 0xd1793c }),
  resist: new THREE.MeshBasicMaterial({ color: 0x3f78ab }),
  driveLine: new THREE.MeshBasicMaterial({ color: 0xd1793c, transparent: true, opacity: 0.9 }),
  resistLine: new THREE.MeshBasicMaterial({ color: 0x3f78ab, transparent: true, opacity: 0.9 }),
};

/* ============ 实验台面 ============ */
function benchTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const x = c.getContext('2d');
  x.fillStyle = '#d8dde1'; x.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 8000; i++) {
    const v = 195 + Math.random() * 45;
    x.fillStyle = `rgba(${v|0},${(v+2)|0},${(v+4)|0},.16)`;
    x.fillRect(Math.random()*512, Math.random()*512, 1.6, 1.6);
  }
  x.strokeStyle = 'rgba(110,125,138,.16)'; x.lineWidth = 2;
  x.strokeRect(1, 1, 510, 510);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(9, 9);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
const table = new THREE.Mesh(new THREE.PlaneGeometry(70, 70),
  new THREE.MeshStandardMaterial({ map: benchTexture(), roughness: 0.94, metalness: 0 }));
table.rotation.x = -Math.PI / 2;
table.receiveShadow = true;
scene.add(table);

/* ============ 支架（世界固定，支点位于 x=0） ============ */
const PIVOT_Y = 3.4;
const SPACING = 1.0;               // 每格 10 cm
const G_EACH = 0.05 * 9.8;         // 每钩码重力 0.49 N

const base = new THREE.Mesh(new RoundedBoxGeometry(3.5, 0.42, 2.35, 4, 0.12), MAT.base);
base.position.set(0, 0.21, 0);
base.castShadow = base.receiveShadow = true;
scene.add(base);
for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
  const foot = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.15, 0.12, 24), MAT.rubber);
  foot.position.set(sx * 1.36, 0.06, sz * 0.86); foot.castShadow = true; scene.add(foot);
}
const post = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.21, PIVOT_Y - 0.4, 32), MAT.post);
post.position.set(0, 0.42 + (PIVOT_Y - 0.4) / 2, 0);
post.castShadow = post.receiveShadow = true;
scene.add(post);
for (const z of [-0.29, 0.29]) {
  const plate = new THREE.Mesh(new RoundedBoxGeometry(0.58, 0.92, 0.1, 3, 0.05), MAT.base);
  plate.position.set(0, PIVOT_Y - 0.06, z); plate.castShadow = true; scene.add(plate);
}
const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.072, 0.072, 0.98, 24), MAT.brass);
pin.rotation.x = Math.PI / 2; pin.position.set(0, PIVOT_Y, 0); pin.castShadow = true; scene.add(pin);

// 固定刻度板（随支架，不随杠杆）
const scalePlate = new THREE.Mesh(new RoundedBoxGeometry(0.95, 0.1, 0.035, 2, 0.02), MAT.dark);
scalePlate.position.set(0, PIVOT_Y - 0.44, 0.215); scene.add(scalePlate);
for (const dx of [-0.32, 0, 0.32]) {
  const tick = new THREE.Mesh(new THREE.BoxGeometry(0.018, 0.055, 0.012),
    new THREE.MeshStandardMaterial({ color: 0xe8edf0, roughness: 0.7 }));
  tick.position.set(dx, PIVOT_Y - 0.44, 0.24); scene.add(tick);
}

/* ============ 杠杆 ============ */
// lever：绕支点的旋转组；leverBody：随支点在杠杆上的选择而平移
const lever = new THREE.Group();
lever.position.set(0, PIVOT_Y, 0);
scene.add(lever);
const leverBody = new THREE.Group();
lever.add(leverBody);

let supportArm = 0;   // 支点所在的孔位编号（-5 … 5）
function applySupport() { leverBody.position.x = -supportArm * SPACING; }

const beam = new THREE.Mesh(new RoundedBoxGeometry(11, 0.18, 0.34, 4, 0.06), MAT.beam);
beam.castShadow = beam.receiveShadow = true;
leverBody.add(beam);
function holeMark(x) {
  const g = new THREE.Group();
  const disc = new THREE.Mesh(new THREE.CircleGeometry(0.072, 24), MAT.dark);
  disc.rotation.x = -Math.PI / 2; disc.position.set(x, 0.0935, 0);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(0.072, 0.011, 8, 24), MAT.dark);
  rim.rotation.x = -Math.PI / 2; rim.position.set(x, 0.095, 0);
  g.add(disc, rim); leverBody.add(g);
}
for (let i = -5; i <= 5; i++) holeMark(i * SPACING);
for (const s of [-1, 1]) {
  const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.95, 18), MAT.post);
  rod.rotation.z = Math.PI / 2; rod.position.set(s * 5.55, 0, 0); rod.castShadow = true; leverBody.add(rod);
  for (const d of [5.45, 5.85]) {
    const nut = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.2, 6), MAT.brass);
    nut.rotation.z = Math.PI / 2; nut.position.set(s * d, 0, 0); nut.castShadow = true; leverBody.add(nut);
  }
}
// 指针固定在支点处（随杠杆转动，但不随杠杆平移）
const shape = new THREE.Shape();
shape.moveTo(-0.055, 0); shape.lineTo(0.055, 0); shape.lineTo(0, -0.3);
const pointer = new THREE.Mesh(new THREE.ShapeGeometry(shape), MAT.red);
pointer.position.set(0, -0.1, 0.185);
lever.add(pointer);

/* ============ 钩码 ============ */
let weights = [], weightBodies = [], nextId = 1;
function createWeight(arm) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.19, 0.205, 0.34, 28), MAT.weight);
  body.castShadow = body.receiveShadow = true; g.add(body);
  const cap1 = new THREE.Mesh(new THREE.CylinderGeometry(0.208, 0.208, 0.045, 28), MAT.post);
  cap1.position.y = 0.174; cap1.castShadow = true; g.add(cap1);
  const cap2 = cap1.clone(); cap2.position.y = -0.174; g.add(cap2);
  const loopA = new THREE.Mesh(new THREE.TorusGeometry(0.105, 0.032, 10, 26), MAT.post);
  loopA.position.y = 0.285; loopA.castShadow = true; g.add(loopA);
  const loopB = loopA.clone(); loopB.rotation.y = Math.PI / 2; g.add(loopB);
  const knob = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.06, 0.1, 16), MAT.post);
  knob.position.y = -0.235; g.add(knob);
  scene.add(g);
  const w = { id: nextId++, arm, level: 0, group: g, body };
  body.userData.owner = w;
  return w;
}
function reindex() {
  const byArm = {};
  weights.forEach(w => { (byArm[w.arm] ||= []).push(w); });
  for (const k in byArm) byArm[k].sort((a,b) => a.id - b.id).forEach((w,i) => w.level = i);
}
function refreshBodies() { weightBodies = weights.map(w => w.body); }
function addWeight(arm) {
  const n = weights.filter(w => w.arm === arm).length;
  if (n >= 5 || arm === supportArm) return;
  weights.push(createWeight(arm));
  reindex(); refreshBodies(); rebuildAnnotations(); updateHUD();
}
function removeOne(arm) {
  const list = weights.filter(w => w.arm === arm).sort((a,b) => b.level - a.level);
  if (!list.length) return;
  scene.remove(list[0].group);
  weights = weights.filter(w => w !== list[0]);
  reindex(); refreshBodies(); rebuildAnnotations(); updateHUD();
}
function clearWeights() {
  weights.forEach(w => scene.remove(w.group));
  weights = []; refreshBodies(); rebuildAnnotations(); updateHUD();
}
function setSupport(arm) {
  supportArm = arm;
  applySupport();
  // 支点上不放钩码：把该处钩码移到相邻空孔
  const onPivot = weights.filter(w => w.arm === arm);
  if (onPivot.length) {
    const dest = arm <= 0 ? Math.max(-5, arm - 1) : Math.min(5, arm + 1);
    onPivot.forEach(w => w.arm = dest);
  }
  reindex(); rebuildAnnotations(); updateHUD();
}

/* ============ 五要素标注与力矢量 ============ */
const annoRoot = new THREE.Group();
scene.add(annoRoot);
let showLabels = true, annotations = [];

// 标注用 HTML 叠加层，按 3D 锚点投影定位；自动避让，互不遮挡
const labelLayer = document.getElementById('labelLayer');
const leadLayer = document.getElementById('leadLayer');
const SVGNS = 'http://www.w3.org/2000/svg';
const LABEL_DEFS = [
  { key: 'O',  text: 'O 支点',    cls: 'o'  },
  { key: 'F1', text: 'F₁ 动力',   cls: 'f1' },
  { key: 'L1', text: 'L₁ 动力臂', cls: 'f1' },
  { key: 'F2', text: 'F₂ 阻力',   cls: 'f2' },
  { key: 'L2', text: 'L₂ 阻力臂', cls: 'f2' },
];
const labelEls = {};
for (const def of LABEL_DEFS) {
  const div = document.createElement('div');
  div.className = 'elabel ' + def.cls;
  div.textContent = def.text;
  div.style.display = 'none';
  labelLayer.appendChild(div);
  const line = document.createElementNS(SVGNS, 'line');
  line.setAttribute('stroke', def.cls === 'o' ? '#bf443c' : def.cls === 'f1' ? '#d1793c' : '#3f78ab');
  line.setAttribute('stroke-width', '1.2');
  line.setAttribute('stroke-dasharray', '3 3');
  line.setAttribute('opacity', '.7');
  line.style.display = 'none';
  leadLayer.appendChild(line);
  labelEls[def.key] = { div, line };
}

function rebuildAnnotations() {
  while (annoRoot.children.length) annoRoot.remove(annoRoot.children[0]);
  annotations = [];
  for (const drive of [true, false]) {
    const list = weights.filter(w => drive ? w.arm < supportArm : w.arm > supportArm);
    if (!list.length) continue;
    const colorMat = drive ? MAT.drive : MAT.resist;
    const lineMat = drive ? MAT.driveLine : MAT.resistLine;
    const g = new THREE.Group();
    // 合力：竖直向下，长度随合力大小
    const len = 0.26 + Math.min(list.length, 5) * 0.1;
    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, len, 12), colorMat);
    shaft.position.y = -len / 2;
    const cone = new THREE.Mesh(new THREE.ConeGeometry(0.058, 0.14, 14), colorMat);
    cone.rotation.z = Math.PI; cone.position.y = -len - 0.07;
    // 力臂：支点到竖直作用线的水平距离（水平线段 + 两端垂线表示垂直）
    const lineH = new THREE.Mesh(new THREE.BoxGeometry(1, 0.018, 0.018), lineMat);
    const capA = new THREE.Mesh(new THREE.BoxGeometry(0.018, 0.14, 0.018), lineMat);
    const capB = new THREE.Mesh(new THREE.BoxGeometry(0.018, 0.14, 0.018), lineMat);
    g.add(shaft, cone, lineH, capA, capB);
    annoRoot.add(g);
    annotations.push({ drive, group: g, shaft, cone, len, lineH, capA, capB });
  }
  annoRoot.visible = showLabels;
}

const _proj = new THREE.Vector3();
function updateAnnotations() {
  const cos = Math.cos(angle), sin = Math.sin(angle);
  const yLine = PIVOT_Y + 0.42, z = 0.5;
  const { drive, resist } = groups();
  const anchors = { O: new THREE.Vector3(0, PIVOT_Y, z) };
  for (const a of annotations) {
    const side = a.drive ? drive : resist;
    if (!side.F) continue;
    // 等效作用线的水平位置（场景单位；1 场景单位 = 0.1 m）
    const wx = (a.drive ? -1 : 1) * (side.L / 0.1);
    const localX = wx / Math.max(0.2, cos);
    const wy = PIVOT_Y + localX * sin;
    a.shaft.position.set(wx, wy - a.len / 2, z);
    a.cone.position.set(wx, wy - a.len - 0.07, z);
    a.lineH.scale.x = Math.max(0.001, Math.abs(wx));
    a.lineH.position.set(wx / 2, yLine, z);
    a.capA.position.set(0, yLine, z);
    a.capB.position.set(wx, yLine, z);
    anchors[a.drive ? 'F1' : 'F2'] = new THREE.Vector3(wx, wy - a.len * 0.55, z);
    anchors[a.drive ? 'L1' : 'L2'] = new THREE.Vector3(wx / 2, yLine, z);
  }
  positionLabels(anchors);
}

function positionLabels(anchors) {
  if (!showLabels) {
    for (const k in labelEls) { labelEls[k].div.style.display = 'none'; labelEls[k].line.style.display = 'none'; }
    return;
  }
  const items = [];
  for (const def of LABEL_DEFS) {
    const anchor = anchors[def.key], ent = labelEls[def.key];
    if (!anchor) { ent.div.style.display = 'none'; ent.line.style.display = 'none'; continue; }
    _proj.copy(anchor).project(camera);
    if (_proj.z > 1) { ent.div.style.display = 'none'; ent.line.style.display = 'none'; continue; }
    const ax = (_proj.x * 0.5 + 0.5) * innerWidth;
    const ay = (-_proj.y * 0.5 + 0.5) * innerHeight;
    const w = ent.div.offsetWidth || 76, h = ent.div.offsetHeight || 24;
    let dx = 0, dy = 0;
    if (def.key === 'O') { dx = -8; dy = -32; }
    else if (def.key === 'F1') { dx = -42; dy = 28; }
    else if (def.key === 'F2') { dx = 42; dy = 28; }
    else if (def.key === 'L1') { dx = -24; dy = -28; }
    else { dx = 24; dy = -28; }
    items.push({ ent, ax, ay, w, h, x: ax + dx, y: ay + dy });
  }
  const clamp = it => {
    it.x = Math.max(it.w/2 + 6, Math.min(innerWidth - it.w/2 - 6, it.x));
    it.y = Math.max(it.h/2 + 6, Math.min(innerHeight - it.h/2 - 6, it.y));
  };
  const infoRect = document.getElementById('info').getBoundingClientRect();
  const barRect = document.getElementById('bar').getBoundingClientRect();
  const avoid = (it, r, dir) => {
    const cx = r.left + r.width/2, cy = r.top + r.height/2;
    if (Math.abs(it.x - cx) < (it.w + r.width)/2 + 8 && Math.abs(it.y - cy) < (it.h + r.height)/2 + 6) {
      it.y = dir < 0 ? r.top - it.h/2 - 8 : r.bottom + it.h/2 + 8;
    }
  };
  items.forEach(clamp);
  for (let pass = 0; pass < 8; pass++) {
    let moved = false;
    items.forEach(it => { avoid(it, infoRect, 1); avoid(it, barRect, -1); clamp(it); });
    for (let i = 0; i < items.length; i++) for (let j = i + 1; j < items.length; j++) {
      const a = items[i], b = items[j];
      const ox = (a.w + b.w)/2 + 8 - Math.abs(a.x - b.x);
      const oy = (a.h + b.h)/2 + 6 - Math.abs(a.y - b.y);
      if (ox > 0 && oy > 0) {
        if (a.y <= b.y) b.y += oy; else a.y += oy;
        moved = true;
      }
    }
    items.forEach(clamp);
    if (!moved) break;
  }
  for (const it of items) {
    it.ent.div.style.display = '';
    it.ent.div.style.left = it.x + 'px';
    it.ent.div.style.top = it.y + 'px';
    it.ent.line.style.display = '';
    const cx = Math.max(-it.w/2, Math.min(it.w/2, it.ax - it.x));
    const cy = Math.max(-it.h/2, Math.min(it.h/2, it.ay - it.y));
    it.ent.line.setAttribute('x1', it.ax);
    it.ent.line.setAttribute('y1', it.ay);
    it.ent.line.setAttribute('x2', it.x + cx);
    it.ent.line.setAttribute('y2', it.y + cy);
  }
}

/* ============ 物理 ============ */
const BEAM_I = 0.12 * 11 * 11 / 12;
let angle = 0, omega = 0, locked = false, prevLocked = false;
const MAX_ANGLE = 0.26;            // 机械限位 ±15°

function stepPhysics(dtReal) {
  const dt = Math.min(dtReal, 0.05) * 3;
  let torque = 0, inertia = BEAM_I;
  const cos = Math.cos(angle);
  for (const w of weights) {
    const localX = (w.arm - supportArm) * SPACING;
    torque += -localX * cos * G_EACH;       // 向下力对支点的力矩
    inertia += 0.05 * localX * localX;
  }
  if (locked) {
    angle += (0 - angle) * Math.min(1, dt * 9); omega = 0;
  } else {
    const accel = (torque - 0.5 * angle) / inertia;
    omega += accel * dt;
    omega *= Math.exp(-0.8 * dt);
    angle += omega * dt;
    if (angle > MAX_ANGLE)  { angle = MAX_ANGLE;  omega = Math.min(0, omega) * 0.15; }
    if (angle < -MAX_ANGLE) { angle = -MAX_ANGLE; omega = Math.max(0, omega) * 0.15; }
  }
  lever.rotation.z = angle;
}

/* ============ 读数 ============ */
const $ = id => document.getElementById(id);
function groups() {
  const cos = Math.cos(angle);
  const drive = { F: 0, M: 0 }, resist = { F: 0, M: 0 };
  const byArm = {};
  weights.forEach(w => { byArm[w.arm] = (byArm[w.arm] || 0) + 1; });
  for (const k in byArm) {
    const arm = +k, n = byArm[k];
    const wx = (arm - supportArm) * SPACING * cos;
    const F = n * G_EACH;
    const M = F * Math.abs(wx) * 0.1;      // N·m（力臂取水平距离）
    const g = arm < supportArm ? drive : arm > supportArm ? resist : (wx < 0 ? drive : resist);
    g.F += F; g.M += M;
  }
  drive.L = drive.F ? drive.M / drive.F : 0;
  resist.L = resist.F ? resist.M / resist.F : 0;
  return { drive, resist };
}
function updateHUD() {
  const { drive, resist } = groups();
  $('driveTxt').textContent = `F₁=${drive.F.toFixed(2)} N　L₁=${drive.L.toFixed(2)} m`;
  $('resistTxt').textContent = `F₂=${resist.F.toFixed(2)} N　L₂=${resist.L.toFixed(2)} m`;
  $('eq').textContent = `F₁L₁ = ${drive.M.toFixed(3)} N·m　｜　F₂L₂ = ${resist.M.toFixed(3)} N·m`;
}

/* ============ 交互 ============ */
let mode = 'weight';                  // 'weight' | 'pivot'
$('bar').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  switch (b.dataset.act) {
    case 'modeWeight':
    case 'modePivot': {
      mode = b.dataset.act === 'modePivot' ? 'pivot' : 'weight';
      $('bar').querySelector('[data-act="modeWeight"]').classList.toggle('on', mode === 'weight');
      $('bar').querySelector('[data-act="modePivot"]').classList.toggle('on', mode === 'pivot');
      break;
    }
    case 'clear': clearWeights(); break;
    case 'lock':
      locked = !locked;
      b.textContent = locked ? '锁定杠杆' : '释放杠杆';
      b.classList.toggle('on', locked);
      break;
    case 'reset':
      clearWeights();
      supportArm = 0; applySupport();
      addWeight(-3); addWeight(-3); addWeight(2); addWeight(2); addWeight(2);
      angle = 0; omega = 0; locked = false;
      $('bar').querySelector('[data-act="lock"]').textContent = '释放杠杆';
      $('bar').querySelector('[data-act="lock"]').classList.remove('on');
      break;
    case 'labels':
      showLabels = !showLabels;
      annoRoot.visible = showLabels;
      if (!showLabels) for (const k in labelEls) {
        labelEls[k].div.style.display = 'none'; labelEls[k].line.style.display = 'none';
      }
      b.classList.toggle('on', showLabels);
      break;
  }
});

const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
const hitPoint = new THREE.Vector3();
let drag = null;                      // { startX, arm, moved }

function setNDC(e) {
  ndc.x = (e.clientX / innerWidth) * 2 - 1;
  ndc.y = -(e.clientY / innerHeight) * 2 + 1;
}
function pickArm() {
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObject(beam, false);
  if (!hits.length) return null;
  const local = leverBody.worldToLocal(hits[0].point.clone());
  return THREE.MathUtils.clamp(Math.round(local.x / SPACING), -5, 5);
}
// 悬停高亮
const hoverRing = new THREE.Mesh(new THREE.TorusGeometry(0.14, 0.022, 8, 24),
  new THREE.MeshBasicMaterial({ color: 0x2f8fbf, transparent: true, opacity: 0.9, depthTest: false }));
hoverRing.rotation.x = -Math.PI / 2; hoverRing.renderOrder = 998;
hoverRing.visible = false; scene.add(hoverRing);

renderer.domElement.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  setNDC(e); raycaster.setFromCamera(ndc, camera);
  const wh = raycaster.intersectObjects(weightBodies, false);
  if (wh.length) {
    const arm = wh[0].object.userData.owner.arm;
    drag = { startX: e.clientX, arm, moved: false };
    prevLocked = locked; locked = true;
    controls.enabled = false;
    renderer.domElement.setPointerCapture(e.pointerId);
    return;
  }
  const arm = pickArm();
  if (arm === null) return;
  if (mode === 'pivot') setSupport(arm);
  else addWeight(arm);
});
renderer.domElement.addEventListener('pointermove', e => {
  setNDC(e);
  if (drag) {
    if (Math.abs(e.clientX - drag.startX) > 5) drag.moved = true;
    if (drag.moved) {
      raycaster.setFromCamera(ndc, camera);
      if (raycaster.ray.intersectPlane(dragPlane, hitPoint)) {
        const local = leverBody.worldToLocal(hitPoint.clone());
        const idx = THREE.MathUtils.clamp(Math.round(local.x / SPACING), -5, 5);
        if (idx !== drag.arm && idx !== supportArm &&
            weights.filter(w => w.arm === idx).length < 5) {
          weights.filter(w => w.arm === drag.arm).forEach(w => w.arm = idx);
          drag.arm = idx;
          reindex(); rebuildAnnotations(); updateHUD();
        }
      }
    }
    return;
  }
  // 悬停反馈
  raycaster.setFromCamera(ndc, camera);
  const overWeight = raycaster.intersectObjects(weightBodies, false).length > 0;
  const arm = overWeight ? null : pickArm();
  if (arm !== null) {
    const cos = Math.cos(angle), sin = Math.sin(angle);
    const localX = (arm - supportArm) * SPACING;
    hoverRing.position.set(localX * cos, PIVOT_Y + localX * sin + 0.11, 0);
    hoverRing.visible = true;
    renderer.domElement.style.cursor = mode === 'pivot' ? 'crosshair' : 'copy';
  } else {
    hoverRing.visible = false;
    renderer.domElement.style.cursor = overWeight ? 'grab' : 'auto';
  }
});
function endDrag(e) {
  if (!drag) return;
  if (!drag.moved && mode === 'weight') removeOne(drag.arm);   // 单击钩码 = 减一个
  if (!drag.moved && mode === 'pivot') setSupport(drag.arm);
  drag = null;
  locked = prevLocked;
  controls.enabled = true;
  hoverRing.visible = false;
  renderer.domElement.style.cursor = 'auto';
  try { renderer.domElement.releasePointerCapture(e.pointerId); } catch (_) {}
}
renderer.domElement.addEventListener('pointerup', endDrag);
renderer.domElement.addEventListener('pointercancel', endDrag);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ============ 初始：支点在中孔，2×3 = 3×2 ============ */
supportArm = 0; applySupport();
addWeight(-3); addWeight(-3);
addWeight(2); addWeight(2); addWeight(2);
updateHUD();

const clock = new THREE.Clock();
let frame = 0;
function animate() {
  requestAnimationFrame(animate);
  stepPhysics(clock.getDelta());
  const cos = Math.cos(angle), sin = Math.sin(angle);
  const sway = THREE.MathUtils.clamp(-omega * 0.09, -0.1, 0.1);
  for (const w of weights) {
    const localX = (w.arm - supportArm) * SPACING;
    w.group.position.set(localX * cos + sway * (1 + w.level * 0.25),
      PIVOT_Y + localX * sin - 0.44 - w.level * 0.55, 0);
    w.group.rotation.z = sway * 0.3;
  }
  updateAnnotations();
  controls.update();
  renderer.render(scene, camera);
}
animate();

const loading = $('loading');
loading.style.opacity = '0';
setTimeout(() => loading.remove(), 450);
</script>
