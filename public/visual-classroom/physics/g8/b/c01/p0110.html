<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>弹簧弹力与伸长量的关系 · 3D 实验台</title>
<style>
  *{box-sizing:border-box;-webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;background:#aeb6bd;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
  #scene{display:block;width:100%;height:100%;touch-action:none;cursor:default}
  .panel{position:absolute;background:rgba(255,255,255,.80);backdrop-filter:blur(16px) saturate(1.4);
    -webkit-backdrop-filter:blur(16px) saturate(1.4);border:1px solid rgba(255,255,255,.85);
    border-radius:14px;box-shadow:0 12px 34px rgba(18,28,38,.18),inset 0 1px 0 rgba(255,255,255,.9);
    color:#1b2026;padding:13px 15px;pointer-events:auto}

  /* 标题不单独占一块面板：直接印在背景墙上，只有文字和一层极淡的光晕 */
  #title{position:absolute;top:20px;left:24px;pointer-events:none}
  #title h1{margin:0;font-size:21px;font-weight:680;letter-spacing:.6px;line-height:1.25;
    color:rgba(25,37,49,.88);
    text-shadow:0 1px 0 rgba(255,255,255,.62),0 0 26px rgba(255,255,255,.42)}
  #title p{margin:5px 0 0;font-size:11.5px;font-weight:500;letter-spacing:1.8px;
    color:rgba(58,74,88,.60);text-shadow:0 1px 0 rgba(255,255,255,.55)}
  /* 标题旁的实时状态胶囊：随弹簧应力连续变色，超限脉动 */
  #statusChip{display:inline-flex;align-items:center;gap:7px;margin-top:10px;padding:5px 12px 5px 9px;
    border-radius:999px;background:rgba(255,255,255,.66);border:1px solid rgba(255,255,255,.9);
    box-shadow:0 4px 14px rgba(18,28,38,.12),inset 0 1px 0 #fff;
    font-size:11.5px;font-weight:600;letter-spacing:.3px;color:#33414e;
    backdrop-filter:blur(10px) saturate(1.3);-webkit-backdrop-filter:blur(10px) saturate(1.3)}
  #statusChip .dot{width:10px;height:10px;border-radius:50%;background:#17795a;
    box-shadow:0 0 0 3px rgba(23,121,90,.16),0 0 10px currentColor;color:#17795a}
  #statusChip.pulse .dot{animation:lockPulse 1.1s ease-in-out infinite}
  #statusChip.over{color:#a3241a;background:rgba(255,246,244,.82)}

  #dataPanel{top:96px;left:18px;width:252px;padding:12px 14px}
  .ptitle{display:none}
  .grid{display:grid;grid-template-columns:auto 1fr;row-gap:5px;column-gap:8px;font-size:12px;align-items:baseline}
  .grid span{color:#6b7680}
  .grid b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums;
    font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-size:12.5px;color:#16202a}
  .grid b.hi{color:#1f6fd0}
  .grid b.ok{color:#17795a}
  .grid b.warn{color:#c0392b}
  /* 超限不可恢复：醒目的脉动徽章 */
  @keyframes lockPulse{0%,100%{opacity:1}50%{opacity:.45}}
  .grid b.locked{color:#fff;background:linear-gradient(135deg,#d23b2c,#a3241a);
    padding:2px 8px;border-radius:7px;font-size:11px;letter-spacing:.3px;
    box-shadow:0 2px 8px rgba(190,50,35,.42);animation:lockPulse 1.5s ease-in-out infinite}
  /* 状态点：随应力连续变色，绿色→琥珀→红 */
  .grid b.state{display:inline-flex;align-items:center;justify-content:flex-end;gap:5px}
  .grid b.state i{width:9px;height:9px;border-radius:50%;display:inline-block;
    box-shadow:0 0 0 3px rgba(0,0,0,.04),0 0 8px currentColor}
  .grid b.state i.beat{animation:lockPulse 1.2s ease-in-out infinite}
  .sep{grid-column:1/-1;height:1px;background:rgba(30,50,70,.09);margin:3px 0 1px}

  #ctrl{bottom:18px;left:18px;width:252px;padding:12px 14px}
  .btnrow{display:flex;gap:7px}
  button{appearance:none;border:1px solid rgba(30,50,70,.14);background:linear-gradient(#fff,#f1f4f7);
    color:#1b2026;font-size:12.5px;font-weight:600;padding:8px 10px;border-radius:9px;cursor:pointer;
    font-family:inherit;transition:transform .08s,box-shadow .15s,background .15s;flex:1;white-space:nowrap;
    box-shadow:0 1px 2px rgba(20,35,50,.08),inset 0 1px 0 #fff}
  button:hover{background:linear-gradient(#fff,#e9eef3);box-shadow:0 3px 10px rgba(20,35,50,.12),inset 0 1px 0 #fff}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.4;cursor:not-allowed;transform:none}
  button.ghost{background:linear-gradient(#fbfcfd,#eef1f4);color:#4a5a68;flex:0 0 auto}
  button.demo{font-size:11.5px;padding:7px 6px;background:linear-gradient(#f2fbf7,#e2f4ec);border-color:rgba(23,121,90,.28);color:#12694e}
  button.demo:hover{background:linear-gradient(#f6fdfa,#d6efe3)}
  button.demo.over{background:linear-gradient(#fff4f2,#fde9e5);border-color:rgba(190,50,35,.28);color:#a3241a}
  button.demo.over:hover{background:linear-gradient(#fff8f6,#fbdcd6)}
  button.demo.running{box-shadow:0 0 0 2px rgba(31,111,208,.28) inset}
  .prow{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;color:#5c6874;margin:10px 0 3px}
  .prow b{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-size:11.5px;color:#1f6fd0;font-weight:600}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;cursor:pointer;margin:0}
  input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:rgba(30,60,90,.16)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5px;
    border-radius:50%;background:#fff;border:2px solid #1f6fd0;box-shadow:0 1px 3px rgba(20,40,60,.28)}
  input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(30,60,90,.16)}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid #1f6fd0}
  .hint{font-size:10.5px;color:#5c6874;line-height:1.55;margin-top:9px;padding-top:8px;border-top:1px solid rgba(30,50,70,.08)}

  /* F–x 图像直接印在背景上：没有面板、没有边框、没有标题框 */
  #graphWrap{position:absolute;right:24px;top:12px;pointer-events:none}
  #gcanvas{display:block}

  #err{position:absolute;inset:0;display:none;place-items:center;background:#eef1f4;color:#313b45;
    font-size:13px;text-align:center;padding:40px;line-height:1.8}
  @media (max-width:900px){
    #title{top:14px;left:16px}
    #title h1{font-size:16px}
    #title p{display:none}
    #dataPanel{top:58px;width:232px;padding:10px 11px}
    .grid{font-size:11px;row-gap:5px}.grid b{font-size:11.5px}
    #ctrl{width:232px;padding:10px}
    #graphWrap{display:none}
  }
</style>

<body>
<canvas id="scene"></canvas>

<div id="title">
  <h1>弹簧弹力与伸长量的关系</h1>
  <p>胡克定律　F = k·x　三维实验台</p>
  <div id="statusChip"><span class="dot"></span><span id="statusChipText">弹性形变 · 可恢复</span></div>
</div>

<div class="panel" id="dataPanel">
  <div class="grid">
    <span>钩码数量</span><b id="vN">0 个</b>
    <span>单个钩码</span><b id="vW">50 g</b>
    <span>总质量 m</span><b id="vM">30 g</b>
    <div class="sep"></div>
    <span>拉力 F</span><b id="vF" class="hi">0.00 N</b>
    <span>弹簧原长 L₀</span><b id="vL">10.0 cm</b>
    <span>指针读数</span><b id="vR">8.6 cm</b>
    <span>伸长量 x</span><b id="vX" class="hi">0.0 cm</b>
    <span>永久形变 x<sub>p</sub></span><b id="vP">0.0 cm</b>
    <div class="sep"></div>
    <span>劲度系数 k</span><b id="vK">16.0 N/m</b>
    <span>弹簧状态</span><b id="vS" class="state"><i id="vSDot"></i><span id="vST">弹性形变</span></b>

</div>

  <div class="btnrow">
    <button id="btnMinus">− 50 g</button>
    <button id="btnPlus">+ 50 g</button>
    <button id="btnReset" class="ghost">复位</button>
  </div>
  <div class="btnrow" style="margin-top:7px">
    <button id="btnDemoElastic" class="demo">▶ 演示·弹性恢复</button>
    <button id="btnDemoPlastic" class="demo over">▶ 演示·超限回不去</button>
  </div>
  <div class="prow"><span>劲度系数 k</span><b id="skVal">16.0 N/m</b></div>
  <input type="range" id="sk" min="6" max="40" step="0.5" value="16">
  <div class="prow"><span>弹簧原长 L₀</span><b id="slVal">10.0 cm</b></div>
  <input type="range" id="sl" min="7" max="16" step="0.5" value="10">
  <div class="hint">点<strong>演示</strong>自动看完整过程，或逐个挂钩码 / <strong>按住砝码往下拉</strong>。观察曲线屈服后弯折、卸载后能否回到原点。</div>
</div>

</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   0. 物理参数（SI：米 / 千克 / 秒）
   ============================================================ */
const G          = 9.8;
const MASS_W     = 0.050;        // 单个钩码 50 g
const MASS_PLATE = 0.030;        // 指针组件自重 30 g
const ZETA       = 0.055;        // 阻尼比
const F_YIELD    = 3.9;          // 弹簧材料的屈服拉力 (N) —— 约 8 个钩码处开始塑性形变
const HARDEN     = 0.6;          // 冷作硬化系数（小=屈服后明显变软，F-x 曲线出现显著弯折/塑性平台）
const MU         = 3.5;          // 塑性流动速率 (1/s)

let K  = 16.0;                   // 劲度系数 N/m（可调）
let L0 = 0.100;                  // 弹簧原长 m（可调）

const SPRING_TOP = 0.834;        // 悬挂点高度
const N_COILS    = 17;
const SPR_R      = 0.0115;       // 簧圈平均半径
const WIRE_R     = 0.00075;      // 钢丝半径

const RULER_TOP  = 0.800;
const RULER_H    = 0.550;
// 尺面两端留白：0 刻度不从尺顶起，末刻度到尺底也留一段空白，像真实量具
const RULER_PAD_TOP = 0.030;   // 顶端留白 3 cm
const RULER_MAX_CM  = 50;      // 刻度标到 50 cm，其后留白
const RULER_ZERO_Y  = RULER_TOP - RULER_PAD_TOP;   // 0 刻度对应的物理高度（读数基准）

// 钩码尺寸（50 g 钢质：V = π·0.0115²·0.016 ≈ 6.6 cm³ → ρ ≈ 7.5 g/cm³）
const W_R = 0.0115, W_H = 0.016, W_PITCH = 0.0210;

/* ============================================================
   1. 渲染器 / 场景 / 相机
   ============================================================ */
const canvas   = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type    = THREE.PCFSoftShadowMap;
renderer.toneMapping       = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.92;
renderer.outputColorSpace  = THREE.SRGBColorSpace;

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.02, 60);
camera.position.set(0.54, 0.615, 1.26);

const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 0.470, -0.010);
controls.enableDamping = true;
controls.dampingFactor = 0.075;
controls.enablePan     = false;
controls.minDistance   = 0.55;
controls.maxDistance   = 3.4;
controls.minPolarAngle = 0.35;
controls.maxPolarAngle = Math.PI * 0.505;
controls.rotateSpeed   = 0.65;
controls.zoomSpeed     = 0.75;
controls.update();

/* ---------- 环境贴图：需要有明暗对比的"摄影棚"，否则镀铬件会整片发白 ---------- */
function buildStudioEnv() {
  const s = new THREE.Scene();
  s.add(new THREE.Mesh(
    new THREE.BoxGeometry(12, 12, 12),
    new THREE.MeshBasicMaterial({ side: THREE.BackSide, color: 0x3d4348 })
  ));

  const panel = (w, h, color, gain, pos, rot) => {
    const m = new THREE.Mesh(
      new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({
        color: new THREE.Color(color).multiplyScalar(gain),
        side: THREE.DoubleSide
      })
    );
    m.position.copy(pos);
    if (rot) m.rotation.copy(rot);
    s.add(m);
  };

  panel(5.2, 5.2, 0xfff3e2, 5.5, new THREE.Vector3(0.6, 5.9, 0.4), new THREE.Euler(Math.PI / 2, 0, 0));
  panel(3.4, 6.5, 0xdae8ff, 2.0, new THREE.Vector3(-5.9, 1.6, 0.5), new THREE.Euler(0, Math.PI / 2, 0));
  panel(2.4, 5.0, 0xffffff, 1.15, new THREE.Vector3(5.9, 0.7, -0.6), new THREE.Euler(0, -Math.PI / 2, 0));
  panel(6.5, 5.0, 0xffffff, 0.62, new THREE.Vector3(0, 0.6, 5.9));
  panel(9, 9, 0x14171a, 1.0, new THREE.Vector3(0, -5.9, 0), new THREE.Euler(-Math.PI / 2, 0, 0));
  panel(0.55, 8.5, 0xffffff, 2.2, new THREE.Vector3(0.2, 1.0, -5.9));
  panel(2.4, 8.5, 0x0c0f12, 1.0, new THREE.Vector3(-2.2, 1.0, -5.85));

  return s;
}

const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
const envRT = pmrem.fromScene(buildStudioEnv(), 0.02);
scene.environment = envRT.texture;

/* ============================================================
   2. 灯光
   ============================================================ */
scene.add(new THREE.HemisphereLight(0xffffff, 0x50575d, 0.35));

const key = new THREE.DirectionalLight(0xfff4e6, 1.85);
key.position.set(0.80, 1.72, 0.95);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near   = 0.15;
key.shadow.camera.far    = 4.0;
key.shadow.camera.left   = -0.85;
key.shadow.camera.right  =  0.85;
key.shadow.camera.top    =  1.35;
key.shadow.camera.bottom = -0.35;
key.shadow.bias        = -0.0004;
key.shadow.normalBias  = 0.010;
key.shadow.radius      = 3.5;
scene.add(key);

const fill = new THREE.DirectionalLight(0xdbe8ff, 0.55);
fill.position.set(-1.25, 0.75, 0.85);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffffff, 0.85);
rim.position.set(-0.45, 1.05, -1.35);
scene.add(rim);

/* ============================================================
   3. 程序化贴图
   ============================================================ */
function noiseTexture(size, base, amp) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(size, size);
  for (let i = 0; i < size * size; i++) {
    const v = Math.max(0, Math.min(255, base + (Math.random() - 0.5) * amp));
    img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v;
    img.data[i * 4 + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(6, 6);
  return t;
}

function gradientBackdrop() {
  const c = document.createElement('canvas');
  c.width = 16; c.height = 512;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 512);
  g.addColorStop(0.00, '#f2f5f7');
  g.addColorStop(0.38, '#d3dade');
  g.addColorStop(0.72, '#aab3ba');
  g.addColorStop(1.00, '#8b959c');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 16, 512);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* ============================================================
   4. 材质
   ============================================================ */
const chromeMat = new THREE.MeshStandardMaterial({
  color: 0xdfe4e8, metalness: 1.0, roughness: 0.155, envMapIntensity: 1.15
});
const chromeSoft = new THREE.MeshStandardMaterial({
  color: 0xd2d8dd, metalness: 1.0, roughness: 0.235, envMapIntensity: 1.0
});
const ironMat = new THREE.MeshStandardMaterial({
  color: 0x2a2e33, metalness: 0.62, roughness: 0.52, envMapIntensity: 0.75
});
const needleMat = new THREE.MeshStandardMaterial({
  color: 0xb23a2c, metalness: 0.35, roughness: 0.45, envMapIntensity: 0.7
});

/* ============================================================
   5. 背景 / 台面
   ============================================================ */
const backdrop = new THREE.Mesh(
  new THREE.PlaneGeometry(16, 10),
  new THREE.MeshBasicMaterial({ map: gradientBackdrop() })
);
backdrop.position.set(0, 1.85, -2.40);
scene.add(backdrop);

const tableNoise = noiseTexture(256, 190, 46);
tableNoise.repeat.set(14, 12);
const tableMat = new THREE.MeshStandardMaterial({
  color: 0x3a4145, roughness: 0.50, metalness: 0.06,
  roughnessMap: tableNoise, envMapIntensity: 0.45
});
const table = new THREE.Mesh(new THREE.BoxGeometry(9, 0.06, 7), tableMat);
table.position.set(0, -0.0305, 0);
table.receiveShadow = true;
scene.add(table);

/* ============================================================
   6. 铁架台
   ============================================================ */
const ROD_X = -0.110;
const ROD_Z = -0.024;

function roundedRect(w, h, r) {
  const s = new THREE.Shape();
  const x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}

const baseGeo = new THREE.ExtrudeGeometry(roundedRect(0.300, 0.175, 0.018), {
  depth: 0.013, bevelEnabled: true, bevelThickness: 0.0028,
  bevelSize: 0.0028, bevelSegments: 3, curveSegments: 14
});
const base = new THREE.Mesh(baseGeo, ironMat);
base.rotation.x = -Math.PI / 2;
base.position.set(-0.062, 0.0006, ROD_Z);
base.castShadow = true;
base.receiveShadow = true;
scene.add(base);

const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.0065, 0.0065, 0.860, 32, 1), chromeMat);
rod.position.set(ROD_X, 0.0135 + 0.430, ROD_Z);
rod.castShadow = true;
scene.add(rod);

const boss = new THREE.Mesh(new THREE.CylinderGeometry(0.0125, 0.0145, 0.010, 28), chromeMat);
boss.position.set(ROD_X, 0.020, ROD_Z);
boss.castShadow = true;
scene.add(boss);

const ARM_Y = 0.845;
const clampBody = new THREE.Mesh(new THREE.BoxGeometry(0.032, 0.038, 0.034), chromeSoft);
clampBody.position.set(ROD_X, ARM_Y, ROD_Z);
clampBody.castShadow = true;
scene.add(clampBody);

const knob = new THREE.Mesh(new THREE.CylinderGeometry(0.0085, 0.0085, 0.016, 20), chromeMat);
knob.rotation.x = Math.PI / 2;
knob.position.set(ROD_X, ARM_Y, ROD_Z + 0.024);
knob.castShadow = true;
scene.add(knob);

const armLen = 0.020 - ROD_X;
const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.0052, 0.0052, armLen, 24), chromeMat);
arm.rotation.z = Math.PI / 2;
arm.position.set(ROD_X + armLen / 2, ARM_Y, ROD_Z);
arm.castShadow = true;
scene.add(arm);

const armHook = new THREE.Mesh(new THREE.TorusGeometry(0.0058, 0.00085, 10, 26), chromeMat);
armHook.position.set(0, ARM_Y - 0.0072, ROD_Z);
armHook.castShadow = true;
scene.add(armHook);

/* ============================================================
   7. 刻度尺
   ============================================================ */
function rulerTexture() {
  const W = 320, H = 3195;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');

  const bg = ctx.createLinearGradient(0, 0, W, 0);
  bg.addColorStop(0, '#e8e5d9');
  bg.addColorStop(0.45, '#f4f2e8');
  bg.addColorStop(1, '#eeebe0');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  const mg = ctx.createLinearGradient(0, 0, 150, 0);
  mg.addColorStop(0, 'rgba(150,168,178,0.30)');
  mg.addColorStop(0.35, 'rgba(215,228,234,0.55)');
  mg.addColorStop(0.7, 'rgba(255,255,255,0.75)');
  mg.addColorStop(1, 'rgba(170,186,196,0.35)');
  ctx.fillStyle = mg;
  ctx.fillRect(4, 0, 150, H);
  ctx.strokeStyle = 'rgba(60,80,95,0.28)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(154, 0); ctx.lineTo(154, H); ctx.stroke();

  const edge = ctx.createLinearGradient(W - 26, 0, W, 0);
  edge.addColorStop(0, 'rgba(90,100,105,0)');
  edge.addColorStop(1, 'rgba(90,100,105,0.18)');

  ctx.fillRect(W - 26, 0, 26, H);

  // 0 刻度从顶端留白后开始，标到 RULER_MAX_CM；两端空白让尺子不再像"截止"在边上
  const totalMM = Math.round(RULER_H * 1000);
  const topMM   = Math.round(RULER_PAD_TOP * 1000);
  const endMM   = topMM + RULER_MAX_CM * 10;
  for (let mm = topMM; mm <= endMM; mm++) {
    const fromZero = mm - topMM;            // 距 0 刻度的毫米数
    const y = mm / totalMM * H;
    let len = 11, lw = 1.5;
    if (fromZero % 10 === 0) { len = 34; lw = 3.2; }
    else if (fromZero % 5 === 0) { len = 21; lw = 2.1; }
    ctx.strokeStyle = fromZero % 10 === 0 ? 'rgba(24,30,36,0.92)' : 'rgba(40,50,58,0.72)';
    ctx.lineWidth = lw;
    ctx.beginPath();
    ctx.moveTo(W - 8, y);
    ctx.lineTo(W - 8 - len, y);
    ctx.stroke();

    if (fromZero % 10 === 0) {
      ctx.fillStyle = 'rgba(22,28,34,0.90)';
      ctx.font = '600 30px ui-sans-serif,system-ui,sans-serif';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(fromZero / 10), W - 48, y);
    }
  }
  ctx.save();
  ctx.translate(W - 104, topMM / totalMM * H - 40);
  ctx.fillStyle = 'rgba(22,28,34,0.75)';
  ctx.font = '600 26px ui-sans-serif,system-ui,sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('cm', 0, 0);
  ctx.restore();

  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

const RADIAL = 8;

const idx = [];
for (let i = 0; i < RINGS - 1; i++) {
  for (let j = 0; j < RADIAL; j++) {
    const j2 = (j + 1) % RADIAL;
    const a = i * RADIAL + j,  b = i * RADIAL + j2;
    const c = (i + 1) * RADIAL + j, d = (i + 1) * RADIAL + j2;
    idx.push(a, c, b, b, c, d);

}

const springMat = new THREE.MeshStandardMaterial({

const KK = N_COILS * Math.PI * 2;

// q: 相对原长的总伸长量；qp: 塑性残余伸长量
// pos 可传入其它 buffer —— ghost（原长虚影）复用同一套螺旋生成
function updateSpring(qTotal, qPlastic, pos = sPos) {
  const stretch = Math.max(0, qTotal / L0);
  const R = SPR_R * (1 - 0.052 * Math.min(stretch, 3));

  // 塑性形变后簧圈间距变得不均匀
  const warpAmp = Math.min(0.085, (qPlastic / Math.max(1e-6, F_YIELD / K)) * 0.085);

  for (let i = 0; i < RINGS; i++) {
    const t0 = i / (RINGS - 1);
    const t = warpAmp > 1e-5 ? t0 + warpAmp * Math.sin(2 * Math.PI * t0) : t0;
    const ang = t * KK;
    const ca = Math.cos(ang), sa = Math.sin(ang);

    const cx = ca * R, cz = sa * R;
    const y  = -t * (L0 + qTotal);

    let tx = -sa * R * KK, ty = -(L0 + qTotal), tz = ca * R * KK;
    const tl = Math.hypot(tx, ty, tz) || 1;
    tx /= tl; ty /= tl; tz /= tl;

    let nx = -tz, nz = tx;
    const nl = Math.hypot(nx, nz) || 1;
    nx /= nl; nz /= nl;

    const bx = ty * nz, by = tz * nx - tx * nz, bz = -ty * nx;

    for (let j = 0; j < RADIAL; j++) {
      const phi = j / RADIAL * Math.PI * 2;
      const c = Math.cos(phi), s = Math.sin(phi);
      const o = (i * RADIAL + j) * 3;
      pos[o]     = cx + WIRE_R * (c * nx + s * bx);
      pos[o + 1] = y  + WIRE_R * (s * by);
      pos[o + 2] = cz + WIRE_R * (c * nz + s * bz);
    }
  }
  if (pos === sPos) {
    springGeo.attributes.position.needsUpdate = true;
    springGeo.computeVertexNormals();
  }
}

/* ============================================================
   10. 物理核心
   ============================================================ */
let n  = 0;
let q  = MASS_PLATE * G / K;   // 总伸长量（相对原长）
let qp = 0;                    // 塑性残余伸长
let v  = 0;
let qRef = q;                  // x = 0 对应的 q
let mLoad = MASS_PLATE;        // 实际参与受力的质量：平滑逼近目标值（真实放砝码是轻轻放下）
let qCap = null;               // 钩码触桌后锁定的弹簧长度；null 表示未触桌
let touching = false;

let dragging = false, dragBaseQ = 0, dragStartY = 0;

const eEl = () => F_YIELD / K;                       // 弹性极限对应的伸长量
const totalMass = () => MASS_PLATE + n * MASS_W;
const eqQ = () => totalMass() * G / K;
/* 屈服应力随塑性应变升高（冷作硬化）——硬化提高的是"屈服的难易程度"，
   而不是弹性模量。钢的弹性模量在塑性变形后基本不变，所以弹性段斜率始终是 K。 */
const Fy = () => F_YIELD * (1 + HARDEN * Math.min(qp / eEl(), 4));

function contactQ() {
  return Math.max(0, SPRING_TOP - L0 - chainLen(n) - 0.022);
}

function physics(dt) {
  // 放/取砝码是"轻轻放下"：质量平滑加上去，避免阶跃引起的瞬态过冲
  // 越过弹性极限而造成伪塑性流动（真实实验也是缓慢加载后读稳定值）
  const mTarget = totalMass();
  mLoad += (mTarget - mLoad) * Math.min(1, dt * 2.5);
  if (Math.abs(mTarget - mLoad) < 1e-5) mLoad = mTarget;

  const m = mLoad;
  const c = 2 * ZETA * Math.sqrt(K * m);
  const steps = Math.min(28, Math.max(1, Math.ceil(dt / (1 / 720))));
  const h = dt / steps;
  const ee = eEl();
  // 钩码串一旦压到桌面就锁定当前长度：再多挂钩码也只会堆在台面上，
  // 弹簧不再继续伸长（也不会因为串变长而被"拉回去"）
  const room = contactQ();
  if (q >= room - 1e-5 && room < 0.7) {
    if (qCap === null) qCap = q;
  } else if (room > (qCap === null ? -1 : qCap) + 1e-6) {
    qCap = null;                       // 取下钩码后解除锁定
  }
  const qmax = qCap === null ? room : qCap;

  for (let i = 0; i < steps; i++) {
    const e = q - qp;
    // 弹性力始终用原始劲度系数 K
    const Fs = K * Math.max(0, e);
    const a = (m * G - Fs - c * v) / m;
    v += a * h;
    q += v * h;

    // 超过屈服应力 → 塑性流动（永久伸长）。流动速率与相对过应力成正比
    const fy = Fy();
    if (Fs > fy) {
      qp += MU * (Fs / fy - 1) * ee * h;
      if (qp > q) qp = q;
    }
    if (q < qp) { q = qp; if (v < 0) v = 0; }

    // 钩码落到桌面：桌面提供支持力
    if (q > qmax) { q = qmax; if (v > 0) v = 0; }
  }
  touching = qCap !== null;
}

/* ============================================================
   11. F–x 图像
   ============================================================ */
/* 轨迹用段(segment)记录：每一段是连续同方向的加载或卸载。
   这样加钩码(加载)与减钩码(卸载)会形成完整的滞回回线，
   弹性段卸载能回到原点，塑性段卸载停在永久形变处。 */
const points = new Map();   // n -> 加载点（仅用于弹性段拟合 k）
const segments = [];        // [{dir:1|-1, pts:[{x,F,level,el,qp}]}]
/* 记录策略：n 改变后固定等待 RECORD_DELAY 秒再记录一个稳定点。
   不能用"某一瞬间 |v|<ε"判定稳定——弹簧始终有微幅振荡，会导致大量点漏记，
   图像只剩几个点连成"直线"。等待固定时间后用稳态解析值记录，每个 n 必有一个点。 */
const RECORD_DELAY = 1.0;
let recordedN = -1;          // 已开始等待记录的 n
let settleTimer = 0;         // n 保持不变的累计时长
let lastRecordN = -1;        // 上一个记录点的 n，用于判定加载/卸载方向
let peakN = -1;              // 历史最大 n，用于区分"新加载"与"卸载后重新加载"
let wasLocked = false;   // 上一次是否已越过弹性限度（用于触发一次性提示）

/* 连续状态量 level ∈ (0, ~1.4)：0=无应力，1=抵达弹性极限，>1=已越过（塑性/不可恢复）。
   弹性段用应力比推进到 1；一旦出现塑性残余 qp，用 qp 相对弹性极限的比例继续推进到红色。
   整个映射是 q、qp 的连续纯函数——越过阈值即时、连续地变色，不跳变也不延迟。 */
const C_SAFE = [23, 137, 105], C_WARN = [232, 170, 38], C_OVER = [208, 52, 40];
function stateLevel() {
  const eEl = F_YIELD / K;
  const stress = (K * Math.max(0, q - qp)) / Fy();
  // 塑性一出现就迅速把颜色推进红区：用较大的系数，并让红区在 level≈1.15 即到纯红
  const plastic = Math.min(1, qp / (eEl * 0.22)) * 0.55;
  return stress + plastic;
}
function pointLevel(p) {
  if (p.level !== undefined) return p.level;
  return p.el ? 0.45 : 1.3;
}
function lerpColor(a, b, t) {
  return [0, 1, 2].map(i => Math.round(a[i] + (b[i] - a[i]) * t));
}
function colorFor(level) {
  if (level <= 0.72) return C_SAFE;
  if (level <= 1) return lerpColor(C_SAFE, C_WARN, (level - 0.72) / 0.28);
  return lerpColor(C_WARN, C_OVER, Math.min(1, (level - 1) / 0.15));
}
function stressColor(level, alpha) {
  const c = colorFor(level);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + (alpha === undefined ? 1 : alpha) + ')';
}
function stressCss(level) {
  const c = colorFor(level);
  return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
}

function recordPoint() {
  const F = n * MASS_W * G;
  // 用当前载荷的稳态伸长作为读数：x_eq = qp + mg/k − qRef。
  // 这样点落在理论稳定位置，不受弹簧微幅振荡影响，保证每个 n 都记录到正确位置。
  const x = Math.max(0, qp + totalMass() * G / K - qRef);
  const p = {
    x,
    F,
    level: Math.min(1.45, stateLevel()),
    el: qp < 5e-4,
    qp
  };

  // 判定方向：n 超过历史峰值=加载；n 低于上一个记录点=卸载；相同则沿用当前段
  const dir = n > peakN ? 1 : (n < lastRecordN ? -1
    : (segments.length ? segments[segments.length - 1].dir : 1));
  peakN = Math.max(peakN, n);
  let seg = segments[segments.length - 1];
  if (!seg || seg.dir !== dir) {
    seg = { dir, pts: [] };
    segments.push(seg);
  }
  // 同一 n 重复稳定时替换该段末点，避免堆积
  const last = seg.pts[seg.pts.length - 1];
  if (last && last.n === n) seg.pts[seg.pts.length - 1] = { n, ...p };
  else seg.pts.push({ n, ...p });
  lastRecordN = n;

  // 弹性段加载点用于拟合（覆盖更新，保持 points 语义）
  if (dir === 1 && p.el) points.set(n, p);
  else if (dir === 1) points.delete(n);
}

function fitK() {
  let sxy = 0, sxx = 0, cnt = 0;
  for (const p of points.values()) {
    if (p.el && p.x > 0.002 && p.F > 0) { sxy += p.x * p.F; sxx += p.x * p.x; cnt++; }
  }
  if (cnt < 2 || sxx < 1e-9) return null;
  return sxy / sxx;
}

/* ---------- 画布尺寸：跟着窗口长大 ---------- */
const gCanvas = document.getElementById('gcanvas');
const gctx = gCanvas.getContext('2d');
let GW = 300, GH = 220;

const PAD = { l: 46, b: 34, t: 26, r: 22 };

/* 背景不用方框：一层模糊过的淡白柔光，边缘完全化进背景里 */
const gBg = document.createElement('canvas');

function buildGraphBg() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  gBg.width  = Math.round(GW * dpr);
  gBg.height = Math.round(GH * dpr);
  const b = gBg.getContext('2d');
  b.setTransform(dpr, 0, 0, dpr, 0, 0);
  b.clearRect(0, 0, GW, GH);

  const pw = GW - PAD.l - PAD.r, ph = GH - PAD.t - PAD.b;
  b.filter = 'blur(20px)';
  const g = b.createLinearGradient(PAD.l, PAD.t, PAD.l + pw * 0.4, PAD.t + ph);
  g.addColorStop(0, 'rgba(252,253,255,0.30)');
  g.addColorStop(1, 'rgba(249,251,253,0.18)');
  b.fillStyle = g;
  b.fillRect(PAD.l - 8, PAD.t - 8, pw + 16, ph + 16);
  b.filter = 'none';

  // 再把四周的透明度淡出去，连"柔和的方框边"也不留
  const cx = PAD.l + pw / 2, cy = PAD.t + ph / 2;
  const maxR = Math.hypot(pw, ph) * 0.5;
  b.globalCompositeOperation = 'destination-in';
  const m = b.createRadialGradient(cx, cy, maxR * 0.52, cx, cy, maxR * 1.0);
  m.addColorStop(0, 'rgba(0,0,0,1)');
  m.addColorStop(1, 'rgba(0,0,0,0)');
  b.fillStyle = m;
  b.fillRect(0, 0, GW, GH);
  b.globalCompositeOperation = 'source-over';
}

function sizeGraph() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const clamp = (v, a, b) => Math.round(Math.min(b, Math.max(a, v)));
  GW = clamp(vw * 0.46, 340, 640);
  GH = clamp(vh * 0.48, 230, 430);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  gCanvas.width  = Math.round(GW * dpr);
  gCanvas.height = Math.round(GH * dpr);
  gCanvas.style.width  = GW + 'px';
  gCanvas.style.height = GH + 'px';
  gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  buildGraphBg();
}

const X_STEPS = [10, 15, 20, 30, 40, 50, 60, 80, 100, 120, 160];
const Y_STEPS = [2, 3, 4, 5, 6, 8, 10, 12, 15, 20];

function pickStep(v, steps) {
  for (const s of steps) if (v <= s) return s;
  return steps[steps.length - 1];
}

function drawGraph(liveX, liveF) {
  const w = GW, h = GH;
  const padL = PAD.l, padB = PAD.b, padT = PAD.t, padR = PAD.r;
  const pw = w - padL - padR, ph = h - padT - padB;
  const S = Math.max(1, Math.min(1.45, GW / 470));   // 字号随画布放大

  // 坐标范围随数据自动扩展（包含卸载段的点）
  let maxXcm = Math.max(6, liveX * 100 + 1), maxF = Math.max(1, liveF + 0.2);
  for (const p of points.values()) {
    maxXcm = Math.max(maxXcm, p.x * 100 + 1);
    maxF = Math.max(maxF, p.F + 0.1);
  }
  for (const seg of segments) for (const p of seg.pts) {
    maxXcm = Math.max(maxXcm, p.x * 100 + 1);
    maxF = Math.max(maxF, p.F + 0.1);
  }
  const XM = pickStep(maxXcm * 1.06, X_STEPS);
  const YM = pickStep(maxF * 1.10, Y_STEPS);
  const xStep = XM <= 20 ? 5 : (XM <= 60 ? 10 : 20);
  const yStep = YM <= 4 ? 1 : 2;

  gctx.clearRect(0, 0, w, h);
  gctx.drawImage(gBg, 0, 0, GW, GH);

  // 网格
  gctx.strokeStyle = 'rgba(40,60,85,0.13)';
  gctx.lineWidth = 1;
  for (let x = 0; x <= XM + 1e-6; x += xStep) {
    const pxx = padL + x / XM * pw;
    gctx.beginPath(); gctx.moveTo(pxx, padT); gctx.lineTo(pxx, padT + ph); gctx.stroke();
  }
  for (let y = 0; y <= YM + 1e-6; y += yStep) {
    const pyy = padT + ph - y / YM * ph;
    gctx.beginPath(); gctx.moveTo(padL, pyy); gctx.lineTo(padL + pw, pyy); gctx.stroke();
  }

  // 坐标轴
  gctx.strokeStyle = 'rgba(28,42,56,0.62)';
  gctx.lineWidth = 1.5;
  gctx.beginPath();
  gctx.moveTo(padL, padT - 4);
  gctx.lineTo(padL, padT + ph);
  gctx.lineTo(padL + pw, padT + ph);
  gctx.stroke();

  // 刻度数字
  gctx.fillStyle = 'rgba(32,46,60,0.68)';
  gctx.font = Math.round(11 * S) + 'px ui-sans-serif,system-ui,sans-serif';
  gctx.textAlign = 'center';
  gctx.textBaseline = 'top';
  for (let x = 0; x <= XM + 1e-6; x += xStep) {
    const pxx = padL + x / XM * pw;
    gctx.beginPath();
    gctx.moveTo(pxx, padT + ph); gctx.lineTo(pxx, padT + ph + 5 * S);
    gctx.strokeStyle = 'rgba(28,42,56,0.5)'; gctx.lineWidth = 1; gctx.stroke();
    gctx.fillText(x, pxx, padT + ph + 8 * S);
  }
  gctx.textAlign = 'right';
  gctx.textBaseline = 'middle';
  for (let y = 0; y <= YM + 1e-6; y += yStep) {
    const pyy = padT + ph - y / YM * ph;
    gctx.beginPath();
    gctx.moveTo(padL - 5 * S, pyy); gctx.lineTo(padL, pyy);
    gctx.strokeStyle = 'rgba(28,42,56,0.5)'; gctx.lineWidth = 1; gctx.stroke();
    gctx.fillText(y.toFixed(0), padL - 9 * S, pyy);
  }

  // 轴名
  gctx.fillStyle = 'rgba(32,46,60,0.6)';
  gctx.font = '600 ' + Math.round(11.5 * S) + 'px ui-sans-serif,system-ui,sans-serif';
  gctx.textAlign = 'left';
  gctx.textBaseline = 'bottom';
  gctx.fillText('F/N', 4, padT - 8);
  gctx.textAlign = 'right';
  gctx.textBaseline = 'bottom';
  gctx.fillText('x/cm', padL + pw - 3, padT + ph - 6);

  // 标题（淡淡的）
  gctx.fillStyle = 'rgba(32,46,60,0.36)';
  gctx.font = '600 ' + Math.round(10.5 * S) + 'px ui-sans-serif,system-ui,sans-serif';
  gctx.textAlign = 'left';
  gctx.textBaseline = 'bottom';
  gctx.fillText('F – x 图像', padL + 3, padT - 10);

  const px = (xcm) => padL + Math.min(xcm, XM) / XM * pw;
  const py = (F)   => padT + ph - Math.min(F, YM) / YM * ph;

  // 拟合直线（只取弹性段的数据点，过原点最小二乘）
  const kFit = fitK();
  if (kFit) {
    const yEnd = Math.min(YM, kFit * (XM / 100));
    gctx.strokeStyle = 'rgba(31,111,208,0.70)';
    gctx.lineWidth = 1.8;
    gctx.setLineDash([6, 4]);
    gctx.beginPath();
    gctx.moveTo(px(0), py(0));
    gctx.lineTo(px(yEnd / kFit * 100), py(yEnd));
    gctx.stroke();
    gctx.setLineDash([]);

    gctx.fillStyle = 'rgba(24,92,180,0.95)';
    gctx.font = '600 ' + Math.round(12 * S) + 'px ui-sans-serif,system-ui,sans-serif';
    gctx.textAlign = 'right';
    gctx.textBaseline = 'bottom';
    gctx.fillText('k测 ≈ ' + kFit.toFixed(1) + ' N/m', padL + pw - 3, padT - 10);
  }

  const ptAt = (p) => ({ x: px(p.x * 100), y: py(p.F) });
  const allPts = [];
  const arr = [...points.values()].sort((a, b) => a.x - b.x);   // 按 x 排序的加载点（兼容旧分支/回退/空状态判断）

  // 按"段"绘制完整轨迹：加载段实线、卸载段虚线并带方向箭头。
  // 弹性段加载是过原点的直线；屈服后弯折变缓；卸载沿 k 斜率返回，
  // 终点停在永久形变 x_p 处（弹性卸载则回到原点）——滞回回线一眼可见。
  for (const seg of segments) {
    if (seg.pts.length < 2) continue;
    const loading = seg.dir === 1;
    for (let i = 1; i < seg.pts.length; i++) {
      const p0 = seg.pts[i - 1], p1 = seg.pts[i];
      const a = ptAt(p0), b = ptAt(p1);
      const grad = gctx.createLinearGradient(a.x, a.y, b.x, b.y);
      grad.addColorStop(0, stressColor(pointLevel(p0), loading ? 0.95 : 0.7));
      grad.addColorStop(1, stressColor(pointLevel(p1), loading ? 0.95 : 0.7));
      gctx.strokeStyle = grad;
      gctx.lineWidth = (loading ? 2.8 : 2.2) * S;
      gctx.lineJoin = 'round';
      gctx.lineCap = 'round';
      if (!loading) gctx.setLineDash([5 * S, 4 * S]);
      gctx.beginPath();
      gctx.moveTo(a.x, a.y);
      gctx.lineTo(b.x, b.y);
      gctx.stroke();
      gctx.setLineDash([]);

      allPts.push(p0, p1);

      // 卸载方向箭头：画在段中点，明确"正在返回"
      if (!loading) {
        const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
        const ang = Math.atan2(b.y - a.y, b.x - a.x);
        const ah = 5 * S;
        gctx.fillStyle = stressColor(pointLevel(p1), 0.85);
        gctx.beginPath();
        gctx.moveTo(mx + Math.cos(ang) * ah, my + Math.sin(ang) * ah);
        gctx.lineTo(mx + Math.cos(ang + 2.5) * ah, my + Math.sin(ang + 2.5) * ah);
        gctx.lineTo(mx + Math.cos(ang - 2.5) * ah, my + Math.sin(ang - 2.5) * ah);
        gctx.closePath();
        gctx.fill();
      }
    }
  }

  // 若还没有分段数据，退回用拟景点画一条加载线（兼容旧状态）
  if (segments.length === 0) {
    for (let i = 1; i < arr.length; i++) {
      const a = ptAt(arr[i - 1]), b = ptAt(arr[i]);
      const grad = gctx.createLinearGradient(a.x, a.y, b.x, b.y);
      grad.addColorStop(0, stressColor(pointLevel(arr[i - 1]), 0.92));
      grad.addColorStop(1, stressColor(pointLevel(arr[i]), 0.92));
      gctx.strokeStyle = grad;
      gctx.lineWidth = 2.6 * S;
      gctx.lineJoin = 'round';
      gctx.beginPath(); gctx.moveTo(a.x, a.y); gctx.lineTo(b.x, b.y); gctx.stroke();
    }
  }

  // 实时点：颜色由当前应力比决定，随阈值连续变化，不再固定蓝色
  const liveR = stateLevel();
  if (liveF > 0.02) {
    const last = allPts.length ? allPts[allPts.length - 1] : (arr.length ? arr[arr.length - 1] : null);
    const lc = stressColor(liveR, 0.95);
    gctx.strokeStyle = stressColor(liveR, 0.4);
    gctx.lineWidth = 1.5;
    gctx.setLineDash([3, 4]);
    gctx.beginPath();
    gctx.moveTo(last ? px(last.x * 100) : px(0), last ? py(last.F) : py(0));
    gctx.lineTo(px(liveX * 100), py(liveF));
    gctx.stroke();
    gctx.setLineDash([]);

    // 外圈光晕 + 实心核，让实时点更醒目
    gctx.beginPath();
    gctx.arc(px(liveX * 100), py(liveF), 7.5 * S, 0, Math.PI * 2);
    gctx.strokeStyle = stressColor(liveR, 0.28);
    gctx.lineWidth = 3.5;
    gctx.stroke();
    gctx.beginPath();
    gctx.arc(px(liveX * 100), py(liveF), 5 * S, 0, Math.PI * 2);
    gctx.strokeStyle = lc;
    gctx.lineWidth = 2;
    gctx.stroke();
    gctx.beginPath();
    gctx.arc(px(liveX * 100), py(liveF), 2 * S, 0, Math.PI * 2);
    gctx.fillStyle = lc;
    gctx.fill();
  }

  // 实测点：加载点实心、卸载点空心，按其连续状态量着色
  for (const p of allPts) {
    const rp = pointLevel(p);
    const c = stressColor(rp, 1);
    if (rp >= 1) {
      gctx.beginPath();
      gctx.arc(px(p.x * 100), py(p.F), 7 * S, 0, Math.PI * 2);
      gctx.fillStyle = stressColor(rp, 0.2);
      gctx.fill();
    }
    gctx.beginPath();
    gctx.arc(px(p.x * 100), py(p.F), 4.2 * S, 0, Math.PI * 2);
    gctx.fillStyle = c;
    gctx.fill();
    gctx.lineWidth = 1.6;
    gctx.strokeStyle = 'rgba(255,255,255,0.95)';
    gctx.stroke();
  }

  // 永久形变：卸载到空载(F=0)却停在 x_p>0，用醒目标记 + 从原点引出的红色虚线
  let anchor = null;
  for (const p of allPts) if (p.F < 1e-6 && p.x * 100 > 0.8) {
    if (!anchor || p.x > anchor.x) anchor = p;
  }
  if (anchor && qp > 0.0012) {
    const ax = px(anchor.x * 100), ay = py(0);
    gctx.strokeStyle = 'rgba(192,57,43,0.55)';
    gctx.lineWidth = 1.4;
    gctx.setLineDash([4 * S, 3 * S]);
    gctx.beginPath(); gctx.moveTo(px(0), py(0)); gctx.lineTo(ax, ay); gctx.stroke();
    gctx.setLineDash([]);
    gctx.beginPath(); gctx.arc(ax, ay, 5.5 * S, 0, Math.PI * 2);
    gctx.strokeStyle = 'rgba(192,57,43,0.95)'; gctx.lineWidth = 2.2; gctx.stroke();
  }

  // 屈服点：加载轨迹中第一个塑性点，标记出来
  let yieldPt = null;
  for (const seg of segments) if (seg.dir === 1) {
    for (const p of seg.pts) if (!p.el) { yieldPt = p; break; }
    if (yieldPt) break;
  }
  if (yieldPt) {
    const yx = px(yieldPt.x * 100), yy = py(yieldPt.F);
    gctx.beginPath(); gctx.arc(yx, yy, 6.5 * S, 0, Math.PI * 2);
    gctx.strokeStyle = 'rgba(232,170,38,0.95)'; gctx.lineWidth = 2; gctx.stroke();
  }

  if (segments.length === 0 && arr.length === 0) {
    gctx.fillStyle = 'rgba(32,46,60,0.30)';
    gctx.font = Math.round(12 * S) + 'px ui-sans-serif,system-ui,sans-serif';
    gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
    gctx.fillText('加钩码后自动记录 F–x 数据', padL + pw / 2, padT + ph / 2);
  }
}

const vN = document.getElementById('vN');
const vW = document.getElementById('vW');
const vM = document.getElementById('vM');
const vF = document.getElementById('vF');
const vL = document.getElementById('vL');
const vR = document.getElementById('vR');
const vX = document.getElementById('vX');
const vK = document.getElementById('vK');
const vP = document.getElementById('vP');
const vS = document.getElementById('vS');
const vST = document.getElementById('vST');
const vSDot = document.getElementById('vSDot');
const statusChip = document.getElementById('statusChip');
const statusChipDot = statusChip.querySelector('.dot');
const statusChipText = document.getElementById('statusChipText');
const btnPlus  = document.getElementById('btnPlus');
const btnMinus = document.getElementById('btnMinus');
const btnReset = document.getElementById('btnReset');
const btnDemoElastic = document.getElementById('btnDemoElastic');
const btnDemoPlastic = document.getElementById('btnDemoPlastic');

const slEl = document.getElementById('sl');
const skVal = document.getElementById('skVal');
const slVal = document.getElementById('slVal');

function ensureWeights() {
  while (weights.length < n) weights.push(makeWeight(weights.length));

  // 钩码串的顶端挂在弹簧下端；若串比可用空间还长，底部就堆在台面上——
  // 这时把整串按比例压缩，读起来就是"摞起来了"
  const topY = SPRING_TOP - (L0 + q) - 0.002;
  const need = chainLen(n);
  const avail = Math.max(0.03, topY);
  const pitch = need > avail ? (avail - 0.0258) / Math.max(1, n - 1) : W_PITCH;

  for (let i = 0; i < weights.length; i++) {
    const on = i < n;
    weights[i].visible = on;
    if (on) weights[i].position.y = -0.002 - i * pitch;
  }
  const h = Math.max(0.135, chainLen(n) + 0.03);
  grab.scale.y = h;
  grab.position.y = -h / 2 - 0.004;
  btnMinus.disabled = n <= 0;
}

function updateHUD() {
  const L = L0 + q;
  const pointerY = SPRING_TOP - L + NEEDLE_DY;
  const reading = (RULER_ZERO_Y - pointerY) * 100;
  const x = (q - qRef) * 100;
  const F = n * MASS_W * G;

  vN.textContent = n + ' 个';
  vW.textContent = (MASS_W * 1000).toFixed(0) + ' g';
  vM.textContent = (totalMass() * 1000).toFixed(0) + ' g';
  vF.textContent = F.toFixed(2) + ' N';
  vL.textContent = (L0 * 100).toFixed(1) + ' cm';
  vR.textContent = reading.toFixed(1) + ' cm';
  vX.textContent = Math.max(0, x).toFixed(1) + ' cm';
  vK.textContent = K.toFixed(1) + ' N/m';
  vP.textContent = (qp * 100).toFixed(2) + ' cm';

  // 状态颜色随连续状态量平滑变化；一旦越过屈服（出现塑性残余或应力到极限）
  // 立即锁定为"不可恢复"。只改样式与文本，不重建 DOM。
  const level = stateLevel();
  const locked = qp > 0.0012 || level >= 1;
  if (locked && !wasLocked && typeof toast === 'function') {
    toast('已越过弹性限度 —— 弹簧产生永久形变，松开后也无法恢复原长');
  }
  wasLocked = locked;
  if (locked) {
    if (vS.className !== 'locked') vS.className = 'locked';
    vSDot.style.display = 'none';
    vST.style.color = '';
    if (vST.textContent !== '⚠ 不可恢复') vST.textContent = '⚠ 不可恢复';
  } else {
    if (vS.className !== 'state') vS.className = 'state';
    vSDot.style.display = '';
    const col = stressCss(level);
    vSDot.style.background = col;
    vSDot.style.color = col;
    vSDot.className = level > 0.72 ? 'beat' : '';
    vST.style.color = col;
    const txt = level > 0.72 ? '接近弹性限度' : '弹性形变';
    if (vST.textContent !== txt) vST.textContent = txt;
  }

  // 标题旁胶囊与数据面板状态保持同步
  const chipCol = stressCss(level);
  statusChipDot.style.background = chipCol;
  statusChipDot.style.color = chipCol;
  const chipTxt = locked ? '⚠ 不可恢复 · 永久形变'
    : (level > 0.72 ? '接近弹性限度 · 注意' : '弹性形变 · 可恢复');
  if (statusChipText.textContent !== chipTxt) statusChipText.textContent = chipTxt;
  statusChip.className = locked ? 'over pulse' : (level > 0.72 ? 'pulse' : '');
}

function resetSpring(newK, newL0) {
  if (newK !== undefined) K = newK;
  if (newL0 !== undefined) L0 = newL0;
  qp = 0; v = 0;
  mLoad = MASS_PLATE;                 // 换弹簧视为重新开始，负载归零
  qCap = null;
  qRef = MASS_PLATE * G / K;
  q = Math.min(totalMass() * G / K, contactQ());
  points.clear();
  segments.length = 0;
  lastRecordN = -1;
  peakN = -1;
  recordedN = -1;
  settleTimer = 0;
  wasLocked = false;
  lastL = -1;
  ensureWeights();
}

/* 还能再挂一个钩码吗？——钩码串不能穿到桌面以下 */
let toastTimer = 0;
const hintEl = document.querySelector('#ctrl .hint');
const hintDefault = hintEl.textContent;

function toast(msg) {
  hintEl.textContent = msg;
  hintEl.style.color = '#c0392b';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    hintEl.textContent = hintDefault;
    hintEl.style.color = '';
  }, 2800);
}

/* ---------- 自动演示：加载 → 卸载，连续观察形变与恢复 ---------- */
let demoTimers = [];
let demoActive = false;
function demoClear() {
  demoTimers.forEach(clearTimeout);
  demoTimers = [];
  demoActive = false;
  btnDemoElastic.classList.remove('running');
  btnDemoPlastic.classList.remove('running');
  btnPlus.disabled = false; btnMinus.disabled = false; btnReset.disabled = false;
  skEl.disabled = false; slEl.disabled = false;
}
function demoAfter(ms, fn) { demoTimers.push(setTimeout(fn, ms)); }

// peak：加载到的钩码数；isPlastic：是否越过弹性限度（决定结束提示与高亮）
function runDemo(peak, isPlastic, btn) {
  demoClear();
  if (btn) btn.classList.add('running');
  btnPlus.disabled = true; btnMinus.disabled = true; btnReset.disabled = true;
  skEl.disabled = true; slEl.disabled = true;
  demoActive = true;

  // 从一个干净的弹簧开始
  n = 0;
  resetSpring();
  ensureWeights();

  const STEP = 720;       // 每步间隔：留足时间让弹簧稳定并被记录
  const HOLD = 1100;      // 到达峰值后停顿，让人看清楚最大形变

  // 逐个加钩码
  for (let k = 1; k <= peak; k++) {
    demoAfter(STEP * k, () => { n = k; ensureWeights(); });
  }
  // 到峰值后停顿，再逐个卸下
  const tOff = STEP * peak + HOLD;
  for (let k = 1; k <= peak; k++) {
    demoAfter(tOff + STEP * k, () => { n = peak - k; ensureWeights(); });
  }
  // 全部卸完后给结论
  demoAfter(tOff + STEP * peak + 500, () => {
    const xp = qp * 100;
    if (isPlastic) {
      toast('演示结束：卸掉全部钩码后仍伸长 ' + xp.toFixed(1) + ' cm —— 弹簧回不去了');
    } else {
      toast('演示结束：卸掉全部钩码后弹簧恢复原长 —— 弹性形变完全可逆');
    }
    demoClear();
  });
}

btnDemoElastic.addEventListener('click', () => runDemo(5, false, btnDemoElastic));
btnDemoPlastic.addEventListener('click', () => runDemo(10, true, btnDemoPlastic));

btnPlus.addEventListener('click', () => {
  if (demoActive) demoClear();
  const before = n;
  n++;
  ensureWeights();
  if (touching && before > 0) {
    toast('钩码已堆到台面上 —— 再多加也只是摞高，弹簧长度不再变化');
  }
});
btnMinus.addEventListener('click', () => { if (demoActive) demoClear(); if (n > 0) { n--; ensureWeights(); } });
btnReset.addEventListener('click', () => {
  if (demoActive) demoClear();
  n = 0;
  resetSpring();
  skEl.value = K; slEl.value = (L0 * 100).toFixed(1);
  skVal.textContent = K.toFixed(1) + ' N/m';
  slVal.textContent = (L0 * 100).toFixed(1) + ' cm';
});

skEl.addEventListener('input', () => {
  const k = parseFloat(skEl.value);
  skVal.textContent = k.toFixed(1) + ' N/m';
  resetSpring(k, L0);
});
slEl.addEventListener('input', () => {
  const l = parseFloat(slEl.value) / 100;
  slVal.textContent = (l * 100).toFixed(1) + ' cm';
  resetSpring(K, l);
});

/* ---------- 拖动砝码 ---------- */
const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2();

function setNDC(e) {
  const r = canvas.getBoundingClientRect();
  pointerNDC.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  pointerNDC.y = -((e.clientY - r.top) / r.height) * 2 + 1;
}

function hoverTest(e) {
  setNDC(e);
  raycaster.setFromCamera(pointerNDC, camera);
  const hit = raycaster.intersectObject(grab, false).length > 0;
  canvas.style.cursor = dragging ? 'grabbing' : (hit ? 'grab' : 'default');
  return hit;
}

canvas.addEventListener('pointermove', (e) => {
  if (dragging) {
    const dy = e.clientY - dragStartY;
    let qNew = Math.max(qp, Math.min(contactQ(), dragBaseQ + dy * 0.0013));
    // 用手把弹簧拉过屈服应力，同样会造成永久形变（真实实验里最常见的过载方式）
    const Fs = K * Math.max(0, qNew - qp);
    const fy = Fy();
    if (Fs > fy) {
      qp += MU * (Fs / fy - 1) * eEl() * 0.016;
      if (qp > qNew) qp = qNew;
    }
    q = Math.max(qp, qNew);
    v = 0;
    return;
  }
  hoverTest(e);
});

canvas.addEventListener('pointerdown', (e) => {
  if (!hoverTest(e)) return;
  if (demoActive) demoClear();          // 用户接管：手动拖动即取消自动演示
  dragging = true;
  dragBaseQ = q;
  dragStartY = e.clientY;
  v = 0;
  controls.enabled = false;
  canvas.style.cursor = 'grabbing';
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
}, { capture: true });

function endDrag(e) {
  if (!dragging) return;
  dragging = false;
  controls.enabled = true;
  canvas.style.cursor = 'grab';
  try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('pointerleave', (e) => { if (dragging) endDrag(e); });

/* ============================================================
   13. 主循环
   ============================================================ */
const clock = new THREE.Clock();
let lastL = -1;

function animate() {
  const dt = Math.min(clock.getDelta(), 0.033);

  if (!dragging) physics(dt);

  const Ltot = L0 + q;
  if (Math.abs(Ltot - lastL) > 0.00004) {
    updateSpring(q, qp);
    updateGhost();            // 同步"原长虚影"，用于对照永久形变
    ensureWeights();          // 弹簧长度变化时重排钩码（触桌后会摞起来）
    lastL = Ltot;
  }
  floatGroup.position.y = SPRING_TOP - Ltot;

  // 稳定后记录数据点：n 改变后固定等待 RECORD_DELAY 再记录一个稳定点。
  // 触桌时长度被锁定、读数不再代表真实弹力，故不记录（等卸载脱离桌面后会重新记录）。
  if (!dragging) {
    if (n !== recordedN) {
      recordedN = n;
      settleTimer = 0;
    } else if (settleTimer < RECORD_DELAY) {
      settleTimer += dt;
      if (settleTimer >= RECORD_DELAY && !touching) {
        recordPoint();
      }
    }
  }

  const eNow = q - qp;
  // 扣除指针组件自重（相当于实验中的"零点"），使 F–x 图线严格过原点
  const liveF = Math.max(0, K * Math.max(0, eNow) - MASS_PLATE * G);
  const liveX = Math.max(0, q - qRef);

  updateHUD();
  drawGraph(liveX, liveF);
  controls.update();
  renderer.render(scene, camera);
}

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  sizeGraph();
}
window.addEventListener('resize', resize);
resize();

ensureWeights();
updateSpring(q, qp);
updateGhost();
floatGroup.position.y = SPRING_TOP - (L0 + q);
animate();                       // 先画一帧，避免首屏空白
renderer.setAnimationLoop(animate);
window.__hkReady = true;

window.addEventListener('error', (e) => {
  if (String(e.message).includes('import') || String(e.message).includes('module')) {
    document.getElementById('err').style.display = 'grid';
  }
});
</script>
