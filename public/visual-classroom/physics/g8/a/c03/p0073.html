<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>光的色散 · 交互式 3D 实验</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    background:#04060a;color:#e9f3ff;
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    user-select:none;
  }
  canvas#webgl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 45%,transparent 45%,rgba(2,4,8,.55) 100%);
  }

  /* ---------------- 顶部标题 ---------------- */
  .topbar{
    position:fixed;left:34px;top:30px;z-index:5;max-width:430px;
    pointer-events:none;
  }
  .kick{
    display:inline-flex;align-items:center;gap:8px;
    font-size:11px;letter-spacing:.20em;color:#5ec8f5;
    padding:5px 11px;border:1px solid rgba(94,200,245,.28);
    border-radius:999px;background:rgba(20,60,90,.22);
    margin-bottom:16px;
  }
  .kick::before{
    content:"";width:5px;height:5px;border-radius:50%;
    background:#4fd1ff;box-shadow:0 0 10px #4fd1ff;
  }
  .topbar h1{
    font-size:31px;line-height:1.24;font-weight:600;letter-spacing:.01em;
    background:linear-gradient(100deg,#ffffff 10%,#a8dcff 55%,#6ea8d8 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 40px rgba(80,180,255,.18);
  }
  .sub{margin-top:10px;font-size:12.5px;color:#7d93a9;letter-spacing:.02em;line-height:1.6}

  /* 光谱小预览 */
  .spectrum{margin-top:18px;width:290px}
  .spec-bar{display:flex;height:9px;border-radius:5px;overflow:hidden;box-shadow:0 0 22px rgba(120,200,255,.20)}
  .spec-bar i{flex:1;background:var(--c);transition:opacity .45s ease,filter .45s ease}
  .spec-bar i.dim{opacity:.13;filter:saturate(.2)}
  .spec-labels{
    display:flex;margin-top:7px;
    font-size:10px;letter-spacing:.06em;color:#7590a8;
  }
  .spec-labels span{flex:1;text-align:center;transition:color .45s,opacity .45s}
  .spec-labels span.dim{opacity:.35}

  /* ---------------- 右侧面板 ---------------- */
  .panel{
    position:fixed;right:22px;top:74px;z-index:6;width:300px;
    max-height:calc(100vh - 52px);overflow-y:auto;overflow-x:hidden;
    padding:22px 22px 20px;
    background:linear-gradient(165deg,rgba(16,25,38,.90),rgba(9,15,24,.86));
    border:1px solid rgba(110,180,230,.16);
    border-radius:18px;
    backdrop-filter:blur(20px) saturate(150%);
    -webkit-backdrop-filter:blur(20px) saturate(150%);
    box-shadow:0 26px 70px rgba(0,0,0,.62),inset 0 1px 0 rgba(255,255,255,.055);
    scrollbar-width:thin;scrollbar-color:rgba(90,150,200,.35) transparent;
    transition:transform .35s ease,opacity .3s ease;
  }
  .panel.collapsed{transform:translateX(calc(100% + 44px));opacity:0;pointer-events:none;}
  .panel-toggle{
    position:fixed;right:22px;top:24px;z-index:7;
    appearance:none;border:1px solid rgba(110,180,230,.28);border-radius:10px;
    background:linear-gradient(160deg,rgba(16,25,38,.94),rgba(9,15,24,.9));
    color:#8fd8ff;font-family:inherit;font-size:12px;letter-spacing:.04em;
    padding:9px 13px;cursor:pointer;backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    box-shadow:0 10px 30px rgba(0,0,0,.42);transition:.2s;
  }
  .panel-toggle:hover{color:#e6f5ff;border-color:rgba(110,200,255,.6);background:rgba(70,160,220,.2);}
  .panel::-webkit-scrollbar{width:5px}
  .panel::-webkit-scrollbar-thumb{background:rgba(90,150,200,.3);border-radius:3px}
  .panel-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:20px}
  .panel-head h2{font-size:16px;font-weight:600;letter-spacing:.04em;color:#eaf5ff}
  .panel-head .en{font-size:9px;letter-spacing:.22em;color:#4a6a85}

  .group{margin-bottom:18px}
  .glabel{
    display:flex;align-items:center;gap:7px;
    font-size:11px;letter-spacing:.12em;color:#7493ab;margin-bottom:9px;
  }
  .glabel::before{content:"";width:3px;height:11px;border-radius:2px;background:linear-gradient(#5ecdff,#2a6f9e)}

  .seg{
    display:flex;gap:4px;padding:4px;border-radius:11px;
    background:rgba(6,12,20,.85);border:1px solid rgba(110,180,230,.10);
  }
  .seg button{
    flex:1;appearance:none;border:0;background:transparent;cursor:pointer;
    color:#8399ad;font-size:12px;letter-spacing:.04em;font-family:inherit;
    padding:8px 2px;border-radius:8px;transition:.22s;white-space:nowrap;
    display:flex;align-items:center;justify-content:center;gap:5px;
  }
  .seg button:hover{color:#cfe6f8;background:rgba(90,160,210,.10)}
  .seg button.on{
    color:#04131d;font-weight:600;
    background:linear-gradient(180deg,#7fe2ff,#35b6ea);
    box-shadow:0 0 18px rgba(70,190,255,.45);
  }
  .seg.light button.on{
    background:linear-gradient(180deg,#eef8ff,#c3dcf0);
    box-shadow:0 0 16px rgba(200,230,255,.35);
  }
  .dot{width:8px;height:8px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}
  .dot.white{background:#fff;color:#fff}
  .dot.red{background:#ff3b30;color:#ff3b30}
  .dot.purple{background:#a855f7;color:#a855f7}
  .seg button.on .dot{box-shadow:0 0 0 2px rgba(4,19,29,.25)}

  /* 滑块 */
  .row{display:flex;align-items:baseline;justify-content:space-between;margin:10px 0 6px}
  .row:first-child{margin-top:0}
  .row span{font-size:12px;color:#93a9bd;letter-spacing:.03em}
  .row b{
    font-family:ui-monospace,"SF Mono",Consolas,monospace;
    font-size:11.5px;color:#64d6ff;font-weight:500;letter-spacing:.02em;
  }
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;cursor:pointer;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:4px;border-radius:3px;
    background:linear-gradient(90deg,rgba(80,200,255,.65),rgba(80,200,255,.12));
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:14px;height:14px;border-radius:50%;margin-top:-5px;
    background:radial-gradient(circle at 35% 32%,#fff,#57cdfa 60%,#1d7fb0);
    box-shadow:0 0 12px rgba(80,205,255,.85),0 0 0 3px rgba(80,205,255,.12);
    transition:transform .15s;
  }
  input[type=range]:active::-webkit-slider-thumb{transform:scale(1.18)}
  input[type=range]::-moz-range-track{height:4px;border-radius:3px;background:rgba(80,200,255,.3)}
  input[type=range]::-moz-range-thumb{
    width:14px;height:14px;border:0;border-radius:50%;background:#5ecdff;box-shadow:0 0 12px rgba(80,205,255,.85);
  }

  .btns{display:flex;gap:8px;margin-top:4px}
  .btns button{
    flex:1;appearance:none;font-family:inherit;cursor:pointer;
    padding:10px 6px;border-radius:10px;font-size:12px;letter-spacing:.05em;
    color:#9fc0d8;background:rgba(70,130,180,.10);
    border:1px solid rgba(110,180,230,.20);transition:.22s;
  }
  .btns button:hover{color:#e6f5ff;border-color:rgba(110,200,255,.5);background:rgba(70,160,220,.20);box-shadow:0 0 18px rgba(70,180,255,.2)}
  .btns button:active{transform:translateY(1px)}

  .readout{
    margin-top:4px;padding:12px 13px;border-radius:11px;
    background:rgba(50,120,170,.09);border:1px solid rgba(110,180,230,.13);
    font-size:11.5px;line-height:1.65;color:#8fb4cc;letter-spacing:.02em;
  }
  .readout b{color:#7fe0ff;font-weight:500}
  .readout .hl{color:#ffd166}

  /* ---------------- 左下提示 ---------------- */
  .hints{
    position:fixed;left:34px;bottom:28px;z-index:5;width:352px;
    padding:16px 17px 15px;border-radius:15px;
    background:linear-gradient(160deg,rgba(14,23,35,.82),rgba(8,13,21,.80));
    border:1px solid rgba(110,180,230,.14);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    box-shadow:0 18px 50px rgba(0,0,0,.5);
  }
  .hints .chips{display:flex;gap:6px;margin-bottom:11px}
  .hints .chips span{
    font-size:10px;letter-spacing:.14em;color:#6fd0f5;
    padding:3px 9px;border-radius:5px;
    background:rgba(60,170,220,.13);border:1px solid rgba(90,200,240,.22);
  }
  .hints ul{list-style:none;display:flex;flex-direction:column;gap:7px}
  .hints li{
    font-size:12px;line-height:1.55;color:#9db3c6;letter-spacing:.01em;
    display:flex;gap:7px;align-items:flex-start;
  }
  .hints li em{
    font-style:normal;flex:none;width:5px;height:5px;border-radius:50%;
    background:#3d7fa5;margin-top:7px;
  }
  .hints .q{
    margin-top:12px;padding-top:11px;border-top:1px dashed rgba(110,170,210,.18);
    font-size:12px;line-height:1.6;color:#c9dcec;
  }
  .hints .q b{color:#ffd166;font-weight:500}

  /* 拖拽提示 */
  .tip{
    position:fixed;left:50%;transform:translateX(-50%);bottom:30px;z-index:5;
    font-size:11.5px;letter-spacing:.08em;color:#5d7c93;
    display:flex;align-items:center;gap:8px;pointer-events:none;
    transition:opacity .6s;
  }
  .tip i{width:5px;height:5px;border-radius:50%;background:#3f7fa6;box-shadow:0 0 8px #3f7fa6}

  @media (max-width:1180px){
    .topbar{max-width:320px}
    .topbar h1{font-size:24px}
    .spectrum{width:240px}
    .panel{width:272px;right:12px;top:66px;padding:16px 14px}
    .panel-toggle{right:12px;top:14px}
    .hints{width:300px;left:18px;bottom:18px}
    .topbar{left:20px;top:20px}
  }
  @media (max-width:860px){
    .hints{display:none}
    .panel{width:230px;padding:14px 12px}
    .topbar h1{font-size:20px}
    .sub{display:none}
  }
</style>
</head>
<body>
<canvas id="webgl"></canvas>
<button id="panelToggle" class="panel-toggle" type="button" aria-expanded="true">控制面板 · 收起</button>

<header class="topbar">
  <div class="kick">初中物理 · 光与颜色</div>
  <h1>白光里，<br/>藏着哪些颜色？</h1>
  <p class="sub">拖动光源与三棱镜，观察一束白光穿过三棱镜后被分解成七色光带。</p>
  <div class="spectrum">
    <div class="spec-bar" id="specBar"></div>
    <div class="spec-labels" id="specLabels"></div>
  </div>
</header>

<aside class="panel">
  <div class="panel-head">
    <h2>光的色散与合成</h2>
    <span class="en">DISPERSION</span>
  </div>

  <div class="group">
    <div class="glabel">实验模式</div>
    <div class="seg" id="modeSeg">
      <button data-mode="dispersion" class="on">色散</button>
      <button data-mode="filter">滤光玻璃</button>
      <button data-mode="paper">色纸反射</button>
    </div>
  </div>

  <div class="group">
    <div class="glabel">第二棱镜 · 白光合成</div>
    <div class="seg" id="p2Seg">
      <button data-p2="off" class="on">关</button>
      <button data-p2="on">开</button>
    </div>
  </div>

  <div class="group">
    <div class="glabel">光源</div>
    <div class="seg light" id="lightSeg">
      <button data-light="white" class="on"><i class="dot white"></i>白光</button>
      <button data-light="red"><i class="dot red"></i>红光</button>
      <button data-light="purple"><i class="dot purple"></i>紫光</button>
    </div>
  </div>

  <div class="group">
    <div class="row"><span>入射光位置</span><b id="valBeam">52%</b></div>
    <input type="range" id="rngBeam" min="0" max="1000" value="500" />
    <div class="row"><span>三棱镜高度</span><b id="valPrism">0.00</b></div>
    <input type="range" id="rngPrism" min="-100" max="100" value="0" />
  </div>

  <div class="btns">
    <button id="btnView">复位视角</button>
    <button id="btnReset">重置实验</button>
  </div>

  <div class="readout" id="readout">—</div>
</aside>

<div class="tip" id="tip"><i></i>空白处 / 右键 / Shift+拖动可旋转视角 · 按住光源或三棱镜可移动</div>

<script type="importmap">
{
  "imports": {
    "three": "../../../../vendor/three/0.160.0/build/three.module.js",
    "three/addons/": "../../../../vendor/three/0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   1. 基础数据
   ============================================================ */
const SPECTRUM = [
  { name:'红', hex:0xff3b30, css:'#ff3b30', n:1.340 },
  { name:'橙', hex:0xff8a1e, css:'#ff8a1e', n:1.360 },
  { name:'黄', hex:0xffd400, css:'#ffd400', n:1.380 },
  { name:'绿', hex:0x33e070, css:'#33e070', n:1.400 },
  { name:'蓝', hex:0x2f8dff, css:'#2f8dff', n:1.420 },
  { name:'靛', hex:0x4a5cff, css:'#4a5cff', n:1.440 },
  { name:'紫', hex:0xa855f7, css:'#a855f7', n:1.460 },
];

const RAIL_Y      = -2.30;
const RAIL_H      = 0.24;
const RAIL_TOP    = RAIL_Y + RAIL_H / 2;
const PRISM_SIDE  = 2.2;
const PRISM_R     = PRISM_SIDE / Math.sqrt(3);      // 1.2702
const BEAM_MIN    = 0.15, BEAM_MAX = 0.95;           // 入射光世界高度
const PRISM_MIN   = -0.25, PRISM_MAX = 0.25;         // 三棱镜高度偏移
const SRC_X_MIN   = -4.90, SRC_X_MAX = -2.40;        // 光源水平范围
const SCREEN_X    =  2.40, SCREEN_Y = -0.58;
const SCREEN_W    =  1.50, SCREEN_H = 2.70;
const FILTER_X    = -1.86;
const BETA        = THREE.MathUtils.degToRad(30);    // 整个光具座的偏转角

const state = {
  mode:'dispersion',      // dispersion | filter | paper
  light:'white',          // white | red | purple
  beamY:0.55,
  prismY:0,
  sourceX:-3.85,
  prism2:false,           // 第二棱镜（白光合成）
  prism2Off:0,            // 第二棱镜手动高度偏移
};

/* ============================================================
   2. 渲染器 / 场景 / 相机
   ============================================================ */
const canvas = document.getElementById('webgl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(38, window.innerWidth/window.innerHeight, 0.1, 120);
const CAM_HOME   = new THREE.Vector3(-1.45, 1.62, 8.85);
const CAM_TARGET = new THREE.Vector3(-0.6, -0.52, 0.1);
camera.position.copy(CAM_HOME);
camera.lookAt(CAM_TARGET);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(CAM_TARGET);
controls.enableDamping = true;
controls.dampingFactor = 0.075;
controls.enablePan = false;
controls.minDistance = 5.2;
controls.maxDistance = 17;
controls.minPolarAngle = Math.PI * 0.27;
controls.maxPolarAngle = Math.PI * 0.56;
controls.minAzimuthAngle = -0.62;
controls.maxAzimuthAngle = 0.55;
controls.rotateSpeed = 0.7;
// 右键也可旋转视角，减少“可旋转区域太小”的限制
controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };
controls.update();

/* ---------- 背景渐变（摄影棚深色布景，带地平线光晕） ---------- */
(function makeBackground(){
  const c = document.createElement('canvas'); c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 512);
  g.addColorStop(0,   '#182b3d');
  g.addColorStop(0.40,'#0e1c2b');
  g.addColorStop(0.55,'#15273a');   // 地平线柔光带
  g.addColorStop(0.72,'#0a1420');
  g.addColorStop(1,   '#04070c');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 512, 512);
  const r = ctx.createRadialGradient(256, 300, 30, 256, 300, 380);
  r.addColorStop(0, 'rgba(90,150,200,0.14)');
  r.addColorStop(1, 'rgba(90,150,200,0)');
  ctx.fillStyle = r; ctx.fillRect(0, 0, 512, 512);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  scene.background = tex;
})();

/* ---------- 环境贴图（冷调天光 + 一条暖光带，给玻璃与金属反射用） ---------- */
(function makeEnv(){
  const c = document.createElement('canvas'); c.width = 512; c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0,   '#3a5871');
  g.addColorStop(0.42,'#16293c');
  g.addColorStop(0.5, '#1d3449');
  g.addColorStop(0.72,'#0b1622');
  g.addColorStop(1,   '#050a10');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 512, 256);
  ctx.globalAlpha = 0.6;
  // 冷调柔光条
  const bands = [[40,26,150,20],[300,18,120,14],[430,60,60,40],[120,74,220,10]];
  bands.forEach(([x,y,w,h])=>{
    const gg = ctx.createLinearGradient(x, y, x + w, y + h);
    gg.addColorStop(0,'rgba(160,220,255,.9)');
    gg.addColorStop(1,'rgba(160,220,255,0)');
    ctx.fillStyle = gg; ctx.fillRect(x, y, w, h);
  });
  // 暖光带（左侧主灯的反射）
  const wg = ctx.createLinearGradient(60, 170, 220, 210);
  wg.addColorStop(0,'rgba(255,190,120,.85)');
  wg.addColorStop(1,'rgba(255,190,120,0)');
  ctx.fillStyle = wg; ctx.fillRect(60, 170, 180, 50);
  ctx.globalAlpha = 1;
  const tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromEquirectangular(tex).texture;
  pmrem.dispose(); tex.dispose();
})();

/* ---------- 灯光（三点式摄影布光：暖主光 + 冷轮廓 + 柔补光） ---------- */
scene.add(new THREE.AmbientLight(0x31465c, 0.9));
const hemi = new THREE.HemisphereLight(0x7fa9cf, 0x05080c, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffdfb0, 1.7);      // 暖主光（左上）
key.position.set(-6.0, 6.8, 5.2);
scene.add(key);

const rim = new THREE.DirectionalLight(0x5f9dff, 1.35);     // 冷轮廓光（右后）
rim.position.set(6.5, 3.2, -5.5);
scene.add(rim);

const fill = new THREE.DirectionalLight(0x8fb8d8, 0.42);    // 柔补光
fill.position.set(2.5, -2.5, 7);
scene.add(fill);

// 顶部聚光，突出光具座
const spot = new THREE.SpotLight(0xcfe4ff, 55, 22, 0.55, 0.6, 1.6);
spot.position.set(-0.5, 7.5, 2.5);
spot.target.position.set(-0.5, -2.2, 0);
scene.add(spot, spot.target);

/* ---------- 抛光地台 ---------- */
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(17, 56),
  new THREE.MeshStandardMaterial({ color:0x0a1017, metalness:0.62, roughness:0.38, envMapIntensity:0.75 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = RAIL_Y - 0.46;
scene.add(floor);

/* ---------- 后期：泛光 ---------- */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight), 0.62, 0.58, 0.55
);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ============================================================
   3. 通用工具
   ============================================================ */
const UP = new THREE.Vector3(0, 1, 0);

function glowTexture(){
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0,   'rgba(255,255,255,1)');
  g.addColorStop(0.18,'rgba(255,255,255,0.75)');
  g.addColorStop(0.45,'rgba(255,255,255,0.22)');
  g.addColorStop(1,   'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* 光束池：一组可复用的圆柱段（芯 + 光晕） */
class BeamPool {
  constructor(parent, count){
    this.items = [];
    const coreGeo = new THREE.CylinderGeometry(1, 1, 1, 10, 1, true);
    const haloGeo = new THREE.CylinderGeometry(1, 1, 1, 10, 1, true);
    for (let i = 0; i < count; i++){
      const g = new THREE.Group();
      const core = new THREE.Mesh(coreGeo, new THREE.MeshBasicMaterial({
        transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, opacity:0.95
      }));
      const halo = new THREE.Mesh(haloGeo, new THREE.MeshBasicMaterial({
        transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, opacity:0.13
      }));
      core.raycast = () => {};
      halo.raycast = () => {};
      g.add(core, halo);
      g.visible = false;
      parent.add(g);
      this.items.push({ g, core, halo });
    }
    this.i = 0;
  }
  begin(){ this.i = 0; }
  add(ax, ay, az, bx, by, bz, color, coreR = 0.014, haloR = 0.085, coreOp = 0.95, haloOp = 0.13){
    if (this.i >= this.items.length) return;
    const it = this.items[this.i++];
    const dx = bx - ax, dy = by - ay, dz = bz - az;
    const len = Math.hypot(dx, dy, dz);
    if (len < 1e-5){ it.g.visible = false; return; }
    it.g.visible = true;
    it.g.position.set(ax + dx * 0.5, ay + dy * 0.5, az + dz * 0.5);
    it.g.quaternion.setFromUnitVectors(UP, new THREE.Vector3(dx, dy, dz).normalize());
    it.core.scale.set(coreR, len, coreR);
    it.halo.scale.set(haloR, len, haloR);
    it.core.material.color.setHex(color);
    it.halo.material.color.setHex(color);
    it.core.material.opacity = coreOp;
    it.halo.material.opacity = haloOp;
  }
  end(){
    for (let k = this.i; k < this.items.length; k++) this.items[k].g.visible = false;
  }
}

/* 投射在光屏上的彩色光带（加色发光，始终清晰可见） */
function bandTexture(rainbow){
  const c = document.createElement('canvas'); c.width = 64; c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 256, 0, 0);
  if (rainbow){
    [...SPECTRUM].reverse().forEach((sp, i) => g.addColorStop(i / 6, rgba(sp.hex, 1)));
  } else {
    g.addColorStop(0, 'rgba(255,255,255,0.85)');
    g.addColorStop(1, 'rgba(255,255,255,0.85)');
  }
  ctx.fillStyle = g; ctx.fillRect(0, 0, 64, 256);
  const img = ctx.getImageData(0, 0, 64, 256);
  for (let x = 0; x < 64; x++){
    const d = Math.abs(x - 31.5) / 31.5;
    const a = Math.pow(1 - d, 1.7);
    for (let y = 0; y < 256; y++) img.data[(y * 64 + x) * 4 + 3] *= a;
  }
  ctx.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

const C2 = { x:  PRISM_SIDE / 2 * PRISM2_S, y:  PRISM_R / 2 * PRISM2_S };
const P2_MID_LX = -0.55 * PRISM2_S;           // 左侧面中点的局部 x
const P2_MID_LOFF = 0.318 * PRISM2_S;         // 对齐偏移（使光扇穿过左侧面中部）

function cross2(a, b){ return a.x * b.y - a.y * b.x; }

function raySeg(o, d, a, b){
  const e = { x: b.x - a.x, y: b.y - a.y };
  const den = cross2(d, e);
  if (Math.abs(den) < 1e-9) return null;
  const df = { x: a.x - o.x, y: a.y - o.y };
  const t = cross2(df, e) / den;
  const s = cross2(df, d) / den;
  if (t > 1e-5 && s >= -1e-6 && s <= 1 + 1e-6){
    return { t, p: { x: o.x + d.x * t, y: o.y + d.y * t } };
  }
  return null;
}

/* 折射：d 入射单位向量，n 与入射方向相对的表面法线，eta = n1 / n2 */
function refract(d, n, eta){
  const cosI = -(d.x * n.x + d.y * n.y);
  const k = 1 - eta * eta * (1 - cosI * cosI);
  if (k < 0) return null;                    // 全反射
  const cosT = Math.sqrt(k);
  return {
    x: eta * d.x + (eta * cosI - cosT) * n.x,
    y: eta * d.y + (eta * cosI - cosT) * n.y
  };
}

function reflect(d, n){
  const dn = d.x * n.x + d.y * n.y;
  return { x: d.x - 2 * dn * n.x, y: d.y - 2 * dn * n.y };
}

/* 从入射点水平射入，返回 p1(入射点) p2(出射点) d2(出射方向) */
function tracePrism(startX, startY, ior, prismY){
  const A = { x: A_L.x, y: A_L.y + prismY };
  const B = { x: B_L.x, y: B_L.y + prismY };
  const C = { x: C_L.x, y: C_L.y + prismY };
  const o = { x: startX, y: startY };
  const d = { x: 1, y: 0 };

  const hitIn = raySeg(o, d, B, A);
  if (!hitIn) return null;

  const nL = { x: -0.8660254, y: 0.5 };       // 左侧面外法线
  const d1 = refract(d, nL, 1 / ior);
  if (!d1) return null;

  const p1 = hitIn.p;
  let p2 = null, nrm = null;
  const hR = raySeg(p1, d1, A, C);
  const hB = raySeg(p1, d1, B, C);
  if (hR && (!hB || hR.t < hB.t)){ p2 = hR.p; nrm = { x: 0.8660254, y: 0.5 }; }
  else if (hB){ p2 = hB.p; nrm = { x: 0, y: -1 }; }
  if (!p2) return null;

  if (d1.x * nrm.x + d1.y * nrm.y > 0) nrm = { x: -nrm.x, y: -nrm.y };
  let d2 = refract(d1, nrm, ior);
  if (!d2) d2 = reflect(d1, nrm);            // 理论上不会发生

  return { p1, p2, d1, d2 };
}

/* 第二棱镜（倒置）追迹：返回穿过棱镜后的出射点与方向 */
function tracePrism2(o, d, ior, px2, py2){
  const A = { x: A2.x + px2, y: A2.y + py2 };
  const B = { x: B2.x + px2, y: B2.y + py2 };
  const C = { x: C2.x + px2, y: C2.y + py2 };
  const faces = [
    { a: B, b: A, n: { x: -0.8660254, y: -0.5 } },  // 左侧面
    { a: A, b: C, n: { x:  0.8660254, y: -0.5 } },  // 右侧面
    { a: B, b: C, n: { x:  0, y: 1 } }              // 顶边
  ];
  let best = null;                                  // 入射面
  faces.forEach(f => {
    if (d.x * f.n.x + d.y * f.n.y >= 0) return;
    const h = raySeg(o, d, f.a, f.b);
    if (h && (!best || h.t < best.h.t)) best = { h, f };
  });
  if (!best) return null;
  const p1 = best.h.p;
  const d1 = refract(d, best.f.n, 1 / ior);
  if (!d1) return null;
  let best2 = null;                                 // 出射面
  faces.forEach(f => {
    if (d1.x * f.n.x + d1.y * f.n.y <= 0) return;
    const h = raySeg(p1, d1, f.a, f.b);
    if (h && (!best2 || h.t < best2.h.t)) best2 = { h, f };
  });
  if (!best2) return null;
  const p2 = best2.h.p;
  let nOut = best2.f.n;                       // 出射时法线需与出射方向相对
  if (d1.x * nOut.x + d1.y * nOut.y > 0) nOut = { x: -nOut.x, y: -nOut.y };
  let d2 = refract(d1, nOut, ior);
  if (!d2) d2 = reflect(d1, nOut);
  return { p1, p2, d2 };
}

   10. 光屏贴图绘制

const rgba = (hex, a) =>
  `rgba(${(hex >> 16) & 255},${(hex >> 8) & 255},${hex & 255},${a})`;

const BAND_RAINBOW = bandTexture(true);
const BAND_WHITE   = bandTexture(false);
const bandMat = new THREE.MeshBasicMaterial({
  map: BAND_RAINBOW, transparent:true, blending:THREE.AdditiveBlending,
  depthWrite:false, side:THREE.DoubleSide, opacity:0.95
});
const bandMesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), bandMat);
bandMesh.visible = false;
rig.add(bandMesh);

function drawBand(ctx, yWorld, hex, strength){
  const v = (yWorld - (SCREEN_Y - SCREEN_H / 2)) / SCREEN_H;
  if (v < -0.08 || v > 1.08) return;
  const cy = (1 - v) * SCR_CH;
  const W = SCR_CW;
  const glowH = 30;

  const hg = ctx.createLinearGradient(0, 0, W, 0);
  hg.addColorStop(0,    rgba(hex, 0));
  hg.addColorStop(0.16, rgba(hex, 0.5));
  hg.addColorStop(0.50, rgba(hex, 1));
  hg.addColorStop(0.84, rgba(hex, 0.5));
  hg.addColorStop(1,    rgba(hex, 0));

  const steps = 24;
  const hh = (glowH * 2) / steps;
  for (let i = 0; i < steps; i++){
    const t = i / (steps - 1);
    const d = Math.abs(t - 0.5) * 2;
    const a = Math.pow(1 - d, 2.4);
    ctx.globalAlpha = Math.min(1, a * strength);
    ctx.fillStyle = hg;
    ctx.fillRect(0, cy - glowH + i * hh, W, hh + 1);
  }
  // 高亮芯
  ctx.globalAlpha = Math.min(1, strength);
  ctx.fillStyle = rgba(0xffffff, 0.10);
  ctx.fillRect(W * 0.30, cy - 1.6, W * 0.40, 3.2);
}

function drawScreen(hits, whiteY){
  const ctx = sctx, W = SCR_CW, H = SCR_CH;
  const paper = state.mode === 'paper';
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.clearRect(0, 0, W, H);

  if (paper){
    const g = ctx.createRadialGradient(W * 0.5, H * 0.42, 20, W * 0.5, H * 0.5, W * 0.95);
    g.addColorStop(0,   '#93211f');
    g.addColorStop(0.55,'#73181a');
    g.addColorStop(1,   '#480c10');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 0.05;
    for (let i = 0; i < 1600; i++){
      ctx.fillStyle = i % 2 ? '#ffffff' : '#000000';
      ctx.fillRect(Math.random() * W, Math.random() * H, 2, 1);
    }
    ctx.globalAlpha = 1;
    ctx.strokeStyle = 'rgba(255,220,200,.10)';
    ctx.lineWidth = 6;
    ctx.strokeRect(3, 3, W - 6, H - 6);
  } else {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0,   '#141d26');
    g.addColorStop(0.45,'#0d151c');
    g.addColorStop(1,   '#070c11');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(120,185,225,.06)';
    ctx.lineWidth = 1;
    for (let x = 0; x <= W; x += 40){ ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y <= H; y += 40){ ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    ctx.strokeStyle = 'rgba(120,185,225,.16)';
    ctx.lineWidth = 4;
    ctx.strokeRect(2, 2, W - 4, H - 4);
  }

  ctx.globalCompositeOperation = 'lighter';
  hits.forEach(h => drawBand(ctx, h.y, h.hex, h.a));
  // 白光合成：七色叠加后叠加一层明亮的白光带
  if (whiteY != null){
    drawBand(ctx, whiteY, 0xffffff, 1.5);
    const v = (whiteY - (SCREEN_Y - SCREEN_H / 2)) / SCREEN_H;
    const cy = (1 - v) * H;
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.fillRect(W * 0.16, cy - 2.4, W * 0.68, 4.8);
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(W * 0.10, cy - 5, W * 0.80, 10);
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  screenTex.needsUpdate = true;
}

/* ============================================================
   11. 场景刷新
   ============================================================ */
const WHITE_HEX = 0xf2f8ff;
let targetP2Y = -0.35;            // 第二棱镜目标高度（自动对准光扇中心）

function activeColors(){
  const L = state.light;
  if (state.mode === 'filter'){
    if (L === 'purple') return [];           // 紫光被红玻璃吸收
    return [0];                              // 只有红光能透过
  }
  if (L === 'white') return [0, 1, 2, 3, 4, 5, 6];
  if (L === 'red') return [0];
  return [6];
}

function update(){
  const prismY = state.prismY;
  const beamY  = state.beamY;
  const p2Active = !!state.prism2 && state.mode === 'dispersion';
  const py2 = prism2Group.position.y;
  prism2Group.visible = p2Active;

  /* --- 位置 --- */
  sourceGroup.position.set(state.sourceX, beamY, 0);
  prismGroup.position.set(0, prismY, 0);

  // 光源支架
  const sFootY = RAIL_TOP - beamY + 0.055;
  srcFoot.position.y = sFootY;
  const sTop = -0.20, sBot = sFootY + 0.05;
  srcPost.scale.y = Math.max(0.02, sTop - sBot);
  srcPost.position.y = (sTop + sBot) / 2;

  // 三棱镜支架
  const pFootY = RAIL_TOP - prismY + 0.055;
  prismFoot.position.y = pFootY;
  prismPlate.position.y = -PRISM_R / 2 - 0.055;
  const pTop = -PRISM_R / 2 - 0.08, pBot = pFootY + 0.05;
  prismPost.scale.y = Math.max(0.02, pTop - pBot);
  prismPost.position.y = (pTop + pBot) / 2;

  // 第二棱镜支架（倒置：底座在顶点下方）
  prism2Plate.position.y = -PRISM_R * PRISM2_S - 0.05;
  const p2FootY = RAIL_TOP - py2 + 0.055;
  prism2Foot.position.y = p2FootY;
  const p2Top = -PRISM_R * PRISM2_S - 0.08, p2Bot = p2FootY + 0.06;
  prism2Post.scale.y = Math.max(0.02, p2Top - p2Bot);
  prism2Post.position.y = (p2Top + p2Bot) / 2;

  /* --- 光源颜色 --- */
  const srcHex = state.light === 'white' ? 0xffffff : (state.light === 'red' ? 0xff3b30 : 0xa855f7);
  lensMat.color.setHex(srcHex);
  srcGlow.material.color.setHex(srcHex);
  srcGlow2.material.color.setHex(srcHex);
  srcLight.color.setHex(state.light === 'white' ? 0xfff2e0 : srcHex);

  /* --- 光线 --- */
  beams.begin();
  hitGlows.forEach(g => { g.material.opacity = 0; });
  const idxs = activeColors();
  const muzzleX = state.sourceX + 0.28;
  const entries = [];
  let firstP1 = null;

  idxs.forEach(i => {
    const tr = tracePrism(muzzleX, beamY, SPECTRUM[i].n, prismY);
    entries.push({ i, tr });
    if (tr && !firstP1) firstP1 = tr.p1;
  });

  // 第二棱镜自动对准光扇中心（绿光为基准）
  if (p2Active){
    const trC = entries[3] && entries[3].tr;
    if (trC && trC.d2 && trC.d2.x > 1e-4){
      const fx = PRISM2_X + P2_MID_LX;
      const yAt = trC.p2.y + trC.d2.y * (fx - trC.p2.x) / trC.d2.x;
      targetP2Y = clamp(yAt + P2_MID_LOFF, -0.30, 0.9);
    }
  }

  // 入射点星芒
  if (firstP1){
    entrySpark.position.set(firstP1.x, firstP1.y, 0);
    entrySpark.material.opacity = idxs.length === 1 ? 0.55 : 0.85;
  } else {
    entrySpark.material.opacity = 0;
  }

  const hits = [];
  let devMin = 999, devMax = -999;

  // 入射段
  const eX = firstP1 ? firstP1.x : SCREEN_X;
  const eY = firstP1 ? firstP1.y : beamY;
  const passIdx = state.mode === 'filter' ? (idxs.length ? idxs[0] : -1) : -1;
  const incidentHex = state.light === 'white' ? (state.mode === 'filter' && passIdx >= 0 ? WHITE_HEX : WHITE_HEX) : srcHex;

  if (state.mode === 'filter'){
    beams.add(muzzleX, beamY, 0, FILTER_X, beamY, 0, WHITE_HEX, 0.014, 0.075, 0.55, 0.07);
    if (passIdx >= 0){
      beams.add(FILTER_X, beamY, 0, eX, eY, 0, SPECTRUM[passIdx].hex, 0.015, 0.095);
    }
  } else {
    beams.add(muzzleX, beamY, 0, eX, eY, 0, incidentHex, 0.015, 0.09);
  }

  // 棱镜内 + 出射
  entries.forEach(({ i, tr }) => {
    if (!tr) return;
    const sp = SPECTRUM[i];
    const single = idxs.length === 1;

    beams.add(tr.p1.x, tr.p1.y, 0, tr.p2.x, tr.p2.y, 0, sp.hex,
      single ? 0.013 : 0.008, single ? 0.06 : 0.03, single ? 0.9 : 0.5, single ? 0.10 : 0.035);

    // 第二棱镜（倒置）：分解后的色光重新汇聚
    const tr2 = p2Active && tr.d2.x > 1e-4
      ? tracePrism2({ x: tr.p2.x, y: tr.p2.y }, tr.d2, sp.n, PRISM2_X, py2)
      : null;

    if (tr2){
      const recombined = !single;                 // 多色光经第二棱镜后复原为白光
      const outHex  = recombined ? 0xf7fbff : sp.hex;
      const outCore = recombined ? 0.017 : (single ? 0.017 : 0.012);
      const outHalo = recombined ? 0.125 : (single ? 0.10 : 0.07);

      beams.add(tr.p2.x, tr.p2.y, 0, tr2.p1.x, tr2.p1.y, 0, sp.hex,
        single ? 0.016 : 0.012, single ? 0.095 : 0.075, 0.95, 0.14);
      beams.add(tr2.p1.x, tr2.p1.y, 0, tr2.p2.x, tr2.p2.y, 0, sp.hex,
        single ? 0.014 : 0.010, single ? 0.07 : 0.045, single ? 0.9 : 0.6, single ? 0.10 : 0.05);

      let tx, ty;
      if (tr2.d2.x > 1e-4){
        const t = (SCREEN_X - tr2.p2.x) / tr2.d2.x;
        tx = SCREEN_X; ty = tr2.p2.y + tr2.d2.y * t;
      } else {
        tx = tr2.p2.x + tr2.d2.x * 1.2; ty = tr2.p2.y + tr2.d2.y * 1.2;
      }
      beams.add(tr2.p2.x, tr2.p2.y, 0, tx, ty, 0, outHex, outCore, outHalo, 1.0, 0.18);

      const dev = Math.atan2(-tr2.d2.y, tr2.d2.x) * 180 / Math.PI;
      devMin = Math.min(devMin, dev); devMax = Math.max(devMax, dev);

      if (tr2.d2.x > 1e-4){
        hits.push({ y: ty, hex: sp.hex, a: recombined ? 0 : 0.95 });
        const g = hitGlows[i];
        g.position.set(SCREEN_X - 0.02, ty, 0);
        g.material.color.setHex(recombined ? 0xffffff : sp.hex);
        g.scale.setScalar(recombined ? 0.5 : (single ? 0.62 : 0.44));
        g.material.opacity = recombined ? 0.3 : (single ? 0.6 : 0.40);
      }
      return;
    }

    let tx, ty;
    if (tr.d2.x > 1e-4){
      const t = (SCREEN_X - tr.p2.x) / tr.d2.x;
      tx = SCREEN_X; ty = tr.p2.y + tr.d2.y * t;
    } else {
      tx = tr.p2.x + tr.d2.x * 1.2; ty = tr.p2.y + tr.d2.y * 1.2;
    }
    beams.add(tr.p2.x, tr.p2.y, 0, tx, ty, 0, sp.hex,
      single ? 0.017 : 0.012, single ? 0.10 : 0.07, 0.95, 0.13);

    const dev = Math.atan2(-tr.d2.y, tr.d2.x) * 180 / Math.PI;
    devMin = Math.min(devMin, dev); devMax = Math.max(devMax, dev);

    if (tr.d2.x > 1e-4){
      hits.push({ y: ty, hex: sp.hex, a: state.mode === 'paper' ? (i === 0 ? 0.75 : 0.10) : 0.95 });
      const g = hitGlows[i];
      g.material.color.setHex(sp.hex);
      g.position.set(SCREEN_X - 0.02, ty, 0);
      g.scale.setScalar(single ? 0.62 : 0.44);
      g.material.opacity = state.mode === 'paper' ? (i === 0 ? 0.5 : 0.07) : (single ? 0.6 : 0.42);
    }
  });

  // 色纸：漫反射
  if (state.mode === 'paper' && hits.length){
    const red = hits[0];
    for (let k = 0; k < 5; k++){
      const ang = THREE.MathUtils.degToRad(148 + k * 21);
      const len = 0.72 + (k % 2) * 0.16;
      beams.add(SCREEN_X, red.y, 0,
        SCREEN_X + Math.cos(ang) * len, red.y + Math.sin(ang) * len, 0,
        0xff3b30, 0.010, 0.065, 0.55, 0.10);
    }
  }

  // 没有光线（滤光片吸收）
  if (!idxs.length && state.mode === 'filter'){
    beams.add(muzzleX, beamY, 0, FILTER_X, beamY, 0, WHITE_HEX, 0.014, 0.075, 0.5, 0.06);
  }

  // 光屏上的彩色光带
  const whiteY = (p2Active && idxs.length > 1 && hits.length)
    ? hits.reduce((s, h) => s + h.y, 0) / hits.length : null;

  if (hits.length){
    const ys = hits.map(h => h.y);
    const top = Math.max(...ys), bot = Math.min(...ys);
    bandMesh.visible = true;
    bandMesh.position.set(SCREEN_X - 0.015, (top + bot) / 2, 0);
    bandMesh.scale.set((p2Active && idxs.length > 1) ? 0.48 : 0.34,
      Math.max(0.14, top - bot + 0.18), 1);
    if (idxs.length === 1){
      bandMat.map = BAND_WHITE;
      bandMat.color.setHex(SPECTRUM[idxs[0]].hex);
      bandMat.opacity = 0.85;
    } else if (state.mode === 'paper'){
      bandMat.map = BAND_WHITE;
      bandMat.color.setHex(0xff3b30);
      bandMat.opacity = 0.45;
    } else if (p2Active){
      bandMat.map = BAND_WHITE;          // 七色重新汇聚 → 白光
      bandMat.color.setHex(0xffffff);
      bandMat.opacity = 1.0;
    } else {
      bandMat.map = BAND_RAINBOW;
      bandMat.color.setHex(0xffffff);
      bandMat.opacity = 0.95;
    }
  } else {
    bandMesh.visible = false;
  }

  beams.end();
  drawScreen(hits, whiteY);

  // 白光汇聚点光晕
  if (whiteY != null){
    whiteGlow.position.set(SCREEN_X - 0.06, whiteY, 0);
    whiteGlow.scale.setScalar(0.72);
    whiteGlow.material.opacity = 0.55;
  } else {
    whiteGlow.material.opacity = 0;
  }

  /* --- 读数 --- */
  updateReadout(idxs.length, devMin, devMax);
  updateSpectrumPreview(idxs);
}

function updateReadout(n, dMin, dMax){
  const L = state.light;
  let html = '';
  if (state.mode === 'dispersion'){
    const lightName = L === 'white' ? '白光' : (L === 'red' ? '红光' : '紫光');
    if (n === 7){
      if (state.prism2){
        html = `白光经<b>第一块棱镜</b>分解为 7 种色光<br/>
                再经<b>倒置的第二块棱镜</b>重新汇聚<br/>
                光屏上复原为<span class="hl">白光</span> —— 白光由多种色光组成`;
      } else {
        html = `<b>${lightName}</b>通过三棱镜后分解为 <b>7</b> 种色光<br/>
                偏折角范围 <b>${dMin.toFixed(1)}°</b> ~ <b>${dMax.toFixed(1)}°</b><br/>
                偏折最小的是<span class="hl">红光</span>，最大的是<span class="hl">紫光</span>`;
      }
    } else {
      html = `<b>${lightName}</b>是单色光，通过三棱镜后<b>不再分解</b><br/>
              只发生偏折，偏折角 <b>${dMin.toFixed(1)}°</b>`;

      html += state.prism2
        ? `<br/>经过第二块棱镜后<span class="hl">仍是原色光</span>，无法合成白光`
        : `<br/>说明它只含一种色光`;
    }
  } else if (state.mode === 'filter'){
    if (L === 'purple'){
      html = `紫光被红色滤光玻璃<b>完全吸收</b><br/>光屏上<b>没有</b>光斑<br/>
              透明物体的颜色由<span class="hl">透过的色光</span>决定`;
    } else if (L === 'red'){
      html = `红光可以<b>透过</b>红色滤光玻璃<br/>光屏上出现红色光斑<br/>
              玻璃看起来是<span class="hl">红色</span>`;
    } else {
      html = `白光中的<span class="hl">红光</span>透过红色玻璃<br/>橙、黄、绿、蓝、靛、紫被<b>吸收</b><br/>
              光屏上只剩<b>一条</b>红色光带`;
    }
  } else {
    if (L === 'purple'){
      html = `紫光照射红色色纸<br/>被<b>全部吸收</b>，没有反射光<br/>
              所以色纸看起来是<span class="hl">黑色</span>的`;
    } else {
      html = `红色色纸<b>反射红光</b>、吸收其余色光<br/>反射光进入眼睛，纸才呈红色<br/>
              不透明物体的颜色由<span class="hl">反射的色光</span>决定`;
    }
  }
  $readout.innerHTML = html;
}

const HINTS = {
  dispersion:{
    obs:'光屏上出现了一条按红、橙、黄、绿、蓝、靛、紫排列的彩色光带。',
    ope:'拖动光源上下移动，光带在光屏上整体上下平移。',
    cmp:'把光源换成红光或紫光，比较它们偏折的角度。',
    q:'白光通过三棱镜后为什么会散开？哪种色光偏折得最厉害？'
  },
  filter:{
    obs:'红色滤光玻璃只让红光通过，其余色光被吸收。',
    ope:'换成紫光照射，观察光屏上是否还有光。',
    cmp:'比较白光、红光、紫光通过同一块红玻璃的结果。',
    q:'透明玻璃的颜色，是由它透过还是吸收的色光决定的？'
  },
  paper:{
    obs:'白光照射红色色纸，只有红光被反射出来。',
    ope:'观察彩色光带照到色纸上时，哪些地方变亮了。',
    cmp:'如果换成绿色色纸，反射出来的光会是什么颜色？',
    q:'不透明物体的颜色，是由它反射的色光决定的吗？'
  }
};

function updateHints(){ /* 提示面板已移除 */ }

/* ============================================================
   13. 交互
   ============================================================ */
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

const $rngBeam  = el('rngBeam');
const $rngPrism = el('rngPrism');

function syncUI(){
  const pct = (state.beamY - BEAM_MIN) / (BEAM_MAX - BEAM_MIN);
  $rngBeam.value = Math.round(pct * 1000);
  $valBeam.textContent = Math.round(pct * 100) + '%';
  $rngPrism.value = Math.round((state.prismY / PRISM_MAX) * 100);
  $valPrism.textContent = state.prismY.toFixed(2);
}

$rngBeam.addEventListener('input', () => {
  state.beamY = BEAM_MIN + ($rngBeam.value / 1000) * (BEAM_MAX - BEAM_MIN);
  syncUI(); update();
});
$rngPrism.addEventListener('input', () => {
  state.prismY = ($rngPrism.value / 100) * PRISM_MAX;
  syncUI(); update();
});

/* 模式 / 光源 */
el('modeSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  [...el('modeSeg').children].forEach(x => x.classList.toggle('on', x === b));
  state.mode = b.dataset.mode;
  filterGroup.visible = state.mode === 'filter';
  updateHints(); update();
});
el('lightSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  [...el('lightSeg').children].forEach(x => x.classList.toggle('on', x === b));
  state.light = b.dataset.light;
  update();
});

/* 第二棱镜开关 */
el('p2Seg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  [...el('p2Seg').children].forEach(x => x.classList.toggle('on', x === b));
  state.prism2 = b.dataset.p2 === 'on';
  update();
});

/* 右侧面板收起 / 展开，腾出旋转空间 */
const panelEl = document.querySelector('.panel');
const panelToggle = el('panelToggle');
panelToggle.addEventListener('click', () => {
  const collapsed = panelEl.classList.toggle('collapsed');
  panelToggle.textContent = collapsed ? '控制面板 · 展开' : '控制面板 · 收起';
  panelToggle.setAttribute('aria-expanded', String(!collapsed));
});

/* 拖动光源 / 三棱镜 */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const dragPlane = new THREE.Plane();
const camDir = new THREE.Vector3();
const tmpV = new THREE.Vector3();
const drag = { mode:null, offX:0, offY:0 };

function castRay(e){
  const r = canvas.getBoundingClientRect();
  ndc.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  ndc.y = -((e.clientY - r.top) / r.height) * 2 + 1;
  raycaster.setFromCamera(ndc, camera);
}

window.addEventListener('pointerdown', e => {
  if (e.target !== canvas || e.button !== 0) return;
  if (e.shiftKey) return; // Shift+拖动交给 OrbitControls 旋转视角
  castRay(e);
  const targets = prism2Group.visible ? [srcHit, prismHit, prism2Hit] : [srcHit, prismHit];
  const hits = raycaster.intersectObjects(targets, false);
  if (!hits.length) return;
  const obj = hits[0].object;
  drag.mode = obj === srcHit ? 'source' : (obj === prism2Hit ? 'prism2' : 'prism');
  camera.getWorldDirection(camDir);
  dragPlane.setFromNormalAndCoplanarPoint(camDir, obj.getWorldPosition(tmpV.clone()));
  if (!raycaster.ray.intersectPlane(dragPlane, tmpV)) return;
  const local = rig.worldToLocal(tmpV.clone());
  if (drag.mode === 'source'){
    drag.offX = local.x - state.sourceX;
    drag.offY = local.y - state.beamY;
  } else if (drag.mode === 'prism2'){
    drag.offX = 0;
    drag.offY = local.y - prism2Group.position.y;
    drag.baseOff = state.prism2Off;
  } else {
    drag.offX = 0;
    drag.offY = local.y - state.prismY;
  }
  controls.enabled = false;
  canvas.style.cursor = 'grabbing';
  el('tip').style.opacity = '0';
}, { capture:true });

window.addEventListener('pointermove', e => {
  if (!drag.mode){
    if (e.target !== canvas) return;
    castRay(e);
    const targets = prism2Group.visible ? [srcHit, prismHit, prism2Hit] : [srcHit, prismHit];
    const h = raycaster.intersectObjects(targets, false);
    canvas.style.cursor = h.length ? 'grab' : 'default';
    return;
  }
  castRay(e);
  if (!raycaster.ray.intersectPlane(dragPlane, tmpV)) return;
  const local = rig.worldToLocal(tmpV.clone());
  if (drag.mode === 'source'){
    state.sourceX = clamp(local.x - drag.offX, SRC_X_MIN, SRC_X_MAX);
    state.beamY   = clamp(local.y - drag.offY, BEAM_MIN, BEAM_MAX);
  } else if (drag.mode === 'prism2'){
    state.prism2Off = clamp(drag.baseOff + (local.y - drag.offY), -0.8, 0.8);
  } else {
    state.prismY = clamp(local.y - drag.offY, PRISM_MIN, PRISM_MAX);
  }
  syncUI(); update();
});

function endDrag(){
  if (!drag.mode) return;
  drag.mode = null;
  controls.enabled = true;
  canvas.style.cursor = 'default';
}
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);

/* 复位视角 */
let camTween = null;
el('btnView').addEventListener('click', () => {
  camTween = { t:0, p0: camera.position.clone(), t0: controls.target.clone() };
  controls.enabled = false;
});
function easeInOut(t){ return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2; }

/* 重置实验 */
el('btnReset').addEventListener('click', () => {
  state.mode = 'dispersion';
  state.light = 'white';
  state.beamY = 0.55;
  state.prismY = 0;
  state.sourceX = -3.85;
  state.prism2 = false;
  state.prism2Off = 0;
  [...el('modeSeg').children].forEach(x => x.classList.toggle('on', x.dataset.mode === 'dispersion'));
  [...el('lightSeg').children].forEach(x => x.classList.toggle('on', x.dataset.light === 'white'));
  [...el('p2Seg').children].forEach(x => x.classList.toggle('on', x.dataset.p2 === 'off'));
  filterGroup.visible = false;
  updateHints(); syncUI(); update();
  camTween = { t:0, p0: camera.position.clone(), t0: controls.target.clone() };
  controls.enabled = false;
});

/* ============================================================
   14. 循环
   ============================================================ */
const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (camTween){
    camTween.t = Math.min(1, camTween.t + dt * 1.8);
    const k = easeInOut(camTween.t);
    camera.position.lerpVectors(camTween.p0, CAM_HOME, k);
    controls.target.lerpVectors(camTween.t0, CAM_TARGET, k);
    camera.lookAt(controls.target);
    if (camTween.t >= 1){ camTween = null; controls.enabled = true; controls.update(); }
  } else {
    controls.update();
  }

  // 光源呼吸
  const t = clock.elapsedTime;
  const pulse = 0.94 + Math.sin(t * 2.2) * 0.05;
  srcGlow.material.opacity = 0.68 * pulse;
  srcGlow.scale.setScalar(1.05 * (1 + Math.sin(t * 1.7) * 0.02));

  // 入射点星芒闪烁
  if (entrySpark.material.opacity > 0){
    entrySpark.scale.setScalar(0.55 * (1 + Math.sin(t * 3.1) * 0.09));
  }

  // 第二棱镜平滑跟随光扇中心
  if (state.prism2 && state.mode === 'dispersion'){
    const p2Target = targetP2Y + state.prism2Off;
    const prev = prism2Group.position.y;
    prism2Group.position.y += (p2Target - prev) * Math.min(1, dt * 5);
    if (Math.abs(p2Target - prism2Group.position.y) > 5e-4) update();
  }

  composer.render();
}

/* ============================================================
   15. 启动
   ============================================================ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
  bloom.setSize(window.innerWidth, window.innerHeight);
});

syncUI();
updateHints();

/* 支持 URL 直达模式：#mode=filter&light=purple */
(function applyHash(){
  const p = new URLSearchParams(location.hash.slice(1));
  const m = p.get('mode'), l = p.get('light'), p2 = p.get('p2');
  if (m && HINTS[m]){ state.mode = m; filterGroup.visible = (m === 'filter'); }
  if (l && ['white','red','purple'].includes(l)) state.light = l;
  if (p2 === '1'){
    state.prism2 = true;
    [...el('p2Seg').children].forEach(x => x.classList.toggle('on', x.dataset.p2 === 'on'));
  }
  [...el('modeSeg').children].forEach(x => x.classList.toggle('on', x.dataset.mode === state.mode));
  [...el('lightSeg').children].forEach(x => x.classList.toggle('on', x.dataset.light === state.light));
  updateHints();
})();

update();
animate();
setTimeout(() => { el('tip').style.opacity = '0.55'; }, 5200);
</script>
