<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRYSTAL LAB · 晶体相变实验舱</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#070b11;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#a9c9dd;}
  #stage{position:fixed;inset:0;}
  /* ===== 左上 HUD 读数 ===== */
  .hud-left{position:fixed;top:20px;left:24px;z-index:10;pointer-events:none;}
  .brand{font-size:13px;letter-spacing:3px;color:#6fc0e6;text-shadow:0 0 14px rgba(80,190,255,.55);}
  .brand span{display:block;font-size:11px;letter-spacing:2px;color:#547187;margin-top:3px;}
  .temp{font-family:"Consolas","Courier New",monospace;font-size:46px;font-weight:600;color:#eaf8ff;
        text-shadow:0 0 22px rgba(90,200,255,.55),0 0 4px rgba(160,230,255,.8);line-height:1;margin-top:14px;}
  .temp i{font-style:normal;font-size:18px;color:#7fb4cf;margin-left:6px;}
  .temp b{font-weight:600;}
  .state{margin-top:8px;font-size:13px;letter-spacing:4px;color:#8fd9ff;
         border-left:2px solid #35c8ff;padding-left:8px;text-shadow:0 0 10px rgba(60,190,255,.5);}
  /* ===== 顶部标签 ===== */
  .tabbar{position:fixed;top:18px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:10;
    background:linear-gradient(180deg,rgba(18,28,38,.92),rgba(9,14,20,.92));
    border:1px solid rgba(80,175,225,.22);border-radius:14px;padding:6px;
    box-shadow:0 10px 30px rgba(0,0,0,.55),inset 0 1px 0 rgba(140,220,255,.12);backdrop-filter:blur(6px);}
  .tabbar button{padding:9px 22px;border:1px solid transparent;border-radius:10px;background:transparent;
    color:#7f9cb2;font-size:13px;letter-spacing:1px;cursor:pointer;transition:.22s;}
  .tabbar button:hover{color:#bfe4f8;}
  .tabbar button.active{color:#eaf9ff;border-color:rgba(90,200,255,.55);
    background:linear-gradient(180deg,rgba(35,120,180,.55),rgba(18,70,110,.45));
    box-shadow:0 0 18px rgba(60,180,255,.4),inset 0 1px 0 rgba(160,230,255,.4);}
  /* ===== 底部控制台 ===== */
  .console{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:10;
    display:flex;align-items:center;gap:16px;padding:12px 22px;border-radius:18px;
    background:linear-gradient(180deg,rgba(20,30,40,.95),rgba(8,13,19,.95));
    border:1px solid rgba(80,175,225,.22);
    box-shadow:0 14px 40px rgba(0,0,0,.6),inset 0 1px 0 rgba(140,220,255,.14);}
  .seg{width:64px;height:2px;border-radius:2px;
    background:linear-gradient(90deg,rgba(80,200,255,0),rgba(90,210,255,.85));}
  .seg.r{background:linear-gradient(90deg,rgba(90,210,255,.85),rgba(80,200,255,0));}
  .cbtn{width:62px;height:62px;border-radius:50%;cursor:pointer;transition:.22s;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    color:#a9cbe0;font-size:12px;letter-spacing:1px;
    border:1px solid rgba(90,190,235,.35);
    background:radial-gradient(circle at 34% 28%,#1c2b3a,#0a1017 78%);
    box-shadow:inset 0 1px 0 rgba(160,220,255,.18),0 4px 14px rgba(0,0,0,.5);}
  .cbtn:hover{color:#e4f6ff;border-color:rgba(120,220,255,.75);box-shadow:0 0 20px rgba(70,190,255,.4),inset 0 1px 0 rgba(180,235,255,.25);}
  .cbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;}
  #btnHeat.on{color:#ffd5ae;border-color:rgba(255,160,80,.85);
    background:radial-gradient(circle at 34% 28%,#3b2214,#150c07 78%);
    box-shadow:0 0 26px rgba(255,140,60,.6),inset 0 1px 0 rgba(255,200,150,.3);}
  /* ===== 曲线面板 ===== */
  #chartBox{position:fixed;left:20px;bottom:20px;z-index:9;padding:8px;border-radius:14px;
    background:linear-gradient(180deg,rgba(14,22,31,.95),rgba(7,12,18,.95));
    border:1px solid rgba(80,175,225,.25);
    box-shadow:0 12px 34px rgba(0,0,0,.6),inset 0 1px 0 rgba(120,200,240,.12);}
  #chartBox.hidden{display:none;}
  #chart{display:block;border-radius:8px;}
  /* ===== 3D 部件标签 ===== */
  .lbl{position:fixed;transform:translate(-50%,-50%);z-index:8;pointer-events:none;white-space:nowrap;
    font-size:11.5px;letter-spacing:1px;color:#bfe9ff;padding:3px 10px;border-radius:20px;
    background:rgba(8,16,24,.78);border:1px solid rgba(80,190,240,.45);
    box-shadow:0 0 14px rgba(40,150,220,.28),inset 0 0 10px rgba(60,170,230,.12);}
  #lead{position:fixed;inset:0;z-index:7;pointer-events:none;width:100%;height:100%;}
  #lead polyline{fill:none;stroke:#6fd2ff;stroke-width:1.3;opacity:.8;}
  #lead .dot{fill:#8fe4ff;}
  #lead .halo{fill:#59d2ff;opacity:.22;}
</style>
</head>
<body>
<div id="stage"></div>

<div class="hud-left">
  <div class="brand">CRYSTAL LAB<span>晶体相变实验舱</span></div>
  <div class="temp"><b id="tempVal">25.0</b><i>℃</i></div>
  <div class="state" id="stateTxt">固态</div>
</div>

<div class="tabbar">
  <button id="tabMelt" class="active">晶体熔化</button>
  <button id="tabFreeze">晶体凝固</button>
  <button id="tabWax">非晶体对比</button>
</div>

<div class="console">
  <div class="seg"></div>
  <button class="cbtn" id="btnHeat">
    <svg viewBox="0 0 24 24"><path d="M12 3c3 3.6 4.6 6.2 4.6 8.8A4.6 4.6 0 0 1 12 16.4a4.6 4.6 0 0 1-4.6-4.6C7.4 9.2 9 6.6 12 3z"/><path d="M12 16.4c1.4 0 2.4 1 2.4 2.3 0 1.4-1 2.3-2.4 2.3s-2.4-.9-2.4-2.3c0-1.3 1-2.3 2.4-2.3z"/></svg>
    <span id="heatTxt">加热</span>
  </button>
  <button class="cbtn" id="btnReset">
    <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4h-4"/></svg>
    <span>重置</span>
  </button>
  <button class="cbtn" id="btnCurve">
    <svg viewBox="0 0 24 24"><path d="M3 19V5"/><path d="M3 19h18"/><path d="M5 16l4-5 3 3 4-6 3 4"/></svg>
    <span>曲线</span>
  </button>
  <div class="seg r"></div>
</div>

<svg id="lead"></svg>
<div id="chartBox"><canvas id="chart" width="318" height="196"></canvas></div>
<div class="lbl" id="lblState">固态</div>
<div class="lbl" id="lblTherm">温度计</div>
<div class="lbl" id="lblBath">烧杯 · 水浴</div>
<div class="lbl" id="lblTube">试管</div>
<div class="lbl" id="lblHeater">加热台</div>
<div class="lbl" id="lblSample">海波 · 晶体样品</div>

<script type="importmap">
{"imports":{
  "three":"../../../../vendor/three/0.160.0/build/three.module.js",
  "three/addons/":"../../../../vendor/three/0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ================= 渲染器 / 场景 / 后期 ================= */
const stageEl = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
stageEl.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070b11);
scene.fog = new THREE.FogExp2(0x070b11, 0.012);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 300);
camera.position.set(15.4, 12.6, 24.4);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 7.15, 0);
controls.enableDamping = true; controls.dampingFactor = .055;
controls.minDistance = 12; controls.maxDistance = 60;
controls.maxPolarAngle = 1.46;
controls.enablePan = false;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const composer = new EffectComposer(renderer);
composer.setPixelRatio(Math.min(devicePixelRatio, 2));
composer.setSize(innerWidth, innerHeight);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), .26, .36, 1.25);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ================= 光照（暖背光 + 冷顶光） ================= */
scene.add(new THREE.HemisphereLight(0x5b7d99, 0x080b10, .45));
const key = new THREE.DirectionalLight(0xdceeff, 1.35);
key.position.set(9, 20, 14); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -18; key.shadow.camera.right = 18;
key.shadow.camera.top = 20; key.shadow.camera.bottom = -10;
key.shadow.camera.near = 1; key.shadow.camera.far = 70;
key.shadow.radius = 4; key.shadow.bias = -0.0008;
scene.add(key);
const warmRim = new THREE.DirectionalLight(0xffb078, .75);
warmRim.position.set(-14, 9, -12); scene.add(warmRim);
const coolRim = new THREE.DirectionalLight(0x5fc8ff, .5);
coolRim.position.set(14, 5, -11); scene.add(coolRim);
/* 正面柔光补光 */
const frontFill = new THREE.DirectionalLight(0x9fd0ee, .62);
frontFill.position.set(4, 7, 20); scene.add(frontFill);
const backGlow = new THREE.PointLight(0x6ec8ff, 40, 26, 2);
backGlow.position.set(0, 9, -9); scene.add(backGlow);
const warmGlow = new THREE.PointLight(0xff9a55, 30, 24, 2);
warmGlow.position.set(-11, 6, -6); scene.add(warmGlow);
const bounce = new THREE.DirectionalLight(0x89b9d8, .3);
bounce.position.set(-6, 16, 10); scene.add(bounce);

/* ================= 材质 ================= */
const M = {
  steel:   new THREE.MeshStandardMaterial({color:0xd8e3ee, metalness:.95, roughness:.26, envMapIntensity:1.7}),
  dark:    new THREE.MeshStandardMaterial({color:0x303b47, metalness:.85, roughness:.38, envMapIntensity:1.5}),
  darker:  new THREE.MeshStandardMaterial({color:0x2a3540, metalness:.8, roughness:.42, envMapIntensity:1.5}),
  brass:   new THREE.MeshStandardMaterial({color:0xd2a355, metalness:1, roughness:.26, envMapIntensity:1.9}),
  copper:  new THREE.MeshStandardMaterial({color:0xc07a50, metalness:1, roughness:.28, envMapIntensity:1.9}),
  cyan:    new THREE.MeshStandardMaterial({color:0xbdefff, emissive:0x3fc8ff, emissiveIntensity:1.7, roughness:.4, metalness:.2}),
  amber:   new THREE.MeshStandardMaterial({color:0xffd8a8, emissive:0xff9a3c, emissiveIntensity:1.1, roughness:.4, metalness:.2}),
  glass:   new THREE.MeshPhysicalMaterial({color:0xcfeeff, transparent:true, opacity:.09, roughness:.02,
             metalness:0, side:THREE.DoubleSide, depthWrite:false, envMapIntensity:1.1}),
  glassHi: new THREE.MeshPhysicalMaterial({color:0xdcf3ff, transparent:true, opacity:.11, roughness:.05,
             metalness:0, side:THREE.DoubleSide, depthWrite:false, envMapIntensity:1.0}),
  water:   new THREE.MeshPhysicalMaterial({color:0x2f9ecb, transparent:true, opacity:.45, roughness:.05,
             depthWrite:false, envMapIntensity:.75}),
  crystal: new THREE.MeshStandardMaterial({color:0xf4fbff, roughness:.12, metalness:0, flatShading:true,
             transparent:true, opacity:.96, depthWrite:false, emissive:0x9fd4f5, emissiveIntensity:.16}),
  pool:    new THREE.MeshPhysicalMaterial({color:0xbfe6ff, transparent:true, opacity:.62, roughness:.05,
             depthWrite:false, envMapIntensity:1.2}),
  wax:     new THREE.MeshStandardMaterial({color:0xf8f1da, roughness:.55, metalness:0, transparent:true,
             opacity:.98, depthWrite:false, emissive:0x8c7d55, emissiveIntensity:.1})
};

/* ================= 通用工具 ================= */
function radialTexture(){
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,'rgba(255,255,255,1)');
  gr.addColorStop(.4,'rgba(255,255,255,.38)');
  gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
}
const RTEX = radialTexture();
function glowSprite(color, size, x, y, z, opacity=.55){
  const s = new THREE.Sprite(new THREE.SpriteMaterial({map:RTEX, color, transparent:true,
    opacity, blending:THREE.AdditiveBlending, depthWrite:false}));
  s.scale.set(size, size, 1); s.position.set(x, y, z); scene.add(s); return s;
}
function mesh(geo, mat, x=0, y=0, z=0, shadow=true){
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  if(shadow){ m.castShadow = true; m.receiveShadow = true; }
  scene.add(m); return m;
}
function textSprite(text, color='#cfeaff', w=1.5, h=.75, px=40){
  const c = document.createElement('canvas'); c.width = 256; c.height = 128;
  const g = c.getContext('2d');
  g.font = `600 ${px}px "PingFang SC","Microsoft YaHei",sans-serif`;
  g.fillStyle = color; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.shadowColor = 'rgba(80,190,255,.85)'; g.shadowBlur = 12;
  g.fillText(text, 128, 66);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),
    transparent:true, depthWrite:false}));
  sp.scale.set(w, h, 1); return sp;
}

/* ================= 环境：地面 / 背墙 / 灯带 ================= */
const floor = new THREE.Mesh(new THREE.CircleGeometry(60, 64),
  new THREE.MeshStandardMaterial({color:0x0d141c, metalness:.55, roughness:.36}));
floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);
/* 地面光池 */
const poolLight = new THREE.Mesh(new THREE.PlaneGeometry(26, 26),
  new THREE.MeshBasicMaterial({map:RTEX, color:0x2f8fc4, transparent:true, opacity:.16,
    blending:THREE.AdditiveBlending, depthWrite:false}));
poolLight.rotation.x = -Math.PI/2; poolLight.position.y = .02; scene.add(poolLight);
/* 地面光环 */
const floorRing = mesh(new THREE.TorusGeometry(7.6, .045, 8, 96), M.cyan, 0, .05, 0, false);
floorRing.rotation.x = Math.PI/2;

/* 背墙 */
const wall = new THREE.Mesh(new THREE.PlaneGeometry(90, 40),
  new THREE.MeshStandardMaterial({color:0x121820, roughness:.92, metalness:.1}));
wall.position.set(0, 14, -22); wall.receiveShadow = true; scene.add(wall);
/* 背墙柔和暖光（氛围，不产生可见灯条） */
const wallGlow = glowSprite(0xff9a5a, 30, 0, 9, -21.4, .1);
wallGlow.material.opacity = .1;
/* ================= 主装置：晶体相变实验舱 ================= */
const G = new THREE.Group(); scene.add(G);
const add = (geo, mat, x, y, z, shadow=true) => {
  const m = new THREE.Mesh(geo, mat); m.position.set(x,y,z);
  if(shadow){ m.castShadow = true; m.receiveShadow = true; }
  G.add(m); return m;
};

/* 底座 */
add(new THREE.BoxGeometry(12.6, 1.0, 8.2), M.darker, 0, .5, 0);
add(new THREE.BoxGeometry(11.9, .42, 7.6), M.dark, 0, 1.18, 0);
add(new THREE.BoxGeometry(11.2, .1, 7.0), M.steel, 0, 1.44, 0);
/* 底座发光边条 */
add(new THREE.BoxGeometry(12.7, .05, .06), M.cyan, 0, 1.02, 4.12, false);
add(new THREE.BoxGeometry(12.7, .05, .06), M.cyan, 0, 1.02, -4.12, false);
add(new THREE.BoxGeometry(.06, .05, 8.3), M.cyan, 6.32, 1.02, 0, false);
add(new THREE.BoxGeometry(.06, .05, 8.3), M.cyan, -6.32, 1.02, 0, false);
/* 底座螺栓 */
for(const sx of [-5.4, -3.0, 3.0, 5.4]) for(const sz of [-3.0, 3.0]){
  add(new THREE.CylinderGeometry(.13,.13,.12,12), M.steel, sx, 1.52, sz);
}
/* 底座正面：控制条 + 发光槽 + 圆形徽标 */
add(new THREE.BoxGeometry(7.2, .62, .1), M.darker, 0, .82, 4.09);
for(let i=-1;i<=1;i++){
  add(new THREE.BoxGeometry(1.5, .11, .04), M.cyan, i*2.1, .82, 4.16, false);
}
add(new THREE.TorusGeometry(.42, .05, 8, 32), M.steel, 0, .3, 4.12, false);
for(let i=0;i<6;i++){
  const a = i/6*Math.PI*2;
  add(new THREE.BoxGeometry(.07,.16,.04), M.brass, Math.cos(a)*.42, .3+Math.sin(a)*.42, 4.14, false);
}
/* 侧面散热格栅 */
for(const s of [-1,1]){
  for(let i=0;i<5;i++){
    add(new THREE.BoxGeometry(.12, .5, 1.5), M.steel, s*6.3, 1.05, -2.4 + i*.9, false);
  }
}
/* 舱体平台 */
add(new THREE.CylinderGeometry(4.7, 4.9, .32, 64), M.dark, 0, 1.62, 0);
const baseRing = add(new THREE.TorusGeometry(4.68, .055, 10, 96), M.cyan, 0, 1.79, 0, false);
baseRing.rotation.x = Math.PI/2;
glowSprite(0x49c6ff, 11, 0, 1.75, 0, .5);

/* 立柱 + 顶梁 */
[-5.35, 5.35].forEach(x => {
  add(new THREE.BoxGeometry(.5, 12.4, .5), M.dark, x, 6.9, -1.2);
  add(new THREE.BoxGeometry(.62, .3, .62), M.steel, x, 1.55, -1.2);
  add(new THREE.BoxGeometry(.22, 11.6, .06), M.darker, x + .3, 6.9, -1.2);
});
add(new THREE.BoxGeometry(11.2, .46, .52), M.dark, 0, 13.05, -1.2);
add(new THREE.BoxGeometry(11.3, .07, .58), M.cyan, 0, 13.3, -1.2, false);

/* 玻璃舱 */
const chamber = add(new THREE.CylinderGeometry(4.35, 4.35, 10.2, 64, 1, true), M.glass, 0, 7.1, 0, false);
chamber.renderOrder = 6;
/* 舱体上下金属环 */
[2.02, 12.12].forEach(y => {
  const r = add(new THREE.TorusGeometry(4.4, .1, 12, 96), M.steel, 0, y, 0);
  r.rotation.x = Math.PI/2;
});
/* 竖直支柱（舱壁外） */
for(const a of [0.6, 2.7, 4.2, 5.5]){
  add(new THREE.BoxGeometry(.07, 10.2, .07), M.steel, Math.cos(a)*4.42, 7.1, Math.sin(a)*4.42);
}
/* 顶盖 + 旋钮 */
add(new THREE.CylinderGeometry(4.5, 4.5, .5, 64), M.dark, 0, 12.4, 0);
add(new THREE.CylinderGeometry(4.55, 4.55, .1, 64), M.brass, 0, 12.68, 0);
add(new THREE.CylinderGeometry(1.5, 1.7, .55, 32), M.steel, 0, 12.95, 0);
add(new THREE.CylinderGeometry(.9, 1.1, .38, 32), M.brass, 0, 13.35, 0);
add(new THREE.CylinderGeometry(.35, .35, .3, 24), M.steel, 0, 13.6, 0);
/* 顶盖小孔环 */
for(let i=0;i<8;i++){
  const a = i/8*Math.PI*2;
  add(new THREE.CylinderGeometry(.07,.07,.06,10), M.cyan, Math.cos(a)*3.3, 12.66, Math.sin(a)*3.3, false);
}
/* 舱内冷光（让内部器材可读） */
const innerLight = new THREE.PointLight(0x7fd2ff, 3.2, 8, 2);
innerLight.position.set(0, 6.4, 0); G.add(innerLight);

/* 舱内扫描光环（科幻感） */
const scanRing = add(new THREE.TorusGeometry(4.0, .022, 8, 80), M.cyan, 0, 4, 0, false);
scanRing.rotation.x = Math.PI/2;
scanRing.material = new THREE.MeshBasicMaterial({color:0x8fe4ff, transparent:true, opacity:.55,
  blending:THREE.AdditiveBlending, depthWrite:false});

/* 左侧铭牌 */
const plate = add(new THREE.BoxGeometry(2.6, .62, .08), M.dark, -5.36, 5.6, -1.2);
const plateTxt = textSprite('CRYSTAL LAB', '#8fe4ff', 2.2, .55, 30);
plateTxt.position.set(-5.36, 5.6, -1.12); G.add(plateTxt);

/* ================= 舱内实验器材 ================= */
/* 加热模块 */
const heater = add(new THREE.CylinderGeometry(3.35, 3.35, .26, 64), M.dark, 0, 2.15, 0);
const heaterRing1 = add(new THREE.TorusGeometry(2.7, .05, 8, 64), M.amber, 0, 2.29, 0, false);
heaterRing1.rotation.x = Math.PI/2;
const heaterRing2 = add(new THREE.TorusGeometry(1.7, .045, 8, 48), M.amber, 0, 2.29, 0, false);
heaterRing2.rotation.x = Math.PI/2;
const heaterGlow = glowSprite(0xff8f3a, 6.5, 0, 2.4, 0, 0);
const heatLight = new THREE.PointLight(0xff9a4a, 0, 12, 2);
heatLight.position.set(0, 2.9, 0); G.add(heatLight);

/* 烧杯（水浴） */
const beaker = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 3.2, 6.0, 64, 1, true), M.glassHi);

/* ================= 物理模型 ================= */
const MP = 48;
const S = {mode:'melt', heating:false, t:0, waterT:22, sampleT:25, solid:1, soft:0, pts:[], rec:0};
const $ = id => document.getElementById(id);
const btnHeat = $('btnHeat'), btnReset = $('btnReset'), btnCurve = $('btnCurve');
const chartBox = $('chartBox'), lblState = $('lblState'), lblTherm = $('lblTherm'), lblBath = $('lblBath');
const tempVal = $('tempVal'), stateTxt = $('stateTxt'), heatTxt = $('heatTxt');

function initMode(m){
  S.mode = m;
  const tabIds = {melt:'tabMelt', freeze:'tabFreeze', wax:'tabWax'};
  document.querySelectorAll('.tabbar button').forEach(b => b.classList.remove('active'));
  const activeTab = document.getElementById(tabIds[m]);
  if(activeTab) activeTab.classList.add('active'); S.heating = false; S.t = 0; S.pts = []; S.rec = 0;
  if(m === 'freeze'){ S.waterT = 78; S.sampleT = 72; S.solid = 0; }
  else { S.waterT = 22; S.sampleT = 25; S.solid = 1; }
  S.soft = 0;
  btnHeat.classList.remove('on'); heatTxt.textContent = '加热';
  const isWax = (m === 'wax');
  $('lblSample').textContent = isWax ? '石蜡 · 非晶体样品' : '海波 · 晶体样品';
  chunkGroup.visible = !isWax;
  pool3d.visible = !isWax;
  wax.visible = isWax;
  updateVisuals(0);
  drawChart();
}

function update(dt){
  const target = S.heating ? 85 : 22;
  S.waterT += THREE.MathUtils.clamp(target - S.waterT, -2.2*dt, 6*dt);
  if(S.mode === 'wax'){
    S.sampleT += (S.waterT - S.sampleT) * .45 * dt;
  } else {
    const mRate = .13 * Math.min(Math.max((S.waterT - MP)/20, .15), 1.6);
    const fRate = .13 * Math.min(Math.max((MP - S.waterT)/20, .15), 1.6);
    if(S.solid > 0 && S.solid < 1){
      S.sampleT = MP;
      if(S.waterT > MP) S.solid = Math.max(0, S.solid - mRate*dt);
      else if(S.waterT < MP) S.solid = Math.min(1, S.solid + fRate*dt);
    } else {
      S.sampleT += (S.waterT - S.sampleT) * .45 * dt;
      if(S.solid === 1 && S.sampleT >= MP && S.waterT > MP){
        S.sampleT = MP; S.solid = Math.max(0, S.solid - mRate*dt);
      } else if(S.solid === 0 && S.sampleT <= MP && S.waterT < MP){
        S.sampleT = MP; S.solid = Math.min(1, S.solid + fRate*dt);
      }
    }
  }
  S.soft = THREE.MathUtils.clamp((S.sampleT - 42)/25, 0, 1);
  S.rec += dt;
  if(S.rec > .35){ S.rec = 0; S.pts.push({t:S.t, T:S.sampleT}); if(S.pts.length > 900) S.pts.shift(); }
  S.t += dt;
}

function updateVisuals(dt){
  /* 样品形态 */
  if(S.mode === 'wax'){
    wax.scale.set(1+.15*S.soft, 1-.55*S.soft, 1+.15*S.soft);
    M.wax.roughness = .55 - .35*S.soft;
    M.wax.opacity = .98 - .28*S.soft;
  } else {
    chunkGroup.visible = S.solid > .001;
    const cs = .4 + .6*S.solid;
    chunks.forEach(c => c.scale.setScalar(cs));
    const ph = (1-S.solid)*1.7;
    pool3d.visible = ph > .02;
    pool3d.scale.y = Math.max(ph, .001);
    pool3d.position.y = 2.9 + ph/2;
  }
  redCol.scale.y = THREE.MathUtils.clamp((S.sampleT-20)/70, .01, 1) * 6.6;
  /* 加热视觉 */
  const on = S.heating;
  heaterRing1.material = on ? M.amber : M.dark;
  heaterRing2.material = on ? M.amber : M.dark;
  heaterGlow.material.opacity = on ? .5 + .12*Math.sin(el*6) : 0;
  heatLight.intensity = on ? 12 + 3*Math.sin(el*8) : 0;
  /* 水色随温度 */
  const heatRatio = THREE.MathUtils.clamp((S.waterT-22)/63, 0, 1);
  M.water.color.setHSL(0.56 - 0.10*heatRatio, .68, .40 + .05*heatRatio);
}

/* ================= 温度曲线 ================= */
const chart = $('chart'), cctx = chart.getContext('2d');
const W = 318, H = 196, L = 34, R = 12, TP = 16, B = 26;
function drawChart(){
  cctx.clearRect(0,0,W,H);
  cctx.fillStyle = '#08121a'; cctx.fillRect(0,0,W,H);
  const tMax = Math.max(60, S.t);
  const X = t => L + (t/tMax)*(W-L-R);
  const Y = T => TP + (95-T)/(95-15)*(H-TP-B);
  /* 网格 */
  cctx.lineWidth = 1; cctx.font = '9px "Consolas",monospace';
  for(let T=20; T<=90; T+=10){
    const y = Y(T);
    cctx.strokeStyle = 'rgba(70,180,230,.14)';
    cctx.beginPath(); cctx.moveTo(L,y); cctx.lineTo(W-R,y); cctx.stroke();
    cctx.fillStyle = 'rgba(140,196,224,.75)'; cctx.fillText(T, 10, y+3);
  }
  for(let i=1;i<=4;i++){
    const x = L + i/5*(W-L-R);
    cctx.strokeStyle = 'rgba(70,180,230,.07)';
    cctx.beginPath(); cctx.moveTo(x,TP); cctx.lineTo(x,H-B); cctx.stroke();
  }
  /* 熔点线 */
  if(S.mode !== 'wax'){
    const y = Y(MP);
    cctx.setLineDash([4,4]); cctx.strokeStyle = 'rgba(255,178,77,.85)';
    cctx.beginPath(); cctx.moveTo(L,y); cctx.lineTo(W-R,y); cctx.stroke();
    cctx.setLineDash([]);
    cctx.fillStyle = '#ffb24d';
    cctx.fillText(S.mode==='freeze' ? '凝固点 48℃' : '熔点 48℃', L+4, y-4);
  }
  /* 坐标轴 */
  cctx.strokeStyle = 'rgba(90,190,235,.4)';
  cctx.beginPath(); cctx.moveTo(L,TP); cctx.lineTo(L,H-B); cctx.lineTo(W-R,H-B); cctx.stroke();
  cctx.fillStyle = 'rgba(140,196,224,.75)';
  cctx.fillText('t/s', W-30, H-8);
  cctx.fillText('T/℃', L+4, TP+9);
  /* 曲线 */
  if(S.pts.length > 1){
    cctx.shadowColor = 'rgba(255,86,60,.75)'; cctx.shadowBlur = 9;
    cctx.strokeStyle = '#ff5c46'; cctx.lineWidth = 2;
    cctx.beginPath();
    S.pts.forEach((p,i)=>{ const x=X(p.t), y=Y(p.T); i ? cctx.lineTo(x,y) : cctx.moveTo(x,y); });
    cctx.stroke();
    /* 当前点 */
    const last = S.pts[S.pts.length-1];
    cctx.fillStyle = '#ffd0c6';
    cctx.beginPath(); cctx.arc(X(last.t), Y(last.T), 2.6, 0, 6.283); cctx.fill();
    cctx.shadowBlur = 0;
  }
}

/* ================= 标签投影 ================= */
/* 标签配置：3D 锚点 + 屏幕偏移（正=右/下），引线自动绘制 */
const LABELS = [
  {el:'lblTherm',  anchor:new THREE.Vector3(-.2, 13.0, 0),   dx:-160, dy:-74},
  {el:'lblTube',   anchor:new THREE.Vector3(1.0, 10.3, 0),   dx: 200, dy:-58},
  {el:'lblBath',   anchor:new THREE.Vector3(-3.15, 7.6, .3), dx:-186, dy:-24},
  {el:'lblSample', anchor:new THREE.Vector3(-.8, 4.35, .5),  dx:-196, dy: 6},
  {el:'lblState',  anchor:new THREE.Vector3(.85, 3.45, .5),  dx: 212, dy: 34},
  {el:'lblHeater', anchor:new THREE.Vector3(-2.3, 2.3, 1.1), dx:-218, dy: 56},
];
const v3 = new THREE.Vector3();
const leadSvg = document.getElementById('lead');
const SVGNS = 'http://www.w3.org/2000/svg';
LABELS.forEach(L => {
  L.dom = document.getElementById(L.el);
  L.g = document.createElementNS(SVGNS,'g');
  L.halo = document.createElementNS(SVGNS,'circle'); L.halo.setAttribute('class','halo'); L.halo.setAttribute('r','7');
  L.dot  = document.createElementNS(SVGNS,'circle'); L.dot.setAttribute('class','dot');  L.dot.setAttribute('r','2.8');
  L.line = document.createElementNS(SVGNS,'polyline');
  L.g.append(L.halo, L.line, L.dot); leadSvg.append(L.g);
});
function placeLbl(L){
  v3.copy(L.anchor).project(camera);
  if(v3.z > 1){ L.dom.style.display = 'none'; L.g.style.display = 'none'; return; }
  L.dom.style.display = ''; L.g.style.display = '';
  const ax = (v3.x*.5+.5)*innerWidth, ay = (-v3.y*.5+.5)*innerHeight;
  let lx = ax + L.dx, ly = ay + L.dy;
  lx = Math.min(Math.max(lx, 80), innerWidth-80);
  ly = Math.min(Math.max(ly, 24), innerHeight-24);
  L.dom.style.left = lx + 'px';
  L.dom.style.top  = ly + 'px';
  const w = L.dom.offsetWidth/2 + 3;
  const sgn = L.dx >= 0 ? 1 : -1;
  const ex = lx - sgn*w;
  L.line.setAttribute('points', `${ax},${ay} ${ex - sgn*16},${ly} ${ex},${ly}`);
  L.dot.setAttribute('cx',ax);  L.dot.setAttribute('cy',ay);
  L.halo.setAttribute('cx',ax); L.halo.setAttribute('cy',ay);
}

/* ================= 交互 ================= */
$('tabMelt').onclick   = e => setTab(e, 'melt');
$('tabFreeze').onclick = e => setTab(e, 'freeze');
$('tabWax').onclick    = e => setTab(e, 'wax');
function setTab(e, m){
  document.querySelectorAll('.tabbar button').forEach(b => b.classList.remove('active'));
  e.currentTarget.classList.add('active');
  initMode(m);
}
btnHeat.onclick = () => {
  S.heating = !S.heating;
  btnHeat.classList.toggle('on', S.heating);
  heatTxt.textContent = S.heating ? '停止' : '加热';
};
btnReset.onclick = () => initMode(S.mode);
btnCurve.onclick = () => {
  const hidden = chartBox.classList.toggle('hidden');
  $('btnCurve').style.opacity = hidden ? .55 : 1;
};

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
const qs = new URLSearchParams(location.search);
const STILL = qs.has('still');
let frames = 0;
let el = 0;
function animate(){
  requestAnimationFrame(animate);
  frames++;
  const dt = STILL ? 0 : Math.min(clock.getDelta(), .05);
  el += STILL ? 0 : dt;

  update(dt);
  updateVisuals(dt);

  /* 扫描环 */
  scanRing.position.y = 4.2 + 4.6*(0.5+0.5*Math.sin(el*.7));
  scanRing.material.opacity = .28 + .25*Math.sin(el*.7);

  /* 气泡 */
  bubbles.forEach(b => {
    b.visible = S.heating;
    if(S.heating){ b.position.y += b.userData.spd*dt; if(b.position.y > 6.9) b.position.y = 2.4; }
  });

  /* 标签 + HUD */
  let st;
  if(S.mode === 'wax') st = S.soft < .15 ? '固态' : (S.soft > .75 ? '液态' : '变软');
  else st = S.solid > .98 ? '固态' : (S.solid < .02 ? '液态' : '固液共存');
  lblState.textContent = st; stateTxt.textContent = st;
  tempVal.textContent = S.sampleT.toFixed(1);
  LABELS.forEach(placeLbl);

  if(!chartBox.classList.contains('hidden')) drawChart();
  controls.update();
  composer.render();
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloom.setSize(innerWidth, innerHeight);
});

initMode('melt');
if(qs.has('mode')) initMode(qs.get('mode'));
if(qs.has('heat')){ S.heating = true; btnHeat.classList.add('on'); heatTxt.textContent = '停止'; }
const warm = parseFloat(qs.get('warm') || '0');
for(let i=0; i<warm*30; i++){ update(1/30); el += 1/30; }
animate();
</script>
