<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>蒸发与沸腾 · 3D 物理实验模拟器</title>
<style>
  :root{
    --c1:#00e5ff;   /* 青 */
    --c2:#7b5cff;   /* 紫 */
    --c3:#ff4fa3;   /* 粉 */
    --c4:#4a7cff;   /* 蓝 */
    --c5:#5cffc4;   /* 薄荷 */
    --ink:#e4efff;
    --muted:#8ea8cc;
    --panel:rgba(11,19,42,.68);
    --border:rgba(120,170,255,.24);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:100%;height:100%;overflow:hidden;}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    background:
      radial-gradient(900px 700px at 74% 16%, rgba(123,92,255,.20), transparent 62%),
      radial-gradient(820px 700px at 20% 80%, rgba(0,229,255,.16), transparent 62%),
      radial-gradient(700px 600px at 62% 92%, rgba(255,79,163,.10), transparent 62%),
      linear-gradient(160deg,#050914 0%,#0a1228 52%,#070c1c 100%);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  /* 科技网格底纹 */
  body::before{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:
      linear-gradient(rgba(120,170,255,.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,170,255,.055) 1px, transparent 1px);
    background-size:48px 48px;
    -webkit-mask-image:radial-gradient(ellipse at 50% 50%, #000 38%, transparent 88%);
    mask-image:radial-gradient(ellipse at 50% 50%, #000 38%, transparent 88%);
  }
  #stage{position:fixed;inset:0;z-index:1;}
  canvas{display:block;}

  /* ---------- 顶部标题 ---------- */
  #title{
    position:fixed;top:22px;left:50%;transform:translateX(-50%);
    text-align:center;pointer-events:none;z-index:5;
  }
  #title h1{
    font-size:21px;font-weight:800;letter-spacing:1.5px;
    background:linear-gradient(90deg,#00e5ff,#7b5cff 45%,#ff4fa3 72%,#5cffc4);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 14px rgba(123,92,255,.55));
  }
  #title p{font-size:11px;color:#9fb8dd;margin-top:4px;letter-spacing:3px;}

  /* ---------- 控制面板 ---------- */
  #panel{
    position:fixed;top:22px;left:22px;width:250px;z-index:6;
    background:linear-gradient(160deg,rgba(16,26,52,.82),rgba(8,14,32,.72));
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px 16px 14px;
    box-shadow:0 14px 44px rgba(0,0,0,.52), 0 0 0 1px rgba(0,229,255,.07),
               inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter:blur(16px);
  }
  #panel::before{
    content:'';position:absolute;top:0;left:16px;right:16px;height:2px;border-radius:2px;
    background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3),var(--c5));
    box-shadow:0 0 12px rgba(0,229,255,.5);
  }
  .p-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
  .p-head .dot{width:8px;height:8px;border-radius:50%;background:#5a7299;box-shadow:0 0 0 4px rgba(90,114,153,.16);transition:.3s;}
  .p-head .dot.on{background:var(--c3);box-shadow:0 0 12px var(--c3),0 0 0 5px rgba(255,79,163,.2);}
  .p-head span{font-size:12px;font-weight:700;letter-spacing:1px;color:#bcd2f0;}

  .temp-box{
    background:linear-gradient(160deg,rgba(5,11,26,.92),rgba(14,24,50,.72));
    border:1px solid rgba(120,170,255,.18);
    border-radius:12px;padding:12px 14px;margin-bottom:12px;
    box-shadow:inset 0 0 20px rgba(0,229,255,.05);
  }
  .temp-label{font-size:11px;color:#88a3c8;letter-spacing:1px;}
  .temp-value{display:flex;align-items:baseline;gap:3px;margin-top:2px;}
  .temp-value b{
    font-size:42px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;
    background:linear-gradient(90deg,#00e5ff,#7b5cff 58%,#ff4fa3);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 10px rgba(0,229,255,.35));
  }
  .temp-value i{font-style:normal;font-size:17px;color:#88a3c8;}
  .bar{height:6px;border-radius:6px;background:rgba(120,170,255,.14);margin-top:10px;overflow:hidden;}
  .bar>div{
    height:100%;width:0%;border-radius:6px;
    background:linear-gradient(90deg,#00e5ff,#7b5cff,#ff4fa3,#ffcf5c);
    box-shadow:0 0 12px rgba(0,229,255,.7);transition:width .12s linear;
  }

  #status{
    display:inline-block;font-size:11px;font-weight:700;letter-spacing:.5px;
    padding:5px 10px;border-radius:20px;margin-bottom:12px;
    background:rgba(10,20,44,.8);color:#a9c2e6;border:1px solid rgba(120,170,255,.25);
    transition:.3s;
  }
  #status.warm{color:#ffcf5c;border-color:rgba(255,207,92,.55);box-shadow:0 0 14px rgba(255,207,92,.22);}
  #status.evap{color:#00e5ff;border-color:rgba(0,229,255,.55);box-shadow:0 0 14px rgba(0,229,255,.22);}
  #status.boil{color:#ff4fa3;border-color:rgba(255,79,163,.6);box-shadow:0 0 14px rgba(255,79,163,.3);}

  .btn{
    width:100%;border:none;border-radius:11px;padding:11px 0;
    font-size:13px;font-weight:800;letter-spacing:1px;cursor:pointer;
    color:#061024;
    background:linear-gradient(100deg,#00e5ff,#7b5cff,#ff4fa3);
    background-size:200% 100%;
    box-shadow:0 6px 22px rgba(123,92,255,.42);transition:.25s;
    font-family:inherit;
  }
  .btn:hover{background-position:100% 0;transform:translateY(-1px);box-shadow:0 9px 28px rgba(255,79,163,.5);}
  .btn.stop{background:linear-gradient(100deg,#ffcf5c,#ff7a45,#ff4fa3);box-shadow:0 6px 22px rgba(255,79,163,.4);}
  .btn.ghost{
    margin-top:8px;background:rgba(20,32,60,.6);color:#bcd2f0;
    border:1px solid var(--border);box-shadow:none;
  }
  .btn.ghost:hover{background:rgba(30,46,80,.8);box-shadow:0 4px 14px rgba(0,229,255,.16);}
  .btn.audio{
    margin-top:8px;background:rgba(20,32,60,.6);color:#7ee9ff;
    border:1px solid rgba(0,229,255,.35);box-shadow:none;
    font-size:12px;padding:9px 0;
  }
  .btn.audio:hover{background:rgba(0,229,255,.12);box-shadow:0 0 14px rgba(0,229,255,.2);}
  .btn.audio.muted{color:#8197b8;border-color:rgba(120,170,255,.2);}

  .row{display:flex;align-items:center;gap:8px;margin-top:13px;}
  .row label{font-size:11px;color:#8ea8cc;white-space:nowrap;}
  .row input[type=range]{flex:1;accent-color:var(--c1);height:4px;}
  .row .pv{font-size:11px;font-weight:800;color:#7ee9ff;width:30px;text-align:right;}

  #hint{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    font-size:11px;color:#8ea8cc;letter-spacing:1px;z-index:5;pointer-events:none;
    background:rgba(8,16,36,.62);padding:7px 16px;border-radius:20px;
    border:1px solid rgba(120,170,255,.18);backdrop-filter:blur(8px);
  }

  /* ---------- 贴附标签 ---------- */
  .obj-label{
    display:flex;align-items:center;gap:6px;
    font-size:12px;font-weight:700;letter-spacing:.5px;color:#eaf4ff;
    background:rgba(8,16,36,.84);
    border:1px solid rgba(0,229,255,.55);
    padding:3px 10px 3px 8px;border-radius:20px;
    box-shadow:0 0 16px rgba(0,229,255,.25), inset 0 0 10px rgba(0,229,255,.07);
    backdrop-filter:blur(6px);white-space:nowrap;
    transform:translate(-50%,-50%);
    transition:opacity .25s;
  }
  .obj-label .pip{width:7px;height:7px;border-radius:50%;background:var(--c1);box-shadow:0 0 9px var(--c1);}
  .obj-label.water .pip{background:#63b8ff;box-shadow:0 0 9px #63b8ff;}
  .obj-label.steam .pip{background:#c3a6ff;box-shadow:0 0 9px #c3a6ff;}
  .obj-label.bub .pip{background:#ff8fd0;box-shadow:0 0 9px #ff8fd0;}

  #loading{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#070c1c;z-index:20;font-size:14px;color:#8ea8cc;letter-spacing:3px;
    transition:opacity .6s;
  }
</style>
</head>
<body>
<div id="stage"></div>

<div id="loading">正在加载 3D 实验场景…</div>

<div id="title">
  <h1>蒸发与沸腾 · 3D 实验模拟器</h1>
  <p>初中物理 · 水的物态变化</p>
</div>

<div id="panel">
  <div class="p-head"><span class="dot" id="heatDot"></span><span>加热控制台</span></div>
  <div class="temp-box">
    <div class="temp-label">THERMOMETER · 当前水温</div>
    <div class="temp-value"><b id="tempVal">20.0</b><i>℃</i></div>
    <div class="bar"><div id="tempBar"></div></div>
  </div>
  <div id="status">待机 · 室温 20℃</div>
  <button class="btn" id="toggleBtn">开启加热</button>
  <button class="btn ghost" id="resetBtn">重置实验</button>
  <button class="btn audio" id="audioBtn">🔊 音效：开</button>
  <div class="row">
    <label>加热功率</label>
    <input type="range" id="power" min="0.5" max="2" step="0.1" value="1" />
    <span class="pv" id="powerVal">1.0×</span>
  </div>
</div>

<div id="hint">拖拽旋转视角 · 滚轮缩放 · 空格键开关加热</div>

<script type="importmap">
{
  "imports": {
    "three": "../../../../vendor/three/0.160.0/build/three.module.js",
    "three/addons/": "../../../../vendor/three/0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ============ 常量 / 状态 ============ */
const BEAKER_BOTTOM = 0.30, BEAKER_H = 2.60, BEAKER_R = 1.15;
const BEAKER_TOP = BEAKER_BOTTOM + BEAKER_H;
const WATER_BOTTOM = 0.35, WATER_TOP = 1.95;
const BOIL = 100;

let temperature = 20;
let heating = false;
let power = 1.0;
let bubbleIntensity = 0, vaporIntensity = 0;
let firstFrame = true;

const clamp = (v,a,b)=>Math.min(b,Math.max(a,v));
const smooth = (a,b,v)=>{const t=clamp((v-a)/(b-a),0,1);return t*t*(3-2*t);};

/* ============ 渲染器 ============ */
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('stage').appendChild(renderer.domElement);

/* 标签渲染层 */
const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, {position:'absolute',top:'0',left:'0',pointerEvents:'none'});
document.getElementById('stage').appendChild(labelRenderer.domElement);

/* ============ 场景 / 相机 ============ */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 100);
camera.position.set(5.6, 4.3, 7.6);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.65, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 5;
controls.maxDistance = 16;
controls.minPolarAngle = 0.25;
controls.maxPolarAngle = Math.PI/2 - 0.02;
controls.update();

/* 环境反射（玻璃虹彩 / 金属质感） */
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ============ 灯光：深色科技 + 彩色氛围 ============ */
scene.add(new THREE.HemisphereLight(0x9fc4ff, 0x0a1030, 0.85));
scene.add(new THREE.AmbientLight(0x6688cc, 0.35));
const key = new THREE.DirectionalLight(0xffffff, 1.7);
key.position.set(5, 9, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left=-8; key.shadow.camera.right=8;
key.shadow.camera.top=8;  key.shadow.camera.bottom=-8;
key.shadow.bias = -0.0004;
key.shadow.radius = 3;
scene.add(key);
const fill = new THREE.DirectionalLight(0x7b5cff, 1.0);
fill.position.set(-6, 4, -5);
scene.add(fill);
const rimCyan = new THREE.PointLight(0x00e5ff, 1.5, 16);
rimCyan.position.set(4.5, 3.2, -3);
scene.add(rimCyan);
const rimPink = new THREE.PointLight(0xff4fa3, 1.2, 16);
rimPink.position.set(-4.5, 2.2, 4);
scene.add(rimPink);
const heatLight = new THREE.PointLight(0xff7a3c, 0, 5);
heatLight.position.set(0, 0.45, 0);
scene.add(heatLight);

/* 科技网格地面 */
const grid = new THREE.GridHelper(30, 30, 0x1d5a8a, 0x123050);
grid.position.y = -0.03;
grid.material.transparent = true;
grid.material.opacity = 0.32;
scene.add(grid);

/* 接影地面 */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60,60),
  new THREE.ShadowMaterial({opacity:0.22})
);
ground.rotation.x = -Math.PI/2;
ground.position.y = -0.025;
ground.receiveShadow = true;
scene.add(ground);

/* ============ 材质：七彩虹彩质感 ============ */
const matMetal = new THREE.MeshStandardMaterial({color:0x2b3654, metalness:0.9, roughness:0.26, emissive:0x0a1830, emissiveIntensity:0.4});
const matDark  = new THREE.MeshStandardMaterial({color:0x161f38, metalness:0.8, roughness:0.34, emissive:0x08122a, emissiveIntensity:0.35});
const matGlass = new THREE.MeshPhysicalMaterial({
  color:0xbfe6ff, metalness:0, roughness:0.05, transmission:0.92,
  thickness:0.3, ior:1.46, transparent:true, side:THREE.DoubleSide,
  clearcoat:1, clearcoatRoughness:0.05, envMapIntensity:1.25,
  iridescence:1, iridescenceIOR:1.35, iridescenceThicknessRange:[120,500]
});
const matWater = new THREE.MeshPhysicalMaterial({
  color:0x3f92d8, metalness:0.1, roughness:0.1, transmission:0.82,
  thickness:0.8, ior:1.333, transparent:true, opacity:0.68, depthWrite:false,
  side:THREE.DoubleSide, clearcoat:0.8, envMapIntensity:1.15,
  emissive:0x0a2a5a, emissiveIntensity:0.16,
  iridescence:0.45, iridescenceIOR:1.3, iridescenceThicknessRange:[100,420]
});
const matWaterTop = new THREE.MeshPhysicalMaterial({
  color:0x8fd9ff, metalness:0, roughness:0.07, transmission:0.45,
  transparent:true, opacity:0.85, side:THREE.DoubleSide, clearcoat:1,
  envMapIntensity:1.4, emissive:0x0d3a66, emissiveIntensity:0.3,
  iridescence:0.9, iridescenceIOR:1.32, iridescenceThicknessRange:[100,450]
});
const matMercury = new THREE.MeshStandardMaterial({color:0xff4d6d, metalness:0.4, roughness:0.2, emissive:0xff2a55, emissiveIntensity:0.9});
const matTick    = new THREE.MeshBasicMaterial({color:0x66f0ff, transparent:true, opacity:0.92});

function shadow(mesh){mesh.castShadow=true;mesh.receiveShadow=true;return mesh;}
/* 霓虹描边：让线条明显 */
function addEdges(mesh, color=0x4fe8ff, threshold=18, opacity=0.9){
  const eg = new THREE.EdgesGeometry(mesh.geometry, threshold);
  const line = new THREE.LineSegments(eg, new THREE.LineBasicMaterial({color, transparent:true, opacity}));
  mesh.add(line);
  return line;
}

/* ============ 加热底座 ============ */
const heater = new THREE.Group(); scene.add(heater);
const baseBody = shadow(new THREE.Mesh(new THREE.CylinderGeometry(1.55,1.62,0.3,56), matDark));
baseBody.position.y = 0.15; heater.add(baseBody);
addEdges(baseBody, 0x7b5cff, 25, 0.75);
const baseTop = new THREE.Mesh(new THREE.CylinderGeometry(1.46,1.46,0.02,56),
  new THREE.MeshStandardMaterial({color:0x111a30, metalness:0.7, roughness:0.38}));
baseTop.position.y = 0.31; heater.add(baseTop);
const baseRing = new THREE.Mesh(new THREE.TorusGeometry(1.5,0.014,8,80),
  new THREE.MeshBasicMaterial({color:0x7b5cff, transparent:true, opacity:0.8}));
baseRing.rotation.x=-Math.PI/2; baseRing.position.y=0.305; heater.add(baseRing);
const coilMat = new THREE.MeshStandardMaterial({color:0x2a2030, metalness:0.6, roughness:0.4, emissive:0xff5a20, emissiveIntensity:0});
const coil = new THREE.Mesh(new THREE.TorusGeometry(1.02,0.034,12,72), coilMat);
coil.rotation.x = -Math.PI/2; coil.position.y = 0.335; heater.add(coil);

/* ============ 烧杯 + 刻度 ============ */
const beaker = new THREE.Group(); scene.add(beaker);
const side = new THREE.Mesh(new THREE.CylinderGeometry(BEAKER_R,BEAKER_R,BEAKER_H,72,1,true), matGlass);
side.position.y = BEAKER_BOTTOM + BEAKER_H/2; side.castShadow=true; beaker.add(side);
addEdges(side, 0x00e5ff, 22, 0.55);
const bBottom = new THREE.Mesh(new THREE.CircleGeometry(BEAKER_R,72), matGlass);
bBottom.rotation.x=-Math.PI/2; bBottom.position.y=BEAKER_BOTTOM+0.005; beaker.add(bBottom);
const rimMat = new THREE.MeshBasicMaterial({color:0x00e5ff, transparent:true, opacity:0.95});
const rim = new THREE.Mesh(new THREE.TorusGeometry(BEAKER_R,0.022,10,80), rimMat);
rim.rotation.x=-Math.PI/2; rim.position.y=BEAKER_TOP; beaker.add(rim);
const bottomRing = new THREE.Mesh(new THREE.TorusGeometry(BEAKER_R,0.018,10,80),
  new THREE.MeshBasicMaterial({color:0x7b5cff, transparent:true, opacity:0.85}));
bottomRing.rotation.x=-Math.PI/2; bottomRing.position.y=BEAKER_BOTTOM+0.01; beaker.add(bottomRing);
const spout = new THREE.Mesh(new THREE.TorusGeometry(0.12,0.025,8,20,Math.PI*0.9), rimMat);
spout.position.set(BEAKER_R-0.05, BEAKER_TOP+0.01, 0); spout.rotation.set(-Math.PI/2,0,0.4); beaker.add(spout);

/* 烧杯竖向霓虹线框，强化线条感 */
(function(){
  const pts=[];
  for(let i=0;i<16;i++){
    const a=i/16*Math.PI*2, x=Math.cos(a)*(BEAKER_R+0.004), z=Math.sin(a)*(BEAKER_R+0.004);
    pts.push(x,BEAKER_BOTTOM,z, x,BEAKER_TOP,z);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pts,3));
  beaker.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({color:0x4fe8ff, transparent:true, opacity:0.28})));
})();

/* 刻度线（贴在烧杯正面） */
const grads = new THREE.Group(); beaker.add(grads);
const tickX = -0.5;
const tickZ = Math.sqrt(BEAKER_R*BEAKER_R - tickX*tickX) + 0.018;
for(let ml=25; ml<=250; ml+=25){
  const y = 0.32 + (ml/250)*2.5;
  const major = (ml%50===0);
  const len = major?0.24:0.13;
  const t = new THREE.Mesh(new THREE.BoxGeometry(len,0.014,0.012), matTick);
  t.position.set(tickX + len/2 - 0.06, y, tickZ);
  grads.add(t);
}
function textSprite(txt){
  const c=document.createElement('canvas'); c.width=96;c.height=64;
  const g=c.getContext('2d');
  g.font='bold 30px sans-serif'; g.fillStyle='rgba(130,235,255,.95)';
  g.shadowColor='rgba(0,229,255,.8)'; g.shadowBlur=8;
  g.textAlign='center';g.textBaseline='middle';g.fillText(txt,48,32);
  const tex=new THREE.CanvasTexture(c); tex.colorSpace=THREE.SRGBColorSpace;
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,opacity:0.95}));
  s.scale.set(0.3,0.2,1); return s;
}
[50,100,150,200,250].forEach(ml=>{
  const y=0.32+(ml/250)*2.5;
  const s=textSprite(String(ml));
  s.position.set(tickX-0.25,y,tickZ-0.02);
  grads.add(s);
});

/* ============ 水 + 水面 ============ */
const waterH = WATER_TOP - WATER_BOTTOM;
const water = new THREE.Mesh(new THREE.CylinderGeometry(BEAKER_R-0.06,BEAKER_R-0.06,waterH,56), matWater);
water.position.y = WATER_BOTTOM + waterH/2; water.castShadow=true; beaker.add(water);

const surfGeo = new THREE.CircleGeometry(BEAKER_R-0.055,72);
const surfBase = Float32Array.from(surfGeo.attributes.position.array);
const surface = new THREE.Mesh(surfGeo, matWaterTop);
surface.rotation.x = -Math.PI/2;
surface.position.y = WATER_TOP;
beaker.add(surface);
const waterLine = new THREE.Mesh(new THREE.TorusGeometry(BEAKER_R-0.055,0.012,8,80),
  new THREE.MeshBasicMaterial({color:0x66f0ff, transparent:true, opacity:0.8}));
waterLine.rotation.x=-Math.PI/2; waterLine.position.y=WATER_TOP; beaker.add(waterLine);

/* ============ 温度计 ============ */
const thermo = new THREE.Group();
thermo.position.set(0.42,0,0);

/* 气泡高光：给每个气泡叠加明亮的光晕，透过水和玻璃也清晰可见 */
function bubbleGlowTexture(){
  const c=document.createElement("canvas");c.width=c.height=128;
  const g=c.getContext("2d");
  const grd=g.createRadialGradient(64,64,2,64,64,62);
  grd.addColorStop(0,"rgba(255,255,255,1)");
  grd.addColorStop(.28,"rgba(196,246,255,.96)");
  grd.addColorStop(.62,"rgba(80,205,255,.45)");
  grd.addColorStop(1,"rgba(40,160,255,0)");
  g.fillStyle=grd;g.fillRect(0,0,128,128);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
const bubGlowPos=new Float32Array(BUB_MAX*3);

const bubGlowMat=new THREE.PointsMaterial({
  size:0.36,map:bubbleGlowTexture(),transparent:true,opacity:0.95,
  blending:THREE.AdditiveBlending,depthWrite:false,depthTest:false,
  sizeAttenuation:true,color:0xffffff
});

function vaporTexture(){
  const c=document.createElement('canvas');c.width=c.height=128;
  const g=c.getContext('2d');
  const grd=g.createRadialGradient(64,64,4,64,64,60);
  grd.addColorStop(0,'rgba(240,252,255,1)');
  grd.addColorStop(.35,'rgba(150,210,255,.72)');
  grd.addColorStop(.7,'rgba(160,120,255,.28)');
  grd.addColorStop(1,'rgba(120,90,255,0)');
  g.fillStyle=grd;g.fillRect(0,0,128,128);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
const vapTex=vaporTexture();
const VAP_COLORS=[0xa8ecff,0xc0a8ff,0xffb3dc,0x8fd8ff,0xd0b8ff];
const VAP_MAX=160;
const vapors=[];
for(let i=0;i<VAP_MAX;i++){
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:vapTex,transparent:true,opacity:0,depthWrite:false}));
  s.visible=false; scene.add(s);
  vapors.push({s,on:false,life:0,max:1,x:0,y:0,z:0,vy:0,vx:0,vz:0,size:0.3});
}
function spawnVapor(strength){
  const v=vapors.find(v=>!v.on); if(!v)return;
  const a=Math.random()*Math.PI*2, r=Math.sqrt(Math.random())*(BEAKER_R-0.1);
  v.on=true;v.life=0;v.max=1.8+Math.random()*2.0;
  v.x=Math.cos(a)*r;v.z=Math.sin(a)*r;v.y=WATER_TOP+0.03;
  v.vy=(0.45+Math.random()*0.55)*(0.7+strength*0.6);
  v.vx=(Math.random()-0.5)*0.22;v.vz=(Math.random()-0.5)*0.22;
  v.size=(0.3+Math.random()*0.22)*(0.7+strength*0.8);
  v.s.material.color.setHex(VAP_COLORS[(Math.random()*VAP_COLORS.length)|0]);
  v.s.visible=true;
}
function spawnBubble(strength){
  const b=bubState.find(b=>!b.on); if(!b)return;
  const a=Math.random()*Math.PI*2, r=Math.sqrt(Math.random())*(BEAKER_R-0.2);
  b.on=true;b.x=Math.cos(a)*r;b.z=Math.sin(a)*r;
  b.y=WATER_BOTTOM+0.02;b.r=0.075+Math.random()*0.075;
  b.sp=(0.8+Math.random()*0.7)*(0.7+strength*0.6);
  b.w=Math.random()*Math.PI*2;
}

/* ============ 音效引擎（Web Audio，程序化生成，无外部文件） ============ */
const AudioEngine = {
  ctx:null, master:null, ready:false, soundOn:true,
  humGain:null, hissGain:null,
  noiseBuf:null,
  lastBlub:0,

  init(){
    if(this.ready) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = this.soundOn ? 0.9 : 0;
    this.master.connect(this.ctx.destination);

    /* 噪声缓冲（用于嘶嘶声与气泡破裂） */
    const len = this.ctx.sampleRate * 2;
    this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = this.noiseBuf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = Math.random()*2-1;

    /* 加热低频嗡鸣：两个振荡器 + 低通 */
    this.humGain = this.ctx.createGain();
    this.humGain.gain.value = 0;
    const lp = this.ctx.createBiquadFilter();
    lp.type='lowpass'; lp.frequency.value=260;
    this.humGain.connect(lp); lp.connect(this.master);
    [50, 100.5].forEach((f,i)=>{
      const o=this.ctx.createOscillator();
      o.type = i ? 'triangle' : 'sawtooth';
      o.frequency.value = f;
      const g=this.ctx.createGain(); g.gain.value = i ? 0.25 : 0.5;
      o.connect(g); g.connect(this.humGain); o.start();
    });

    /* 蒸发嘶嘶声：循环噪声 + 带通 */
    const hiss = this.ctx.createBufferSource();
    hiss.buffer = this.noiseBuf; hiss.loop = true;
    const bp = this.ctx.createBiquadFilter();
    bp.type='bandpass'; bp.frequency.value=3200; bp.Q.value=0.6;
    this.hissGain = this.ctx.createGain();
    this.hissGain.gain.value = 0;
    hiss.connect(bp); bp.connect(this.hissGain); this.hissGain.connect(this.master);
    hiss.start();

    this.ready = true;
  },

  resume(){ if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); },

  setMuted(on){
    this.soundOn = !on;
    if(this.master) this.master.gain.setTargetAtTime(on?0:0.9, this.ctx.currentTime, 0.05);
  },

  click(){
    if(!this.ready || !this.soundOn) return;
    const t=this.ctx.currentTime;
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(680,t);
    o.frequency.exponentialRampToValueAtTime(420,t+0.07);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.18,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.12);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+0.14);
  },

  /* 单个气泡破裂的"咕嘟"声：短促下滑正弦 + 噪声点缀 */
  blub(intensity){
    if(!this.ready || !this.soundOn) return;
    const t=this.ctx.currentTime;
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type='sine';
    const f0 = 180 + Math.random()*160;
    o.frequency.setValueAtTime(f0,t);
    o.frequency.exponentialRampToValueAtTime(f0*0.45, t+0.09);
    const vol = (0.05 + 0.12*intensity) * (0.6+Math.random()*0.4);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.11);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+0.13);
  },

  /* 达到沸点的提示音：两声上行音阶 */
  boilChime(){
    if(!this.ready || !this.soundOn) return;
    const t=this.ctx.currentTime;
    [523.25, 783.99].forEach((f,i)=>{
      const o=this.ctx.createOscillator(), g=this.ctx.createGain();
      o.type='triangle'; o.frequency.value=f;
      const s=t+i*0.13;
      g.gain.setValueAtTime(0.0001,s);
      g.gain.exponentialRampToValueAtTime(0.14,s+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,s+0.4);
      o.connect(g); g.connect(this.master); o.start(s); o.stop(s+0.42);
    });
  },

  /* 每帧更新持续音的音量 */
  update(heat, vapor, boiling){
    if(!this.ready) return;
    const t=this.ctx.currentTime;
    this.humGain.gain.setTargetAtTime(heat?0.16:0, t, 0.15);
    this.hissGain.gain.setTargetAtTime(vapor*(boiling?0.16:0.09), t, 0.2);
  },

  /* 气泡破裂音效，内部限流避免过密 */
  tryBlub(boiling, intensity){
    if(!this.ready || !this.soundOn) return;
    const now=performance.now();
    const gap = boiling ? 55 : 140;
    if(now - this.lastBlub < gap) return;
    if(Math.random() > (boiling?0.85:0.5)) return;
    this.lastBlub = now;
    this.blub(intensity);
  }
};

/* ============ UI ============ */
const el=id=>document.getElementById(id);
const tempVal=el('tempVal'),tempBar=el('tempBar'),statusEl=el('status');
const toggleBtn=el('toggleBtn'),resetBtn=el('resetBtn'),heatDot=el('heatDot');
const powerInput=el('power'),powerVal=el('powerVal'),audioBtn=el('audioBtn');

function wakeAudio(){ AudioEngine.init(); AudioEngine.resume(); }

toggleBtn.onclick=()=>{wakeAudio();AudioEngine.click();heating=!heating;updateUI();};
resetBtn.onclick=()=>{wakeAudio();AudioEngine.click();heating=false;temperature=20;bubState.forEach(b=>b.on=false);vapors.forEach(v=>{v.on=false;v.s.visible=false;});updateUI();};
powerInput.oninput=()=>{power=parseFloat(powerInput.value);powerVal.textContent=power.toFixed(1)+'×';};
audioBtn.onclick=()=>{
  wakeAudio();
  const muted=AudioEngine.soundOn;
  AudioEngine.setMuted(muted);
  audioBtn.textContent=muted?'🔇 音效：关':'🔊 音效：开';
  audioBtn.classList.toggle('muted',muted);
  if(!muted) AudioEngine.click();
};
addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();wakeAudio();AudioEngine.click();heating=!heating;updateUI();}});

function updateUI(){
  tempVal.textContent=temperature.toFixed(1);
  tempBar.style.width=clamp((temperature-20)/80*100,0,100)+'%';
  heatDot.classList.toggle('on',heating);
  toggleBtn.textContent=heating?'关闭加热':'开启加热';
  toggleBtn.classList.toggle('stop',heating);
  statusEl.className='';
  if(!heating && temperature<45){statusEl.textContent='待机 · 室温 '+temperature.toFixed(0)+'℃';}
  else if(heating && temperature<60){statusEl.textContent='加热中 · 水温上升';statusEl.classList.add('warm');}
  else if(temperature<99){statusEl.textContent='蒸发中 · 水面水汽';statusEl.classList.add('evap');}
  else{statusEl.textContent='沸腾中 · 温度保持 100℃';statusEl.classList.add('boil');}
}

/* ============ 动画循环 ============ */
const clock=new THREE.Clock();
let bubAccum=0,vapAccum=0;
let wasBoiling=false;

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  const t=clock.elapsedTime;

  /* 温度状态机 */
  if(heating){
    temperature += dt*6.5*power;
    if(temperature>=BOIL) temperature=BOIL;   // 沸腾时温度恒定
  }else{
    temperature -= dt*3.2;
    if(temperature<=20) temperature=20;
  }

  /* 现象强度 */
  const evapFactor=smooth(40,99,temperature);
  const boiling=temperature>=99.4;
  bubbleIntensity=boiling?1:smooth(64,99,temperature)*0.62*evapFactor;
  vaporIntensity=boiling?1:evapFactor*(heating?0.75:0.2);

  /* 达到沸点提示音（仅在首次进入沸腾时响一次） */
  if(boiling && !wasBoiling) AudioEngine.boilChime();
  wasBoiling = boiling;

  /* 持续音效音量 */
  AudioEngine.update(heating, vaporIntensity, boiling);

  /* 温度计水银柱 */
  const colH=0.12+(temperature/100)*2.05;
  mercury.scale.y=colH;
  mercury.position.y=0.98+colH/2;

  /* 加热底座：七彩循环辉光 */
  const glow=heating?(0.9+0.35*Math.sin(t*6)):0;
  coilMat.emissive.setHSL((t*0.12)%1, 1, 0.55);
  coilMat.emissiveIntensity=glow;
  heatLight.color.setHSL((t*0.12)%1, 1, 0.6);
  heatLight.intensity=heating?1.7:0;

  /* 水体颜色随温度升高变化 */
  const hot=smooth(60,100,temperature);
  matWater.color.setRGB(0.22+hot*0.1, 0.5+hot*0.1, 0.85-hot*0.05);

  /* 水面波纹 */
  const pos=surfGeo.attributes.position;
  const amp=0.006+bubbleIntensity*0.075;
  for(let i=0;i<pos.count;i++){
    const x=surfBase[i*3],y=surfBase[i*3+1];
    const d=Math.sqrt(x*x+y*y);
    pos.setZ(i, amp*(Math.sin(d*9-t*5.2)+0.6*Math.sin(d*15+t*7))*(0.4+0.6*(1-d/(BEAKER_R-0.055))));
  }
  pos.needsUpdate=true;
  surfGeo.computeVertexNormals();

  /* 气泡生成与运动 */
  bubAccum+=dt*(boiling?170:bubbleIntensity*45);
  while(bubAccum>=1){spawnBubble(bubbleIntensity);bubAccum--;}
  for(let i=0;i<BUB_MAX;i++){
    const b=bubState[i];
    if(!b.on){dummy.position.set(0,-50,0);dummy.scale.setScalar(0.0001);}
    else{
      b.y+=b.sp*dt;
      b.r+=dt*(0.1+bubbleIntensity*0.26);
      const x=b.x+Math.sin(b.y*5+b.w)*0.04;
      const z=b.z+Math.cos(b.y*4+b.w)*0.04;
      if(b.y>=WATER_TOP){
        b.on=false;
        spawnVapor(boiling?1:0.5);
        spawnVapor(boiling?1:0.5);
        if(Math.random()<0.3) AudioEngine.tryBlub(boiling, bubbleIntensity);
        dummy.position.set(0,-50,0);dummy.scale.setScalar(0.0001);
      }
      else{dummy.position.set(x,b.y,z);dummy.scale.setScalar(Math.min(b.r,0.24));}
    }
    dummy.updateMatrix();bubbles.setMatrixAt(i,dummy.matrix);
    bubGlowPos[i*3]=dummy.position.x;
    bubGlowPos[i*3+1]=dummy.position.y;
    bubGlowPos[i*3+2]=dummy.position.z;
  }
  bubbles.instanceMatrix.needsUpdate=true;
  bubGlowGeo.attributes.position.needsUpdate=true;
  bubGlowMat.opacity=0.6+0.4*bubbleIntensity;
  bubGlowMat.size=0.3+0.14*bubbleIntensity;

  /* 水汽运动 */
  vapAccum+=dt*(boiling?55:vaporIntensity*16);
  while(vapAccum>=1){spawnVapor(vaporIntensity);vapAccum--;}
  for(const v of vapors){
    if(!v.on)continue;
    v.life+=dt;
    if(v.life>=v.max){v.on=false;v.s.visible=false;continue;}
    const k=v.life/v.max;
    v.y+=v.vy*dt;v.x+=v.vx*dt;v.z+=v.vz*dt;
    v.s.position.set(v.x,v.y,v.z);
    const sc=v.size*(0.5+k*2.1);
    v.s.scale.set(sc,sc,1);
    v.s.material.opacity=Math.sin(k*Math.PI)*(boiling?0.62:0.42);
  }

  /* 霓虹环随时间微微呼吸 */
  rimMat.opacity = 0.8 + 0.15*Math.sin(t*2);

  /* 标签显隐 */
  lbBub.el.style.opacity=bubbleIntensity>0.08?'1':'0';
  lbVap.el.style.opacity=vaporIntensity>0.06?'1':'0';

  if(Math.floor(t*10)%3===0)updateUI();
  if(firstFrame){firstFrame=false;const l=el('loading');l.style.opacity='0';setTimeout(()=>l.remove(),700);}

  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
animate();
updateUI();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  labelRenderer.setSize(innerWidth,innerHeight);
});
</script>
