<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>物态变化 · 分子可视化实验室</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#06101f;font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

  .title{position:fixed;top:24px;left:28px;z-index:10;pointer-events:none}
  .title .main{display:flex;align-items:center;gap:10px;color:#dff1ff;font-size:17px;font-weight:600;letter-spacing:1.2px;text-shadow:0 0 24px rgba(60,180,255,.5)}
  .title .gem{width:11px;height:11px;transform:rotate(45deg);background:linear-gradient(135deg,#7fe9ff,#1d8fe0);box-shadow:0 0 16px #35c6ff;border-radius:2px}
  .title .sub{margin-top:7px;padding-left:21px;color:#6f9fc4;font-size:11px;letter-spacing:2.5px}

  .dock{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:12;display:flex;align-items:center;gap:12px}
  .tabs{display:flex;gap:8px;padding:7px;border-radius:18px;background:rgba(9,24,44,.66);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(80,180,240,.22);box-shadow:0 10px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(140,210,255,.12)}
  .tabs button{position:relative;border:0;background:transparent;color:#8fb4d0;font-size:14px;letter-spacing:2px;font-family:inherit;padding:11px 30px;border-radius:12px;cursor:pointer;transition:all .3s cubic-bezier(.2,.8,.2,1)}
  .tabs button:hover{color:#cfeeff;background:rgba(60,160,230,.1)}
  .tabs button.active{color:#eafaff;background:linear-gradient(135deg,rgba(46,180,255,.9),rgba(24,110,200,.9));box-shadow:0 0 22px rgba(50,180,255,.55),inset 0 1px 0 rgba(190,235,255,.5);font-weight:600}

  .playbtn{display:flex;align-items:center;justify-content:center;gap:9px;min-width:152px;border:1px solid rgba(90,205,255,.42);border-radius:16px;padding:13px 20px;background:linear-gradient(135deg,rgba(24,96,158,.82),rgba(14,52,96,.86));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:#eafaff;font-family:inherit;font-size:13px;letter-spacing:1px;cursor:pointer;transition:all .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 20px rgba(50,180,255,.28),0 10px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(160,225,255,.28);white-space:nowrap;user-select:none}
  .playbtn:hover{color:#fff;border-color:rgba(120,225,255,.85);box-shadow:0 0 30px rgba(60,190,255,.5),0 10px 40px rgba(0,0,0,.45)}
  .playbtn:active{transform:scale(.96)}
  .playbtn .pico{flex:none;filter:drop-shadow(0 0 5px currentColor)}
  .playbtn .pico-play{display:none}
  .playbtn.paused .pico-pause{display:none}
  .playbtn.paused .pico-play{display:block}
  .playbtn.paused{background:linear-gradient(135deg,rgba(150,88,26,.82),rgba(92,48,16,.88));border-color:rgba(255,168,84,.5);color:#ffe0bd;box-shadow:0 0 18px rgba(255,150,60,.24),0 10px 40px rgba(0,0,0,.45)}
  .playbtn.paused:hover{border-color:rgba(255,190,110,.9);box-shadow:0 0 28px rgba(255,160,70,.45),0 10px 40px rgba(0,0,0,.45)}

  .sndbtn{width:48px;height:48px;flex:none;display:flex;align-items:center;justify-content:center;border:1px solid rgba(80,180,240,.3);border-radius:14px;background:rgba(9,24,44,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:#7fa8c6;cursor:pointer;transition:all .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 10px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(140,210,255,.12);user-select:none}
  .sndbtn:hover{color:#cfeeff;border-color:rgba(90,205,255,.65)}
  .sndbtn:active{transform:scale(.94)}
  .sndbtn.on{color:#8fe9ff;border-color:rgba(90,205,255,.5);background:rgba(20,70,110,.7);box-shadow:0 0 18px rgba(60,190,255,.3),0 10px 40px rgba(0,0,0,.45)}
  .sndbtn .ico-off{display:none}
  .sndbtn.off .ico-on{display:none}
  .sndbtn.off .ico-off{display:block}

  .tag{position:absolute;left:0;top:0;z-index:8;display:flex;align-items:center;gap:7px;padding:6px 10px 6px 8px;border-radius:9px;background:rgba(8,22,42,.72);border:1px solid rgba(90,180,235,.28);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#d3ebff;font-size:11px;letter-spacing:.5px;white-space:nowrap;box-shadow:0 4px 18px rgba(0,0,0,.4);pointer-events:none;will-change:transform}
  .tag .ico{width:14px;height:14px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:9px;color:#06101f;font-weight:700}
  .ico.vapor{background:radial-gradient(circle at 35% 30%,#dff8ff,#4fc9ff);box-shadow:0 0 10px #4fc9ff}
  .ico.liquid{background:radial-gradient(circle at 35% 30%,#bfe6ff,#2f8fe0);box-shadow:0 0 10px #2f8fe0}
  .ico.solid{background:radial-gradient(circle at 35% 30%,#d9b6ff,#7b3fd6);box-shadow:0 0 10px #8b4fe0}
  .ico.gas2{background:radial-gradient(circle at 35% 30%,#f0c8ff,#b15cf0);box-shadow:0 0 10px #b15cf0}
  .ico.cold{background:radial-gradient(circle at 35% 30%,#eaffff,#57d8e8);box-shadow:0 0 10px #57d8e8}
  .ico.gear{background:linear-gradient(135deg,#8fa9bd,#5b7387)}

  .hint{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);color:#4f7796;font-size:11px;letter-spacing:1.5px;z-index:9;pointer-events:none;transition:opacity 1s}

  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:#06101f;color:#7fb6d8;font-size:13px;letter-spacing:2px;z-index:30;transition:opacity .6s}
  #loading.hide{opacity:0;pointer-events:none}
  .spinner{width:34px;height:34px;border-radius:50%;border:3px solid rgba(70,190,255,.16);border-top-color:#4fc9ff;animation:spin .9s linear infinite;box-shadow:0 0 20px rgba(70,190,255,.3)}
  @keyframes spin{to{transform:rotate(360deg)}}

  @media(max-width:640px){
    .title{top:16px;left:16px}.title .main{font-size:14px}.title .sub{font-size:9px}
    .dock{bottom:16px;gap:8px;max-width:calc(100% - 16px);flex-wrap:wrap;justify-content:center}
    .tabs{padding:5px;gap:4px}
    .tabs button{padding:10px 12px;font-size:12px;letter-spacing:1px}
    .playbtn{min-width:auto;padding:11px 12px;font-size:11px;letter-spacing:0}
    .sndbtn{width:42px;height:42px}
    .hint{bottom:92px}
  }
</style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="labels"></div>

  <div class="title">
    <div class="main"><span class="gem"></span><span>物态变化 · 分子可视化实验室</span></div>
    <div class="sub">MOLECULAR PHASE TRANSITION LAB</div>
  </div>

  <div class="dock">
    <nav class="tabs">
      <button data-key="liq" class="active">液化</button>
      <button data-key="sub">升华</button>
      <button data-key="dep">凝华</button>
    </nav>
    <button class="playbtn" id="playBtn" type="button" title="开始 / 停止当前实验动画">
      <svg class="pico pico-pause" width="11" height="12" viewBox="0 0 11 12" aria-hidden="true"><rect x="1" y="1" width="3.2" height="10" rx="1" fill="currentColor"/><rect x="6.8" y="1" width="3.2" height="10" rx="1" fill="currentColor"/></svg>
      <svg class="pico pico-play" width="11" height="12" viewBox="0 0 11 12" aria-hidden="true"><path d="M1.5 1 L10 6 L1.5 11 Z" fill="currentColor"/></svg>
      <span id="playTxt">停止凝华</span>
    </button>
    <button class="sndbtn on" id="sndBtn" type="button" title="关闭音效" aria-label="音效开关">
      <svg class="ico-on" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      <svg class="ico-off" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="m16 9 5 6M21 9l-5 6"/></svg>
    </button>
  </div>
  <div class="hint" id="hint">拖拽旋转 · 滚轮缩放</div>
  <div id="loading"><div class="spinner"></div><span>正在初始化实验装置…</span></div>

  <script>
    window.__labReady=false;
    setTimeout(function(){if(!window.__labReady){var l=document.getElementById('loading');if(l)l.innerHTML='<span style="color:#e0816a">3D 引擎加载失败，请检查网络后刷新</span>';}},12000);
  </script>
  <script type="importmap">
  {
    "imports": {
      "three": "../../../../vendor/three/0.160.0/build/three.module.js",
      "three/addons/": "../../../../vendor/three/0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
  import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
  import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
  import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
  import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

  /* ============ 工具 ============ */
  const rand=(a,b)=>a+Math.random()*(b-a);
  const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
  const smoothstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
  const TAU=Math.PI*2;

  function softTex(){
    const c=document.createElement('canvas');c.width=c.height=128;
    const x=c.getContext('2d');
    const g=x.createRadialGradient(64,64,0,64,64,64);
    g.addColorStop(0,'rgba(255,255,255,0.9)');g.addColorStop(0.35,'rgba(255,255,255,0.4)');
    g.addColorStop(0.7,'rgba(255,255,255,0.08)');g.addColorStop(1,'rgba(255,255,255,0)');
    x.fillStyle=g;x.fillRect(0,0,128,128);
    const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
  }
  const SOFT=softTex();

  /* ============ 渲染器 / 场景 ============ */
  const canvas=document.getElementById('scene');
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.setSize(innerWidth,innerHeight);
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.0;
  renderer.outputColorSpace=THREE.SRGBColorSpace;

  const scene=new THREE.Scene();
  scene.fog=new THREE.FogExp2(0x24405c,0.03);

  // 深蓝渐变背景
  const bg=new THREE.Mesh(new THREE.SphereGeometry(70,32,16),new THREE.ShaderMaterial({
    side:THREE.BackSide,depthWrite:false,fog:false,
    vertexShader:'varying vec3 vP; void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
    fragmentShader:'varying vec3 vP; void main(){float h=normalize(vP).y;vec3 top=vec3(0.008,0.02,0.05);vec3 mid=vec3(0.026,0.062,0.12);vec3 bot=vec3(0.045,0.10,0.17);vec3 c=h>0.0?mix(mid,top,smoothstep(0.0,0.7,h)):mix(mid,bot,smoothstep(0.0,-0.6,h));gl_FragColor=vec4(c,1.0);}'
  }));
  scene.add(bg);

  // 环境反射（深色带霓虹亮条）
  const pmrem=new THREE.PMREMGenerator(renderer);
  (function(){
    const c=document.createElement('canvas');c.width=512;c.height=256;
    const x=c.getContext('2d');
    const g=x.createLinearGradient(0,0,0,256);
    g.addColorStop(0,'#0a1a30');g.addColorStop(0.5,'#12294a');g.addColorStop(0.52,'#0a1628');g.addColorStop(1,'#050c18');
    x.fillStyle=g;x.fillRect(0,0,512,256);
    x.fillStyle='rgba(120,225,255,0.95)';x.fillRect(40,36,150,12);x.fillRect(330,48,130,9);
    x.fillStyle='rgba(255,170,100,0.7)';x.fillRect(200,158,110,7);
    x.fillStyle='rgba(90,150,220,0.6)';x.fillRect(20,120,60,6);
    const t=new THREE.CanvasTexture(c);t.mapping=THREE.EquirectangularReflectionMapping;t.colorSpace=THREE.SRGBColorSpace;
    scene.environment=pmrem.fromEquirectangular(t).texture;t.dispose();
  })();

  const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,120);
  camera.position.set(0.7,3.6,9.4);

  const controls=new OrbitControls(camera,renderer.domElement);
  controls.enableDamping=true;controls.dampingFactor=0.06;
  controls.target.set(0,1.75,0);
  controls.minDistance=6;controls.maxDistance=18;
  controls.minPolarAngle=Math.PI*0.16;controls.maxPolarAngle=Math.PI*0.52;
  controls.enablePan=false;controls.rotateSpeed=0.6;controls.zoomSpeed=0.8;

  /* ============ 灯光 ============ */
  scene.add(new THREE.HemisphereLight(0x9ec9ff,0x06101f,0.65));
  const key=new THREE.DirectionalLight(0xdcefff,1.5);key.position.set(5,10,7);
  key.castShadow=true;key.shadow.mapSize.set(2048,2048);
  Object.assign(key.shadow.camera,{near:1,far:34,left:-8,right:8,top:9,bottom:-8});
  key.shadow.camera.updateProjectionMatrix();key.shadow.bias=-0.0006;key.shadow.normalBias=0.02;
  scene.add(key);
  const cyanL=new THREE.PointLight(0x36c8ff,26,16,2);cyanL.position.set(-5,3.5,3);scene.add(cyanL);
  const cyanR=new THREE.PointLight(0x2fa6ff,20,16,2);cyanR.position.set(5,3,2);scene.add(cyanR);
  const backL=new THREE.PointLight(0x7a5cff,14,14,2);backL.position.set(0,4,-5);scene.add(backL);
  const heatL=new THREE.PointLight(0xff8a3d,0,8,2);heatL.position.set(0,0.6,0);scene.add(heatL);

  /* ============ 后处理辉光 ============ */
  const composer=new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene,camera));
  const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.7,0.45,1.0);
  composer.addPass(bloom);
  composer.addPass(new OutputPass());

  /* ============ 通用材质 ============ */
  const M={
    metal:new THREE.MeshStandardMaterial({color:0x9fb3c6,metalness:0.92,roughness:0.28}),
    darkMetal:new THREE.MeshStandardMaterial({color:0x1c2b3e,metalness:0.8,roughness:0.35}),
    base:new THREE.MeshStandardMaterial({color:0x142036,metalness:0.7,roughness:0.4}),
    ceramic:new THREE.MeshStandardMaterial({color:0xc9dbe8,metalness:0.05,roughness:0.38}),
    knob:new THREE.MeshStandardMaterial({color:0xd98b45,metalness:0.6,roughness:0.35}),
    rubber:new THREE.MeshStandardMaterial({color:0x14202c,metalness:0.1,roughness:0.75}),
    glass:()=>new THREE.MeshPhysicalMaterial({color:0xeaf6ff,metalness:0,roughness:0.045,transmission:0.97,thickness:0.35,ior:1.5,clearcoat:1,clearcoatRoughness:0.03,envMapIntensity:1.8,transparent:true,side:THREE.DoubleSide,depthWrite:false}),
    water:()=>new THREE.MeshPhysicalMaterial({color:0x5fc8f5,metalness:0,roughness:0.12,transmission:0.75,thickness:0.5,ior:1.33,transparent:true,opacity:0.78,envMapIntensity:1.4,side:THREE.DoubleSide,depthWrite:false})
  };
  const neon=(hex,mul=2.2)=>new THREE.MeshBasicMaterial({color:new THREE.Color(hex).multiplyScalar(mul),toneMapped:false});
  const CYAN=neon(0x39d4ff,1.35), DEEP_CYAN=neon(0x1e9fe0,1.15), ORANGE=neon(0xff8a3c,1.4), PURPLE=neon(0xb164ff,1.4);

  function edgeOutline(geo,color=0x6fe0ff,opacity=0.5){
    return new THREE.LineSegments(new THREE.EdgesGeometry(geo),new THREE.LineBasicMaterial({color,transparent:true,opacity}));
  }

  /* ============ 器材组件 ============ */
  // 加热底座：深色机身 + 陶瓷台面 + 青色霓虹边 + 橙色加热光
  function buildHeater(){
    const g=new THREE.Group();
    const body=new THREE.Mesh(new RoundedBoxGeometry(3.0,0.5,2.4,4,0.12),M.base);
    body.position.y=0.3;body.castShadow=true;body.receiveShadow=true;g.add(body);
    // 霓虹边条
    const strip=(w,h,d,x,y,z)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),CYAN);m.position.set(x,y,z);g.add(m);};
    strip(3.02,0.05,0.05,0,0.1,1.21);strip(3.02,0.05,0.05,0,0.1,-1.21);
    strip(0.05,0.05,2.4,1.51,0.1,0);strip(0.05,0.05,2.4,-1.51,0.1,0);
    // 陶瓷台面
    const top=new THREE.Mesh(new RoundedBoxGeometry(2.4,0.12,1.9,4,0.06),M.ceramic);
    top.position.y=0.61;top.castShadow=true;g.add(top);
    // 加热盘（橙色发光环）
    const ringMat=neon(0xff7a30,1.0);
    const heaterRing=new THREE.Mesh(new THREE.TorusGeometry(0.72,0.032,12,64),ringMat);
    heaterRing.rotation.x=Math.PI/2;heaterRing.position.y=0.68;g.add(heaterRing);
    const heatDisc=new THREE.Mesh(new THREE.CircleGeometry(0.7,48),new THREE.MeshBasicMaterial({color:0xff6a22,transparent:true,opacity:0.25,depthWrite:false,toneMapped:false,blending:THREE.AdditiveBlending}));
    heatDisc.rotation.x=-Math.PI/2;heatDisc.position.y=0.675;g.add(heatDisc);
    // 侧面散热槽 + 指示灯
    for(let i=0;i<5;i++){const s=new THREE.Mesh(new THREE.BoxGeometry(0.02,0.14,0.5),M.darkMetal);s.position.set(-1.51,0.32,-0.6+i*0.3);g.add(s);}
    const led=new THREE.Mesh(new THREE.SphereGeometry(0.035,10,8),ORANGE);led.position.set(1.0,0.34,1.21);g.add(led);
    g.userData={heaterRing,heatDisc,led};
    return g;
  }

  // 铁架台：底座 + 立杆 + 横杆 + 夹具 + 橙色旋钮
  function buildStand(rodH=4.2,clampY=2.0,armLen=2.1){
    const g=new THREE.Group();
    const foot=new THREE.Mesh(new THREE.CylinderGeometry(0.95,1.05,0.16,40),M.darkMetal);
    foot.position.y=0.1;foot.castShadow=true;g.add(foot);
    const rod=new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.055,rodH,16),M.metal);
    rod.position.y=rodH/2+0.16;rod.castShadow=true;g.add(rod);
    // 夹具滑块
    const boss=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.15,0.26,20),M.metal);
    boss.position.y=clampY;g.add(boss);
    const arm=new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,armLen,12),M.metal);
    arm.rotation.z=Math.PI/2;arm.position.set(armLen/2,clampY,0);g.add(arm);
    const knob=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,0.16,16),M.knob);
    knob.rotation.z=Math.PI/2;knob.position.set(-0.16,clampY,0);g.add(knob);
    const jaw1=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.3,0.1),M.metal);jaw1.position.set(armLen,clampY+0.15,0);g.add(jaw1);
    const jaw2=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.3,0.1),M.metal);jaw2.position.set(armLen,clampY-0.15,0);g.add(jaw2);
    g.userData={clampY};
    return g;
  }

  // 亚克力防护罩（U 形透明板 + 青色发光边框）
  function buildShield(w=4.0,h=3.3,d=2.6){
    const g=new THREE.Group();
    const panelMat=new THREE.MeshPhysicalMaterial({color:0x9fdfff,metalness:0,roughness:0.06,transmission:0.96,thickness:0.08,ior:1.48,transparent:true,opacity:0.5,side:THREE.DoubleSide,depthWrite:false});
    const frameT=0.035;
    const panel=(pw,ph,x,y,z,ry=0)=>{
      const p=new THREE.Mesh(new THREE.PlaneGeometry(pw,ph),panelMat);p.position.set(x,y,z);p.rotation.y=ry;g.add(p);
    };
    const bar=(bw,bh,bd,x,y,z)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(bw,bh,bd),DEEP_CYAN);m.position.set(x,y,z);g.add(m);};
    // 背板
    panel(w,h,0,h/2+0.4,-d/2);
    // 左右侧板
    panel(d,h,-w/2,h/2+0.4,0,Math.PI/2);
    panel(d,h,w/2,h/2+0.4,0,Math.PI/2);
    // 发光边框（Π 形，前开口）
    bar(w,frameT,frameT,0,h+0.4,-d/2);
    bar(frameT,h,frameT,-w/2,h/2+0.4,-d/2);
    bar(frameT,h,frameT,w/2,h/2+0.4,-d/2);
    bar(frameT,frameT,d,-w/2,h+0.4,0);
    bar(frameT,frameT,d,w/2,h+0.4,0);
    bar(frameT,h,frameT,-w/2,h/2+0.4,d/2);
    bar(frameT,h,frameT,w/2,h/2+0.4,d/2);
    bar(w,frameT,frameT,0,h+0.4,d/2);
    return g;
  }

  /* ============ 发光分子云（InstancedMesh） ============ */
  class MolCloud{
    constructor(parent,count,{color=0xffffff,radius=0.05,glow=2.2}={}){
      this.count=count;this.parent=parent;
      const geo=new THREE.SphereGeometry(radius,10,8);
      const col=new THREE.Color(color).multiplyScalar(glow);
      const mat=new THREE.MeshBasicMaterial({color:col,toneMapped:false,transparent:true,opacity:1});
      this.mesh=new THREE.InstancedMesh(geo,mat,count);
      this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      this.mesh.frustumCulled=false;
      this.mesh.renderOrder=4;
      parent.add(this.mesh);
      this.data=Array.from({length:count},()=>({p:new THREE.Vector3(),v:new THREE.Vector3(),scale:0,life:0,ttl:1,seed:Math.random()*100,delay:Math.random()}));
      this.dummy=new THREE.Object3D();
    }
    update(dt,fn){
      for(let i=0;i<this.count;i++){
        const d=this.data[i];fn(d,i,dt);
        this.dummy.position.copy(d.p);
        this.dummy.scale.setScalar(Math.max(0.0001,d.scale));
        this.dummy.updateMatrix();
        this.mesh.setMatrixAt(i,this.dummy.matrix);
      }
      this.mesh.instanceMatrix.needsUpdate=true;
    }
    reset(fn){this.data.forEach((d,i)=>fn(d,i));}
  }

  // 柔和雾团（Sprite 池）
  class Wisps{
    constructor(parent,count,color,opacity){
      this.items=[];
      for(let i=0;i<count;i++){
        const s=new THREE.Sprite(new THREE.SpriteMaterial({map:SOFT,color,transparent:true,opacity:0,depthWrite:false,blending:THREE.AdditiveBlending}));
        s.renderOrder=3;s.visible=false;parent.add(s);
        this.items.push({s,on:false,life:0,ttl:1,p:new THREE.Vector3(),v:new THREE.Vector3(),size:1,seed:Math.random()*10});
      }
    }
    spawn(p,v,ttl,size){const it=this.items.find(i=>!i.on);if(!it)return;it.on=true;it.life=0;it.ttl=ttl;it.p.copy(p);it.v.copy(v);it.size=size;it.s.visible=true;}
    update(dt,t,mode){
      for(const it of this.items){
        if(!it.on)continue;
        it.life+=dt;
        if(it.life>=it.ttl){it.on=false;it.s.visible=false;it.s.material.opacity=0;continue;}
        const q=it.life/it.ttl;
        it.v.x+=Math.sin(t*0.8+it.seed)*dt*0.08;
        it.v.z+=Math.cos(t*0.7+it.seed)*dt*0.07;
        if(mode==='rise')it.v.y+=dt*0.04;
        it.p.addScaledVector(it.v,dt);
        it.s.position.copy(it.p);
        const sc=it.size*(0.5+q*1.1);it.s.scale.set(sc,sc,1);
        it.s.material.opacity=0.5*smoothstep(0,0.18,q)*(1-smoothstep(0.55,1,q));
      }
    }
    reset(){this.items.forEach(it=>{it.on=false;it.s.visible=false;it.s.material.opacity=0;});}
  }

  /* ============ 场景 1：液化 ============ */
  function buildLiquefaction(){
    const g=new THREE.Group();

    const stand=buildStand(4.4,3.18,2.1);stand.position.set(-1.9,0,0);g.add(stand);
    g.add(buildShield());

    // 烧杯（在加热台上）
    const beaker=new THREE.Group();beaker.position.y=0.68;g.add(beaker);
    const bGeo=new THREE.CylinderGeometry(0.92,0.88,1.7,56,1,true);
    const wall=new THREE.Mesh(bGeo,M.glass());wall.position.y=0.85;beaker.add(wall);
    beaker.add(edgeOutline(bGeo,0x8fe6ff,0.35).translateY(0.85));
    const bBase=new THREE.Mesh(new THREE.CylinderGeometry(0.88,0.88,0.055,56),M.glass());bBase.position.y=0.03;beaker.add(bBase);
    const lip=new THREE.Mesh(new THREE.TorusGeometry(0.92,0.035,12,56),neon(0x59c9ff,1.2));lip.rotation.x=Math.PI/2;lip.position.y=1.7;beaker.add(lip);
    // 杯嘴
    const spout=new THREE.Mesh(new THREE.ConeGeometry(0.13,0.26,16,1,true),M.glass());spout.position.set(0.86,1.66,0);spout.rotation.z=-Math.PI/2.6;beaker.add(spout);
    // 水
    const waterTop=0.78;
    const water=new THREE.Mesh(new THREE.CylinderGeometry(0.86,0.84,waterTop,48),M.water());water.position.y=waterTop/2+0.03;beaker.add(water);
    const waterSurf=new THREE.Mesh(new THREE.CircleGeometry(0.86,48),new THREE.MeshPhysicalMaterial({color:0x8fe0ff,transparent:true,opacity:0.4,roughness:0.1,metalness:0.1,side:THREE.DoubleSide,depthWrite:false}));
    waterSurf.rotation.x=-Math.PI/2;waterSurf.position.y=waterTop+0.035;beaker.add(waterSurf);
    // 沸腾气泡
    const bubbles=new MolCloud(beaker,16,{color:0xcdefff,radius:0.035,glow:1.2});
    bubbles.reset((d)=>{d.seed=Math.random()*TAU;d.life=Math.random()*1.5;d.p.set(rand(-0.6,0.6),rand(0.1,waterTop),rand(-0.6,0.6));});

    // 冷玻璃片（夹在夹具上，位于烧杯上方）
    const plateY=3.18;
    const plateGroup=new THREE.Group();plateGroup.position.set(0,plateY,0);plateGroup.rotation.x=-0.38;g.add(plateGroup);
    const pGeo=new RoundedBoxGeometry(2.6,0.09,1.5,3,0.04);
    const plate=new THREE.Mesh(pGeo,M.glass());plateGroup.add(plate);
    plateGroup.add(edgeOutline(pGeo,0x7fe4ff,0.6));
    // 玻璃片上的冷雾光带
    const coldBar=new THREE.Mesh(new THREE.BoxGeometry(2.5,0.02,0.02),neon(0x63d9ff,1.2));coldBar.position.set(0,-0.05,0.7);plateGroup.add(coldBar);

    // 水蒸气分子（青白发光球）
    const vapor=new MolCloud(g,64,{color:0x9fe8ff,radius:0.052,glow:2.6});
    vapor.reset((d)=>{d.life=rand(0,3);d.ttl=rand(2.6,4.2);d.p.set(rand(-0.65,0.65),waterTop+0.75+rand(0,1.4),rand(-0.65,0.65));d.v.set(rand(-0.12,0.12),rand(0.35,0.7),rand(-0.12,0.12));d.scale=rand(0.6,1.0);});
    // 蒸汽柔雾
    const wisp=new Wisps(g,30,0x9fdcff,0.5);
    let dropAcc=0;
    // 水珠池（写实高光小球）
    const dropGeo=new THREE.SphereGeometry(1,16,12);
    const dropMat=new THREE.MeshPhysicalMaterial({color:0xbfe8ff,roughness:0.04,metalness:0.05,transmission:0.35,thickness:0.3,ior:1.33,clearcoat:1,clearcoatRoughness:0.02,envMapIntensity:2.4,emissive:0x2a6f9a,emissiveIntensity:0.45,transparent:true,opacity:0.95});
    const drops=[];
    for(let i=0;i<34;i++){
      const m=new THREE.Mesh(dropGeo,dropMat);m.visible=false;m.renderOrder=5;plateGroup.add(m);
      drops.push({m,on:false,phase:0,x:0,z:0,r:0,hold:0,vy:0});
    }
    function spawnDrop(x,z){
      const d=drops.find(v=>!v.on);if(!d)return;
      d.on=true;d.phase=0;d.x=clamp(x,-1.15,1.15);d.z=clamp(z,-0.6,0.6);d.r=rand(0.055,0.085);d.hold=rand(0.6,2.4);d.vy=0;d.m.visible=true;
    }
    function update(dt,t){
      // 加热呼吸光
      const pulse=0.85+0.15*Math.sin(t*2.4);
      heater.userData.heatDisc.material.opacity=0.12*pulse;
      heatL.intensity=3*pulse;heatL.position.set(0,0.7,0);
      // 气泡
      bubbles.update(dt,(d,i,dd)=>{
        d.life+=dd;d.p.y+=dd*(0.35+d.life*0.12);
        d.p.x+=Math.sin(t*3+d.seed)*dd*0.05;
        if(d.p.y>waterTop+0.02){d.p.y=0.1;d.p.x=rand(-0.6,0.6);d.p.z=rand(-0.6,0.6);d.life=0;}
        d.scale=0.6+0.4*Math.sin(d.life*4+d.seed);
      });
      // 水蒸气：上升 → 撞冷片 → 液化成水珠
      vapor.update(dt,(d,i,dd)=>{
        d.life+=dd;
        d.p.addScaledVector(d.v,dd);
        d.v.x+=Math.sin(t*1.4+d.seed)*dd*0.1;
        d.v.z+=Math.cos(t*1.2+d.seed*1.7)*dd*0.08;
        const fade=smoothstep(0,0.5,d.life)*(1-smoothstep(d.ttl-1,d.ttl,d.life));
        // 接近冷片：吸附并生成水珠
        if(d.p.y>=plateY-0.12&&Math.abs(d.p.x)<1.25&&Math.abs(d.p.z)<0.72){
          d.life=0;d.ttl=rand(2.6,4.2);
          d.p.set(rand(-0.65,0.65),waterTop+0.85,rand(-0.65,0.65));
          d.v.set(rand(-0.12,0.12),rand(0.35,0.7),rand(-0.12,0.12));
          if(Math.random()<0.55)spawnDrop(d.p.x,d.p.z);
        }
        d.scale=(0.55+0.45*fade)*(0.85+0.15*Math.sin(t*5+d.seed));
      });
      wisp.acc=(wisp.acc||0)+dt;
      if(wisp.acc>0.28){wisp.acc=0;wisp.spawn(new THREE.Vector3(rand(-0.5,0.5),waterTop+0.85,rand(-0.5,0.5)),new THREE.Vector3(rand(-0.08,0.08),rand(0.3,0.55),rand(-0.08,0.08)),rand(2.5,4),rand(0.7,1.2));}
      wisp.update(dt,t,'rise');
      // 水珠：长大 → 停留 → 滑落
      for(const d of drops){
        if(!d.on)continue;
        d.r+=dt*0.012;
        if(d.phase===0){d.hold-=dt;if(d.hold<=0)d.phase=1;}
        if(d.phase===1){d.vy+=dt*0.5;d.z-=d.vy*dt*0.25;if(d.z<-0.8){d.on=false;d.m.visible=false;}}
        const stretch=d.phase===1?1+d.vy*0.25:1;
        d.m.scale.set(d.r,d.r*stretch,d.r);
        d.m.position.set(d.x,0.055+d.r*0.35,d.z);
      }
    }
    function reset(){
      bubbles.reset((d)=>{d.life=Math.random()*1.5;d.p.set(rand(-0.6,0.6),rand(0.1,waterTop),rand(-0.6,0.6));});
      vapor.reset((d)=>{d.life=rand(0,3);d.ttl=rand(2.6,4.2);d.p.set(rand(-0.65,0.65),waterTop+0.75+rand(0,1.4),rand(-0.65,0.65));d.v.set(rand(-0.12,0.12),rand(0.35,0.7),rand(-0.12,0.12));});
      wisp.reset();drops.forEach(d=>{d.on=false;d.m.visible=false;});
    }
    return {group:g,update,reset,labels:[
      {pos:new THREE.Vector3(0.75,2.5,0.4),ico:'vapor',text:'水蒸气分子'},
      {obj:plateGroup,local:[1.0,0.05,0.3],ico:'gear',text:'冷玻璃片'},
      {obj:plateGroup,local:[-0.5,-0.12,0.35],ico:'liquid',text:'水珠（液化）'}
    ]};
  }

  function buildSublimation(){
    const g=new THREE.Group();
    const heater=buildHeater();g.add(heater);

    const bulb=new THREE.Mesh(new THREE.SphereGeometry(0.09,12,10),neon(0xff7a4a,1.4));bulb.position.set(-0.15,1.4,0);tube.add(bulb);

    // 固态碘颗粒（堆积在底部，暗紫带微光）
    const grainGeo=new THREE.OctahedronGeometry(1,0);
    const grainMat=new THREE.MeshStandardMaterial({color:0x4b2378,metalness:0.45,roughness:0.32,emissive:0x2a0f4a,emissiveIntensity:0.5,flatShading:true});
    const grains=new THREE.InstancedMesh(grainGeo,grainMat,110);
    grains.instanceMatrix.setUsage(THREE.DynamicDrawUsage);grains.castShadow=true;tube.add(grains);
    const grainData=[];
    for(let i=0;i<110;i++){
      const a=Math.random()*TAU,rr=Math.sqrt(Math.random())*0.6;
      grainData.push({x:Math.cos(a)*rr,z:Math.sin(a)*rr,y:0.0+rand(0,0.32),s:rand(0.045,0.085),rot:rand(0,TAU),delay:Math.random()*0.5});
    }
    const gDummy=new THREE.Object3D();

    // 紫色碘蒸气分子
    const vapor=new MolCloud(tube,80,{color:0xc07bff,radius:0.055,glow:2.8});
    vapor.reset((d)=>{d.life=rand(0,3);d.ttl=rand(3,5.5);const a=Math.random()*TAU,rr=Math.sqrt(Math.random())*0.6;d.p.set(Math.cos(a)*rr,rand(0.1,2.0),Math.sin(a)*rr);d.v.set(rand(-0.12,0.12),rand(0.18,0.5),rand(-0.12,0.12));});
    // 紫色雾团
    const wisp=new Wisps(tube,26,0xa855f7,0.6);
    let spawnAcc=0;

    function update(dt,t){
      const pulse=0.85+0.15*Math.sin(t*2.6);
      heater.userData.heatDisc.material.opacity=0.16*pulse;
      heatL.intensity=4.5*pulse;heatL.position.set(0.2,0.85,0);
      // 碘颗粒逐渐减少（升华）
      for(let i=0;i<grainData.length;i++){
        const d=grainData[i];
        const remain=clamp(1-((t%20)/20)*1.0+d.delay*0.25,0.12,1);
        gDummy.position.set(d.x,d.y,d.z);
        gDummy.rotation.set(d.rot,d.rot*0.7,d.rot*1.3);
        gDummy.scale.setScalar(d.s*remain*(0.94+0.06*Math.sin(t*3+i)));
        gDummy.updateMatrix();grains.setMatrixAt(i,gDummy.matrix);
      }
      grains.instanceMatrix.needsUpdate=true;
      // 碘蒸气：直接由固态扩散，无液滴
      vapor.update(dt,(d,i,dd)=>{
        d.life+=dd;
        d.p.addScaledVector(d.v,dd);
        d.v.x+=Math.sin(t*1.6+d.seed)*dd*0.12;
        d.v.z+=Math.cos(t*1.3+d.seed*1.4)*dd*0.1;
        d.v.y+=(d.p.y<1.6?dd*0.05:-dd*0.03);
        // 撞壁反弹（限制在试管内）
        const rr=Math.hypot(d.p.x,d.p.z);
        if(rr>0.64){d.v.x-=d.p.x/rr*dd*0.5;d.v.z-=d.p.z/rr*dd*0.5;}
        if(d.p.y>2.1||d.p.y<0.0){d.v.y*=-0.55;d.p.y=clamp(d.p.y,0.02,2.08);}
        const density=smoothstep(0.5,3,t%20+0.5);
        d.scale=(0.6+0.4*Math.sin(d.life*3+d.seed))*smoothstep(0,0.4,d.life)*density;
      });
      spawnAcc+=dt;
      if(spawnAcc>0.22){spawnAcc=0;const a=Math.random()*TAU,rr=Math.sqrt(Math.random())*0.5;wisp.spawn(new THREE.Vector3(0.2+Math.cos(a)*rr,rand(0.05,0.4),Math.sin(a)*rr),new THREE.Vector3(rand(-0.06,0.06),rand(0.25,0.5),rand(-0.06,0.06)),rand(3,5),rand(0.7,1.25));}
      wisp.update(dt,t,'rise');
    }
    function reset(){
      vapor.reset((d)=>{d.life=rand(0,3);d.ttl=rand(3,5.5);const a=Math.random()*TAU,rr=Math.sqrt(Math.random())*0.6;d.p.set(Math.cos(a)*rr,rand(0.1,2.0),Math.sin(a)*rr);d.v.set(rand(-0.12,0.12),rand(0.18,0.5),rand(-0.12,0.12));});
      wisp.reset();
    }
    return {group:g,update,reset,labels:[
      {obj:tube,local:[-0.45,-0.18,0.5],ico:'solid',text:'固态碘颗粒'},
      {obj:tube,local:[0.55,1.5,0.35],ico:'gas2',text:'碘蒸气（气态）'}
    ]};
  }

    crystals.instanceMatrix.setUsage(THREE.DynamicDrawUsage);crystals.castShadow=true;jar.add(crystals);
    const cryData=[];
    for(let i=0;i<150;i++){
      const a=Math.random()*TAU,y=rand(-0.7,0.7),ring=0.46+rand(0,0.1);
      cryData.push({x:Math.cos(a)*ring,y,z:Math.sin(a)*ring,s:rand(0.03,0.07),rot:rand(0,TAU),delay:Math.random()*0.65});
    }
    const cDummy=new THREE.Object3D();

    // 碘蒸气分子（朝冷管壁运动并被吸附）
    const vapor=new MolCloud(jar,76,{color:0xc07bff,radius:0.05,glow:2.8});
    vapor.reset((d)=>{d.life=rand(0,3);d.ttl=rand(3,5);const a=Math.random()*TAU,rr=rand(0.55,0.85);d.p.set(Math.cos(a)*rr,rand(-0.9,1.0),Math.sin(a)*rr);d.v.set(rand(-0.1,0.1),rand(0.1,0.35),rand(-0.1,0.1));});
    const wisp=new Wisps(jar,22,0xa855f7,0.5);
    let acc=0;

    function update(dt,t){
      const pulse=0.85+0.15*Math.sin(t*2.2);
      heater.userData.heatDisc.material.opacity=0.1*pulse;
      heatL.intensity=2.5*pulse;heatL.position.set(0,0.7,0);
      coldCap.material.color.setHex(0x5fe0ff).multiplyScalar(1.1+0.15*Math.sin(t*3));
      // 晶粒逐渐凝华成型
      const prog=(t%18)/18;
      for(let i=0;i<cryData.length;i++){
        const d=cryData[i];
        const grow=smoothstep(d.delay,d.delay+0.32,prog)*(1-smoothstep(0.92,1,prog));
        cDummy.position.set(d.x,d.y+0.05,d.z);
        cDummy.rotation.set(d.rot,d.rot*0.6,d.rot*1.2);
        cDummy.scale.setScalar(d.s*grow*(0.92+0.08*Math.sin(t*4+i)));
        cDummy.updateMatrix();crystals.setMatrixAt(i,cDummy.matrix);
      }
      crystals.instanceMatrix.needsUpdate=true;
      // 碘蒸气：被冷管壁吸附
      vapor.update(dt,(d,i,dd)=>{
        d.life+=dd;
        const rr=Math.hypot(d.p.x,d.p.z);
        // 向管壁靠拢
        if(rr>0.52){d.v.x-=d.p.x/rr*dd*0.22;d.v.z-=d.p.z/rr*dd*0.22;}
        d.p.addScaledVector(d.v,dd);
        d.v.x+=Math.sin(t*1.5+d.seed)*dd*0.1;
        d.v.z+=Math.cos(t*1.2+d.seed)*dd*0.1;
        d.v.y+=Math.sin(t+d.seed)*dd*0.05;
        // 触及冷指表面 → 凝华，重新从底部生成
        if(rr<0.5&&d.p.y>-0.75&&d.p.y<0.75){
          d.life=0;const a=Math.random()*TAU;d.p.set(Math.cos(a)*rand(0.6,0.85),rand(-0.8,0.9),Math.sin(a)*rand(0.6,0.85));
          d.v.set(rand(-0.1,0.1),rand(0.1,0.3),rand(-0.1,0.1));
        }
        if(d.p.y<-0.95||d.p.y>1.1)d.v.y*=-0.6;
        d.scale=(0.55+0.45*Math.sin(d.life*3+d.seed))*smoothstep(0,0.4,d.life)*smoothstep(0,1.5,t%18+0.5);
      });
      acc+=dt;
      if(acc>0.28){acc=0;const a=Math.random()*TAU;wisp.spawn(new THREE.Vector3(Math.cos(a)*0.7,rand(-0.7,0.7),Math.sin(a)*0.7),new THREE.Vector3(rand(-0.05,0.05),rand(0.15,0.35),rand(-0.05,0.05)),rand(3,5),rand(0.6,1.0));}
      wisp.update(dt,t,'rise');
    }
    function reset(){
      vapor.reset((d)=>{d.life=rand(0,3);d.ttl=rand(3,5);const a=Math.random()*TAU,rr=rand(0.55,0.85);d.p.set(Math.cos(a)*rr,rand(-0.9,1.0),Math.sin(a)*rr);d.v.set(rand(-0.1,0.1),rand(0.1,0.35),rand(-0.1,0.1));});
      wisp.reset();
    }
    return {group:g,update,reset,labels:[
      {obj:jar,local:[-0.8,1.7,0.45],ico:'gas2',text:'碘蒸气'},
      {obj:cold,local:[0.0,0.15,0.55],ico:'solid',text:'碘晶粒（凝华）'},
      {obj:jar,local:[0.6,1.85,0.4],ico:'cold',text:'低温管壁'}
    ]};
  }

  /* ============ 装配 ============ */
  const scenes={liq:buildLiquefaction(),sub:buildSublimation(),dep:buildDeposition()};
  Object.values(scenes).forEach(s=>{s.group.visible=false;scene.add(s.group);s.time=0;});

  /* ============ 音效引擎（Web Audio 拟真合成 + 卷积混响，无外部音频） ============ */
  const Sound=(()=>{
    let ctx=null,master=null,dry=null,revSend=null,layers={},started=false;
    let on=true,running=true,sceneKey='liq';
    let nextDrop=0,nextGrain=0,nextChime=0,modT=0;
    const CFG={
      liq:{type:'bandpass',freq:640,q:0.65,gain:0.050},
      sub:{type:'lowpass', freq:820,q:0.70,gain:0.070},
      dep:{type:'highpass',freq:2400,q:0.70,gain:0.026}
    };
    // 粉红噪声（Paul Kellet 近似）—— 比白噪声更接近自然气流
    function pinkBuffer(sec){
      const len=Math.floor(ctx.sampleRate*sec),b=ctx.createBuffer(2,len,ctx.sampleRate);
      for(let c=0;c<2;c++){
        const d=b.getChannelData(c);let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
        for(let i=0;i<len;i++){
          const w=Math.random()*2-1;
          b0=0.99886*b0+w*0.0555179;b1=0.99332*b1+w*0.0750759;b2=0.96900*b2+w*0.1538520;
          b3=0.86650*b3+w*0.3104856;b4=0.55000*b4+w*0.5329522;b5=-0.7616*b5-w*0.0168980;
          b6=w*0.115926;
          d[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11;
        }
      }
      return b;
    }
    // 卷积混响脉冲响应：指数衰减噪声 + 少量早期反射，营造实验室空间感
    function irBuffer(sec){
      const len=Math.floor(ctx.sampleRate*sec),b=ctx.createBuffer(2,len,ctx.sampleRate);
      for(let c=0;c<2;c++){
        const d=b.getChannelData(c);
        for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)*0.6;
        [0.011,0.023,0.037,0.056].forEach((tt,k)=>{const idx=Math.floor(tt*ctx.sampleRate);if(idx<len)d[idx]+=(k%2?1:-1)*(0.42-k*0.07);});
      }
      return b;
    }
    function boot(){
      if(started)return true;
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return false;
      try{
        ctx=new AC();
        master=ctx.createGain();master.gain.value=0;master.connect(ctx.destination);
        dry=ctx.createGain();dry.gain.value=1;dry.connect(master);
        const conv=ctx.createConvolver();conv.buffer=irBuffer(1.7);
        const ret=ctx.createGain();ret.gain.value=0.4;conv.connect(ret);ret.connect(master);
        revSend=ctx.createGain();revSend.gain.value=1;revSend.connect(conv);
        const nb=pinkBuffer(3);
        Object.keys(CFG).forEach(k=>{
          const c=CFG[k],src=ctx.createBufferSource();src.buffer=nb;src.loop=true;
          const f=ctx.createBiquadFilter();f.type=c.type;f.frequency.value=c.freq;f.Q.value=c.q;
          const g=ctx.createGain();g.gain.value=(k==='liq'?c.gain:0);
          src.connect(f);f.connect(g);g.connect(dry);
          const s=ctx.createGain();s.gain.value=0.22;g.connect(s);s.connect(revSend);
          src.start();layers[k]={f,g};
        });
        started=true;applyGain();return true;
      }catch(e){return false;}
    }
    const now=()=>ctx?ctx.currentTime:0;
    function applyGain(){if(started)master.gain.setTargetAtTime(on?1:0,now(),0.09);}
    // 短噪声瞬态（冲击 / 沙沙颗粒），带混响发送
    function burst(dur,vol,type,freq,q,bus,when){
      if(!started||!on)return;
      const t=when||now(),len=Math.max(1,Math.floor(ctx.sampleRate*dur));
      const buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);
      for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,1.5);
      const src=ctx.createBufferSource();src.buffer=buf;
      const f=ctx.createBiquadFilter();f.type=type||'bandpass';f.frequency.value=freq||2000;f.Q.value=q||1;
      const g=ctx.createGain();g.gain.value=vol;const s=ctx.createGain();s.gain.value=0.5;
      src.connect(f);f.connect(g);g.connect(bus||dry);g.connect(s);s.connect(revSend);src.start(t);
      src.onended=()=>{try{src.disconnect();f.disconnect();g.disconnect();s.disconnect();}catch(e){}};
    }
    // 带音量包络与频率滑落的振荡器（模拟共振体）
    function tone(freq,dur,type,vol,glideTo,bus,when,atk){
      if(!started||!on)return;
      const t=when||now(),o=ctx.createOscillator(),g=ctx.createGain(),s=ctx.createGain();
      o.type=type||'sine';o.frequency.setValueAtTime(freq,t);
      if(glideTo)o.frequency.exponentialRampToValueAtTime(glideTo,t+dur);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(vol,t+(atk||0.004));
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      s.gain.value=0.55;o.connect(g);g.connect(bus||dry);g.connect(s);s.connect(revSend);
      o.start(t);o.stop(t+dur+0.03);
      o.onended=()=>{try{o.disconnect();g.disconnect();s.disconnect();}catch(e){}};
    }
    // 真实水滴：高频瞬态冲击 + 快速下滑的共振 + 小回弹
    function droplet(){
      const t=now(),f=760+Math.random()*420;
      burst(0.010,0.10,'highpass',2600,0.7,dry,t);
      tone(f,0.085+Math.random()*0.05,'sine',0.075,f*0.32,dry,t);
      if(Math.random()<0.7)tone(f*1.35,0.05,'sine',0.028,f*0.6,dry,t+0.055+Math.random()*0.03);
    }
    // 结晶微颗粒：密集细碎的沙沙 / 噼啪
    function frostGrain(){burst(0.006+Math.random()*0.008,0.012+Math.random()*0.016,'bandpass',4200+Math.random()*3200,2.2,dry);}
    function chime(){const t=now(),f=1800+Math.random()*1600;tone(f,0.28,'sine',0.032,f*1.01,dry,t);tone(f*2.4,0.14,'triangle',0.011,null,dry,t);}
    function ui(kind){
      if(!boot())return;
      const t=now();
      burst(0.008,0.045,'bandpass',1800,1.6,dry,t); // 机械开关轻"咔哒"
      if(kind==='tab')tone(880,0.055,'sine',0.05,1120,dry,t);
      else if(kind==='on')tone(620,0.09,'sine',0.05,940,dry,t);
      else if(kind==='stop')tone(520,0.10,'sine',0.045,340,dry,t);
      else if(kind==='start')tone(480,0.09,'sine',0.045,760,dry,t);
    }
    function setScene(k){
      sceneKey=k;if(!started)return;
      Object.keys(layers).forEach(key=>layers[key].g.gain.setTargetAtTime(key===k?CFG[key].gain:0,now(),0.35));
      if(on&&running)burst(0.06,0.02,'highpass',3000,0.7,dry);
    }
    function setRunning(v){
      running=v;if(!started)return;
      Object.keys(layers).forEach(key=>layers[key].g.gain.setTargetAtTime(v&&key===sceneKey?CFG[key].gain:0,now(),0.25));
    }
    function setOn(v){on=v;if(v&&!boot())on=false;applyGain();return on;}
    function tick(dt){
      if(!started||!on||!running)return;
      const t=now();
      // 缓慢起伏：调制当前气流层的滤波频率与音量，避免机械感
      modT+=dt;const L=layers[sceneKey],c=CFG[sceneKey];
      if(L){
        L.f.frequency.setTargetAtTime(c.freq*(0.82+0.30*(0.5+0.5*Math.sin(modT*0.9))),t,0.2);
        L.g.gain.setTargetAtTime(c.gain*(0.75+0.35*(0.5+0.5*Math.sin(modT*0.55+1.3))),t,0.25);
      }
      if(sceneKey==='liq'){
        nextDrop-=dt;if(nextDrop<=0){droplet();nextDrop=0.9+Math.random()*1.8;}
      }else if(sceneKey==='dep'){
        nextGrain-=dt;if(nextGrain<=0){frostGrain();nextGrain=0.045+Math.random()*0.12;}
        nextChime-=dt;if(nextChime<=0){if(Math.random()<0.6)chime();nextChime=1.6+Math.random()*2.6;}
      }else{
        nextGrain-=dt;if(nextGrain<=0){burst(0.02,0.008,'bandpass',2600+Math.random()*1800,1.2,dry);nextGrain=0.12+Math.random()*0.3;}
      }
    }
    return {boot,ui,setScene,setRunning,setOn,tick,getOn:()=>on};
  })();
  addEventListener('pointerdown',()=>Sound.boot(),{once:true});

  let active='liq';
  let playing=true;
  const PLAY_NAMES={liq:'液化',sub:'升华',dep:'凝华'};
  const playBtn=document.getElementById('playBtn');
  const playTxt=document.getElementById('playTxt');
  function syncPlayBtn(){
    playTxt.textContent=(playing?'停止':'开始')+PLAY_NAMES[active];
    playBtn.classList.toggle('paused',!playing);
  }
  function setActive(key){
    if(!scenes[key])return;
    active=key;
    Object.keys(scenes).forEach(k=>{scenes[k].group.visible=(k===key);scenes[k].time=0;scenes[k].reset();});
    document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.key===key));
    heatL.intensity=0;
    playing=true;syncPlayBtn();
    Sound.setScene(key);Sound.setRunning(true);
  }
  document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{Sound.ui('tab');setActive(b.dataset.key);}));
  playBtn.addEventListener('click',()=>{
    playing=!playing;syncPlayBtn();
    Sound.setRunning(playing);Sound.ui(playing?'start':'stop');
  });
  const sndBtn=document.getElementById('sndBtn');
  sndBtn.addEventListener('click',()=>{
    const on=Sound.setOn(!Sound.getOn());
    sndBtn.classList.toggle('on',on);sndBtn.classList.toggle('off',!on);
    sndBtn.title=on?'关闭音效':'开启音效';
    if(on)Sound.ui('on');
  });

  // 极简图标标注（投影跟随）
  const labelLayer=document.getElementById('labels');
  const items=[];
  Object.keys(scenes).forEach(k=>scenes[k].labels.forEach(def=>{
    const el=document.createElement('div');el.className='tag';
    el.innerHTML='<span class="ico '+def.ico+'"></span><span>'+def.text+'</span>';
    labelLayer.appendChild(el);items.push({key:k,def,el});
  }));
  const v3=new THREE.Vector3();
  function updateLabels(){
    scene.updateMatrixWorld();
    const w=innerWidth,h=innerHeight;
    for(const L of items){
      if(L.key!==active){L.el.style.display='none';continue;}
      v3.copy(L.def.obj?L.def.obj.localToWorld(new THREE.Vector3(...L.def.local)):L.def.pos);
      v3.project(camera);
      if(v3.z>1||v3.z<-1){L.el.style.display='none';continue;}
      L.el.style.display='flex';
      L.el.style.transform='translate(-50%,-50%) translate('+((v3.x*0.5+0.5)*w).toFixed(1)+'px,'+((-v3.y*0.5+0.5)*h).toFixed(1)+'px)';
    }
  }

  /* ============ 循环 ============ */
  const clock=new THREE.Clock();
  function animate(){
    requestAnimationFrame(animate);
    const dt=Math.min(clock.getDelta(),0.05);
    controls.update();
    const S=scenes[active];
    if(playing){S.time+=dt;S.update(dt,S.time);}
    Sound.tick(dt);
    updateLabels();
    composer.render();
  }
  addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
    composer.setSize(innerWidth,innerHeight);
  });
  setTimeout(()=>{const h=document.getElementById('hint');if(h)h.style.opacity=0;},6500);

  const params=new URLSearchParams(location.search);
  const ini=params.get('scene');
  setActive(scenes[ini]?ini:'liq');
  const pt=parseFloat(params.get('t'));
  if(!isNaN(pt)){const S=scenes[active];S.time=pt;for(let i=0;i<Math.min(pt*60,900);i++)S.update(1/60,i/60);}
  animate();
  window.__labReady=true;
  const loading=document.getElementById('loading');loading.classList.add('hide');setTimeout(()=>loading.remove(),700);
  </script>
</body>
</html>
