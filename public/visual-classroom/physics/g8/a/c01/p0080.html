<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>声学探究实验台 · 声音的产生、传播与噪声控制</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#04060c;
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }
  #labels { position:fixed; inset:0; pointer-events:none; z-index:5; }

  /* 3D 极简标签 */
  .tag {
    color:rgba(190,225,255,.92); font-size:12px; letter-spacing:3px;
    padding:3px 10px 3px 13px; border-radius:99px; white-space:nowrap;
    background:rgba(8,16,30,.55); border:1px solid rgba(110,175,255,.28);
    backdrop-filter:blur(4px); text-shadow:0 0 8px rgba(80,180,255,.5);
  }
  /* 控制台说明标签（主标题 + 作用副标题） */
  .tag.console-tag {
    display:flex; flex-direction:column; align-items:center; gap:2px;
    padding:6px 14px 7px; border-radius:10px; letter-spacing:1px;
    background:rgba(8,16,30,.82); border-color:rgba(255,196,90,.45);
    box-shadow:0 0 14px rgba(255,170,60,.18);
  }
  .tag.console-tag .t-main { color:#ffd98a; font-size:12px; letter-spacing:3px; text-shadow:0 0 10px rgba(255,180,70,.6); }
  .tag.console-tag .t-sub  { color:rgba(200,225,255,.85); font-size:10px; letter-spacing:1px; text-shadow:none; }

  /* 暗角 */
  #vignette { position:fixed; inset:0; pointer-events:none; z-index:2;
    background:radial-gradient(ellipse at 50% 42%, transparent 52%, rgba(1,3,9,.62) 100%); }

  /* 顶部课题标签栏 */
  #tabs {
    position:fixed; top:20px; left:50%; transform:translateX(-50%);
    z-index:10; display:flex; gap:10px;
  }
  .tab {
    pointer-events:auto; cursor:pointer; user-select:none; white-space:nowrap;
    color:rgba(180,210,250,.75); font-size:13px; letter-spacing:2px;
    padding:8px 18px; border-radius:99px;
    background:rgba(8,16,30,.6); border:1px solid rgba(110,175,255,.25);
    backdrop-filter:blur(6px); transition:all .2s ease;
  }
  .tab:hover { color:#d5eaff; border-color:rgba(140,200,255,.6); }
  .tab.active {
    color:#031018; font-weight:600;
    background:linear-gradient(135deg,#39c0ff,#2b8dff);
    border-color:transparent; box-shadow:0 0 20px rgba(56,160,255,.45);
  }

  /* 声呐探测流程指示（极简图示，随过程点亮） */
  #process {
    position:fixed; top:72px; left:50%; transform:translateX(-50%);
    z-index:10; display:none; align-items:center; gap:10px;
    padding:7px 14px; border-radius:99px;
    background:rgba(6,12,22,.55); border:1px solid rgba(80,145,230,.18);
    backdrop-filter:blur(6px);
  }
  .step {
    display:flex; align-items:center; gap:6px;
    color:rgba(150,185,225,.35); font-size:12px; letter-spacing:2px;
    padding:3px 10px; border-radius:99px; border:1px solid transparent;
    transition:all .25s ease;
  }
  .step .ico { font-family:Consolas,monospace; font-size:15px; letter-spacing:-3px; }
  .step.on {
    color:#eaf6ff; border-color:rgba(90,190,255,.6);
    background:rgba(40,130,220,.35); box-shadow:0 0 16px rgba(60,160,255,.45);
  }
  .step.done { color:rgba(150,220,255,.75); background:rgba(40,90,150,.18); }
  .flow { color:rgba(120,170,230,.4); font-size:15px; }
  .dist {
    color:#ffd166; font-family:Consolas,monospace; font-size:14px;
    opacity:0; transform:translateX(-6px); transition:all .3s ease;
    padding-left:4px;
  }
  .dist.show { opacity:1; transform:translateX(0); }

  /* 品牌铭牌（左上） */
  #brand {
    position:fixed; left:24px; top:20px; z-index:10;
    font-family:Consolas,Menlo,monospace; pointer-events:none;
  }
  #brand .b1 { color:rgba(190,225,255,.9); font-size:13px; letter-spacing:4px; font-weight:600; }
  #brand .b2 { color:rgba(110,160,215,.6); font-size:9px; letter-spacing:3px; margin-top:3px; }
  #brand .b1 em { font-style:normal; color:#4dc3ff; }

  /* 视图切换（右上） */
  #view-switch {
    position:fixed; right:24px; top:18px; z-index:10; display:flex; gap:3px;
    background:rgba(8,14,24,.8); border:1px solid rgba(90,140,200,.3);
    border-radius:7px; padding:3px; backdrop-filter:blur(6px);
  }
  .vbtn {
    cursor:pointer; user-select:none; color:rgba(160,195,235,.65);
    font:11px Consolas,monospace; letter-spacing:1px; padding:5px 12px;
    border-radius:5px; transition:all .2s;
  }
  .vbtn:hover { color:#cfe6ff; background:rgba(40,80,130,.3); }
  .vbtn.active { color:#eaf6ff; background:rgba(45,130,220,.5); box-shadow:0 0 12px rgba(60,160,255,.35) inset; }

  /* 数据气泡（参考图风格） */
  .bubble {
    position:relative; display:flex; align-items:center; gap:6px;
    background:rgba(8,13,22,.92); border:1px solid rgba(120,165,215,.5);
    border-left:3px solid var(--bc,#4dc3ff); border-radius:4px;
    padding:4px 10px; color:#dcecff; font:11px Consolas,Menlo,monospace;
    letter-spacing:1px; white-space:nowrap;
    box-shadow:0 4px 18px rgba(0,0,0,.6), 0 0 10px rgba(70,150,230,.18);
  }
  .bubble::before {
    content:''; position:absolute; left:-5px; top:50%; margin-top:-3px;
    border-top:3px solid transparent; border-bottom:3px solid transparent;
    border-right:5px solid var(--bc,#4dc3ff);
  }
  .bubble .dot {
    width:5px; height:5px; border-radius:50%; background:var(--bc,#4dc3ff);
    box-shadow:0 0 8px var(--bc,#4dc3ff);
  }
  .bubble b { color:var(--bc,#4dc3ff); font-weight:600; }

  /* 示波器面板（左下） */
  #wave-panel {
    position:fixed; left:24px; bottom:24px; z-index:10; width:372px;
    background:linear-gradient(155deg,#171e29,#0a0f17 70%);
    border:1px solid #303d50; border-radius:8px; padding:11px 12px 9px;
    box-shadow:0 14px 40px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .scope-head {
    display:flex; justify-content:space-between; align-items:center; margin-bottom:9px;
    font-family:Consolas,monospace;
  }
  .scope-title { color:rgba(175,210,250,.85); font-size:10px; letter-spacing:3px; }
  .scope-title em { font-style:normal; color:#5ec8ff; }
  .scope-led { display:flex; align-items:center; gap:5px; color:rgba(120,170,220,.7); font-size:9px; letter-spacing:1px; }
  .scope-led i {
    display:inline-block; width:6px; height:6px; border-radius:50%;
    background:#4ade80; box-shadow:0 0 9px #4ade80; animation:blink 2s ease-in-out infinite;
  }
  @keyframes blink { 50% { opacity:.35; } }
  .scope-screen {
    position:relative; background:#040910; border:1px solid #1e2c3e; border-radius:4px;
    box-shadow:inset 0 0 22px rgba(0,0,0,.9); overflow:hidden;
  }
  #wave { display:block; width:100%; height:124px; }
  .scope-foot {
    display:flex; justify-content:space-between; margin-top:7px;
    font:9px Consolas,monospace; color:rgba(120,165,215,.55); letter-spacing:1px;
  }
  .screw {
    position:absolute; width:6px; height:6px; border-radius:50%;
    background:linear-gradient(135deg,#6b7789,#2a3444);
    box-shadow:inset 0 0 2px #000, 0 1px 1px rgba(255,255,255,.1);
  }
  .screw.tl { left:5px; top:5px; } .screw.tr { right:5px; top:5px; }
  .screw.bl { left:5px; bottom:5px; } .screw.br { right:5px; bottom:5px; }

  /* 状态读数（右下，仪表风格） */
  #readout {
    position:fixed; right:24px; bottom:26px; z-index:10;
    background:linear-gradient(160deg,#171e29,#0a0f17);
    border:1px solid #303d50; border-radius:7px; padding:10px 16px;
    font:12px Consolas,Menlo,monospace; letter-spacing:1px;
    color:rgba(150,195,250,.85);
    box-shadow:0 12px 34px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.05);
  }
  #readout b { color:#eaf6ff; font-weight:600; margin:0 2px; }
  #readout::before {
    content:'◉'; color:#4ade80; margin-right:8px; font-size:9px; text-shadow:0 0 8px #4ade80;
  }

  /* 操作按钮（底部居中） */
  #controls {
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    z-index:10; display:flex; gap:12px;
  }
  .btn {
    pointer-events:auto; cursor:pointer; user-select:none;
    color:rgba(200,230,255,.9); font-size:14px; letter-spacing:6px; text-indent:6px;
    padding:10px 22px; border-radius:99px;
    background:rgba(10,20,36,.75); border:1px solid rgba(110,175,255,.35);
    backdrop-filter:blur(6px); transition:all .2s ease;
  }
  .btn:hover { border-color:rgba(140,200,255,.7); background:rgba(16,32,55,.85); }
  .btn.active {
    color:#031018; background:linear-gradient(135deg,#39c0ff,#2b8dff);
    border-color:transparent; box-shadow:0 0 22px rgba(56,160,255,.5);
  }
</style>
</head>

<div id="labels"></div>

<div id="brand">
  <div class="b1">ACOUSTIC <em>RESEARCH</em> LAB</div>

</div>

<div id="view-switch">

<div id="tabs">
  <div class="tab" data-m="produce">声音的产生与传播</div>
  <div class="tab active" data-m="vacuum">真空铃实验</div>
  <div class="tab" data-m="noise">噪声控制与隔音房间</div>
  <div class="tab" data-m="info">声音传递信息</div>

<div id="process">
  <div class="step" id="st0"><span class="ico">))</span>发射</div>

<script type="importmap">

  "imports": {

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ================= 基础 ================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04060c);
scene.fog = new THREE.FogExp2(0x04060c, 0.022);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(6.4, 3.8, 7.8);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
document.getElementById('labels').appendChild(labelRenderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.25, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 4;
controls.maxDistance = 16;
controls.maxPolarAngle = 1.46;

/* ================= 光照 ================= */
scene.add(new THREE.HemisphereLight(0x35507a, 0x0a0e16, 0.55));
const key = new THREE.DirectionalLight(0xeaf2ff, 1.6);
key.position.set(6, 9, 4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -10; key.shadow.camera.right = 10;
key.shadow.camera.top = 10;  key.shadow.camera.bottom = -10;
key.shadow.radius = 6;
scene.add(key);
const rimL = new THREE.PointLight(0x2f8fff, 30, 22); rimL.position.set(-6, 4, -5); scene.add(rimL);
const fillL = new THREE.PointLight(0x66d9ff, 12, 16); fillL.position.set(4, 2.5, -6); scene.add(fillL);

/* ================= 地面 ================= */
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(18, 64),
  new THREE.MeshStandardMaterial({ color:0x0a0f19, roughness:0.9, metalness:0.1 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(34, 34, 0x1c3d63, 0x0e2138);
grid.material.transparent = true; grid.material.opacity = 0.5;
grid.position.y = 0.002;
scene.add(grid);

/* ================= 公共材质 ================= */
const metal = new THREE.MeshStandardMaterial({ color:0xb7c2cf, roughness:0.28, metalness:0.9 });
const dark  = new THREE.MeshStandardMaterial({ color:0x1c2027, roughness:0.6, metalness:0.4 });

/* ============================================================
   高度仿真仪器组件工厂
============================================================ */
const panelMat = new THREE.MeshStandardMaterial({ color:0x1b222d, roughness:0.55, metalness:0.75 });
const panelDark = new THREE.MeshStandardMaterial({ color:0x0d121a, roughness:0.5, metalness:0.6 });
const boltMat = new THREE.MeshStandardMaterial({ color:0x8592a4, roughness:0.3, metalness:0.95 });
const boltGeo = new THREE.CylinderGeometry(0.035, 0.035, 0.02, 8);

/* 螺丝（面板四角细节） */
function addBolts(parent, w, h, z, step=1){
  for (const sx of [-1,1]) for (const sy of [-1,1]){
    const b = new THREE.Mesh(boltGeo, boltMat);
    b.rotation.x = Math.PI/2;
    b.position.set(sx*w/2*step, sy*h/2*step, z);
    parent.add(b);
  }
}

/* 发光圆形仪表（带刻度 + 指针） */
function makeGauge(parent, x, y, z, text, color, radius=0.28){
  const g = new THREE.Group();
  g.position.set(x,y,z);
  parent.add(g);
  const bezel = new THREE.Mesh(new THREE.CylinderGeometry(radius*1.14, radius*1.14, 0.06, 40), boltMat);
  bezel.rotation.x = Math.PI/2; g.add(bezel);
  const face = new THREE.Mesh(new THREE.CircleGeometry(radius, 40),
    new THREE.MeshBasicMaterial({ color:0x05090f }));
  face.position.z = 0.032; g.add(face);
  // 刻度环（分 3 色区域）
  const ring = new THREE.Mesh(new THREE.RingGeometry(radius*0.80, radius*0.86, 48),
    new THREE.MeshBasicMaterial({ color, transparent:true, opacity:0.85, side:THREE.DoubleSide }));
  ring.position.z = 0.033; g.add(ring);
  const seg = new THREE.Mesh(new THREE.RingGeometry(radius*0.86, radius*0.95, 48, 1, 0, Math.PI*0.42),
    new THREE.MeshBasicMaterial({ color:0xff5c5c, transparent:true, opacity:0.9, side:THREE.DoubleSide }));
  seg.rotation.z = -Math.PI*0.42; seg.position.z = 0.033; g.add(seg);
  // 刻度线
  for (let i=0;i<=10;i++){
    const a = Math.PI*0.75 - i*(Math.PI*1.5/10);
    const r1 = radius*0.56, r2 = radius*(i%5===0?0.74:0.67);
    const tick = new THREE.Mesh(new THREE.BoxGeometry(0.012, r2-r1, 0.005),
      new THREE.MeshBasicMaterial({ color: i>7 ? 0xff7a7a : 0x9db8d4 }));
    tick.position.set(Math.cos(a)*(r1+r2)/2, Math.sin(a)*(r1+r2)/2, 0.035);
    tick.rotation.z = a - Math.PI/2;
    g.add(tick);
  }
  // 指针
  const needle = new THREE.Group();
  const nd = new THREE.Mesh(new THREE.BoxGeometry(0.018, radius*0.66, 0.006),
    new THREE.MeshBasicMaterial({ color }));
  nd.position.y = radius*0.33; needle.add(nd);
  needle.position.z = 0.038; g.add(needle);
  const hub = new THREE.Mesh(new THREE.CircleGeometry(0.032, 16),
    new THREE.MeshBasicMaterial({ color:0xdceaff }));
  hub.position.z = 0.04; g.add(hub);
  // 仪表文字（CanvasTexture）
  const c = document.createElement('canvas'); c.width=256; c.height=64;
  const cx = c.getContext('2d');
  cx.fillStyle='rgba(0,0,0,0)'; cx.fillRect(0,0,256,64);
  cx.font='bold 26px Consolas,monospace'; cx.fillStyle='rgba(190,220,255,.9)';
  cx.textAlign='center'; cx.fillText(text,128,40);
  const tex = new THREE.CanvasTexture(c);
  const label = new THREE.Mesh(new THREE.PlaneGeometry(radius*1.6, radius*0.4),
    new THREE.MeshBasicMaterial({ map:tex, transparent:true }));
  label.position.set(0, -radius*1.35, 0.02); g.add(label);
  return { set(v){ needle.rotation.z = Math.PI*0.75 - Math.max(0,Math.min(1,v))*Math.PI*1.5; },
           ring, bezel };
}

/* 指示灯组 */
function makeLamps(parent, x, y, z, colors){
  const lamps = [];
  colors.forEach((col,i)=>{
    const base = new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.055,0.03,16), boltMat);
    base.rotation.x = Math.PI/2; base.position.set(x+i*0.17, y, z); parent.add(base);
    const bulb = new THREE.Mesh(new THREE.CircleGeometry(0.042,16),
      new THREE.MeshBasicMaterial({ color:col, transparent:true, opacity:0.3 }));
    bulb.position.set(x+i*0.17, y, z+0.018); parent.add(bulb);
    lamps.push(bulb);
  });
  return {
    set(index, on){
      lamps.forEach((b,i)=> b.material.opacity = (i===index && on) ? 1 : 0.25);
    }
  };
}

/* 数字读数小屏 */
function makeReadout(parent, x, y, z, w, h){
  const c = document.createElement('canvas'); c.width=256; c.height=96;
  const cx = c.getContext('2d');
  const tex = new THREE.CanvasTexture(c);
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w,h),
    new THREE.MeshBasicMaterial({ map:tex }));
  mesh.position.set(x,y,z); parent.add(mesh);
  const frame = new THREE.Mesh(new THREE.BoxGeometry(w+0.08,h+0.08,0.03), panelDark);
  frame.position.set(x,y,z-0.02); parent.add(frame);
  return {
    set(line1, line2, col='#7fe3ff'){
      cx.fillStyle='#050a11'; cx.fillRect(0,0,256,96);
      cx.strokeStyle='rgba(80,140,200,.35)'; cx.lineWidth=2; cx.strokeRect(3,3,250,90);
      cx.textAlign='left';
      cx.fillStyle='rgba(140,185,235,.7)'; cx.font='16px Consolas,monospace';
      cx.fillText(line1,14,28);
      cx.fillStyle=col; cx.font='bold 40px Consolas,monospace';
      cx.fillText(line2,14,74);
      tex.needsUpdate=true;
    }
  };
}

/* 通用仪器控制台（金属机箱 + 楔形面板 + 仪表 + 灯 + 数字屏） */
function makeConsole(parent, opts){
  const g = new THREE.Group();
  g.position.set(opts.x, opts.y, opts.z);
  if (opts.ry) g.rotation.y = opts.ry;
  if (opts.scale) g.scale.setScalar(opts.scale);
  parent.add(g);
  const W = opts.w || 3.0, H = 1.0, D = 0.75;
  // 机箱主体
  const body = new THREE.Mesh(new THREE.BoxGeometry(W, H, D), panelMat);
  body.position.y = H/2; body.castShadow = true; body.receiveShadow = true; g.add(body);
  // 上盖
  const lid = new THREE.Mesh(new THREE.BoxGeometry(W+0.06, 0.06, D+0.06),
    new THREE.MeshStandardMaterial({ color:0x2a3341, roughness:0.4, metalness:0.85 }));
  lid.position.y = H+0.02; lid.castShadow = true; g.add(lid);
  // 倾斜面板（朝上前方）
  const face = new THREE.Mesh(new THREE.BoxGeometry(W-0.12, 0.62, 0.05), panelDark);
  face.position.set(0, H+0.24, -D/2+0.18);
  face.rotation.x = -0.42;
  g.add(face);
  // 竖直仪表背板（仪表盘安装面）
  const backboard = new THREE.Mesh(new THREE.BoxGeometry(W-0.16, 0.68, 0.1),
    new THREE.MeshStandardMaterial({ color:0x161d27, roughness:0.5, metalness:0.7 }));
  backboard.position.set(0, 1.3, 0.32);
  backboard.castShadow = true;
  g.add(backboard);
  // 背板顶部横梁 + 铆钉

  // 侧面散热格栅

  for (const sx of [-1,1]) for (const sy of [-1,1]){

    b.position.set(sx*(W/2-0.09), sy*0.35+0.5, D/2+0.02);

/* 数据气泡（参考图风格，CSS2D） */
function makeBubble(pool, text, x, y, z, color='#4dc3ff'){
  const el = document.createElement('div');
  el.className = 'bubble';
  el.style.setProperty('--bc', color);
  el.innerHTML = `<span class="dot"></span><span>${text}</span>`;
  const o = new CSS2DObject(el);
  o.position.set(x,y,z);
  o.setText = (html)=>{ el.lastElementChild.innerHTML = html; };
  pool.push(o);
  return o;
}

/* ================= 环形涟漪工具 ================= */
function makeRingPool(group, color, y, n, inner=0.46, outer=0.52){
  const pool = [];
  for (let i=0;i<n;i++){
    const r = new THREE.Mesh(
      new THREE.RingGeometry(inner, outer, 48),
      new THREE.MeshBasicMaterial({ color, transparent:true, opacity:0, side:THREE.DoubleSide, depthWrite:false })
    );
    r.rotation.x = -Math.PI/2;
    r.position.y = y;
    group.add(r);
    pool.push({ mesh:r, life:0 });
  }
  return pool;
}
function spawnRing(pool){
  for (const r of pool){
    if (r.life <= 0){ r.life = 1; r.mesh.scale.setScalar(1); break; }
  }
}
function updateRings(pool, dt, strength, expand, speed){
  for (const r of pool){
    if (r.life > 0){
      r.life -= dt * speed;
      const s = 1 + (1 - Math.max(r.life,0)) * expand;
      r.mesh.scale.setScalar(s);
      r.mesh.material.opacity = Math.max(0, r.life) * 0.55 * strength;
    }
  }
}

}

   音频（合成铃声 / 音叉纯音 / 噪声）
============================================================ */
let actx = null, master = null, noiseGain = null, energyGain = null, soundOn = true;
function ensureAudio(){
  if (actx) return;
  actx = new (window.AudioContext || window.webkitAudioContext)();
  master = actx.createGain();
  master.gain.value = soundOn ? 1 : 0;
  master.connect(actx.destination);
  // 低频嗡鸣（能量模块）
  const eo1 = actx.createOscillator(); eo1.type = 'sine'; eo1.frequency.value = 110;
  const eo2 = actx.createOscillator(); eo2.type = 'sine'; eo2.frequency.value = 220;
  energyGain = actx.createGain(); energyGain.gain.value = 0;
  eo1.connect(energyGain); eo2.connect(energyGain); energyGain.connect(master);
  eo1.start(); eo2.start();
  // 白噪声源（噪声模块）
  const buf = actx.createBuffer(1, actx.sampleRate*2, actx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  const src = actx.createBufferSource();
  src.buffer = buf; src.loop = true;
  const filt = actx.createBiquadFilter();
  filt.type = 'lowpass'; filt.frequency.value = 1100;
  noiseGain = actx.createGain(); noiseGain.gain.value = 0;
  src.connect(filt); filt.connect(noiseGain); noiseGain.connect(master);
  src.start();
}
addEventListener('pointerdown', ()=>{ ensureAudio(); if(actx.state==='suspended') actx.resume(); });

function ding(){
  if (!actx || air <= 1) return;
  const t = actx.currentTime;
  const vol = Math.pow(air/100, 2) * 0.5;
  [[1244,1],[1867,0.6],[2794,0.35],[622,0.5]].forEach(([f,g])=>{
    const o = actx.createOscillator(), gn = actx.createGain();
    o.type = 'sine'; o.frequency.value = f;
    gn.gain.setValueAtTime(vol*g, t);
    gn.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
    o.connect(gn); gn.connect(master);
    o.start(t); o.stop(t + 1.15);
  });
}
function forkTone(strength){
  if (!actx) return;
  const t = actx.currentTime;
  const dur = strength > 0.7 ? 2.6 : 1.6;
  [[440,1],[884,0.35],[1796,0.12]].forEach(([f,g])=>{
    const o = actx.createOscillator(), gn = actx.createGain();
    o.type = 'sine'; o.frequency.value = f;
    gn.gain.setValueAtTime(strength*0.35*g, t);
    gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(gn); gn.connect(master);
    o.start(t); o.stop(t + dur + 0.1);
  });
}
function sonarBeep(freq, dur){
  if (!actx) return;
  const t0 = actx.currentTime;
  const o = actx.createOscillator(), gn = actx.createGain();
  o.type = 'sine'; o.frequency.value = freq;
  gn.gain.setValueAtTime(0.25, t0);
  gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(gn); gn.connect(master);
  o.start(t0); o.stop(t0 + dur + 0.05);
}

    soundBtn(); consoleBtn();
  } else if (activeMod === 'noise'){
    mk('吸音棉',  ()=>{ cottonOn = !cottonOn; buildControls(); }, cottonOn);
    mk('双层玻璃', ()=>{ glassOn  = !glassOn;  buildControls(); }, glassOn);
    mk('密封门',  ()=>{ doorOn   = !doorOn;   buildControls(); }, doorOn);
    soundBtn(); consoleBtn();
  } else if (activeMod === 'energy'){
    mk('声波能量', ()=>{ energyOn = !energyOn; buildControls(); }, energyOn);
    soundBtn(); consoleBtn();
  } else {
    mk('声呐探测', ()=>{
      if (pingT < 0){
        pingT = 0; pTimer = 0;
        echoSpawned = false; echoArrived = false; distShown = null;
        measureLine.visible = false;
        distTag.visible = false;
        sonarBeep(1500, 0.3);
        buildControls();
      }
    }, pingT >= 0);
    soundBtn(); consoleBtn();
  }
}
function toggleSound(){
  soundOn = !soundOn;
  if (master) master.gain.setTargetAtTime(soundOn?1:0, actx.currentTime, 0.05);
  buildControls();
}
function forkStrike(strength){
  forkAmp = Math.max(forkAmp, strength);
  malletActive = true; malletT = 0;
  forkTone(strength);
}

function switchModule(m){
  activeMod = m;
  gVac.visible = (m==='vacuum');
  gPro.visible = (m==='produce');
  gNoi.visible = (m==='noise');
  gInfoM.visible = (m==='info');
  gEnergy.visible = (m==='energy');
  labelVac.forEach(o=>o.visible = m==='vacuum');
  labelPro.forEach(o=>o.visible = m==='produce');
  labelNoi.forEach(o=>o.visible = m==='noise');
  labelInfoM.forEach(o=>o.visible = m==='info');
  labelEnergy.forEach(o=>o.visible = m==='energy');
  consoleTagOf[m].visible = consolesVisible;
  distTag.visible = false;
  procEl.style.display = (m==='info') ? 'flex' : 'none';
  lastProcKey = '';
  tabsEl.forEach(t=>t.classList.toggle('active', t.dataset.m===m));
  capEl.textContent = caps[m];
  scopeModeEl.textContent = scopeModes[m];
  buildControls();
  applyView();
  lastShownDb = -1; lastShownOut = -1;
}
tabsEl.forEach(t=> t.onclick = ()=> switchModule(t.dataset.m));

/* 视图模式：LAB 标准 / EXPLODED 全景俯视 / STUDIO 近景特写 */
let viewMode = 'lab';
const viewBtns = document.querySelectorAll('.vbtn');
function applyView(){
  const base = presets[activeMod];
  let p = base.pos.clone(), l = base.look.clone();
  if (viewMode === 'exploded'){
    p.multiplyScalar(1.35); p.y += 3.2;
    l.y += 0.3;
  } else if (viewMode === 'studio'){
    const dir = p.clone().sub(l).normalize();
    p = l.clone().addScaledVector(dir, Math.max(4.2, p.distanceTo(l)*0.62));
    p.y = l.y + Math.max(1.6, (p.y-l.y)*0.7);
  }
  setCam(p, l);
}
viewBtns.forEach(b=> b.onclick = ()=>{
  viewMode = b.dataset.v;
  viewBtns.forEach(x=>x.classList.toggle('active', x===b));
  applyView();
});

/* 初始化可见性 */
procEl.style.display = 'none';
gPro.visible = false; gNoi.visible = false; gInfoM.visible = false; gEnergy.visible = false;
labelPro.forEach(o=>o.visible = false);
labelNoi.forEach(o=>o.visible = false);
labelInfoM.forEach(o=>o.visible = false);
labelEnergy.forEach(o=>o.visible = false);
buildControls();

/* ============================================================
   波形图
============================================================ */
const waveCan = document.getElementById('wave');
const wCtx = waveCan.getContext('2d');
let phase = 0, hitPulse = 0;
let nph1 = 0, nph2 = 0, nph3 = 0;

function drawWave(dt, amp, style){
  phase += dt * (4 + amp*8);
  nph1 += dt*3.7; nph2 += dt*2.3; nph3 += dt*5.1;
  const w = waveCan.width, h = waveCan.height;
  wCtx.clearRect(0,0,w,h);

  /* 网格（示波器刻度） */
  wCtx.lineWidth = 1;
  wCtx.strokeStyle = 'rgba(60,110,165,.13)';
  wCtx.beginPath();
  for (let x=0; x<=w; x+=w/12){ wCtx.moveTo(x,0); wCtx.lineTo(x,h); }
  for (let y=0; y<=h; y+=h/6){ wCtx.moveTo(0,y); wCtx.lineTo(w,y); }
  wCtx.stroke();
  wCtx.strokeStyle = 'rgba(80,145,215,.28)';
  wCtx.beginPath();
  wCtx.moveTo(0,h/2); wCtx.lineTo(w,h/2);
  wCtx.moveTo(w/2,0); wCtx.lineTo(w/2,h);
  wCtx.stroke();

  let color, color2;
  if (style==='noise'){ color = `rgba(255,140,95,${0.3+amp*0.7})`; color2 = 'rgba(255,200,110,.28)'; }
  else if (style==='tone'){ color = `rgba(94,232,208,${0.3+amp*0.7})`; color2 = 'rgba(110,170,255,.3)'; }
  else { color = `rgba(90,205,255,${0.25+amp*0.75})`; color2 = 'rgba(180,130,255,.3)'; }

  const A = amp * (h*0.36) * (1 + (hitPulse + pingPulse)*0.6);
  function trace(offset, phaseShift, scale, stroke, lw, blur){
    wCtx.beginPath();
    for (let x=0; x<=w; x+=2){
      const u = x/w;
      const env = Math.sin(u*Math.PI);
      let y;
      if (style==='noise'){
        y = h/2 + offset + A*env*(0.45*Math.sin(u*50+nph1+phaseShift) + 0.3*Math.sin(u*83+nph2) + 0.25*Math.sin(u*131+nph3));
      } else if (style==='tone'){
        y = h/2 + offset + (Math.sin(u*26+phase+phaseShift)*A*env*0.85 + Math.sin(u*52+phase*1.9)*A*env*0.15)*scale;
      } else {
        y = h/2 + offset + (Math.sin(u*22+phase+phaseShift)*A*env*0.75 + Math.sin(u*44+phase*1.7)*A*env*0.25)*scale;
      }
      x===0 ? wCtx.moveTo(x,y) : wCtx.lineTo(x,y);
    }
    wCtx.strokeStyle = stroke;
    wCtx.lineWidth = lw;
    wCtx.shadowColor = stroke;
    wCtx.shadowBlur = blur;
    wCtx.stroke();
    wCtx.shadowBlur = 0;
  }
  // 副通道（参考波形）+ 主通道
  trace(-h*0.22, 1.4, 0.55, color2, 1.4, 4);
  trace(h*0.14, 0, 0.45, color2, 1.4, 4);
  trace(0, 0, 1, color, 2.6, 8 + amp*12);

  // 扫描亮线
  const sx = (clock.elapsedTime*140) % w;
  const grad = wCtx.createLinearGradient(sx-30,0,sx,0);
  grad.addColorStop(0,'rgba(120,210,255,0)');
  grad.addColorStop(1,`rgba(150,225,255,${0.12+amp*0.1})`);
  wCtx.fillStyle = grad;
  wCtx.fillRect(sx-30,0,30,h);
}

/* ============================================================
   主循环
============================================================ */
const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  /* 相机平滑过渡 */
  if (camMoving){
    const k = 1 - Math.pow(0.004, dt);
    camera.position.lerp(camDestPos, k);
    controls.target.lerp(camDestLook, k);
    if (camera.position.distanceTo(camDestPos) < 0.04) camMoving = false;
  }

  let waveStyle = 'bell', waveAmp = 0;

  /* ---- 真空铃 ---- */
  if (activeMod === 'vacuum'){
    if (pumpMode==='out') air = Math.max(0, air - dt*9);
    if (pumpMode==='in')  air = Math.min(100, air + dt*14);

    const db = 12 + 70 * Math.pow(air/100, 1.4);
    if (Math.round(db) !== lastShownDb){
      drawScreen(mCtx, mTex, db, air/100);
      lastShownDb = Math.round(db);
    }
    readoutEl.innerHTML = `分贝 <b>${Math.round(db)}</b> dB · 空气 <b>${Math.round(air)}%</b>`;

    if (pumpMode==='out') wheel.rotation.x -= dt*7;
    if (pumpMode==='in')  wheel.rotation.x += dt*9;

    const count = Math.floor(N * air/100);
    pGeo.setDrawRange(0, count);
    airPoints.rotation.y += dt*0.15;
    airPoints.material.opacity = 0.2 + 0.35*(air/100);

    armPivot.rotation.z = Math.sin(t*9) * 0.55;
    hitTimer += dt;
    if (hitTimer >= 0.72){
      hitTimer = 0;
      hitPulse = 1;
      ding();
      spawnRing(vacRipples);
    }
    updateRings(vacRipples, dt, air/100, 1.6, 1.6);
    hitPulse = Math.max(0, hitPulse - dt*4);

    // 仪表台
    vacGaugeP.set(1 - air/100);
    vacGaugeD.set((db-12)/70);
    vacGaugeV.set(pumpMode==='out' ? 0.8 : (pumpMode==='in' ? 0.6 : 0.05));
    vacLamps.set(pumpMode==='out' ? 0 : (pumpMode==='in' ? 1 : 2), true);
    vacReadout.set('CHAMBER PRESSURE', `${Math.round(air)}%`, '#4dc3ff');
    vacBubble.setText(`真空度 <b>${Math.round(100-air)}%</b>`);
    vacBubble2.setText(`声压 <b>${Math.round(db)} dB</b>`);

    waveStyle = 'bell';
    waveAmp = Math.max(0, (db - 15) / 70);
  }

  /* ---- 音叉 ---- */
  if (activeMod === 'produce'){
    forkAmp = Math.max(0, forkAmp - dt*0.55);

    // 音叉振动（可见摆动）
    const disp = Math.sin(t*14) * forkAmp * 0.05;
    prongL.position.x = -0.105 - disp;
    prongR.position.x =  0.105 + disp;

    // 音锤动作
    if (malletActive){
      malletT += dt;
      const f = Math.sin(Math.PI * Math.min(malletT/0.35, 1));
      mallet.position.lerpVectors(malletRest, malletHit, f);
      if (malletT >= 0.35){ malletActive = false; mallet.position.copy(malletRest); }
    }

    // 纵波粒子列（疏密相间，向右传播）
    rowSpheres.forEach(p=>{
      p.mesh.position.x = p.bx + forkAmp * 0.14 * Math.sin(4.5*(p.bx-0.3) - t*14);
      p.mesh.material.opacity = 0.15 + forkAmp*0.6;
    });

    // 涟漪持续发射
    forkRingTimer += dt;
    if (forkAmp > 0.08 && forkRingTimer >= 0.22){
      forkRingTimer = 0;
      spawnRing(forkRipples);
    }
    updateRings(forkRipples, dt, forkAmp, 4.5, 0.9);

    // 仪表台
    proGaugeA.set(forkAmp);
    proLamps.set(forkAmp>0.05 ? 0 : 1, true);
    proReadout.set('TUNING FORK 440Hz', `${Math.round(forkAmp*100)}%`, '#5ee8d0');
    proBubble.setText(`振动 <b>${Math.round(forkAmp*100)}%</b>`);

    readoutEl.innerHTML = `频率 <b>440</b> Hz · 振幅 <b>${Math.round(forkAmp*100)}%</b>`;
    waveStyle = 'tone';
    waveAmp = forkAmp;
  }

  /* ---- 声音传递能量：声波"吹"动烛焰 ---- */
  if (activeMod === 'energy'){
    const flick = Math.sin(t*13)*0.22 + Math.sin(t*29)*0.12;
    const lean = energyOn ? 0.78 + 0.22*Math.sin(t*8) : 0.05;
    flameOuter.rotation.z = -lean;
    flameInner.rotation.z = -lean;
    flameOuter.scale.set(1+flick*0.5, 1+flick, 1+flick*0.5);
    flameInner.scale.set(1+flick*0.5, 1+flick*1.4, 1+flick*0.5);
    eCone.scale.setScalar(1 + (energyOn?0.4:0.04)*Math.abs(Math.sin(t*26)));
    eSpeaker.position.y = energyOn ? Math.sin(t*40)*0.025 : 0;

    // 能量声波涟漪（更密更亮）
    if (energyOn){
      eRingTimer += dt;
      if (eRingTimer >= 0.2){
        eRingTimer = 0;
        eRings.forEach(r=>{ if(r.life<=0) r.mesh.position.set(-2.6, 1.0, 0); });
        spawnRing(eRings);
      }
    }
    updateRings(eRings, dt, energyOn?1.6:0, 2.6, 1.5);

    // 仪表台
    energyGaugeP.set(energyOn ? 0.85 : 0.02);
    energyGaugeL.set(Math.min(1, Math.abs(lean)/1.1));
    energyLamps.set(energyOn ? 1 : 0, true);
    energyReadout.set('ACOUSTIC OUTPUT', energyOn?'ACTIVE':'IDLE', '#ff8c3a');
    energyBubble.setText(`声能 <b>${energyOn?'ON':'OFF'}</b>`);

    readoutEl.innerHTML = `声波能量 <b>${energyOn?'开':'关'}</b> · 烛焰偏角 <b>${Math.round(lean*57)}°</b>`;
    if (actx && energyGain){
      energyGain.gain.setTargetAtTime(energyOn?0.2:0, actx.currentTime, 0.2);
    }
    waveStyle = 'tone';
    waveAmp = energyOn ? 0.9 : 0.05;
  } else if (actx && energyGain){
    energyGain.gain.setTargetAtTime(0, actx.currentTime, 0.15);
  }

  /* ---- 声音传递信息：声呐回声定位 ---- */
  if (activeMod === 'info'){
    sGlow += (((pingT>=0 && pingT<1.2) ? 1 : 0.25) - sGlow) * Math.min(1, dt*6);
    sEmitterMat.emissiveIntensity = 0.6 + sGlow*2.2;

    // 脉冲 → 碰到礁石 → 回声返回 → 读出距离
    if (pingT >= 0){
      pingT += dt;
      if (pingT < 1.0 && !echoSpawned){
        pTimer += dt;
        if (pTimer >= 0.22){
          pTimer = 0;
          pingRings.forEach(r=>{ if(r.life<=0) r.mesh.position.set(2.4, 1.3, 0); });
          spawnRing(pingRings);
        }
      }
      if (pingT >= 1.0 && !echoSpawned){
        echoSpawned = true;
        rockFlash = 1;               // 礁石被声波"照亮"
        echoRings.forEach(r=>{ if(r.life<=0) r.mesh.position.set(5.5, 1.3, 0); });
        spawnRing(echoRings);
      }
      if (pingT >= 2.0 && !echoArrived){
        echoArrived = true;
        pingPulse = 1;
        distShown = 3.0;
        measureLine.visible = true;   // 测距虚线出现
        distTag.visible = true;       // 3.0 m 标签出现
        sonarBeep(900, 0.5);
        buildControls();
      }
      if (pingT > 3.2){ pingT = -1; buildControls(); }
    }
    updateRings(pingRings, dt, 1.6, 5, 1.0);
    updateRings(echoRings, dt, 1.6, 4.5, 0.9);
    pingPulse = Math.max(0, pingPulse - dt*2.5);
    rockFlash = Math.max(0, rockFlash - dt*1.2);
    rockMatA.emissiveIntensity = rockFlash*1.8;
    updateProcess();

    // 仪表台
    infoGaugeS.set(pingT>=0 && pingT<1.2 ? 0.85 : 0.1);
    infoGaugeE.set(echoArrived ? 0.9 : 0.05);
    infoLamps.set(echoArrived ? 0 : (pingT>=0 ? 1 : 0), pingT>=0 || echoArrived);
    infoReadout.set('TARGET RANGE', distShown===null?'——':distShown.toFixed(1)+' m', '#6db8ff');
    infoBubble.setText(`回波 <b>${distShown===null?'—':distShown.toFixed(1)+' m'}</b>`);

    readoutEl.innerHTML = `回声距离 <b>${distShown===null?'—':distShown.toFixed(1)}</b> m`;
    waveStyle = 'tone';
    waveAmp = pingT>=0 ? 0.6 : 0.08;
  }

  /* ---- 隔音房间 ---- */
  if (activeMod === 'noise'){
    foamPanels.forEach(p=>{ p.visible = cottonOn; });
    dgGroup.visible = glassOn;
    const targetRot = doorOn ? 0 : 1.15;
    doorGroup.rotation.y += (targetRot - doorGroup.rotation.y) * Math.min(1, dt*5);
    door.material = doorOn ? doorMatClosed : doorMatOpen;
    sealFrame.visible = doorOn;

    // 音箱锥盆脉动 + 噪声涟漪
    spCone.scale.setScalar(1 + 0.12*Math.sin(t*14));
    noiRipples.forEach(r=>{ if (r.life<=0) r.mesh.position.set(-0.6, 1.0, -0.6); });

    const odb = outDb();
    if (Math.round(odb) !== lastShownOut){
      drawScreen(nCtx, nTex, odb, odb/100);
      lastShownOut = Math.round(odb);
    }
    const reduction = DB_IN - odb;
    // 仪表台
    noiGaugeIn.set(DB_IN/100);
    noiGaugeOut.set(odb/100);
    noiGaugeR.set(reduction/60);
    noiLamps.set(reduction>25 ? 0 : (reduction>10 ? 1 : 2), true);
    noiReadout.set('NOISE REDUCTION', '-'+Math.round(reduction)+' dB', '#8ef0c0');
    noiBubble.setText(`隔声量 <b>${Math.round(reduction)} dB</b>`);

    readoutEl.innerHTML = `室内 <b>${DB_IN}</b> dB · 室外 <b>${Math.round(odb)}</b> dB`;

    if (actx && noiseGain){
      const target = Math.pow(odb/100, 1.6) * 0.4;
      noiseGain.gain.setTargetAtTime(target, actx.currentTime, 0.15);
    }

    waveStyle = 'noise';
    waveAmp = odb/100;
  } else if (actx && noiseGain){
    noiseGain.gain.setTargetAtTime(0, actx.currentTime, 0.1);
  }

  drawWave(dt, waveAmp, waveStyle);
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
animate();

/* 噪声模块涟漪发射 */
setInterval(()=>{
  if (activeMod === 'noise' && gNoi.visible) spawnRing(noiRipples);
}, 480);

/* ================= 自适应 ================= */
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});
