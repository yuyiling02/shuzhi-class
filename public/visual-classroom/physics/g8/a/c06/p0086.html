<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>密度测量 · 3D 物理实验</title>
<link rel="icon" href="data:," />
<style>
  :root{
    --bg:#0b1220; --panel:#141e30; --panel-2:#1b2940; --line:rgba(120,170,230,.18);
    --txt:#e6eefb; --sub:#8fa4c0; --blue:#4d9dff; --blue-2:#1b3357; --cyan:#5fe0e6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;color:var(--txt);}
  #app{display:flex;flex-direction:column;width:100vw;height:100vh;}
  #topbar{flex:none;display:flex;align-items:center;gap:16px;padding:9px 16px;
    background:linear-gradient(180deg,#16223a,#111b2e);border-bottom:1px solid var(--line);z-index:5;}
  .brand{font-weight:700;font-size:16px;letter-spacing:.5px;white-space:nowrap;color:#f0f6ff;}
  .brand span{font-weight:400;font-size:12px;color:var(--sub);margin-left:6px;}
  .tabs{display:flex;gap:6px;background:#0e1830;padding:4px;border-radius:12px;border:1px solid var(--line);}
  .tab,.btn,.vbtn{border:0;cursor:pointer;font:inherit;font-size:13px;color:var(--sub);
    background:transparent;padding:7px 13px;border-radius:9px;transition:.18s;white-space:nowrap;}
  .tab.active,.vbtn.active{background:linear-gradient(135deg,#2f6fd0,#4d9dff);color:#fff;
    box-shadow:0 3px 12px rgba(77,157,255,.35);font-weight:600;}
  .tab:hover:not(.active),.btn:hover,.vbtn:hover:not(.active){background:rgba(77,157,255,.12);color:#fff;}
  .tools{display:flex;gap:6px;margin-left:auto;}
  .btn{background:#1b2940;border:1px solid var(--line);color:var(--txt);}
  .btn.primary{background:linear-gradient(135deg,#2f6fd0,#4d9dff);color:#fff;border-color:transparent;}
  .btn.primary:hover{background:linear-gradient(135deg,#3d7ee0,#5cabff);}
  #stage{position:relative;flex:1;min-height:160px;overflow:hidden;}
  #scene{position:absolute;inset:0;}
  #scene canvas{display:block;touch-action:none;}
  #labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
  #dock{flex:none;height:214px;display:grid;grid-template-columns:1.4fr .95fr .95fr;
    gap:10px;padding:9px 14px 10px;background:linear-gradient(180deg,#111b2e,#0e1728);border-top:1px solid var(--line);}
  .dockPanel{background:linear-gradient(160deg,#16223a,#131d31);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 4px 16px rgba(0,0,0,.28);padding:9px 12px;overflow:auto;}
  .dockPanel h3{margin:0 0 5px;font-size:13px;display:flex;align-items:center;gap:8px;color:#dce9ff;}
  .dockPanel h3::before{content:"";width:4px;height:13px;background:var(--cyan);border-radius:3px;box-shadow:0 0 8px rgba(95,224,230,.6);}
  #steps{list-style:none;margin:0;padding:0;counter-reset:s;}
  #steps li{counter-increment:s;position:relative;padding:5px 6px 5px 27px;border-radius:9px;
    font-size:12.5px;color:var(--sub);margin-bottom:2px;line-height:1.3;transition:.2s;}
  #steps li::before{content:counter(s);position:absolute;left:4px;top:4px;width:17px;height:17px;
    border-radius:50%;background:#243656;color:#9fb6d6;font-size:10.5px;font-weight:700;
    display:flex;align-items:center;justify-content:center;}
  #steps li.active{background:var(--blue-2);color:#eaf2ff;font-weight:600;}
  #steps li.active::before{background:var(--blue);color:#fff;box-shadow:0 0 8px rgba(77,157,255,.7);}
  #steps li.done::before{content:"✓";background:#2fa877;color:#fff;}
  #actBtn{display:block;width:100%;margin-top:6px;background:linear-gradient(135deg,#2f6fd0,#4d9dff);color:#fff;font-size:13px;
    font-weight:600;padding:10px;border-radius:10px;border:0;cursor:pointer;transition:.18s;
    box-shadow:0 4px 14px rgba(77,157,255,.3);}
  #actBtn:hover{background:linear-gradient(135deg,#3d7ee0,#5cabff);}
  #actBtn:active{transform:translateY(1px);}
  .hintline{margin:7px 2px 0;font-size:11px;line-height:1.45;color:#8fb6d8;background:rgba(95,224,230,.08);border:1px solid rgba(95,224,230,.18);border-radius:8px;padding:6px 8px;}
  .nav{display:flex;gap:6px;margin-top:5px;}
  .nav .btn{flex:1;font-size:11.5px;padding:4px;background:#1b2940;}
  .readouts{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
  .ro{background:#18263d;border:1px solid var(--line);border-radius:8px;padding:3px 8px;}
  .ro label{display:block;font-size:10px;color:var(--sub);margin-bottom:1px;}
  .ro strong{font-size:13px;color:#eaf2ff;font-variant-numeric:tabular-nums;}
  .ro.wide{grid-column:1/-1;background:linear-gradient(135deg,#1b3357,#17304a);padding:2px 8px;
    display:flex;align-items:center;justify-content:space-between;}
  .ro.wide label{margin:0;}
  .ro.wide strong{color:var(--cyan);font-size:16px;text-shadow:0 0 10px rgba(95,224,230,.5);}
  .vbtns{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .vbtn{background:#1b2940;border:1px solid var(--line);text-align:center;padding:6px 4px;font-size:12px;}
  #readNote{margin-top:8px;font-size:12px;color:var(--cyan);font-weight:600;
    background:#172c42;border:1px solid rgba(95,224,230,.22);border-radius:9px;padding:7px 9px;text-align:center;}
  .lbl{position:absolute;transform:translate(-50%,-50%);pointer-events:none;white-space:nowrap;
    background:rgba(16,28,48,.92);border:1px solid rgba(120,180,230,.4);border-radius:8px;
    padding:2px 8px;font-size:11.5px;color:#dceaff;box-shadow:0 2px 10px rgba(0,0,0,.35);}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#0b1220;z-index:30;font-size:14px;color:var(--sub);transition:opacity .5s;}
  @media (max-width:900px){
    #dock{height:210px;grid-template-columns:1.2fr 1fr;}
    #dock .dockPanel:last-child{grid-column:1/-1;}
    .brand span{display:none;}
  }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="brand">密度测量</div>
    <div class="tabs">
      <button class="tab active" data-mode="solid">测固体密度</button>
      <button class="tab" data-mode="liquid">测液体密度</button>
    </div>
    <div class="tools">
      <button class="btn" id="btnLabels">标签</button>
      <button class="btn primary" id="btnReset">重置实验</button>
    </div>
  </div>
  <div id="stage">
    <div id="scene"></div>
    <div id="labels"></div>
  </div>
  <div id="dock">
    <div class="dockPanel">
      <h3>步骤</h3>
      <ol id="steps"></ol>
      <button id="actBtn">开始</button>
      <p class="hintline">砝码、游码、石块、烧杯、滴管均可手动拖动；也可点“开始”自动完成。</p>
      <div class="nav">
        <button class="btn" id="prevStep">← 上一步</button>
        <button class="btn" id="nextStep">下一步 →</button>
      </div>
    </div>
    <div class="dockPanel">
      <h3>数据</h3>
      <div class="readouts">
        <div class="ro"><label>m / g</label><strong id="rMass">—</strong></div>
        <div class="ro"><label>读数 / mL</label><strong id="rVol">0.0</strong></div>
        <div class="ro"><label>V₁ / mL</label><strong id="rV1">—</strong></div>
        <div class="ro"><label>V₂ / mL</label><strong id="rV2">—</strong></div>
        <div class="ro wide"><label>ρ /（g/cm³）</label><strong id="rDen">—</strong></div>
      </div>
    </div>
    <div class="dockPanel">
      <h3>视线</h3>
      <div class="vbtns">
        <button class="vbtn active" data-view="eye">平视</button>
        <button class="vbtn" data-view="down">俯视</button>
        <button class="vbtn" data-view="up">仰视</button>
        <button class="vbtn" data-view="free">自由</button>
      </div>
      <div id="readNote">平视 · 准确</div>
    </div>
  </div>
</div>
<div id="loading">正在搭建虚拟实验室…</div>
