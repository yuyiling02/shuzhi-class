<script src="../../../../vendor/three/r128/three.min.js"></script>
<script>
/* ================= 基础参数 ================= */
const V = 3;
const LOOP_X = 24;
const WRAP = 100;
let playing = false;
let ref = 'ground';
let carX = -16;

/* ================= 渲染器（ACES 电影级色调映射） ================= */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 300);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.getElementById('app').appendChild(renderer.domElement);

/* ================= 程序化纹理工具 ================= */
function makeNoiseTexture(base, amp, painter, pw, ph){
  const c = document.createElement('canvas');
  c.width = pw || 256; c.height = ph || 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = base; ctx.fillRect(0, 0, c.width, c.height);
  const img = ctx.getImageData(0, 0, c.width, c.height), d = img.data;
  for (let i = 0; i < d.length; i += 4){
    const n = (Math.random() - 0.5) * amp;
    d[i] += n; d[i+1] += n; d[i+2] += n;
  }
  ctx.putImageData(img, 0, 0);
  if (painter) painter(ctx, c.width, c.height);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

/* 沥青路面纹理 */
const asphaltTex = makeNoiseTexture('#2a323c', 22, (ctx,w,h)=>{
  for (let i = 0; i < 12; i++){
    ctx.fillStyle = 'rgba(0,0,0,' + (Math.random()*0.09 + 0.02) + ')';
    ctx.beginPath();
    ctx.ellipse(Math.random()*w, Math.random()*h, 25+Math.random()*55, 15+Math.random()*30, Math.random()*3, 0, 7);
    ctx.fill();
  }
  for (let i = 0; i < 8; i++){
    ctx.fillStyle = 'rgba(255,255,255,' + (Math.random()*0.04) + ')';

});

/* 地面纹理 */

{

/* ================= 树木（随机形态与色彩变化） ================= */
const trunkMat = new THREE.MeshStandardMaterial({color:0x4a3d32, roughness:0.9});

body.castShadow = true; carGroup.add(body);

/* 圆角矩形轮廓辅助（侧箱等） */
function roundedRectShape(w, h, r){
  const s = new THREE.Shape();
  const x = -w/2, y = -h/2;
  s.moveTo(x+r, y);
  s.lineTo(x+w-r, y);         s.quadraticCurveTo(x+w, y, x+w, y+r);
  s.lineTo(x+w, y+h-r);       s.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  s.lineTo(x+r, y+h);         s.quadraticCurveTo(x, y+h, x, y+h-r);
  s.lineTo(x, y+r);           s.quadraticCurveTo(x, y, x+r, y);
  return s;
}
function roundedBox(w, h, d, r, mat){
  const g = new THREE.ExtrudeGeometry(roundedRectShape(w, h, r), {
    depth: d - r*2, bevelEnabled:true, bevelThickness:r, bevelSize:r,
    bevelSegments:2, steps:1, curveSegments:8
  });
  g.translate(0, 0, -(d - r*2)/2);
  const m = new THREE.Mesh(g, mat);
  m.castShadow = true;
  return m;
}

/* --- 悬挂连杆（车身→轮毂） --- */
function tube(a, b, r, mat, parent){
  const dirv = new THREE.Vector3().subVectors(b, a);
  const len = dirv.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 6), mat);
  m.position.copy(a).addScaledVector(dirv, 0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dirv.clone().normalize());
  m.castShadow = true;
  parent.add(m);
}
[[1.4, 0.85], [1.4, -0.85], [-1.5, 0.9], [-1.5, -0.9]].forEach(p=>{
  const [wx, wz] = p;

  tube(new THREE.Vector3(wx - 0.05, 0.55, side*0.25), new THREE.Vector3(wx, 0.4, wz*0.94), 0.022, carbonMat, carGroup);
});

/* --- 车轮：轮胎 + 粉色轮毂 + 辐条 --- */
function addWheel(x, z, r, w){
  const g = new THREE.Group();
  const tire = new THREE.Mesh(new THREE.CylinderGeometry(r, r, w, 28), tireMat);
  tire.rotation.x = Math.PI/2; tire.castShadow = true; g.add(tire);
  const rim = new THREE.Mesh(new THREE.CylinderGeometry(r*0.56, r*0.56, w + 0.03, 20), rimMat);
  rim.rotation.x = Math.PI/2; g.add(rim);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(r*0.16, r*0.16, w + 0.07, 12), carbonMat);
  hub.rotation.x = Math.PI/2; g.add(hub);
  for (let i = 0; i < 7; i++){
    const sp = new THREE.Mesh(new THREE.BoxGeometry(0.035, r*0.95, 0.05), carbonMat);
    const ang = i * Math.PI*2/7;
    sp.position.set(Math.sin(ang)*r*0.42, Math.cos(ang)*r*0.42, 0);
    sp.rotation.z = -ang;
    g.add(sp);
  }
  g.position.set(x, r, z);
  carGroup.add(g);
}
addWheel(1.4, 0.85, 0.36, 0.3);
addWheel(1.4, -0.85, 0.36, 0.3);
addWheel(-1.5, 0.9, 0.44, 0.36);
addWheel(-1.5, -0.9, 0.44, 0.36);

/* ================= 标签芯片 ================= */
const CHIP_STYLES = {
  move:  {bg:'rgba(30,20,12,0.9)',  fg:'#ffb37a'},
  still: {bg:'rgba(12,26,18,0.9)',  fg:'#7de0a6'},
  ref:   {bg:'rgba(12,20,32,0.9)',  fg:'#7ab3ff'},
  name:  {bg:'rgba(16,24,34,0.9)',  fg:'#cfe0f0'}
};
function makeChip(scaleX){
  const canvas = document.createElement('canvas');
  canvas.width = 320; canvas.height = 112;
  const tex = new THREE.CanvasTexture(canvas);
  tex.minFilter = THREE.LinearFilter;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthTest:false}));
  sp.renderOrder = 999;
  sp.scale.set(scaleX || 2.2, (scaleX || 2.2) * 112/320, 1);
  sp.userData = {canvas, tex};
  return sp;
}
function setChip(sp, text, kind){
  const st = CHIP_STYLES[kind];
  const c = sp.userData.canvas, ctx = c.getContext('2d');
  ctx.clearRect(0, 0, 320, 112);
  ctx.font = 'bold 50px "Microsoft YaHei", sans-serif';
  const tw = ctx.measureText(text).width;
  const w = tw + 64, h = 88, x = (320 - w)/2, y = (112 - h)/2, r = 26;
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y,   x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x,   y+h, r);
  ctx.arcTo(x,   y+h, x,   y,   r);
  ctx.arcTo(x,   y,   x+w, y,   r);
  ctx.closePath();
  ctx.fillStyle = st.bg;
  ctx.shadowColor = 'rgba(0,0,0,0.55)';
  ctx.shadowBlur = 12; ctx.shadowOffsetY = 4;
  ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.globalAlpha = 0.55;
  ctx.strokeStyle = st.fg; ctx.lineWidth = 3;
  ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.fillStyle = st.fg;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 160, 57);
  sp.userData.tex.needsUpdate = true;
}

const carChip  = makeChip(2.3);  carChip.position.set(-1.6, 2.4, 0);  carGroup.add(carChip);

/* ================= 判定同步 ================= */
function refreshChips(){
  if (ref === 'ground'){
    setChip(carChip,  '赛车 · 运动', 'move');
    setChip(passChip, '乘客 · 运动', 'move');
    setChip(treeChip, '树木 · 静止', 'still');
  } else {
    setChip(carChip,  '赛车 · 静止', 'still');
    setChip(passChip, '乘客 · 静止', 'still');
    setChip(treeChip, '树木 · 运动', 'move');
  }
  setChip(refChip, '参照物', 'ref');
}
refreshChips();

/* ================= 轨道相机 ================= */
let theta = 0.55, phi = 1.15, radius = 24;
const target = new THREE.Vector3(0, 1, 0);
let dragging = false, lastPX = 0, lastPY = 0;
const dom = renderer.domElement;
dom.addEventListener('pointerdown', e=>{ dragging = true; lastPX = e.clientX; lastPY = e.clientY; });
addEventListener('pointerup',   ()=> dragging = false);
addEventListener('pointermove', e=>{
  if (!dragging) return;
  theta -= (e.clientX - lastPX) * 0.005;
  phi   -= (e.clientY - lastPY) * 0.005;
  phi = Math.max(0.3, Math.min(1.45, phi));
  lastPX = e.clientX; lastPY = e.clientY;
});
dom.addEventListener('wheel', e=>{
  e.preventDefault();
  radius *= 1 + e.deltaY * 0.001;
  radius = Math.max(6, Math.min(55, radius));
}, {passive:false});

function updateCamera(){
  camera.position.set(
    target.x + radius * Math.sin(phi) * Math.sin(theta),
    target.y + radius * Math.cos(phi),
    target.z + radius * Math.sin(phi) * Math.cos(theta)
  );
  camera.lookAt(target);
}

/* ================= 交互控制 ================= */
const playBtn = document.getElementById('playBtn');
playBtn.addEventListener('click', ()=>{
  playing = !playing;
  playBtn.textContent = playing ? '暂停' : '播放';
});
document.getElementById('resetBtn').addEventListener('click', ()=>{
  carX = -16;
  carGroup.position.x = carX;
  playing = false;
  playBtn.textContent = '播放';
});
const refGroundBtn = document.getElementById('refGroundBtn');
const refCarBtn = document.getElementById('refCarBtn');
function setRef(r){
  ref = r;
  refGroundBtn.classList.toggle('active', r === 'ground');
  refCarBtn.classList.toggle('active', r === 'car');
  ring.visible = (r === 'ground');
  refreshChips();
}
refGroundBtn.addEventListener('click', ()=> setRef('ground'));
refCarBtn.addEventListener('click',    ()=> setRef('car'));
const auxBtn = document.getElementById('auxBtn');
auxBtn.addEventListener('click', ()=>{
  auxGroup.visible = !auxGroup.visible;
  auxBtn.classList.toggle('active', auxGroup.visible);
});
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ================= 主循环 ================= */
let last = performance.now();
function tick(now){
  const dt = Math.min((now - last)/1000, 0.05);
  last = now;

  if (playing){
    if (ref === 'ground'){
      carX += V * dt;
      if (carX > LOOP_X) carX = -LOOP_X;
      carGroup.position.x = carX;
    } else {
      for (const m of movers){
        m.position.x -= V * dt;
        if (m.position.x < -WRAP - 5) m.position.x += 2 * WRAP + 10;
      }
    }
  }
  carSpot.position.set(carGroup.position.x + 4, 9, 6);

  if (ref === 'ground') refChip.position.set(0, 1.4, 9.4);
  else refChip.position.set(carGroup.position.x, 3.5, 0);

  updateCamera();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
