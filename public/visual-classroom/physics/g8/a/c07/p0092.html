<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>运动与速度 · 物理可视化</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:100%;height:100%;overflow:hidden;background:#061226;}
  body{
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  #app{position:fixed;inset:0;}
  canvas{display:block;width:100%;height:100%;}

  .tabs{
    position:absolute;
    top:clamp(18px,3.4vh,40px);
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:6px;
    padding:6px;
    border-radius:999px;
    background:rgba(10,30,58,.72);
    box-shadow:0 8px 30px rgba(0,0,0,.35),inset 0 0 0 1px rgba(90,180,255,.22);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    z-index:5;
  }
  .tabs button{
    appearance:none;border:0;cursor:pointer;
    font-family:inherit;
    font-size:clamp(13px,1.05vw,17px);
    font-weight:600;
    letter-spacing:.5px;
    color:#7fa6cc;
    padding:clamp(8px,1.1vh,13px) clamp(18px,2vw,30px);
    border-radius:999px;
    background:transparent;
    transition:color .25s ease,background .25s ease,box-shadow .25s ease;
    white-space:nowrap;
  }
  .tabs button:hover{color:#bfe2ff;}
  .tabs button.active{
    color:#eaf6ff;
    background:linear-gradient(180deg,#2a80d8,#1b62ad);
    box-shadow:0 4px 16px rgba(40,140,235,.45),inset 0 0 0 1px rgba(150,215,255,.35);
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="scene"></canvas>
  <div class="tabs" role="tablist" aria-label="演示模块">
    <button id="tabUniform" class="active" role="tab" aria-selected="true">匀速直线运动</button>
    <button id="tabCompare" role="tab" aria-selected="false">速度对比</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d', {alpha:false});

  // ---------- 设计空间（16:9）----------
  const DW = 1600, DH = 900;
  let dpr = 1, viewScale = 1, offX = 0, offY = 0, cssW = 0, cssH = 0;

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    cssW = window.innerWidth; cssH = window.innerHeight;
    canvas.width  = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    canvas.style.width  = cssW + 'px';
    canvas.style.height = cssH + 'px';
    viewScale = Math.min(cssW / DW, cssH / DH);
    offX = (cssW - DW * viewScale) / 2;
    offY = (cssH - DH * viewScale) / 2;
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- 物理参数 ----------
  const X0 = 250, X1 = 1350;
  const METERS = 10;
  const PPM = (X1 - X0) / METERS;

  const TRACK = {
    left:150, right:1450,
    faceTop:398, faceBottom:560,
    frontBottom:592,
    rulerY:636
  };

  const MODES = {
    uniform: {
      distance: METERS,
      v: 1.5,
      pause: 0.9,
      carBase: 548
    },
    compare: {
      distance: METERS,
      vFast: 2.0,
      vSlow: 1.0,
      pause: 1.4,
      fastBase: 486,
      slowBase: 552,
      targetM: 5
    }
  };

  // 发光色（RGB）
  const GLOW = {
    blue:  [86, 196, 255],
    amber: [255, 186, 84]
  };
  function rgba(c,a){ return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }

  // ---------- 运行状态 ----------
  let mode = 'uniform';
  let elapsed = 0;
  let paused = false;
  let lastTs = 0;

  function cycleTime(){
    const m = MODES[mode];
    if(mode==='uniform') return m.distance / m.v + m.pause;
    return m.distance / m.vFast + m.pause;
  }
  function moveTime(){
    const m = MODES[mode];
    return mode==='uniform' ? m.distance / m.v : m.distance / m.vFast;
  }
  function reset(){ elapsed = 0; }

  // ---------- 工具 ----------
  function rr(x,y,w,h,r){
    r = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  // ---------- 背景：深蓝科技风 ----------
  function drawBackground(){
    // 深色底渐变
    const g = ctx.createLinearGradient(0,0,DW*.3,DH);
    g.addColorStop(0,'#081734');
    g.addColorStop(.45,'#0b2246');
    g.addColorStop(1,'#061226');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,DW,DH);

    // 柔和青蓝光晕（不遮挡主体）
    const rg = ctx.createRadialGradient(DW*.62, DH*.30, 40, DW*.62, DH*.30, DW*.62);
    rg.addColorStop(0,'rgba(38,120,205,.20)');
    rg.addColorStop(.5,'rgba(24,86,160,.10)');
    rg.addColorStop(1,'rgba(10,30,60,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(0,0,DW,DH);

    const rg2 = ctx.createRadialGradient(DW*.12, DH*.10, 20, DW*.12, DH*.10, DW*.5);
    rg2.addColorStop(0,'rgba(60,150,220,.12)');
    rg2.addColorStop(1,'rgba(10,30,60,0)');
    ctx.fillStyle = rg2;
    ctx.fillRect(0,0,DW,DH);

    // 顶部氛围光带
    const tg = ctx.createLinearGradient(0,0,0,120);
    tg.addColorStop(0,'rgba(90,180,255,.10)');
    tg.addColorStop(1,'rgba(90,180,255,0)');
    ctx.fillStyle = tg;
    ctx.fillRect(0,0,DW,120);

    // 地面透视网格（极淡）
    ctx.save();
    ctx.strokeStyle='rgba(92,168,236,.07)';
    ctx.lineWidth=1;
    for(let y=DH*.64; y<DH; y+=44){
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(DW,y); ctx.stroke();
    }
    for(let x=0; x<=DW; x+=88){
      ctx.beginPath(); ctx.moveTo(x,DH*.64); ctx.lineTo(x,DH); ctx.stroke();
    }
    ctx.restore();

    // 稀疏科技感光点
    ctx.save();
    for(let i=0;i<26;i++){
      const px = ((i*173+90)%DW);
      const py = 110 + ((i*97)%520);
      const a = 0.05 + ((i*13)%9)/160;
      ctx.fillStyle='rgba(150,210,255,'+a+')';
      ctx.beginPath(); ctx.arc(px,py,1.3,0,7); ctx.fill();
    }
    ctx.restore();
  }

  // ---------- 轨道：深色玻璃科技平台 ----------
  function drawTrack(faceTop, faceBottom){
    const L=TRACK.left, R=TRACK.right;

    // 落影
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,.42)'; ctx.filter='blur(20px)';
    rr(L-6, faceBottom+8, R-L+12, 40, 20); ctx.fill();
    ctx.restore();

    // 前立面
    const front = ctx.createLinearGradient(0,faceBottom,0,TRACK.frontBottom);
    front.addColorStop(0,'#103257');
    front.addColorStop(1,'#081d38');
    ctx.fillStyle=front;
    rr(L, faceBottom-2, R-L, TRACK.frontBottom-faceBottom+2, 12); ctx.fill();

    // 顶面（深蓝玻璃，透光感）
    const top = ctx.createLinearGradient(0,faceTop,0,faceBottom);
    top.addColorStop(0,'#17395f');
    top.addColorStop(.5,'#122f52');
    top.addColorStop(1,'#0c2442');
    ctx.fillStyle=top;
    rr(L, faceTop, R-L, faceBottom-faceTop, 14); ctx.fill();

    // 顶面顶部高光带
    const hl = ctx.createLinearGradient(0,faceTop,0,faceTop+30);
    hl.addColorStop(0,'rgba(140,210,255,.16)');
    hl.addColorStop(1,'rgba(140,210,255,0)');
    ctx.fillStyle=hl;
    rr(L+2, faceTop+1, R-L-4, 30, 12); ctx.fill();

    // 发光描边（把轨道从深背景中托出）
    ctx.save();
    ctx.shadowColor='rgba(80,180,255,.55)'; ctx.shadowBlur=16;
    ctx.strokeStyle='rgba(110,200,255,.62)'; ctx.lineWidth=1.8;
    rr(L, faceTop, R-L, faceBottom-faceTop, 14); ctx.stroke();
    ctx.restore();

    // 车行中线（淡青虚线）
    ctx.save();
    ctx.strokeStyle='rgba(120,200,255,.18)'; ctx.lineWidth=1.4;
    ctx.setLineDash([16,14]);
    ctx.beginPath(); ctx.moveTo(L+30, (faceTop+faceBottom)/2); ctx.lineTo(R-30, (faceTop+faceBottom)/2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();

    // 起止端竖线
    ctx.save();
    ctx.strokeStyle='rgba(110,200,255,.5)'; ctx.setLineDash([5,6]); ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(X0, faceTop+10); ctx.lineTo(X0, faceBottom-10); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(X1, faceTop+10); ctx.lineTo(X1, faceBottom-10); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='rgba(120,215,255,.85)';
    ctx.beginPath(); ctx.arc(X0, faceTop+14, 4, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(X1, faceTop+14, 4, 0, 7); ctx.fill();
    ctx.restore();
  }

  // ---------- 刻度尺 ----------
  function drawRuler(){
    const y = TRACK.rulerY;
    ctx.save();
    ctx.textAlign='center'; ctx.textBaseline='top';
    for(let m=0; m<=METERS; m++){
      const x = X0 + m*PPM;
      ctx.strokeStyle='rgba(120,205,255,.75)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y+18); ctx.stroke();
      ctx.fillStyle='#bfe4ff';
      ctx.font='600 19px "Segoe UI","PingFang SC",sans-serif';
      ctx.fillText(String(m), x, y+24);
      if(m<METERS){
        const hx = X0 + (m+0.5)*PPM;
        ctx.strokeStyle='rgba(110,180,235,.4)'; ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(hx,y); ctx.lineTo(hx,y+11); ctx.stroke();
      }
    }
    ctx.strokeStyle='rgba(100,180,240,.4)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(X0-14,y); ctx.lineTo(X1+14,y); ctx.stroke();
    ctx.fillStyle='#8fc6ee';
    ctx.font='500 17px "Segoe UI","PingFang SC",sans-serif';
    ctx.fillText('m', X1+34, y+2);
    ctx.restore();
  }

  // ---------- 轨迹光带 ----------
  function drawTrail(xFrom, xTo, yBase, color){
    if(xTo<=xFrom+1) return;
    const g = ctx.createLinearGradient(xFrom,0,xTo,0);
    g.addColorStop(0,'rgba(120,200,255,0)');
    g.addColorStop(1,color);
    ctx.save();
    ctx.shadowColor=color; ctx.shadowBlur=10;
    ctx.strokeStyle=g;
    ctx.lineWidth=5; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(xFrom,yBase); ctx.lineTo(xTo,yBase); ctx.stroke();
    ctx.restore();
  }

  // ---------- 每秒落点（可标注秒数，体现“相同时间”）----------
  function drawDots(maxSeconds, speed, yBase, secColor, labelUp){
    ctx.save();
    for(let n=1; n<=maxSeconds; n++){
      const x = X0 + speed*n*PPM;
      if(x>X1+1) break;
      const g = ctx.createRadialGradient(x,yBase,1,x,yBase,16);
      g.addColorStop(0,'rgba(255,255,255,.95)');
      g.addColorStop(.35,'rgba(120,205,255,.6)');
      g.addColorStop(1,'rgba(120,205,255,0)');
      ctx.fillStyle=g;
      ctx.beginPath(); ctx.arc(x,yBase,16,0,7); ctx.fill();
      ctx.fillStyle='#ffffff';
      ctx.beginPath(); ctx.arc(x,yBase,5.2,0,7); ctx.fill();
      ctx.strokeStyle= secColor ? rgba(secColor,.9) : 'rgba(140,220,255,.85)';
      ctx.lineWidth=1.3;
      ctx.beginPath(); ctx.arc(x,yBase,5.2,0,7); ctx.stroke();

      // 秒数标注（相同秒数 = 相同时间）
      if(secColor){
        const label = n + 's';
        ctx.font='600 14px "Segoe UI","PingFang SC",sans-serif';
        const tw = ctx.measureText(label).width;
        const ly = labelUp===false ? yBase+13 : yBase-31;
        ctx.fillStyle='rgba(6,22,44,.82)';
        ctx.strokeStyle=rgba(secColor,.55); ctx.lineWidth=1;
        rr(x-tw/2-6, ly, tw+12, 20, 10); ctx.fill(); ctx.stroke();
        ctx.fillStyle=rgba(secColor,1);
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(label, x, ly+10.5);
      }
    }
    ctx.restore();
  }

  // ---------- 概念跑车（侧视，车头朝右）----------
  function drawCar(cx, baseY, w, glow){
    const S = w/150;
    const P = (x,y)=>[cx+x*S, baseY+y*S];

    ctx.save();

    // 车底科技辉光
    const ug = ctx.createRadialGradient(cx, baseY+3, 4, cx, baseY+3, 92*S);
    ug.addColorStop(0, rgba(glow,.42));
    ug.addColorStop(.45, rgba(glow,.16));
    ug.addColorStop(1, rgba(glow,0));
    ctx.save();
    ctx.translate(cx, baseY+3); ctx.scale(1, .26); ctx.translate(-cx, -(baseY+3));
    ctx.fillStyle=ug;
    ctx.beginPath(); ctx.arc(cx, baseY+3, 92*S, 0, 7); ctx.fill();
    ctx.restore();

    // 地面接触阴影
    ctx.fillStyle='rgba(0,0,0,.45)'; ctx.filter='blur(8px)';
    ctx.beginPath(); ctx.ellipse(cx, baseY+2, 62*S, 8*S, 0,0,7); ctx.fill();
    ctx.filter='none';

    // ---- 车轮（先画，车身轮拱覆盖其上部）----
    const wheels = [-30, 30];
    wheels.forEach(wx=>{
      const [px,py]=P(wx,-16);
      const R=17*S;
      // 轮胎
      const tire=ctx.createRadialGradient(px,py,R*.3,px,py,R);
      tire.addColorStop(0,'#1b2532'); tire.addColorStop(1,'#070d16');
      ctx.fillStyle=tire;
      ctx.beginPath(); ctx.arc(px,py,R,0,7); ctx.fill();
      ctx.strokeStyle='rgba(150,180,210,.35)'; ctx.lineWidth=1.2*S;
      ctx.beginPath(); ctx.arc(px,py,R-1*S,0,7); ctx.stroke();
      // 轮辋
      const rim=ctx.createLinearGradient(px-R,py-R,px+R,py+R);
      rim.addColorStop(0,'#9fb3c8'); rim.addColorStop(.5,'#5d7086'); rim.addColorStop(1,'#2b3b4e');
      ctx.fillStyle=rim;
      ctx.beginPath(); ctx.arc(px,py,R*.74,0,7); ctx.fill();
      // 多辐条
      ctx.save(); ctx.translate(px,py);
      for(let i=0;i<9;i++){
        ctx.rotate(Math.PI*2/9);
        ctx.fillStyle='rgba(16,26,38,.85)';
        ctx.beginPath();
        ctx.moveTo(-1.6*S, -R*.20);
        ctx.lineTo(1.6*S, -R*.20);
        ctx.lineTo(2.6*S, -R*.70);
        ctx.lineTo(-2.6*S, -R*.70);
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();
      // 发光轮圈
      ctx.save();
      ctx.shadowColor=rgba(glow,.9); ctx.shadowBlur=12*S;
      ctx.strokeStyle=rgba(glow,.85); ctx.lineWidth=1.6*S;
      ctx.beginPath(); ctx.arc(px,py,R*.78,0,7); ctx.stroke();
      ctx.restore();
      // 轮心
      const hc=ctx.createRadialGradient(px,py,0,px,py,5*S);
      hc.addColorStop(0,'#ffffff'); hc.addColorStop(.4,rgba(glow,.95)); hc.addColorStop(1,rgba(glow,0));
      ctx.fillStyle=hc; ctx.beginPath(); ctx.arc(px,py,5*S,0,7); ctx.fill();
    });

    // ---- 车身主体（楔形，含轮拱）----
    ctx.beginPath();
    let p=P(-75,-16); ctx.moveTo(p[0],p[1]);
    p=P(-75,-34); ctx.lineTo(p[0],p[1]);
    let q=P(-72,-45), r=P(-50,-49); ctx.quadraticCurveTo(q[0],q[1],r[0],r[1]);
    p=P(-8,-51); ctx.lineTo(p[0],p[1]);
    q=P(15,-50); r=P(30,-40); ctx.quadraticCurveTo(q[0],q[1],r[0],r[1]);
    p=P(58,-33); ctx.lineTo(p[0],p[1]);
    q=P(75,-29); r=P(75,-21); ctx.quadraticCurveTo(q[0],q[1],r[0],r[1]);
    p=P(74,-15); ctx.lineTo(p[0],p[1]);
    // 底边：前轮拱
    p=P(48,-15); ctx.lineTo(p[0],p[1]);
    ctx.arc(...P(30,-15), 18*S, 0, Math.PI, true);
    p=P(12,-15); ctx.lineTo(p[0],p[1]);
    p=P(-12,-15); ctx.lineTo(p[0],p[1]);
    // 后轮拱
    ctx.arc(...P(-30,-15), 18*S, 0, Math.PI, true);
    p=P(-75,-15); ctx.lineTo(p[0],p[1]);
    ctx.closePath();

    const body=ctx.createLinearGradient(0,baseY-52*S,0,baseY-12*S);
    body.addColorStop(0,'#ffffff');
    body.addColorStop(.30,'#eef5fb');
    body.addColorStop(.62,'#c6d5e6');
    body.addColorStop(.85,'#8ea3ba');
    body.addColorStop(1,'#485e76');
    ctx.fillStyle=body;
    ctx.shadowColor='rgba(0,0,0,.35)'; ctx.shadowBlur=10*S; ctx.shadowOffsetY=3*S;
    ctx.fill();
    ctx.shadowColor='transparent'; ctx.shadowBlur=0; ctx.shadowOffsetY=0;
    ctx.strokeStyle='rgba(255,255,255,.6)'; ctx.lineWidth=1*S; ctx.stroke();

    // 车身上部高光反射
    ctx.save();
    p=P(-72,-44); q=P(28,-41); r=P(70,-27);
    const hg=ctx.createLinearGradient(p[0],p[1],r[0],r[1]);
    hg.addColorStop(0,'rgba(255,255,255,.55)');
    hg.addColorStop(.5,'rgba(255,255,255,.10)');
    hg.addColorStop(1,'rgba(255,255,255,.32)');
    ctx.strokeStyle=hg; ctx.lineWidth=2.2*S; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.quadraticCurveTo(q[0],q[1],r[0],r[1]); ctx.stroke();
    ctx.restore();

    // 侧腰线（明暗分割，结构清晰）
    p=P(-70,-27); q=P(0,-26); r=P(66,-24);
    ctx.strokeStyle='rgba(60,86,116,.55)'; ctx.lineWidth=1.4*S;
    ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.quadraticCurveTo(q[0],q[1],r[0],r[1]); ctx.stroke();
    p=P(-70,-25.4); q=P(0,-24.4); r=P(66,-22.4);
    ctx.strokeStyle='rgba(255,255,255,.45)'; ctx.lineWidth=1*S;
    ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.quadraticCurveTo(q[0],q[1],r[0],r[1]); ctx.stroke();

    // 车门分缝
    p=P(-6,-46); r=P(-8,-18);
    ctx.strokeStyle='rgba(70,96,124,.35)'; ctx.lineWidth=1*S;
    ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.lineTo(r[0],r[1]); ctx.stroke();

    // ---- 深色玻璃座舱 ----
    ctx.beginPath();
    p=P(-44,-46.5); ctx.moveTo(p[0],p[1]);
    p=P(-10,-48); ctx.lineTo(p[0],p[1]);
    q=P(12,-46); r=P(22,-38.5); ctx.quadraticCurveTo(q[0],q[1],r[0],r[1]);
    p=P(-40,-38.5); ctx.lineTo(p[0],p[1]);
    ctx.closePath();
    const glass=ctx.createLinearGradient(0,baseY-49*S,0,baseY-38*S);
    glass.addColorStop(0,'#0d1b2e');
    glass.addColorStop(.5,'#183350');
    glass.addColorStop(1,'#0b1a2c');
    ctx.fillStyle=glass; ctx.fill();
    ctx.save(); ctx.clip();
    // 玻璃斜向反光
    p=P(-40,-48); r=P(-16,-38);
    const gr=ctx.createLinearGradient(p[0],p[1],r[0],r[1]);
    gr.addColorStop(0,'rgba(255,255,255,0)');
    gr.addColorStop(.5,'rgba(200,230,255,.30)');
    gr.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=gr;
    ctx.beginPath();
    let a=P(-34,-48), b=P(-20,-48), c=P(-4,-38), d=P(-18,-38);
    ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.lineTo(c[0],c[1]); ctx.lineTo(d[0],d[1]);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.strokeStyle='rgba(170,210,245,.5)'; ctx.lineWidth=1*S; ctx.stroke();

    // ---- 前 LED 头灯（锐利灯带 + 光晕）----
    ctx.save();
    ctx.shadowColor=rgba(glow,1); ctx.shadowBlur=16*S;
    ctx.fillStyle='#ffffff';
    a=P(60,-28); b=P(74,-24.5); c=P(73,-21.8); d=P(60,-25);
    ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.lineTo(c[0],c[1]); ctx.lineTo(d[0],d[1]);
    ctx.closePath(); ctx.fill();
    // 头灯光束微芒
    const hglow=ctx.createRadialGradient(...P(74,-24),1,...P(74,-24),24*S);
    hglow.addColorStop(0,rgba(glow,.55)); hglow.addColorStop(1,rgba(glow,0));
    ctx.fillStyle=hglow; ctx.beginPath(); ctx.arc(...P(74,-24),24*S,0,7); ctx.fill();
    ctx.restore();

    // ---- 尾灯 ----
    ctx.save();
    ctx.shadowColor='rgba(255,90,105,.9)'; ctx.shadowBlur=9*S;
    ctx.fillStyle='#ff5a69';
    a=P(-74,-31); b=P(-70,-31.5); c=P(-70,-28.8); d=P(-74,-28.3);
    ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.lineTo(c[0],c[1]); ctx.lineTo(d[0],d[1]);
    ctx.closePath(); ctx.fill();
    ctx.restore();

    // ---- 侧裙底光条（分段，避开车轮）----
    ctx.save();
    ctx.shadowColor=rgba(glow,.9); ctx.shadowBlur=10*S;
    ctx.strokeStyle=rgba(glow,.85); ctx.lineWidth=2*S; ctx.lineCap='round';
    [[-72,-49],[-11,11],[49,72]].forEach(seg=>{
      const s0=P(seg[0],-14), s1=P(seg[1],-14);
      ctx.beginPath(); ctx.moveTo(s0[0],s0[1]); ctx.lineTo(s1[0],s1[1]); ctx.stroke();
    });
    ctx.restore();

    ctx.restore();
  }

  // ---------- 极简标签 ----------
  function tag(text, x, y, anchor){
    ctx.save();
    ctx.font='600 17px "Segoe UI","PingFang SC",sans-serif';
    const w = ctx.measureText(text).width + 22;
    const h = 30;
    let bx = x-w/2;
    if(anchor==='left') bx = x;
    if(anchor==='right') bx = x-w;
    ctx.fillStyle='rgba(8,26,50,.88)';
    ctx.strokeStyle='rgba(90,185,255,.45)'; ctx.lineWidth=1;
    rr(bx,y,w,h,15); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#c9e4fb';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(text, bx+w/2, y+h/2+.5);
    ctx.restore();
  }

  function leader(x1,y1,x2,y2){
    ctx.save();
    ctx.strokeStyle='rgba(110,190,250,.6)'; ctx.lineWidth=1.2;
    ctx.setLineDash([3,4]);
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='rgba(120,205,255,.9)';
    ctx.beginPath(); ctx.arc(x2,y2,3,0,7); ctx.fill();
    ctx.restore();
  }

  // ---------- 看点提示 ----------
  function drawHint(lead, text){
    ctx.save();
    ctx.font='600 20px "Segoe UI","PingFang SC",sans-serif';
    const lw = ctx.measureText(lead).width;
    ctx.font='500 19px "Segoe UI","PingFang SC",sans-serif';
    const tw = ctx.measureText(text).width;
    const padL=24, padR=26, barW=4, gapLead=14, gapText=12;
    const w = padL + barW + gapLead + lw + gapText + tw + padR;
    const h = 50;
    const x = 800 - w/2;
    const y = 104;

    ctx.save();
    ctx.fillStyle='rgba(50,150,240,.18)'; ctx.filter='blur(12px)';
    rr(x,y,w,h,25); ctx.fill();
    ctx.restore();

    ctx.fillStyle='rgba(9,28,54,.92)';
    ctx.strokeStyle='rgba(100,195,255,.5)'; ctx.lineWidth=1.5;
    rr(x,y,w,h,25); ctx.fill(); ctx.stroke();

    const barG = ctx.createLinearGradient(0,y+10,0,y+h-10);
    barG.addColorStop(0,'#7fd4ff'); barG.addColorStop(1,'#2f86e6');
    ctx.fillStyle=barG;
    rr(x+padL, y+12, barW, h-24, 2); ctx.fill();

    ctx.textBaseline='middle'; ctx.textAlign='left';
    ctx.font='600 20px "Segoe UI","PingFang SC",sans-serif';
    ctx.fillStyle='#7fd4ff';
    ctx.fillText(lead, x+padL+barW+gapLead, y+h/2+.5);
    ctx.font='500 19px "Segoe UI","PingFang SC",sans-serif';
    ctx.fillStyle='#cfe8ff';
    ctx.fillText(text, x+padL+barW+gapLead+lw+gapText, y+h/2+.5);
    ctx.restore();
  }

  // ---------- “同一时刻”读数牌（两车共用一个时间）----------
  function drawSameTime(t){
    const cx = 800, y = 176, h = 44;
    ctx.save();
    const head='同一时刻';
    const num='t = '+t.toFixed(1)+' s';
    ctx.font='600 17px "Segoe UI","PingFang SC",sans-serif';
    const headW=ctx.measureText(head).width;
    ctx.font='600 25px "Consolas","SF Mono",monospace';
    const numW=ctx.measureText(num).width;
    const gap=18, pad=22;
    const w=pad+headW+gap+numW+pad;
    const x=cx-w/2;

    ctx.save();
    ctx.fillStyle='rgba(50,150,240,.16)'; ctx.filter='blur(11px)';
    rr(x,y,w,h,22); ctx.fill();
    ctx.restore();

    ctx.fillStyle='rgba(10,32,62,.94)';
    ctx.strokeStyle='rgba(110,205,255,.55)'; ctx.lineWidth=1.5;
    rr(x,y,w,h,22); ctx.fill(); ctx.stroke();

    ctx.textBaseline='middle'; ctx.textAlign='left';
    ctx.font='600 17px "Segoe UI","PingFang SC",sans-serif';
    ctx.fillStyle='#8fd6ff';
    ctx.fillText(head, x+pad, y+h/2+.5);
    ctx.font='600 25px "Consolas","SF Mono",monospace';
    ctx.fillStyle='#eaf7ff';
    ctx.fillText(num, x+pad+headW+gap, y+h/2+.5);
    ctx.restore();
  }

  // ---------- 秒表 ----------
  function drawStopwatch(t){
    const cx=1408, cy=214, R=96;
    ctx.save();
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,.5)'; ctx.filter='blur(16px)';
    ctx.beginPath(); ctx.arc(cx,cy+6,R,0,7); ctx.fill();
    ctx.restore();

    // 表壳
    const shell=ctx.createLinearGradient(cx-R,cy-R,cx+R,cy+R);
    shell.addColorStop(0,'#1b3c64'); shell.addColorStop(1,'#0a1c38');
    ctx.fillStyle=shell;
    ctx.beginPath(); ctx.arc(cx,cy,R,0,7); ctx.fill();
    ctx.save();
    ctx.shadowColor='rgba(90,190,255,.5)'; ctx.shadowBlur=14;
    ctx.strokeStyle='rgba(110,200,255,.6)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(cx,cy,R,0,7); ctx.stroke();
    ctx.restore();

    // 表盘
    const face=ctx.createRadialGradient(cx-R*.3,cy-R*.35,10,cx,cy,R);
    face.addColorStop(0,'#122c4b'); face.addColorStop(1,'#07172e');
    ctx.fillStyle=face;
    ctx.beginPath(); ctx.arc(cx,cy,R-12,0,7); ctx.fill();

    // 刻度
    for(let i=0;i<60;i++){
      const a = i/60*Math.PI*2 - Math.PI/2;
      const major = i%5===0;
      const r1 = R-20, r2 = R-(major?34:28);
      ctx.strokeStyle = major?'rgba(120,210,255,.85)':'rgba(90,165,225,.45)';
      ctx.lineWidth = major?2.4:1.2;
      ctx.beginPath();
      ctx.moveTo(cx+Math.cos(a)*r1, cy+Math.sin(a)*r1);
      ctx.lineTo(cx+Math.cos(a)*r2, cy+Math.sin(a)*r2);
      ctx.stroke();
    }

    // 指针
    const ang = (t/10)*Math.PI*2 - Math.PI/2;
    ctx.save();
    ctx.shadowColor='rgba(110,210,255,.9)'; ctx.shadowBlur=10;
    ctx.strokeStyle='#7ad6ff'; ctx.lineWidth=3.4; ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(cx-Math.cos(ang)*12, cy-Math.sin(ang)*12);
    ctx.lineTo(cx+Math.cos(ang)*(R-40), cy+Math.sin(ang)*(R-40));
    ctx.stroke();
    ctx.restore();
    ctx.fillStyle='#7ad6ff'; ctx.beginPath(); ctx.arc(cx,cy,6,0,7); ctx.fill();
    ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.arc(cx,cy,2.4,0,7); ctx.fill();

    // 数字读数
    ctx.fillStyle='#e2f4ff';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font='600 26px "Consolas","SF Mono",monospace';
    ctx.fillText(t.toFixed(1), cx, cy+R*.55);
    ctx.font='600 14px "Segoe UI",sans-serif';
    ctx.fillStyle='#8fc4ea';
    ctx.fillText('s', cx+40, cy+R*.55+1);
    ctx.restore();

    tag('秒表', cx, cy+R+30);
  }

  // ---------- 主绘制 ----------
  function render(){
    ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle='#061226';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    const s = dpr*viewScale;
    ctx.setTransform(s,0,0,s, dpr*offX, dpr*offY);

    drawBackground();

    const m = MODES[mode];
    const mt = moveTime();
    const t = Math.min(elapsed, mt);

    if(mode==='uniform'){
      drawTrack(TRACK.faceTop, TRACK.faceBottom);
      drawRuler();

      const carX = X0 + m.v*t*PPM;
      const fullX = X0 + m.distance*PPM;

      drawTrail(X0, Math.min(carX,fullX), m.carBase+2, 'rgba(110,205,255,.5)');
      const secs = Math.floor(t + 1e-6);
      drawDots(secs, m.v, m.carBase+2, GLOW.blue, true);

      drawCar(carX, m.carBase, 150, GLOW.blue);
      drawSameTime(t);

      tag('轨道', 196, TRACK.faceBottom+6, 'left');
      leader(230, TRACK.faceBottom+16, 300, TRACK.faceBottom+26);
      tag('刻度', 196, TRACK.rulerY-4, 'left');
      // 运动轨迹标签固定在前立面区，避免与跟随小车的标签重叠
      tag('运动轨迹', 440, TRACK.faceBottom+4);
      leader(472, TRACK.faceBottom+8, X0+m.v*Math.min(secs,1)*PPM, m.carBase+2-8);
      tag('小车', carX, m.carBase-96);
      leader(carX, m.carBase-66, carX, m.carBase-54);

    } else {
      drawTrack(TRACK.faceTop-8, TRACK.faceBottom+2);
      ctx.save();
      ctx.strokeStyle='rgba(110,190,250,.35)'; ctx.lineWidth=1.6; ctx.setLineDash([12,10]);
      ctx.beginPath(); ctx.moveTo(TRACK.left+24,520); ctx.lineTo(TRACK.right-24,520); ctx.stroke();
      ctx.setLineDash([]); ctx.restore();
      drawRuler();

      const fastX = X0 + m.vFast*t*PPM;
      const slowX = X0 + m.vSlow*t*PPM;
      const fastFull = X0 + m.distance*PPM;

      const tx = X0 + m.targetM*PPM;
      ctx.save();
      ctx.strokeStyle='rgba(110,200,255,.5)'; ctx.lineWidth=1.6; ctx.setLineDash([6,6]);
      ctx.beginPath(); ctx.moveTo(tx,TRACK.faceTop-2); ctx.lineTo(tx,TRACK.rulerY-6); ctx.stroke();
      ctx.setLineDash([]); ctx.restore();

      drawTrail(X0, Math.min(fastX,fastFull), m.fastBase+2, 'rgba(90,190,255,.5)');
      drawTrail(X0, slowX, m.slowBase+2, 'rgba(255,186,84,.45)');

      const secsFast=Math.floor(t+1e-6);
      const secsSlow=Math.floor(t+1e-6);
      // 两车秒数都标在各自落点下方（车身在落点上方），避开车身遮挡；两排标签上下错开不重叠
      drawDots(secsFast, m.vFast, m.fastBase+2, GLOW.blue, false);
      drawDots(secsSlow, m.vSlow, m.slowBase+2, GLOW.amber, false);

      drawCar(fastX, m.fastBase, 138, GLOW.blue);
      drawCar(slowX, m.slowBase, 138, GLOW.amber);
      drawSameTime(t);

      tag('轨道', 196, TRACK.faceBottom+10, 'left');
      tag('刻度', 196, TRACK.rulerY-4, 'left');
      // 运动轨迹标签固定在前立面区，避免与跟随车辆的标签重叠
      tag('运动轨迹', 440, TRACK.faceBottom+8);
      leader(474, TRACK.faceBottom+4, X0+m.vFast*Math.min(secsFast,1)*PPM, m.fastBase+2-8);
      tag('相同路程', tx, TRACK.faceTop-40);
      leader(tx, TRACK.faceTop-10, tx, TRACK.faceTop+2);
      tag('快速车', fastX, m.fastBase-96);
      tag('慢速车', slowX, m.slowBase-96);
    }

    if(mode==='uniform'){
      drawHint('看什么：','速度始终不变  →  每秒走过的路程都相等');
    } else {
      drawHint('看什么：','同时出发  →  相同时间，快车走得更远');
    }

    drawStopwatch(t);
  }

  // ---------- 循环 ----------
  function frame(ts){
    if(!lastTs) lastTs = ts;
    let dt = (ts - lastTs)/1000;
    lastTs = ts;
    if(dt>0.05) dt = 0.05;
    if(!paused){
      elapsed += dt;
      const ct = cycleTime();
      if(elapsed >= ct) elapsed = elapsed % ct;
    }
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- 交互 ----------
  const tabU=document.getElementById('tabUniform');
  const tabC=document.getElementById('tabCompare');
  function setMode(next){
    if(mode===next) return;
    mode=next; reset();
    const u = mode==='uniform';
    tabU.classList.toggle('active',u); tabC.classList.toggle('active',!u);
    tabU.setAttribute('aria-selected',u?'true':'false');
    tabC.setAttribute('aria-selected',u?'false':'true');
  }
  tabU.addEventListener('click',()=>setMode('uniform'));
  tabC.addEventListener('click',()=>setMode('compare'));

  canvas.addEventListener('pointerdown',()=>{ paused=!paused; });
  window.addEventListener('keydown',e=>{
    if(e.code==='Space'){ e.preventDefault(); paused=!paused; }
    if(e.key==='1') setMode('uniform');
    if(e.key==='2') setMode('compare');
  });
  document.addEventListener('visibilitychange',()=>{ lastTs=0; });
})();
</script>
</body>
</html>
