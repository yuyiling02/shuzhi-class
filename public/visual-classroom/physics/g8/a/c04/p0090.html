<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>眼睛成像与视力矫正模拟器 · 初二物理虚拟实验</title>
<style>
  :root{
    --bg:#0b1524; --panel:rgba(18,32,50,.72); --line:rgba(110,170,225,.22);
    --ink:#dce9f7; --sub:#8aa4c0; --accent:#5fb6f5; --accent2:#ffc25c;
    --shadow:0 10px 34px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden}
  body{font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
       background:radial-gradient(120% 90% at 50% 0%,#15243a 0%,#0c1728 55%,#070e1a 100%);
       color:var(--ink);-webkit-font-smoothing:antialiased}
  #app{position:relative;width:100vw;height:100vh}
  canvas{display:block;width:100%;height:100%;touch-action:none}

  /* 顶部标题 */
  #header{position:absolute;top:22px;left:0;right:0;text-align:center;pointer-events:none;z-index:5}
  #header h1{font-size:20px;font-weight:650;letter-spacing:1px;color:#eef6ff;
             text-shadow:0 2px 14px rgba(95,182,245,.45)}
  #header p{font-size:12px;color:var(--sub);margin-top:5px;letter-spacing:.5px}

  /* 模式切换标签 */
  #modes{position:absolute;top:78px;left:50%;transform:translateX(-50%);
         display:flex;gap:6px;padding:5px;background:var(--panel);
         border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
         backdrop-filter:blur(12px);z-index:6}
  .mode{pointer-events:auto;cursor:pointer;border:0;background:transparent;color:var(--sub);
        font-size:13px;font-weight:600;padding:9px 20px;border-radius:10px;transition:.22s;
        white-space:nowrap;font-family:inherit}
  .mode:hover{color:var(--accent);background:rgba(63,142,208,.08)}
  .mode.active{color:#fff;background:linear-gradient(135deg,#3d8fd0,#2b6fa8);
               box-shadow:0 5px 16px rgba(95,182,245,.4)}

  /* 镜片托盘 */
  #tray{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);
        display:flex;gap:14px;align-items:center;z-index:6}
  .chip{pointer-events:auto;cursor:grab;user-select:none;display:flex;align-items:center;gap:10px;
        padding:9px 16px 9px 10px;background:var(--panel);border:1px solid var(--line);
        border-radius:13px;box-shadow:var(--shadow);backdrop-filter:blur(12px);transition:.2s}
  .chip:hover{transform:translateY(-2px);border-color:rgba(63,142,208,.5)}
  .chip:active{cursor:grabbing}
  .chip.used{opacity:.4;pointer-events:none;filter:grayscale(.4)}
  .chip .lensIcon{width:30px;height:30px;flex:0 0 30px}
  .chip .txt b{display:block;font-size:12.5px;color:var(--ink)}
  .chip .txt span{display:block;font-size:10.5px;color:var(--sub);margin-top:1px}

  /* 右侧控制 */
  #side{position:absolute;right:24px;top:50%;transform:translateY(-50%);
        display:flex;flex-direction:column;gap:10px;z-index:6}
  .btn{pointer-events:auto;cursor:pointer;width:104px;padding:11px 8px;text-align:center;
       background:var(--panel);border:1px solid var(--line);border-radius:11px;
       box-shadow:var(--shadow);backdrop-filter:blur(12px);font-size:12.5px;font-weight:600;
       color:var(--ink);transition:.2s;font-family:inherit}
  .btn:hover{border-color:rgba(63,142,208,.5);color:var(--accent);transform:translateX(-2px)}
  .btn.remove.off{opacity:.4;pointer-events:none}

  /* 底部状态说明 */
  #status{position:absolute;bottom:104px;left:50%;transform:translateX(-50%);
          max-width:min(92vw,720px);text-align:center;z-index:5;pointer-events:none}
  #status .line1{display:inline-block;font-size:13px;font-weight:600;color:#dce9f7;
                 padding:7px 18px;background:rgba(18,32,50,.7);border:1px solid var(--line);
                 border-radius:20px;backdrop-filter:blur(8px)}
  #status .line2{font-size:11.5px;color:var(--sub);margin-top:7px;line-height:1.5}

  /* 3D 部位标注 */
  .label{position:absolute;z-index:4;pointer-events:none;transform:translate(-50%,-50%);
         font-size:11.5px;font-weight:600;color:#dce9f7;white-space:nowrap;
         padding:3px 9px;border-radius:9px;background:rgba(18,32,50,.82);
         border:1px solid rgba(110,170,225,.32);box-shadow:0 3px 12px rgba(0,0,0,.4);
         transition:opacity .25s;backdrop-filter:blur(4px)}
  .label.ray{color:#ffc25c;border-color:rgba(255,194,92,.5)}
  .label.lens{color:#7fc6ef;border-color:rgba(95,182,245,.5)}
  .label.anat{font-size:10.5px;font-weight:500;color:#aac2da;padding:2px 7px;
              background:rgba(18,32,50,.7);border-color:rgba(110,170,225,.25)}

  /* 引线标注层：标签排在画面外围，引线连回 3D 结构锚点 */
  #leaders{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none;overflow:visible}
  #leaders line{stroke:rgba(127,198,239,.6);stroke-width:1.3}
  #leaders circle{fill:#7fc6ef;stroke:#0b1524;stroke-width:1.6}
  .label.callout{font-size:11px;font-weight:600;color:#dceaf8;padding:3px 9px;
                 background:rgba(16,29,47,.9);border:1px solid rgba(127,198,239,.45);
                 box-shadow:0 4px 14px rgba(0,0,0,.45);border-radius:7px}
  .label.callout.light{color:#ffd98a;border-color:rgba(255,194,92,.6);
                       background:rgba(46,36,20,.95)}
  .label.callout.wall{color:#ffb98a;border-color:rgba(224,116,56,.55);
                      background:rgba(58,30,18,.9)}

  .label.focus{font-weight:700;padding:4px 10px;color:#ffc25c;
               border-color:rgba(255,194,92,.6)}
  .label.focus.ok{color:#67e6a8;border-color:rgba(80,220,150,.65);
                  background:rgba(18,54,40,.94);box-shadow:0 3px 14px rgba(60,200,130,.28)}
  .label.focus.bad{color:#ff9d74;border-color:rgba(255,140,90,.65);
                   background:rgba(58,32,22,.94);box-shadow:0 3px 14px rgba(230,120,70,.28)}

  /* 提示 */
  #tip{position:absolute;left:22px;bottom:24px;z-index:5;max-width:210px;font-size:11px;
       color:var(--sub);line-height:1.6;pointer-events:none}
  #tip b{color:var(--accent);font-weight:600}

  /* 加载遮罩 */
  #loading{position:absolute;inset:0;background:#0b1524;display:flex;align-items:center;
           justify-content:center;flex-direction:column;gap:14px;z-index:20;transition:opacity .5s}
  #loading .spin{width:34px;height:34px;border:3px solid #22344c;border-top-color:var(--accent);
                 border-radius:50%;animation:sp .8s linear infinite}
  #loading p{font-size:13px;color:var(--sub)}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <h1>眼睛成像与视力矫正模拟器</h1>
    <p>光的折射 · 近视与远视的成因及矫正 —— 初二物理虚拟实验</p>
  </div>

  <div id="modes">
    <button class="mode active" data-mode="normal">正常眼睛</button>
    <button class="mode" data-mode="myopia">近视眼</button>
    <button class="mode" data-mode="hyperopia">远视眼</button>
  </div>

  <div id="status">
    <div class="line1" id="statusTitle">正常眼 · 光线恰好会聚在视网膜上，成像清晰</div>
    <div class="line2" id="statusDesc">平行光经晶状体折射后，会聚点落在视网膜 —— 这就是清晰视觉的原理。</div>
  </div>

  <div id="side">
    <button class="btn" id="resetBtn">↺ 重置光路</button>
    <button class="btn remove off" id="removeBtn">✕ 拿下镜片</button>
    <button class="btn" id="viewBtn">◐ 切换视角</button>
  </div>

  <div id="tray">
    <div class="chip" data-lens="concave" draggable="false">
      <svg class="lensIcon" viewBox="0 0 32 32">
        <path d="M11 4 Q17 16 11 28 Q21 16 21 4 Z" fill="rgba(120,190,225,.35)" stroke="#4b93c4" stroke-width="1.4"/>
      </svg>
      <div class="txt"><b>凹透镜</b><span>近视镜 · 拖到光路上</span></div>
    </div>
    <div class="chip" data-lens="convex" draggable="false">
      <svg class="lensIcon" viewBox="0 0 32 32">
        <path d="M16 4 Q23 16 16 28 Q9 16 16 4 Z" fill="rgba(120,190,225,.35)" stroke="#4b93c4" stroke-width="1.4"/>
      </svg>
      <div class="txt"><b>凸透镜</b><span>远视镜 · 拖到光路上</span></div>
    </div>
  </div>

  <div id="tip"><b>操作提示</b><br>拖动底部镜片到光学轨道上即可戴上；点击轨道上的镜片可拿下。拖动空白处可旋转视角。</div>

  <svg id="leaders"></svg>

  <div id="loading"><div class="spin"></div><p>正在搭建虚拟光学实验室…</p></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "../../../../vendor/three/0.161.0/build/three.module.js",
    "three/addons/": "../../../../vendor/three/0.161.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   1. 光学系统参数（近轴光线追迹）
   光轴沿 X 轴，Y 为竖直方向。单位：任意(场景单位)
   ============================================================ */
const OPT = {
  xObj:   -9.0,   // 发光物体位置
  xCorr:  -2.5,   // 矫正镜片在轨道上的安装位（贴近眼前，保证光线经镜片后仍从瞳孔通过）
  xLens:   0.6,   // 眼球晶状体位置（等效折射面，初二教学把角膜+晶状体合并为一处）
  xPupil: -0.35,  // 瞳孔（虹膜中央光阑）位置，在晶状体前方稍远处——拉开与晶状体的距离便于看清
  pupilR:  0.78,  // 瞳孔半径，保证各状态（含矫正发散）下光束都能通过
  xRetina: 5.7,   // 视网膜位置
  fNormal: 5.1,   // 正常眼等效焦距 = xRetina - xLens
  // 光束初始高度（平行光）——落在瞳孔 aperture 内，光线才真正从瞳孔进入眼睛
  ys: [-0.34,-0.22,-0.11,0.11,0.22,0.34],
  // 光线在视网膜之后继续延伸的长度（用于展示会聚/发散）
  tail: 1.7
};
// 眼睛自身等效焦距：近视更短(折光强)，远视更长(折光弱)
function eyeFocal(mode){
  if(mode==='normal') return OPT.fNormal;
  if(mode==='myopia') return OPT.fNormal - 2.0;   // 焦点前移
  return OPT.fNormal + 3.0;                        // 焦点后移
}
// 匹配模式时，反推能把焦点精确移回视网膜的镜片焦距
function matchedCorrFocal(mode){
  const d1 = OPT.xLens - OPT.xCorr;
  const K  = 1/eyeFocal(mode) - 1/OPT.fNormal;
  return d1 - 1/K;
}
// 镜片焦距（物理值）；非匹配情形用固定值，故意让成像变差
function corrFocal(mode, type){
  if(type==='concave' && mode==='myopia')    return matchedCorrFocal('myopia');
  if(type==='convex'  && mode==='hyperopia') return matchedCorrFocal('hyperopia');
  return type==='concave' ? -3.4 : 7.0;
}

let state = { mode:'normal', lens:null }; // lens: null | 'concave' | 'convex'

/* 追迹一条初始高度为 y0 的平行光线，返回折线关键点与焦点、视网膜处偏移 */
function traceRay(y0, mode, lensType){
  let x = OPT.xObj, y = y0, u = 0;               // u = 斜率 dy/dx
  const pts = [new THREE.Vector3(x,y,0)];
  const hasCorr = !!lensType;

  if(hasCorr){
    y += u*(OPT.xCorr - x); x = OPT.xCorr;
    pts.push(new THREE.Vector3(x,y,0));
    u -= y / corrFocal(mode, lensType);          // 薄透镜折射
  }else{
    // 无镜片时也放置一个线性中间点，便于加/减镜片时点数一致
    y += u*(OPT.xCorr - x); x = OPT.xCorr;
    pts.push(new THREE.Vector3(x,y,0));
  }

  // 光线先穿过瞳孔（虹膜中央孔），再到达晶状体 —— 明确"光从瞳孔进入眼睛"
  y += u*(OPT.xPupil - x); x = OPT.xPupil;
  pts.push(new THREE.Vector3(x,y,0));

  y += u*(OPT.xLens - x); x = OPT.xLens;
  pts.push(new THREE.Vector3(x,y,0));
  u -= y / eyeFocal(mode);                        // 眼球晶状体折射

  const xFocus = x - y/u;                         // 与光轴交点
  const yRetina = y + u*(OPT.xRetina - x);        // 视网膜处高度(弥散圆半径)
  // 光束末端动态延伸：焦点在视网膜后时，让光束继续画到焦点之后，便于看到"会聚太晚"
  const xEnd = Math.max(OPT.xRetina + 0.5, xFocus + 0.7);
  const yEnd = y + u*(xEnd - x);
  pts.push(new THREE.Vector3(xEnd,yEnd,0));
  return { pts, xFocus, yRetina };
}

/* ============================================================
   2. 场景 / 渲染器 / 光照  (PBR + 柔和全局光 + 软阴影)
   ============================================================ */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.insertBefore(renderer.domElement, app.firstChild);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1524);
scene.fog = new THREE.Fog(0x0b1524, 30, 56);

// 透视相机：真实近大远小，眼球呈现立体球形纵深
const FOV = 42;
let camera = new THREE.PerspectiveCamera(FOV, innerWidth/innerHeight, 0.1, 220);
const CONST = { cx:-1.0, cy:0.3, contentW:23.5, contentH:11.5 };
let viewSide = 0; // 0:主视角  1:侧上方
function placeCamera(){
  const aspect = innerWidth/innerHeight;
  camera.aspect = aspect;
  const halfFov = THREE.MathUtils.degToRad(FOV)/2;
  // 距离自适应：保证装置宽度/高度都在视野内
  let dist = (CONST.contentW/2)/(Math.tan(halfFov)*aspect);
  dist = Math.max(dist, (CONST.contentH/2)/Math.tan(halfFov));
  if(viewSide===0) camera.position.set(CONST.cx, CONST.cy+4.8, dist);
  else camera.position.set(CONST.cx-8.5, CONST.cy+9, dist-3.5);
  camera.lookAt(CONST.cx, CONST.cy, 0);
  camera.near=0.1; camera.far=220;
  camera.updateProjectionMatrix();
}
placeCamera();

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.minDistance = 12; controls.maxDistance = 65;
controls.target.set(CONST.cx, CONST.cy, 0);
controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };

// 柔和光照（深色科技风：冷色环境 + 主光 + 青蓝补光）
scene.add(new THREE.HemisphereLight(0xcfe4ff, 0x1b2c42, 1.15));
const key = new THREE.DirectionalLight(0xf2f7ff, 2.2);
key.position.set(-8, 14, 12);
key.castShadow = true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left=-16; key.shadow.camera.right=16;
key.shadow.camera.top=12; key.shadow.camera.bottom=-12;
key.shadow.camera.near=1; key.shadow.camera.far=60;
key.shadow.radius = 6; key.shadow.bias = -0.0006;
scene.add(key);
const fill = new THREE.DirectionalLight(0x6fb4f0, 0.95);
fill.position.set(10, 5, -8);
scene.add(fill);
const rimLight = new THREE.DirectionalLight(0x4fd6e0, 0.5);
rimLight.position.set(4, -4, -10);
scene.add(rimLight);

/* ============================================================
   3. 实验台 / 光学轨道 / 发光物体
   ============================================================ */
const MAT = {
  table:  new THREE.MeshStandardMaterial({color:0x142338, roughness:.82, metalness:.12}),
  rail:   new THREE.MeshStandardMaterial({color:0x35506e, roughness:.3, metalness:.78}),
  railHi: new THREE.MeshStandardMaterial({color:0x7fb8e0, roughness:.25, metalness:.6,
            emissive:0x2b6a9a, emissiveIntensity:.35}),
  stand:  new THREE.MeshStandardMaterial({color:0x4a6a88, roughness:.35, metalness:.62}),
  glass:  new THREE.MeshPhysicalMaterial({color:0xa9dcf5, transparent:true, opacity:.36,
            roughness:.08, metalness:0, clearcoat:1, clearcoatRoughness:.1,
            side:THREE.DoubleSide, depthWrite:false}),
  lens:   new THREE.MeshPhysicalMaterial({color:0x9fd6f5, transparent:true, opacity:.5,
            roughness:.06, metalness:0, clearcoat:1, side:THREE.DoubleSide, depthWrite:false}),
  retina: new THREE.MeshStandardMaterial({color:0xf07f66, emissive:0x9a3220, emissiveIntensity:.5,
            roughness:.55, transparent:true, opacity:.72, side:THREE.DoubleSide, depthWrite:false}),
  nerve:  new THREE.MeshStandardMaterial({color:0xe8bf84, roughness:.6, metalness:.05})
};

// 台面
const table = new THREE.Mesh(new THREE.BoxGeometry(26,0.5,11), MAT.table);
table.position.set(-1,-3.85,0); table.receiveShadow=true;
scene.add(table);
// 台面前沿装饰线
const edge = new THREE.Mesh(new THREE.BoxGeometry(26,0.08,0.12),
  new THREE.MeshStandardMaterial({color:0x3d6d96, roughness:.4, metalness:.5,
    emissive:0x1d5a86, emissiveIntensity:.5}));
edge.position.set(-1,-3.58,5.5); scene.add(edge);

// 光学轨道（金属导轨 + 亮条）
const rail = new THREE.Mesh(new THREE.BoxGeometry(18,0.28,0.62), MAT.rail);
rail.position.set(-1.6,-3.35,0); rail.castShadow=true; rail.receiveShadow=true;
scene.add(rail);
const railTop = new THREE.Mesh(new THREE.BoxGeometry(18,0.04,0.2), MAT.railHi);
railTop.position.set(-1.6,-3.19,0); scene.add(railTop);
// 轨道刻度
for(let i=-9;i<=7;i+=1){
  const tick = new THREE.Mesh(new THREE.BoxGeometry(0.02,0.05, i%2===0?0.5:0.34),
    new THREE.MeshStandardMaterial({color:0x6d98b8, roughness:.5, metalness:.4}));
  tick.position.set(i,-3.16,0); scene.add(tick);
}

// 支架工厂：从轨道连到元件中心
function makeStand(x, topY){
  const g=new THREE.Group();
  const pole=new THREE.Mesh(new THREE.CylinderGeometry(.09,.11,(topY+2.9),16),MAT.stand);
  pole.position.set(x, (-2.9+topY)/2, 0); pole.castShadow=true;
  const base=new THREE.Mesh(new THREE.CylinderGeometry(.42,.5,.16,24),MAT.stand);
  base.position.set(x,-3.12,0); base.castShadow=true;
  g.add(pole,base); return g;
}

// 发光物体（蜡烛状箭头光源），位于光轴上方
const objGroup=new THREE.Group();
const objCore=new THREE.Mesh(new THREE.SphereGeometry(.34,32,24),
  new THREE.MeshStandardMaterial({color:0xfff0b8, emissive:0xffc23c, emissiveIntensity:2.6, roughness:.4}));
objCore.position.set(OPT.xObj,0,0); // 发光点在光轴上，与平行光束中心一致
const objHalo=new THREE.Mesh(new THREE.SphereGeometry(.62,24,18),
  new THREE.MeshBasicMaterial({color:0xffd976, transparent:true, opacity:.22,
    blending:THREE.AdditiveBlending, depthWrite:false}));
objHalo.position.copy(objCore.position);
const objBody=new THREE.Mesh(new THREE.SphereGeometry(.13,12,10),
  new THREE.MeshStandardMaterial({color:0xf2f5f8, roughness:.5}));
objBody.position.set(OPT.xObj,-0.72,0);
objGroup.add(objCore,objHalo,objBody,makeStand(OPT.xObj,-0.3));
scene.add(objGroup);
const objLight=new THREE.PointLight(0xffd27a, 1.6, 8, 2);
objLight.position.set(OPT.xObj,0,0); scene.add(objLight);

/* ============================================================
   4. 眼球结构仿真图
   剖面朝向观察者：保留 z<0 的一半壳体，内部层次一览无余
   结构：巩膜 → 脉络膜 → 视网膜(含黄斑) → 玻璃体 → 角膜 →
         虹膜(含瞳孔) → 睫状体 → 悬韧带 → 晶状体 → 视神经
   ============================================================ */
const EYE = { cx:2.5, R:3.2 }; // 球心与半径；视网膜后极 = cx+R ≈ 5.7
const eyeGroup = new THREE.Group();
scene.add(eyeGroup);

// 程序化血管纹理：橙红底 + 树枝状视网膜血管（贴在脉络膜/玻璃体后壁，写实感关键）
function makeVesselTexture(size=1024){
  const cv=document.createElement('canvas'); cv.width=cv.height=size;
  const c=cv.getContext('2d'), cx=size*0.78, cy=size/2; // 血管从视盘(后极)向外放射
  // 暖橙红径向渐变底
  const g=c.createRadialGradient(cx,cy,size*0.05,cx,cy,size*0.95);
  g.addColorStop(0,'#e8793c'); g.addColorStop(.45,'#cf5428');
  g.addColorStop(.8,'#a83a1f'); g.addColorStop(1,'#7d2a17');
  c.fillStyle=g; c.fillRect(0,0,size,size);
  // 从视盘放射的树枝状血管
  c.lineCap='round';
  function branch(x,y,ang,len,w,depth){
    if(depth<=0||len<3) return;
    const x2=x+Math.cos(ang)*len, y2=y+Math.sin(ang)*len;
    c.strokeStyle=`rgba(${90+depth*8},${22+depth*4},12,${.28+depth*.09})`;
    c.lineWidth=w; c.beginPath(); c.moveTo(x,y);
    c.quadraticCurveTo((x+x2)/2+(Math.random()-.5)*8,(y+y2)/2+(Math.random()-.5)*8,x2,y2);
    c.stroke();
    branch(x2,y2,ang+(Math.random()-.5)*.5,len*.74,w*.72,depth-1);
    if(Math.random()>.28) branch(x2,y2,ang+(Math.random()-.5)*1.0,len*.6,w*.6,depth-1);
  }
  for(let i=0;i<16;i++){
    const a=Math.PI*2*i/16+(Math.random()-.5)*.3;
    branch(cx,cy,a,size*(0.10+Math.random()*.05),5.5,5);
  }
  const t=new THREE.CanvasTexture(cv); t.colorSpace=THREE.SRGBColorSpace; return t;
}

// 圆盘虹膜纹理（正面沿光轴看时：中央瞳孔 + 放射状纤维）
function makeIrisDiscTexture(size=512){
  const cv=document.createElement('canvas'); cv.width=cv.height=size;
  const c=cv.getContext('2d'), cx=size/2, cy=size/2, R=size/2;
  const g=c.createRadialGradient(cx,cy,R*.28,cx,cy,R);
  g.addColorStop(0,'#1d4a63'); g.addColorStop(.45,'#2e86a8');
  g.addColorStop(.75,'#1e5f7d'); g.addColorStop(1,'#0e2c3d');
  c.fillStyle=g; c.fillRect(0,0,size,size);
  for(let i=0;i<420;i++){                 // 放射纤维
    const a=Math.random()*Math.PI*2, r0=R*(.30+Math.random()*.05), r1=R*(.85+Math.random()*.13);
    c.strokeStyle=Math.random()>.5?`rgba(150,225,255,${.08+Math.random()*.18})`
                                  :`rgba(8,32,48,${.08+Math.random()*.2})`;
    c.lineWidth=.6+Math.random()*2.4; const bend=(Math.random()-.5)*.22;
    c.beginPath(); c.moveTo(cx+Math.cos(a)*r0,cy+Math.sin(a)*r0);
    c.quadraticCurveTo(cx+Math.cos(a+bend)*(r0+r1)/2,cy+Math.sin(a+bend)*(r0+r1)/2,
                       cx+Math.cos(a+bend*1.6)*r1,cy+Math.sin(a+bend*1.6)*r1); c.stroke();
  }
  for(let i=0;i<80;i++){                  // 隐窝
    const a=Math.random()*Math.PI*2, r=R*(.44+Math.random()*.42);
    c.fillStyle=`rgba(10,40,58,${.14+Math.random()*.22})`;
    c.beginPath(); c.ellipse(cx+Math.cos(a)*r,cy+Math.sin(a)*r,2+Math.random()*7,2+Math.random()*5,a,0,Math.PI*2); c.fill();
  }
  c.strokeStyle='rgba(8,26,38,.9)'; c.lineWidth=R*.07;   // 瞳孔括约肌
  c.beginPath(); c.arc(cx,cy,R*.31,0,Math.PI*2); c.stroke();
  c.strokeStyle='rgba(10,38,56,.6)'; c.lineWidth=R*.11;  // 睫状带
  c.beginPath(); c.arc(cx,cy,R*.96,0,Math.PI*2); c.stroke();
  const t=new THREE.CanvasTexture(cv); t.colorSpace=THREE.SRGBColorSpace; return t;
}
// 纤维条纹理（剖面两片虹膜瓣；u=瞳孔缘→外周）
function makeIrisFiberTexture(w=384,h=96){
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  const c=cv.getContext('2d');
  const g=c.createLinearGradient(0,0,w,0);
  g.addColorStop(0,'#15475f'); g.addColorStop(.42,'#2d87a9'); g.addColorStop(1,'#17405a');
  c.fillStyle=g; c.fillRect(0,0,w,h);
  for(let i=0;i<300;i++){                       // 放射纤维（更密、对比更强）
    const y=Math.random()*h;
    c.strokeStyle=Math.random()>.5?`rgba(165,230,255,${.14+Math.random()*.32})`
                                  :`rgba(8,32,48,${.16+Math.random()*.32})`;
    c.lineWidth=.5+Math.random()*2.2;
    c.beginPath(); c.moveTo(Math.random()*w*.28,y);
    c.bezierCurveTo(w*.4,y+(Math.random()-.5)*9,w*.72,y+(Math.random()-.5)*9,w,y); c.stroke();
  }
  for(let i=0;i<26;i++){                        // 隐窝
    c.fillStyle=`rgba(8,30,46,${.2+Math.random()*.26})`;
    c.beginPath(); c.ellipse(Math.random()*w,Math.random()*h,4+Math.random()*12,2+Math.random()*4,0,0,Math.PI*2); c.fill();
  }
  // 瞳孔缘括约肌（深色）；外缘睫状带（更深）
  c.fillStyle='rgba(6,24,36,.88)'; c.fillRect(0,0,w*.07,h);
  c.fillStyle='rgba(8,28,42,.6)'; c.fillRect(w*.9,0,w*.1,h);
  const t=new THREE.CanvasTexture(cv); t.colorSpace=THREE.SRGBColorSpace; return t;
}

  geo.setIndex(idx); geo.computeVertexNormals(); return geo;
}

// 晶状体：真实双凸轮廓（旋转成型），厚度随模式变化（近视厚/远视薄）
function crystalProfile(R, halfT, N=44){
  const pts=[];
  for(let i=0;i<=N;i++){ const r=R*i/N; const y=-halfT*Math.sqrt(Math.max(0,1-(r/R)*(r/R))); pts.push(new THREE.Vector2(r,y)); }
  for(let i=N;i>=0;i--){ const r=R*i/N; const y= halfT*Math.sqrt(Math.max(0,1-(r/R)*(r/R))); pts.push(new THREE.Vector2(r,y)); }
  return pts;
}

function orientSegment(mesh,p1,p2,radius){
  const d=new THREE.Vector3().subVectors(p2,p1);
  const len=d.length();
  mesh.position.copy(p1).add(p2).multiplyScalar(.5);
  if(len>1e-5) mesh.quaternion.setFromUnitVectors(UP, d.clone().normalize());
  mesh.scale.set(radius,len,radius);
}

/* ============================================================
   6. 矫正镜片（可拖放）：凹透镜 / 凸透镜 —— 用旋转轮廓生成真实双凹/双凸透镜
   ============================================================ */
function lensProfile(R, tc, te, concave){
  const pts=[], N=44;
  if(concave){
    for(let i=0;i<=N;i++){ const r=R*i/N; pts.push(new THREE.Vector2(r, -tc/2-(te/2-tc/2)*Math.pow(r/R,2))); }
    for(let i=N;i>=0;i--){ const r=R*i/N; pts.push(new THREE.Vector2(r, tc/2+(te/2-tc/2)*Math.pow(r/R,2))); }
  }else{
    for(let i=0;i<=N;i++){ const r=R*i/N; const s=Math.sqrt(Math.max(0,1-Math.pow(r/R,2))); pts.push(new THREE.Vector2(r, -te/2-(tc/2-te/2)*s)); }
    for(let i=N;i>=0;i--){ const r=R*i/N; const s=Math.sqrt(Math.max(0,1-Math.pow(r/R,2))); pts.push(new THREE.Vector2(r, te/2+(tc/2-te/2)*s)); }
  }
  return pts;
}
function makeLensMesh(type){
  const concave = type==='concave';
  const geo = new THREE.LatheGeometry(lensProfile(0.98, concave?0.12:0.62, concave?0.5:0.12, concave), 64);
  geo.rotateZ(Math.PI/2); // 透镜轴 Y -> X
  const m = new THREE.Mesh(geo, MAT.lens.clone());
  m.userData.lensType=type;
  return m;
}

  {key:'aqueous',  text:'房水',       cls:'callout',       pos:[52,26], anchor:()=>new THREE.Vector3(OPT.xPupil-0.35,0.95,0)},
  {key:'iris',     text:'虹膜',       cls:'callout',       pos:[39,24], anchor:()=>new THREE.Vector3(OPT.xPupil,1.05,0)},
  {key:'ciliary',  text:'睫状体',     cls:'callout',       pos:[59,20], anchor:()=>new THREE.Vector3(OPT.xLens+0.05,1.5,0)},
  {key:'zonule',   text:'悬韧带',     cls:'callout',       pos:[64,29], anchor:()=>new THREE.Vector3(OPT.xLens+0.15,0.98,0)},
  // 瞳孔/晶状体（下方，光路以下、状态栏以上）
  {key:'pupil',    text:'瞳孔',       cls:'callout',       pos:[40,60], anchor:()=>new THREE.Vector3(OPT.xPupil,-0.55,0)},
  {key:'crystal',  text:'晶状体',     cls:'callout',       pos:[52,69], anchor:()=>new THREE.Vector3(OPT.xLens,-0.85,0)},
  {key:'vitreous', text:'玻璃体',     cls:'callout',       pos:[66,72], anchor:()=>new THREE.Vector3(EYE.cx+0.4,-0.3,0)},
  // 眼球壁三层与后段（右侧）
  {key:'sclera',   text:'巩膜',       cls:'callout wall',  pos:[70,17], anchor:()=>new THREE.Vector3(EYE.cx-0.4,2.9,0)},
  {key:'choroid',  text:'脉络膜',     cls:'callout wall',  pos:[79,26], anchor:()=>new THREE.Vector3(EYE.cx+1.0,2.4,0)},
  {key:'retina',   text:'视网膜',     cls:'callout wall',  pos:[88,37], anchor:()=>new THREE.Vector3(EYE.cx+2.0,1.9,0)},
  {key:'macula',   text:'黄斑',       cls:'callout wall',  pos:[73,63], anchor:()=>new THREE.Vector3(EYE.cx+EYE.R-0.45,-0.15,0)},
  {key:'disc',     text:'视盘',       cls:'callout wall',  pos:[81,55], anchor:()=>new THREE.Vector3(EYE.cx+EYE.R-0.4,-0.5,0)},
  {key:'nerve',    text:'视神经',     cls:'callout wall',  pos:[89,72], anchor:()=>new THREE.Vector3(EYE.cx+EYE.R+1.0,-0.45,0)}
];
const leadersSvg=document.getElementById('leaders');
const SVGNS='http://www.w3.org/2000/svg';
const labelEls={}, leaderEls={};
labelDefs.forEach(d=>{
  const el=document.createElement('div'); el.className='label '+d.cls; el.textContent=d.text;
  el.style.left=d.pos[0]+'%'; el.style.top=d.pos[1]+'%';
  app.appendChild(el); labelEls[d.key]=el;
  const line=document.createElementNS(SVGNS,'line');
  const dot=document.createElementNS(SVGNS,'circle'); dot.setAttribute('r','3.2');
  if(d.cls.indexOf('light')>=0){ line.setAttribute('stroke','rgba(224,178,90,.75)'); dot.setAttribute('fill','#e0b25a'); }
  else if(d.cls.indexOf('wall')>=0){ line.setAttribute('stroke','rgba(226,132,80,.7)'); dot.setAttribute('fill','#e28450'); }
  leadersSvg.appendChild(line); leadersSvg.appendChild(dot);
  leaderEls[d.key]={line,dot};
});
// 镜片标签：跟随已安装/托盘中的镜片
const lensLabels={};
['concave','convex'].forEach(t=>{
  const el=document.createElement('div'); el.className='label lens';
  el.textContent = t==='concave'?'凹透镜（近视镜）':'凸透镜（远视镜）';
  app.appendChild(el); lensLabels[t]=el;
});

// 成像点标注（会聚点 + 视网膜上的像）——带清晰/模糊判定
const focusBadge=document.createElement('div');
focusBadge.className='label focus'; app.appendChild(focusBadge);
const imageBadge=document.createElement('div');
imageBadge.className='label focus'; app.appendChild(imageBadge);
// 会聚点引线：焦点在视网膜后方且徽章被左移时，用引线连回真实焦点
const focusLeader=document.createElement('div');
focusLeader.style.cssText='position:absolute;z-index:3;pointer-events:none;height:1px;'+
  'background:linear-gradient(90deg,rgba(224,110,60,0),rgba(224,110,60,.7));transform-origin:left center;opacity:0';
app.appendChild(focusLeader);

let lastFocus = OPT.xRetina;
let focusInfo = { clear:true, offset:0 }; // 由 refresh 计算：是否清晰、焦点相对视网膜的偏移
const _v = new THREE.Vector3();
function project(el, world){
  _v.copy(world).project(camera);
  if(_v.z>1){ el.style.opacity=0; return; }
  el.style.left = ((_v.x*.5+.5)*innerWidth)+'px';
  el.style.top  = ((-_v.y*.5+.5)*innerHeight)+'px';
  el.style.opacity=1;
}

/* ============================================================
   8. 状态刷新：重算光路 + 更新材质/文案/UI
   ============================================================ */
const info = {
  normal:{title:'正常眼 · 光线恰好会聚在视网膜上，成像清晰',
          desc:'平行光经晶状体折射后，会聚点落在视网膜 —— 这就是清晰视觉的原理。'},
  myopia0:{title:'近视眼 · 晶状体太厚，折光能力太强',
          desc:'光线在到达视网膜之前就已会聚，落点偏前，视网膜上得到一个模糊的光斑 —— 看不清远处。'},
  myopia1:{title:'近视矫正 · 戴上凹透镜后成像清晰',
          desc:'凹透镜先把光线适当发散，延迟会聚，使焦点向后移回视网膜。'},
  hyper0:{title:'远视眼 · 晶状体太薄，折光能力太弱',
          desc:'光线会聚得太晚，若延伸会在视网膜之后才相交，视网膜上同样是模糊光斑 —— 看不清近处。'},
  hyper1:{title:'远视矫正 · 戴上凸透镜后成像清晰',
          desc:'凸透镜先让光线适度会聚，提前交点，使焦点向前移回视网膜。'},
  wrong:{title:'镜片不匹配 · 焦点反而偏离了视网膜',
          desc:'近视需凹透镜、远视需凸透镜。选错镜片会让光路更加偏离，成像更模糊。'}
};
function refresh(){
  // 追迹所有光线
  OPT.ys.forEach((y0,i)=>{
    const data=traceRay(y0,state.mode,state.lens);
    rayVisuals[i].data=data;
    if(i===0) lastFocus=data.xFocus;
  });
  // 成像清晰度：视网膜处弥散圆半径 < 0.10 判为清晰
  const blur=Math.max.apply(null, rayVisuals.map(r=>Math.abs(r.data.yRetina)));
  focusInfo={ clear: blur<0.10, offset: lastFocus-OPT.xRetina, blur };
  // 成像点徽章文字（位置 + 清晰/模糊判定）
  const off=focusInfo.offset;
  const rel = off < -0.15 ? '视网膜前方' : off > 0.15 ? '视网膜后方' : '正好在视网膜上';
  focusBadge.textContent = focusInfo.clear
    ? '会聚点 · 落在视网膜（成像清晰 ✓）'
    : '会聚点 · 落在'+rel+'（成像模糊）';
  focusBadge.className = 'label focus '+(focusInfo.clear?'ok':'bad');
  imageBadge.textContent = focusInfo.clear ? '像 · 清晰' : '视网膜上的像 · 模糊光斑';
  imageBadge.className = 'label focus '+(focusInfo.clear?'ok':'bad');
  // 晶状体厚度：近视厚、远视薄
  crystal.scale.set(state.mode==='myopia'?1.32:state.mode==='hyperopia'?0.66:1, 1, 1);
  // 状态文案
  let key;
  if(state.mode==='normal') key = state.lens?null:'normal';
  else if(state.mode==='myopia') key = state.lens==='concave'?'myopia1':state.lens==='convex'?'wrong':'myopia0';
  else key = state.lens==='convex'?'hyper1':state.lens==='concave'?'wrong':'hyper0';
  if(!key && state.lens){
    document.getElementById('statusTitle').textContent='正常眼 · 无需矫正镜片';
    document.getElementById('statusDesc').textContent='正常眼本身就能清晰成像，戴上任何镜片反而会打破会聚平衡。拿下镜片试试。';
  }else{
    document.getElementById('statusTitle').textContent=info[key].title;
    document.getElementById('statusDesc').textContent=info[key].desc;
  }
  // 托盘 / 移除按钮状态
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('used', c.dataset.lens===state.lens));
  document.getElementById('removeBtn').classList.toggle('off', !state.lens);
  // 镜片目标位置与可见性
  for(const t of ['concave','convex']){
    const o=lensObj[t];
    o.target = (state.lens===t)
      ? new THREE.Vector3(OPT.xCorr,0,0)
      : o.home.clone();
    o.targetScale = (state.lens===t)?1:0.72;
  }
}

/* ============================================================
   9. 交互：模式切换 / 拖放镜片 / 移除 / 重置 / 视角
   ============================================================ */
document.querySelectorAll('.mode').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.mode').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.mode=btn.dataset.mode;
    refresh();
  });
});
document.getElementById('removeBtn').addEventListener('click',()=>{
  state.lens=null; refresh();
});
document.getElementById('resetBtn').addEventListener('click',()=>{
  state.mode='normal'; state.lens=null;
  document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode==='normal'));
  viewSide=0; placeCamera();
  lensObj.concave.mesh.position.copy(lensObj.concave.home);
  lensObj.convex.mesh.position.copy(lensObj.convex.home);
  refresh();
});
document.getElementById('viewBtn').addEventListener('click',()=>{
  viewSide = viewSide?0:1; placeCamera();
});

// 3D 内拖放镜片：射线与 z=0 平面求交
const raycaster=new THREE.Raycaster();
const ndc=new THREE.Vector2();
const planeZ0=new THREE.Plane(new THREE.Vector3(0,0,1),0);
const hitPt=new THREE.Vector3();
let dragging=null, dragOffset=new THREE.Vector3(), pressedAt=null, moved=false;

function setNDC(e){
  ndc.x=(e.clientX/innerWidth)*2-1;
  ndc.y=-(e.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(ndc,camera);
}
function pickLens(){
  const meshes=Object.values(lensObj).map(o=>o.mesh);
  const hits=raycaster.intersectObjects(meshes,false);
  if(!hits.length) return null;
  const t=hits[0].object.userData.lensType;
  return t;
}
renderer.domElement.addEventListener('pointerdown',e=>{
  setNDC(e);
  const t=pickLens();
  if(t){
    dragging=t;
    lensObj[t].mesh.scale.setScalar(1);
    raycaster.ray.intersectPlane(planeZ0,hitPt);
    dragOffset.subVectors(lensObj[t].mesh.position,hitPt);
    pressedAt={x:e.clientX,y:e.clientY}; moved=false;
    controls.enabled=false;
    renderer.domElement.setPointerCapture(e.pointerId);
  }else{
    pressedAt={x:e.clientX,y:e.clientY}; moved=false;
  }
});
renderer.domElement.addEventListener('pointermove',e=>{
  if(!dragging) {
    if(pressedAt && (Math.abs(e.clientX-pressedAt.x)>4||Math.abs(e.clientY-pressedAt.y)>4)) moved=true;
    return;
  }
  moved=true;
  setNDC(e);
  if(raycaster.ray.intersectPlane(planeZ0,hitPt)){
    const p=hitPt.clone().add(dragOffset);
    p.y=THREE.MathUtils.clamp(p.y,-2.4,1.8);
    p.x=THREE.MathUtils.clamp(p.x,OPT.xCorr-3.2,OPT.xCorr+3.2);
    lensObj[dragging].mesh.position.copy(p);
  }
});
renderer.domElement.addEventListener('pointerup',e=>{
  if(dragging){
    const t=dragging; dragging=null; controls.enabled=true;
    const p=lensObj[t].mesh.position;
    const onTrack = Math.abs(p.x-OPT.xCorr)<1.9 && Math.abs(p.y)<1.9;
    if(onTrack){ state.lens=t; refresh(); }
    else { lensObj[t].mesh.position.copy(lensObj[t].home); if(state.lens===t){state.lens=null;refresh();} }
  }else if(pressedAt && !moved){
    // 点击已安装的镜片 => 拿下
    setNDC(e); const t=pickLens();
    if(t && state.lens===t){ state.lens=null; refresh(); }
  }
  pressedAt=null;
});

// 从底部托盘拖拽 HTML 镜片卡片到画布
document.querySelectorAll('.chip').forEach(chip=>{
  let ghost=null;
  chip.addEventListener('pointerdown',e=>{
    if(chip.classList.contains('used')) return;
    const t=chip.dataset.lens;
    ghost=document.createElement('div');
    ghost.style.cssText='position:fixed;z-index:50;pointer-events:none;width:34px;height:34px;border-radius:50%;'+
      'background:rgba(170,220,245,.85);border:2px solid #4b93c4;transform:translate(-50%,-50%);box-shadow:0 6px 18px rgba(60,110,160,.3)';
    document.body.appendChild(ghost);
    const mv=ev=>{ ghost.style.left=ev.clientX+'px'; ghost.style.top=ev.clientY+'px'; };
    const up=ev=>{
      document.removeEventListener('pointermove',mv); document.removeEventListener('pointerup',up);
      ghost.remove(); ghost=null;
      const overCanvas = ev.clientX>0&&ev.clientX<innerWidth&&ev.clientY>0&&ev.clientY<innerHeight;
      if(overCanvas){ state.lens=t; refresh(); }
    };
    document.addEventListener('pointermove',mv); document.addEventListener('pointerup',up);
    e.preventDefault();
  });
});

/* ============================================================
   10. 动画循环
   ============================================================ */
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  controls.update();

  // 更新光束段
  rayVisuals.forEach(rv=>{
    const d=rv.data; if(!d) return;
    for(let s=0;s<4;s++){
      orientSegment(rv.segs[s].core, d.pts[s], d.pts[s+1], 0.026);
      orientSegment(rv.segs[s].glow, d.pts[s], d.pts[s+1], 0.072);
    }
  });
  // 会聚点位置与呼吸
  const fp=lastFocus;
  focusCore.position.set(fp,0,0); focusGlow.position.set(fp,0,0);
  const pulse=1+0.14*Math.sin(t*3.2);
  focusGlow.scale.setScalar(pulse);
  // 视网膜光斑大小 = 弥散圆半径（取最大光线的偏差）
  const blur=Math.min(1.35, focusInfo.blur||0);
  const spotR=Math.max(0.05, blur*0.9);
  spot.scale.set(spotR,spotR,1);
  spot.material.opacity = focusInfo.clear?0.98:0.5;
  // 流动亮点沿路径运动
  flows.forEach((f,i)=>{
    const d=rayVisuals[i].data; if(!d) return;
    f.userData.t=(f.userData.t+0.0035)%1;
    const q=f.userData.t, pts=d.pts;
    // 近似按四段等长插值
    const seg=Math.min(3,Math.floor(q*4)), s=q*4-seg;
    f.position.copy(pts[seg]).lerp(pts[seg+1],s);
    f.material.opacity=0.55+0.4*Math.sin(q*Math.PI);
  });
  // 镜片平滑归位 + 缩放（拖动中的镜片不干预，保持被抓取的状态）
  for(const key of ['concave','convex']){
    const o=lensObj[key];
    if(o.target && dragging!==key) o.mesh.position.lerp(o.target,0.18);
    if(dragging!==key && o.targetScale){
      const s=THREE.MathUtils.lerp(o.mesh.scale.x, o.targetScale, 0.18);
      o.mesh.scale.setScalar(s);
    }
  }
  // 结构标注：标签固定在画面外围，引线连回 3D 结构锚点
  labelDefs.forEach(d=>{
    const el=labelEls[d.key], L=leaderEls[d.key];
    const lx=d.pos[0]/100*innerWidth, ly=d.pos[1]/100*innerHeight;
    el.style.left=lx+'px'; el.style.top=ly+'px';
    _v.copy(d.anchor()).project(camera);
    if(_v.z>1){ el.style.opacity=0; L.line.style.opacity=0; L.dot.style.opacity=0; return; }
    el.style.opacity=1;
    const ax=(_v.x*.5+.5)*innerWidth, ay=(-_v.y*.5+.5)*innerHeight;
    L.line.setAttribute('x1',lx); L.line.setAttribute('y1',ly);
    L.line.setAttribute('x2',ax); L.line.setAttribute('y2',ay);
    L.dot.setAttribute('cx',ax); L.dot.setAttribute('cy',ay);
    L.line.style.opacity=1; L.dot.style.opacity=1;
  });
  // 会聚点徽章：跟随实际焦点放在上方；"像"徽章贴在视网膜成像处放下方，避免两者重叠
  // 焦点在视网膜后方时徽章左移避开右侧按钮，并用引线连回真实焦点
  const shifted = focusInfo.offset>0.15;
  const badgeX = shifted ? Math.min(fp, EYE.cx+EYE.R+0.2) : fp;
  project(focusBadge, new THREE.Vector3(badgeX, focusInfo.clear?1.05:1.25, 0));
  project(imageBadge, new THREE.Vector3(OPT.xRetina-0.1, focusInfo.clear?-1.15:-1.55, 0));
  if(shifted){
    const ax=parseFloat(focusBadge.style.left), ay=parseFloat(focusBadge.style.top)+10;
    _v.set(fp,0,0).project(camera);
    const bx=(_v.x*.5+.5)*innerWidth, by=(-_v.y*.5+.5)*innerHeight;
    const len=Math.hypot(bx-ax,by-ay);
    focusLeader.style.left=ax+'px'; focusLeader.style.top=ay+'px';
    focusLeader.style.width=len+'px';
    focusLeader.style.transform='rotate('+Math.atan2(by-ay,bx-ax)+'rad)';
    focusLeader.style.opacity=1;
  }else focusLeader.style.opacity=0;
  for(const key of ['concave','convex']){
    const o=lensObj[key];
    o.mesh.updateMatrixWorld();
    _v.setFromMatrixPosition(o.mesh.matrixWorld);
    project(lensLabels[key], _v.clone().add(new THREE.Vector3(0,-1.4,0)));
    lensLabels[key].style.opacity = (key===state.lens||o.mesh.position.distanceTo(o.home)<0.3)?1:0.85;
  }
  renderer.render(scene,camera);
}

addEventListener('resize',()=>{
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  placeCamera();
});

refresh();
animate();
setTimeout(()=>{ const l=document.getElementById('loading'); l.style.opacity=0; setTimeout(()=>l.remove(),520); }, 700);
</script>
